<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LUMO – Die Insel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1033">
<meta name="format-detection" content="telephone=no">
<style>/*__STYLE__*/</style>
</head>
<body>
<div id="lumo-root">
  <canvas id="lumo-canvas" aria-label="LUMO Spielwelt"></canvas>
  <div id="hud" class="is-hidden"></div>
  <div id="boot" class="boot">
    <div class="boot-sky"></div>
    <div class="boot-sun"></div>
    <div class="boot-sea"></div>
    <div class="boot-island"></div>
    <div class="boot-card">
      <div class="boot-kicker">Ein Abenteuer auf der Insel</div>
      <h1 class="boot-title" aria-label="LUMO"><span>L</span><span>U</span><span>M</span><span>O</span></h1>
      <div class="boot-sub">Die Insel</div>
      <div class="boot-progress"><div class="boot-bar" id="boot-bar"></div></div>
      <div class="boot-status" id="boot-status">Die Insel taucht auf …</div>
      <button class="boot-start is-hidden" id="boot-start" type="button">Los geht's</button>
    </div>
  </div>
</div>
<script>/*__SCRIPT__*/</script>
</body>
</html>
