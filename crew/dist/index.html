.feed-flag { font-size: 0.72em; font-weight: 800; padding: 2px 7px; border-radius: 6px; border: 2px solid var(--line); animation: feed-stamp 360ms cubic-bezier(.2, 1.5, .4, 1) both; }
.feed-flag.teamA { background: var(--teamA); color: var(--teamA-ink); }
.feed-flag.teamB { background: var(--teamB); color: var(--teamB-ink); }
.feed-flag.solo { background: var(--accent); color: var(--accent-ink); }
.feed-spread-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.feed-count { display: flex; align-items: center; gap: 12px; }
.feed-count .feed-big { font-size: 2.5em; }
.feed-swarm { width: 240px; max-width: 52%; }
.feed-swarm svg { display: block; width: 100%; height: auto; }
.feed-swarm circle { fill: var(--muted); opacity: 0.16; transform-box: fill-box; transform-origin: center; transition: fill 500ms, opacity 400ms; }
.feed-swarm circle.on { fill: var(--muted); opacity: 1; }
.feed-swarm circle.new { fill: var(--accent); animation: feed-popdot 500ms cubic-bezier(.2, 1.6, .4, 1) both; }
.feed-swarm circle.src { fill: var(--yellow); opacity: 1; }
.feed-stopinfo { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.feed-stopchip { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.feed-how { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--panel2); border-radius: var(--radius-sm); }
.feed-how-b { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feed-how-b .feed-kind { display: inline-block; vertical-align: 2px; margin-left: 4px; font-size: 0.66em; padding: 2px 8px; }
.feed-seen { display: inline-flex; align-items: baseline; gap: 6px; color: var(--muted); font-weight: 700; font-size: 0.86em; }
.feed-seen .ic { align-self: center; }
.feed-seen .feed-big { color: var(--text); font-size: 2em; }
.feed-outs.kette { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.feed-ghost-row { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 10px; align-items: center; }
.feed-ghost-row .feed-metric { flex-direction: column; align-items: flex-start; gap: 4px; }
.feed-outs.kette { row-gap: 16px; }
.feed-outs.kette .feed-out { gap: 10px; }
.feed-ghost-row .feed-minichat { min-height: 0; }
.feed-ghost { border-style: dashed; background: color-mix(in srgb, var(--panel) 65%, transparent); box-shadow: none; }
.feed-ghost .feed-msg { background: color-mix(in srgb, var(--accent) 25%, var(--panel2)); }
.feed-truth { border-top: 8px solid var(--good); }
.feed-truth-row { display: flex; gap: 14px; align-items: flex-start; }
.feed-truth-ic { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--good); color: var(--good-ink); border: var(--bw) solid var(--line); }
.app[data-look="pixel"] .feed-truth-ic { border-radius: 0; }

/* ---------- Intro ---------- */
.feed-intro { align-items: center; }
.feed-title { font-size: clamp(2.6em, 4vw + 1.2em, 4.2em); }
.feed-kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feed-kindtile { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: 0 3px 0 var(--line); line-height: 1.15; }
.feed-kindtile .feed-tico { width: 42px; height: 42px; }
.feed-formula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.feed-formula > b { font-family: var(--font-display); font-size: 1.4em; color: var(--muted); }
.feed-crewpill { background: var(--yellow); color: var(--yellow-ink); }
.app[data-look="neon"] .feed-crewpill { background: transparent; color: var(--yellow); border-color: var(--yellow); }

/* ---------- Übergang zwischen den Runden ---------- */
.feed-splash { background: color-mix(in srgb, var(--ink) 72%, transparent); }
.feed-splash-in { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: feed-splash 1150ms cubic-bezier(.2, 1.2, .3, 1) both; }
.feed-splash-t { font-size: clamp(2.2em, 6vw, 4.4em); color: var(--text); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.app[data-look="neon"] .feed-splash-t { -webkit-text-stroke: 0; text-shadow: 0 0 24px var(--accent); }
.app[data-look="pixel"] .feed-splash-t { -webkit-text-stroke: 0; text-shadow: 5px 5px 0 var(--ink); }

/* ---------- Ende ---------- */
.feed-end { align-items: center; text-align: center; gap: 14px; }
.feed-formula.big { justify-content: center; }
.feed-endrow { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--yellow); flex-wrap: wrap; }
.feed-endnum { font-size: 5em; line-height: 1; color: var(--yellow); font-variant-numeric: tabular-nums; }
.feed-endlbl { font-size: 1.6em; color: var(--text); }
.feed-tip { display: flex; gap: 16px; align-items: flex-start; text-align: left; border-top: 8px solid var(--teamA); width: 100%; }
.feed-tip-ic { width: 60px; height: 60px; flex: none; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--teamA); color: var(--teamA-ink); border: var(--bw) solid var(--line); }
.feed-tip-h { font-size: 1.15em; }
.feed-tel { font-family: var(--font-display); font-weight: 400; font-size: 1.35em; letter-spacing: 0.03em; color: var(--teamA); white-space: nowrap; }
.app[data-look="neon"] .feed-tip-ic { background: transparent; color: var(--teamA); border-color: var(--teamA); }

/* ---------- Animationen ---------- */
@keyframes feed-in { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes feed-drop { from { opacity: 0; transform: translateY(-16px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes feed-dot { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }
@keyframes feed-glow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--yellow) 0%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--yellow) 35%, transparent); } }
@keyframes feed-bump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
@keyframes feed-stamp { 0% { opacity: 0; transform: scale(1.8) rotate(-12deg); } 60% { opacity: 1; transform: scale(.94) rotate(-4deg); } 100% { transform: scale(1) rotate(-4deg); } }
@keyframes feed-now { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes feed-popdot { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes feed-splash { 0% { opacity: 0; transform: scale(.7); } 25% { opacity: 1; transform: scale(1.04); } 40% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }

/* ---------- Kleinere Bildschirme ---------- */
@media (max-width: 900px) {
  .feed-main { grid-template-columns: minmax(0, 1fr); }
  .feed-phone { max-width: 430px; --feed-h: clamp(290px, 31vh, 380px); }
  .feed-call { padding: 12px 14px; gap: 10px; }
  .feed-seg { min-height: 50px; }
  .feed-lockp { --feed-h: clamp(300px, 34vh, 400px); }
  .feed-phone.fakt { --feed-h: clamp(300px, 40vh, 470px); }
  .feed-phone.fakt .feed-media svg { max-height: 104px; }
  .feed-intro .feed-left { order: 2; }
}
@media (max-width: 600px) {
  .feed-phone { --feed-h: auto; }
  .feed-screen { min-height: 280px; }
  .feed-lockp .feed-screen { min-height: 360px; }
  .feed-lock-time { font-size: 3.4em; }
  .feed-metrics { grid-template-columns: 1fr; }
  .feed-outs { grid-template-columns: minmax(0, 1fr); }
  .feed-kinds { grid-template-columns: 1fr; }
  .feed-call-row .pill { min-width: 0; }
  .feed-swarm { max-width: 76%; width: 76%; margin: 0 auto; }
  .feed-outs.kette { grid-template-columns: minmax(0, 1fr); }
  .feed-ghost-row { grid-template-columns: minmax(0, 1fr); }
  .feed-sc .nm { max-width: 8em; overflow: hidden; text-overflow: ellipsis; }
}

/* ---- missions/radar.css ---- */
/* Mission „Gefühls-Radar“ – alle Klassen mit Präfix radar- */

/* Pixel-Schrift: „fi“-Ligatur sieht dort kaputt aus („Profi“) – also aus. */
.app[data-look="pixel"] .radar-screen { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }

/* ---------- Kopf mit Runden-Anzeige ---------- */
.radar-head { align-items: flex-end; }
.radar-pips { display: inline-flex; gap: 6px; align-items: center; }
.radar-pips i {
  display: block; width: 26px; height: 10px;
  border-radius: 99px;
  background: var(--panel2);
  border: 2px solid var(--line);
}
.radar-pips i.done { background: var(--good); }
.radar-pips i.now { background: var(--yellow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 30%, transparent); }
.app[data-look="pixel"] .radar-pips i { border-radius: 0; }

/* ---------- Gefühls-Abzeichen ---------- */
.radar-emo {
  --emo: #ffc93c; --s: 44px;
  width: var(--s); height: var(--s); flex: none;
  display: inline-grid; place-items: center;
  background: var(--emo); color: #160d2b;
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line);
}
.radar-emo svg { width: 66%; height: 66%; display: block; }
.app[data-look="neon"] .radar-emo {
  background: color-mix(in srgb, var(--emo) 14%, transparent);
  color: var(--emo); border-color: var(--emo);
  box-shadow: 0 0 12px color-mix(in srgb, var(--emo) 55%, transparent);
}

/* Kleine Legende unter der Situation */
.radar-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; }
.radar-lg { display: inline-flex; align-items: center; gap: 7px; font-size: 0.85em; font-weight: 600; color: var(--muted); }
.radar-lg .radar-emo { border-width: 2px; box-shadow: none; }

/* ---------- Intro ---------- */
.radar-intro {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 18px; align-items: center;
}
.radar-step { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; }
.radar-step .paddle-hint { font-size: 0.8em; padding: 5px 12px; align-self: flex-start; }
.radar-stepnum {
  flex: none; width: 44px; height: 44px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.3em;
  background: var(--accent); color: var(--accent-ink);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
}
.radar-stepnum.small { width: 34px; height: 34px; font-size: 1em; }
.app[data-look="neon"] .radar-stepnum { background: transparent; color: var(--accent); border-color: var(--accent); }
.radar-steptitle {
  font-family: var(--font-display); font-weight: 400;
  text-transform: var(--display-case); letter-spacing: var(--display-track);
  font-size: 1.2em; line-height: 1.15;
}

/* ---------- Radar (SVG) ---------- */
/* Heißes Ende der Skala: passend zum Look (Arena orange, Pixel rot, Neon pink) */
.app { --radar-hot: var(--accent); }
.app[data-look="pixel"] { --radar-hot: #ff5a4f; }
.app[data-look="neon"] { --radar-hot: var(--teamB); }
.radar-dialbox, .radar-mix, .radar-side, .radar-sit, .radar-word, .radar-tile, .radar-step { box-sizing: border-box; }
.radar-dialbox {
  background:
    radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--good) 12%, transparent) 0%, transparent 60%),
    var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: clamp(10px, 1.6vw, 18px) clamp(10px, 1.6vw, 18px) 4px;
  min-width: 0;
}
.radar-dial { width: 100%; height: auto; display: block; overflow: visible; }
.radar-dial .grid path { fill: none; stroke: var(--muted); stroke-opacity: 0.3; stroke-width: 2; stroke-dasharray: 3 7; }
.radar-dial .base { stroke: var(--muted); stroke-opacity: 0.35; stroke-width: 2; }
.radar-dial .band { stroke: var(--line); stroke-width: 3; }
.radar-dial .sep { stroke: var(--line); stroke-width: 3; }
.radar-dial .num {
  fill: var(--text); font-family: var(--font-display); font-size: 19px;
  text-anchor: middle; dominant-baseline: central;
}
.radar-dial .num.key { font-size: 24px; fill: var(--yellow); }
.radar-dial .anchor {
  fill: var(--muted); font-family: var(--font-body); font-size: 14px; font-weight: 700;
  text-anchor: middle; dominant-baseline: central; letter-spacing: 0.06em; text-transform: uppercase;
}
.app[data-look="neon"] .radar-dial .band { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)); }

.radar-sweep {
  transform-box: view-box; transform-origin: 230px 230px;
  animation: radar-sweep 3.4s ease-in-out infinite;
  transition: opacity 500ms ease;
}
.radar-sweep path { fill: var(--good); }
.radar-sweep .edge { fill: none; stroke: var(--good); stroke-width: 3; stroke-linecap: round; opacity: 0.8; }
.radar-sweep.off { opacity: 0; }
.app[data-look="pixel"] .radar-sweep { animation-timing-function: steps(12); }
@keyframes radar-sweep { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(151deg); } }

.radar-zone { opacity: 0; transition: opacity 350ms ease; }
.radar-zone.on { opacity: 1; }
.radar-zone path { fill: var(--yellow); fill-opacity: 0.13; stroke: var(--yellow); stroke-width: 2.5; stroke-dasharray: 7 6; transition: fill 400ms, stroke 400ms, fill-opacity 400ms; }
.radar-zone.hit path { fill: var(--good); fill-opacity: 0.3; stroke: var(--good); stroke-dasharray: none; }
.radar-marker { fill: var(--yellow); stroke: var(--line); stroke-width: 3; stroke-linejoin: round; }

.radar-needle {
  transform-box: view-box; transform-origin: 230px 230px;
  transform: rotate(0deg);
  transition: transform 1600ms cubic-bezier(.25, 1.35, .45, 1);
}
.radar-needle .shadow { stroke: var(--line); stroke-width: 14; stroke-linecap: round; }
.radar-needle .main { stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
.radar-needle.idle { animation: radar-idle 4s ease-in-out infinite; }
@keyframes radar-idle { 0%, 100% { transform: rotate(62deg); } 50% { transform: rotate(122deg); } }
.radar-hub { fill: var(--accent); stroke: var(--line); stroke-width: 3; }

.radar-blip { transform-box: fill-box; transform-origin: center; animation: radar-pop 360ms cubic-bezier(.2, 1.6, .4, 1) both; }
.radar-blip .dot { fill: var(--text); stroke: var(--line); stroke-width: 3; }
.radar-ping { fill: none; stroke: var(--text); stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: radar-ping 1000ms ease-out both; }
.radar-decor .dot { stroke: var(--line); stroke-width: 3; }
.radar-decor .ping { fill: none; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; animation: radar-ping 2.6s ease-out infinite; }
@keyframes radar-ping { from { transform: scale(1); opacity: 0.9; } to { transform: scale(3.2); opacity: 0; } }
@keyframes radar-pop { from { transform: scale(0); } to { transform: scale(1); } }

/* ---------- Schritt A: Situation, Zählen, Mix ---------- */
.radar-sitcard .say { font-size: clamp(1.6em, 2.4vw + 0.9em, 2.7em); }
.radar-tally .tally { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.radar-tally .t-item.radar-titem {
  box-shadow: inset 0 7px 0 var(--emo), 0 var(--lift) 0 var(--line);
  padding: 18px 12px 12px;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  grid-template-areas: "icon label label" "minus count plus";
  align-items: center; justify-items: center;
  gap: 12px 8px;
}
.radar-tally .t-item.radar-titem > .radar-emo { grid-area: icon; }
.radar-tally .t-item.radar-titem > .t-label { grid-area: label; justify-self: start; text-align: left; }
.radar-tally .t-item.radar-titem > .t-count { grid-area: count; line-height: 1; }
.radar-tally .t-item.radar-titem > .t-ctrl { display: contents; }
.radar-tally .t-item.radar-titem > .t-ctrl > :first-child { grid-area: minus; }
.radar-tally .t-item.radar-titem > .t-ctrl > :last-child { grid-area: plus; }
.app[data-look="neon"] .radar-tally .t-item.radar-titem { box-shadow: inset 0 3px 0 var(--emo), 0 0 12px color-mix(in srgb, var(--emo) 25%, transparent); }
.radar-tally .t-label { font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: 400; font-size: 1.05em; }

.radar-mix {
  display: flex; width: 100%;
  height: clamp(72px, 10vw, 104px);
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  overflow: hidden;
}
.radar-mix .seg {
  flex: 0 0 0%; min-width: 0; overflow: hidden;
  display: grid; place-items: center;
  background: var(--emo); color: #160d2b;
  border-right: var(--bw) solid var(--line);
  transition: flex-basis 1000ms cubic-bezier(.2, .9, .2, 1);
}
.radar-mix .seg:last-child { border-right: 0; }
.radar-mix .seg svg { width: clamp(32px, 4vw, 48px); height: clamp(32px, 4vw, 48px); }
.app[data-look="neon"] .radar-mix .seg { background: color-mix(in srgb, var(--emo) 36%, transparent); color: var(--emo); border-right-color: var(--line); }
.radar-legend2 { gap: 10px; }
.radar-lchip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 6px 16px 6px 6px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 99px;
  font-weight: 600;
}
.radar-lchip b { font-family: var(--font-display); font-weight: 400; font-size: 1.15em; }
.app[data-look="pixel"] .radar-lchip { border-radius: 0; }

/* ---------- Wort-Upgrade ---------- */
.radar-switch { gap: 8px; }
.radar-switch .chip .radar-emo { border-width: 2px; box-shadow: none; }
.radar-scale { display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 700; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.08em; }
.radar-scale i {
  flex: 1; height: 8px; border-radius: 99px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--emo, var(--yellow)) 15%, transparent), var(--emo, var(--yellow)));
}
.radar-words { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.radar-word {
  --emo: var(--yellow);
  appearance: none; font: inherit; color: var(--text);
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line);
  padding: 18px 12px 14px;
  min-height: 132px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px;
  cursor: pointer; touch-action: manipulation;
  transition: transform 90ms ease, box-shadow 90ms ease, background 160ms;
}
.radar-word:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.radar-word .w {
  font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track);
  font-size: clamp(1.15em, 1.2vw + 0.7em, 1.55em); line-height: 1.1; text-align: center; text-wrap: balance;
}
.radar-word.sel { background: var(--emo); color: #160d2b; }
.app[data-look="neon"] .radar-word { box-shadow: none; }
.app[data-look="neon"] .radar-word.sel { background: color-mix(in srgb, var(--emo) 22%, transparent); color: var(--text); border-color: var(--emo); box-shadow: 0 0 16px color-mix(in srgb, var(--emo) 50%, transparent); }
.radar-signal { display: flex; align-items: flex-end; gap: 5px; height: 30px; }
.radar-signal i { display: block; width: 10px; border-radius: 2px; background: color-mix(in srgb, var(--emo) 22%, transparent); }
.radar-signal i.on { background: var(--emo); }
.radar-word.sel .radar-signal i.on { background: #160d2b; }
.app[data-look="neon"] .radar-word.sel .radar-signal i.on { background: var(--emo); }
.radar-word:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

/* ---------- Schritt B: Radar-Profi & Tipp ---------- */
.radar-sit {
  display: flex; gap: 12px; align-items: center;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--panel) 65%, transparent);
  border: 2px solid color-mix(in srgb, var(--muted) 30%, transparent);
  border-radius: var(--radius-sm);
  font-weight: 600;
}
.radar-sit .ic { color: var(--yellow); flex: none; }
.radar-profi { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 16px; }
.radar-profi-who { align-items: center; justify-content: center; }
.radar-profi-tipp { gap: 10px; }
.radar-mini { display: flex; gap: 12px; align-items: flex-start; }
.radar-mini > span:last-child { padding-top: 4px; }
.radar-minidial { max-width: 330px; width: 100%; margin: 0 auto; }
.radar-profi-tipp .stepper .val { color: var(--yellow); }

.radar-seats { width: 100%; max-width: 270px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.radar-seats .table { fill: var(--panel2); stroke: var(--line); stroke-width: 3; }
.radar-seats .table-ring { fill: none; stroke: var(--muted); stroke-opacity: 0.35; stroke-width: 2; stroke-dasharray: 3 6; }
.radar-seats .seat { fill: var(--bg2); stroke: var(--muted); stroke-opacity: 0.7; stroke-width: 2.5; }
.radar-seats .seat.lk { fill: var(--yellow); stroke: var(--line); stroke-opacity: 1; stroke-width: 3; }
.radar-seats .seat.profi { fill: var(--accent); stroke: var(--line); stroke-opacity: 1; stroke-width: 3; }
.radar-seats text { font-family: var(--font-display); font-size: 16px; text-anchor: middle; dominant-baseline: central; fill: var(--muted); }
.radar-seats text.lk { fill: var(--yellow-ink); }
.radar-seats text.profi { fill: var(--accent-ink); font-size: 18px; }
.radar-seats text.cap { font-family: var(--font-body); font-size: 13px; font-weight: 700; fill: var(--muted); }
.radar-seats .ring { fill: none; stroke: var(--accent); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: radar-ping 1.8s ease-out infinite; }
.radar-seats .arrow { fill: none; stroke: var(--yellow); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.app[data-look="neon"] .radar-seats .seat.profi { fill: color-mix(in srgb, var(--accent) 30%, var(--bg)); stroke: var(--accent); }
.app[data-look="neon"] .radar-seats text.profi { fill: var(--text); }

.radar-pad .valuepad .btn { min-height: 68px; }

/* ---------- Auflösung ---------- */
.radar-reveal {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 18px; align-items: center;
}
.radar-side {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line);
  padding: 18px 20px;
  gap: 14px;
}
.radar-stat { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.radar-stat .lbl { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 700; }
.radar-big {
  font-family: var(--font-display);
  font-size: clamp(2.3em, 3vw + 1em, 3.4em);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.radar-big.tipp { color: var(--yellow); }
.radar-key { display: inline-block; flex: none; width: 22px; height: 22px; }
.radar-key.needle { height: 8px; border-radius: 99px; background: var(--accent); border: 2px solid var(--line); }
.radar-key.tipp { width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 16px solid var(--yellow); }
.radar-verdict { opacity: 0; transform: translateY(10px); transition: opacity 300ms ease, transform 300ms ease; gap: 8px; border-top: 2px dashed color-mix(in srgb, var(--muted) 35%, transparent); padding-top: 14px; }
.radar-verdict.on { opacity: 1; transform: none; }
.radar-verdict .pill { align-self: flex-start; text-transform: none; letter-spacing: 0.02em; font-size: 0.85em; }
.radar-vtitle.hit { color: var(--good); }
.radar-vtitle.near { color: var(--yellow); }
.radar-vtitle.miss { color: var(--text); }
.radar-verdict .radar-vtitle.hit { animation: pop-in 420ms cubic-bezier(.2, 1.5, .4, 1) both; }

/* ---------- Bilanz ---------- */
.radar-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; }
.radar-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.radar-tile .lbl { color: var(--muted); font-weight: 700; font-size: 0.9em; }
.radar-tile:nth-child(2) { animation-delay: 120ms; }
.radar-tile:nth-child(3) { animation-delay: 240ms; }
.radar-found { gap: 10px 16px; }
.radar-found .radar-lg { font-size: 0.95em; color: var(--text); }

/* ---------- Kleinere Bildschirme ---------- */
@media (max-width: 900px) {
  /* Zählkacheln: Zeichen, Name, dann − Zahl + untereinander (lange Namen wie „Überraschung“) */
  .radar-tally .t-item.radar-titem { grid-template-areas: "icon icon icon" "label label label" "minus count plus"; gap: 8px; }
  .radar-tally .t-item.radar-titem > .t-label { justify-self: center; text-align: center; font-size: 0.95em; }
  .radar-intro { grid-template-columns: 1fr; }
  .radar-intro .radar-dialbox { max-width: 560px; width: 100%; margin: 0 auto; }
  .radar-reveal { grid-template-columns: 1fr; }
  .radar-reveal .radar-dialbox { max-width: 640px; width: 100%; margin: 0 auto; }
}
@media (max-width: 760px) {
  .radar-profi { grid-template-columns: 1fr; }
  .radar-seats { max-width: 200px; }
  .radar-tally .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .radar-words { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .radar-stats { grid-template-columns: 1fr; }
  .radar-tile { flex-direction: row; justify-content: center; flex-wrap: wrap; }
  .radar-legend { gap: 6px 10px; }
  .radar-lg { font-size: 0.75em; }
  .radar-tally .t-item.radar-titem .icon-btn { width: 48px; height: 48px; }
  .radar-tally .t-item.radar-titem { grid-template-columns: 48px minmax(0, 1fr) 48px; padding: 16px 8px 10px; gap: 8px 4px; }
}

/* ---- missions/reframe.css ---- */
/* =========================================================
   Mission „Reframe-Battle“ + Solo „Reframe-Rush“
   Alle Klassen mit Präfix reframe-. Farben nur über Tokens,
   damit Arena, Pixel und Neon passen.
   ========================================================= */

[class^="reframe-"], [class*=" reframe-"], [class^="reframe-"] *, [class*=" reframe-"] * { box-sizing: border-box; }

/* ---------- Bildschirm: Knopf-Zone unten fest (nichts springt, wenn Knöpfe später kommen).
   Titel-Bildschirme ohne Kopfzeile (Intro, Finale) sitzen senkrecht in der Mitte. ---------- */
.wrap.reframe-screen > :first-child:not(.reframe-hud):not(.reframe-hudslot) { margin-top: auto; }
.wrap.reframe-screen > :first-child:not(.reframe-hud):not(.reframe-hudslot) ~ .reframe-acts { margin-bottom: auto; }
.reframe-acts { min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.wrap.reframe-screen.reframe-top > * { margin-top: 0; }
.wrap.reframe-screen.reframe-top > .reframe-acts { margin-bottom: 0; }

/* ---------- Kopfzeile ---------- */
.reframe-hud {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  grid-template-areas: "label mini scores";
  align-items: center;
  gap: 10px 16px;
}
.reframe-hud-label { grid-area: label; }
.reframe-hud .reframe-mini-slot { grid-area: mini; }
.reframe-scores { grid-area: scores; display: flex; gap: 10px; justify-content: flex-end; min-width: 0; }
.reframe-score {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 5px 4px 14px;
  border: var(--bw) solid var(--line);
  border-radius: 99px;
  box-shadow: 0 3px 0 var(--line);
  font-weight: 700;
  min-height: 48px;
}
.reframe-score.tA { background: var(--teamA); color: var(--teamA-ink); }
.reframe-score.tB { background: var(--teamB); color: var(--teamB-ink); }
.reframe-score.tC { background: var(--yellow); color: var(--yellow-ink); }
.reframe-score-name { font-size: 0.85em; white-space: nowrap; }
.reframe-score-num {
  font-family: var(--font-display);
  font-size: 1.35em; line-height: 1;
  min-width: 1.9em; padding: 6px 8px;
  text-align: center;
  border-radius: 99px;
  background: color-mix(in srgb, var(--ink) 22%, transparent);
  color: inherit;
  font-variant-numeric: tabular-nums;
}
.reframe-score-num.bump { animation: reframe-bump 600ms cubic-bezier(.2,1.6,.4,1) both; }
.reframe-score.big { font-size: 1.15em; padding-left: 18px; }
.app[data-look="pixel"] .reframe-score, .app[data-look="pixel"] .reframe-score-num { border-radius: 0; }
.app[data-look="neon"] .reframe-score { background: transparent; box-shadow: 0 0 14px color-mix(in srgb, currentColor 30%, transparent); }
.app[data-look="neon"] .reframe-score.tA { color: var(--teamA); border-color: var(--teamA); }
.app[data-look="neon"] .reframe-score.tB { color: var(--teamB); border-color: var(--teamB); }
.app[data-look="neon"] .reframe-score.tC { color: var(--yellow); border-color: var(--yellow); }
.app[data-look="neon"] .reframe-score-num { background: color-mix(in srgb, currentColor 16%, transparent); }

/* Mini-Turm in der Kopfzeile */
.reframe-mini { display: inline-flex; align-items: flex-end; gap: 6px; }
.reframe-mini-tower { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 44px; }
.reframe-mini-bars { display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; margin-bottom: 2px; }
.reframe-mini-bars i {
  display: block; width: 30px; height: 7px;
  border: 1.5px solid var(--line); border-radius: 2px;
  background: var(--yellow);
}
.reframe-mini-bars i:nth-child(odd) { width: 26px; }
.reframe-mini-bars i.tA { background: var(--teamA); }
.reframe-mini-bars i.tB { background: var(--teamB); }
.reframe-mini-bars i.fresh { animation: reframe-drop-mini 600ms cubic-bezier(.2,1.3,.4,1) both; }
.reframe-mini-tower .base { display: block; width: 40px; height: 9px; background: var(--muted); border: 1.5px solid var(--line); border-radius: 3px 3px 0 0; }
.reframe-mini-num { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; color: var(--yellow); }
.reframe-mini-num b { font-family: var(--font-display); font-weight: 400; font-size: 1.45em; }
.reframe-mini-num small { font-size: 0.62em; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.app[data-look="pixel"] .reframe-mini-bars i, .app[data-look="pixel"] .reframe-mini-tower .base { border-radius: 0; }
.app[data-look="neon"] .reframe-mini-bars i { box-shadow: 0 0 6px currentColor; }

/* ---------- Etikett zum Umdrehen ---------- */
.reframe-flip {
  perspective: 1400px;
  width: min(620px, 100%);
  margin: 0 auto;
  rotate: -1.5deg;
}
.reframe-flip.small { width: min(380px, 100%); rotate: 1.2deg; }
.reframe-flip-inner {
  display: grid;
  transform-style: preserve-3d;
  transition: transform 750ms cubic-bezier(.3,1.35,.5,1);
}
.reframe-flip.flipped .reframe-flip-inner { transform: rotateY(180deg); }
.reframe-flip.demo .reframe-flip-inner { animation: reframe-demo 5.2s ease-in-out infinite; }
.reframe-face {
  grid-area: 1 / 1;
  position: relative;
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
  min-height: 150px;
  padding: 22px 28px 22px 74px;
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  text-align: left;
}
.reframe-face.front { background: var(--text); color: var(--ink); }
/* Loch im Anhänger + Schnur */
.reframe-face.front::before {
  content: ''; position: absolute; left: 26px; top: 50%;
  width: 22px; height: 22px; transform: translateY(-50%);
  border-radius: 50%; background: var(--bg); border: var(--bw) solid var(--line);
}
.reframe-face.front::after {
  content: ''; position: absolute; left: -26px; top: 50%; width: 52px; height: 3px;
  background: var(--muted); transform: rotate(-18deg); transform-origin: right center; opacity: .8;
}
.reframe-face.back {
  transform: rotateY(180deg);
  background: var(--good); color: var(--good-ink);
  align-items: center; text-align: center;
  padding: 22px 28px;
}
.reframe-face-kicker {
  font-size: 0.72em; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  opacity: 0.72;
}
.reframe-face-text {
  font-family: var(--font-display);
  font-size: clamp(1.6em, 2.3vw + 0.9em, 2.7em);
  line-height: 1.08;
  text-wrap: balance;
  hyphens: auto;
  overflow-wrap: break-word;
}
.reframe-face.back .reframe-face-text { text-transform: var(--display-case); letter-spacing: var(--display-track); }
.reframe-face-sub { font-weight: 700; opacity: 0.85; }
.reframe-flip.small .reframe-face { min-height: 96px; padding: 14px 18px 14px 54px; }
.reframe-flip.small .reframe-face.back { padding: 14px 18px; }
.reframe-flip.small .reframe-face.front::before { left: 18px; width: 18px; height: 18px; }
.reframe-flip.small .reframe-face.front::after { display: none; }
.reframe-flip.small .reframe-face-text { font-size: clamp(1.2em, 1.1vw + 0.85em, 1.65em); }
.app[data-look="pixel"] .reframe-flip { rotate: 0deg; }
.app[data-look="pixel"] .reframe-face.front::before { border-radius: 0; }
.app[data-look="neon"] .reframe-face.front { background: var(--panel); color: var(--text); border-style: dashed; border-color: var(--muted); box-shadow: none; }
.app[data-look="neon"] .reframe-face.back { background: var(--panel); color: var(--good); border-color: var(--good); box-shadow: 0 0 24px color-mix(in srgb, var(--good) 45%, transparent); }
.app[data-look="neon"] .reframe-face.back .reframe-face-text { text-shadow: 0 0 18px currentColor; }

/* ---------- Allgemeine Bausteine ---------- */
.reframe-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.reframe-kicker {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); font-weight: 700; font-size: 1.05em;
}
.reframe-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; min-height: 44px;
  border-radius: 99px; border: 2px solid var(--line);
  background: var(--yellow); color: var(--yellow-ink);
  font-weight: 700;
}
.app[data-look="pixel"] .reframe-chip { border-radius: 0; }
.app[data-look="neon"] .reframe-chip { background: transparent; color: var(--yellow); border-color: var(--yellow); }
.reframe-starter {
  align-self: flex-start;
  font-family: var(--font-display);
  text-transform: none;
  font-size: clamp(1.4em, 1.5vw + 0.95em, 2.1em);
  line-height: 1.1;
  color: var(--yellow);
  padding: 0.2em 0.55em;
  border: 3px dashed color-mix(in srgb, var(--yellow) 65%, transparent);
  border-radius: var(--radius-sm);
}
.reframe-starter.small { font-size: 1.35em; }

/* Bedenkzeit */
.reframe-think {
  display: flex; align-items: center; justify-content: space-between; gap: 18px 26px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line);
  padding: 18px 24px;
}
.reframe-think-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.reframe-timer { flex: none; }
.reframe-tip { min-height: 48px; display: flex; align-items: center; }

/* Zwei Team-Felder */
.reframe-headrow { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
.reframe-headrow > .stack { flex: 1 1 300px; min-width: 0; }
.reframe-headrow > .reframe-flip { flex: 0 1 360px; margin: 0; }
.reframe-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.reframe-panel {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 0 10px 0 var(--rf-team, var(--accent)), 0 var(--lift) 0 var(--line);
  padding: 26px 20px 20px;
  min-width: 0;
}
.reframe-panel.tA { --rf-team: var(--teamA); }
.reframe-panel.tB { --rf-team: var(--teamB); }
.reframe-panel.vote { align-items: center; text-align: center; }
.reframe-panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.reframe-panel-head b { font-family: var(--font-display); font-size: 1.35em; letter-spacing: var(--display-track); text-transform: var(--display-case); color: var(--rf-team); }
.reframe-panel.vote .reframe-panel-head { justify-content: center; }
.reframe-order {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%; border: var(--bw) solid var(--line);
  background: var(--rf-team); color: var(--ink);
  font-family: var(--font-display); font-size: 1.3em;
}
.app[data-look="pixel"] .reframe-order { border-radius: 0; }
.app[data-look="neon"] .reframe-panel { box-shadow: inset 0 4px 0 var(--rf-team), 0 0 18px color-mix(in srgb, var(--rf-team) 25%, transparent); border-color: color-mix(in srgb, var(--rf-team) 60%, transparent); }
.app[data-look="neon"] .reframe-order { background: transparent; color: var(--rf-team); border-color: var(--rf-team); }

/* Teams im Intro */
.reframe-teams { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.reframe-teams-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 12px; }
.reframe-teamchip {
  display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05;
  padding: 10px 18px;
  border: var(--bw) solid var(--line); border-radius: var(--radius-sm);
  box-shadow: 0 var(--lift) 0 var(--line);
  font-family: var(--font-display); font-size: 1.25em;
  text-transform: var(--display-case); letter-spacing: var(--display-track);
}
.reframe-teamchip small { font-family: var(--font-body); font-size: 0.6em; font-weight: 700; opacity: 0.8; text-transform: none; letter-spacing: 0; }
.reframe-teamchip.tA { background: var(--teamA); color: var(--teamA-ink); }
.reframe-teamchip.tB { background: var(--teamB); color: var(--teamB-ink); }
.app[data-look="neon"] .reframe-teamchip { background: transparent; box-shadow: 0 0 14px color-mix(in srgb, currentColor 35%, transparent); }
.app[data-look="neon"] .reframe-teamchip.tA { color: var(--teamA); border-color: var(--teamA); }
.app[data-look="neon"] .reframe-teamchip.tB { color: var(--teamB); border-color: var(--teamB); }
.reframe-vs { font-family: var(--font-display); font-size: 1.4em; color: var(--muted); text-transform: uppercase; }

/* Intro: Demo + 3 Schritte */
.reframe-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 300px); gap: 24px 32px; align-items: center; }
.reframe-split > * { min-width: 0; }
.reframe-demo { display: flex; flex-direction: column; gap: 16px; padding: 8px 0 0 26px; }
.reframe-solo-demo { width: min(420px, 100%); margin: 0 auto; padding-left: 20px; }
.reframe-demo-cap { text-align: center; }
.reframe-steps { display: flex; flex-direction: column; gap: 10px; }
.reframe-step {
  display: flex; align-items: center; gap: 14px;
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius);
  padding: 12px 16px;
}
.reframe-step b { display: block; font-family: var(--font-display); font-size: 1.15em; letter-spacing: var(--display-track); text-transform: var(--display-case); }
.reframe-step .muted { display: block; font-size: 0.92em; line-height: 1.3; }
.reframe-step-n {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%; border: var(--bw) solid var(--line);
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-size: 1.35em;
}
.app[data-look="pixel"] .reframe-step-n { border-radius: 0; }
.app[data-look="neon"] .reframe-step-n { background: transparent; color: var(--accent); border-color: var(--accent); }

/* Ergebnis einer Battle-Runde */
.reframe-res-l { gap: 16px; }
.reframe-res-l .reframe-flip { margin: 6px 0 4px 26px; width: calc(100% - 26px); }
.reframe-result {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px 14px;
  padding: 10px 12px 10px 16px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-left: 10px solid var(--rf-team, var(--accent));
  border-radius: var(--radius-sm);
}
.reframe-result.tA { --rf-team: var(--teamA); }
.reframe-result.tB { --rf-team: var(--teamB); }
.reframe-result-l { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; min-width: 0; }
.reframe-result b { font-family: var(--font-display); font-weight: 400; font-size: 1.15em; letter-spacing: var(--display-track); text-transform: var(--display-case); }
.reframe-result-ja { color: var(--muted); font-weight: 600; }
.reframe-result-msg { font-weight: 700; text-align: right; }
.reframe-result.yes .reframe-result-msg { color: var(--good); }
.reframe-plus {
  font-family: var(--font-display); font-size: 1.15em;
  padding: 3px 12px; border-radius: 99px;
  background: var(--yellow); color: var(--yellow-ink); border: 2px solid var(--line);
  animation: reframe-bump 600ms 700ms cubic-bezier(.2,1.6,.4,1) both;
}
.app[data-look="pixel"] .reframe-plus { border-radius: 0; }
.app[data-look="neon"] .reframe-plus { background: transparent; color: var(--yellow); border-color: var(--yellow); }

/* ---------- Stärken-Turm ---------- */
.reframe-tower-slot { display: flex; justify-content: center; align-items: flex-end; min-width: 0; }
.reframe-tower { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
.reframe-roof { position: relative; width: 74%; height: 62px; margin-bottom: -2px; }
.reframe-roof svg { display: block; width: 100%; height: 100%; overflow: visible; }
.reframe-roof path { fill: transparent; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 9 7; stroke-linejoin: round; opacity: 0.5; }
.reframe-roof.on path { fill: var(--accent); stroke: var(--line); stroke-width: 4; stroke-dasharray: none; opacity: 1; }
.reframe-roof.fresh { animation: reframe-drop 800ms 250ms cubic-bezier(.2,1.2,.4,1) both; }
.reframe-roof-star { position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%); color: var(--accent-ink); display: grid; }
.reframe-blocks { display: flex; flex-direction: column-reverse; align-items: center; width: 100%; }
.reframe-block {
  display: flex; align-items: center; justify-content: center;
  width: 86%;
  min-height: 2.35em;
  margin-top: -3px;
  padding: 0.35em 0.7em;
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: inset 0 -5px 0 color-mix(in srgb, var(--ink) 20%, transparent);
  font-family: var(--font-display);
  font-size: 1.05em; line-height: 1.05;
  text-transform: var(--display-case); letter-spacing: var(--display-track);
  text-align: center;
  hyphens: auto; overflow-wrap: break-word;
  background: var(--yellow); color: var(--yellow-ink);
}
.reframe-block span { min-width: 0; }
.reframe-block.long { font-size: 0.9em; }
.reframe-block.xlong { font-size: 0.8em; }
.app[data-look="pixel"] .reframe-block { letter-spacing: 0.02em; }
.app[data-look="pixel"] .reframe-block.long { font-size: 0.8em; }
.app[data-look="pixel"] .reframe-block.xlong { font-size: 0.7em; }
.reframe-block:nth-child(5n+1) { width: 88%; }
.reframe-block:nth-child(5n+2) { width: 76%; rotate: 0.8deg; }
.reframe-block:nth-child(5n+3) { width: 82%; rotate: -0.7deg; }
.reframe-block:nth-child(5n+4) { width: 70%; }
.reframe-block:nth-child(5n+5) { width: 80%; rotate: 0.6deg; }
.reframe-block.tA { background: var(--teamA); color: var(--teamA-ink); }
.reframe-block.tB { background: var(--teamB); color: var(--teamB-ink); }
.reframe-block.fresh { animation: reframe-drop 700ms cubic-bezier(.2,1.2,.4,1) both; }
.reframe-base { position: relative; width: 100%; height: 66px; margin-top: -3px; }
.reframe-base-shape { position: absolute; inset: 0; }
.reframe-base-shape svg { display: block; width: 100%; height: 100%; overflow: visible; }
.reframe-base-shape .b { fill: var(--panel2); stroke: var(--line); stroke-width: 3.5; stroke-linejoin: round; }
.reframe-base-shape .d { fill: var(--bg); stroke: var(--line); stroke-width: 3; }
.reframe-base-name {
  position: absolute; left: 12%; right: 12%; top: 6px;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--font-display); font-weight: 400; font-size: 0.95em;
  text-transform: var(--display-case); letter-spacing: var(--display-track);
  color: var(--text);
}
.reframe-tower.compact { max-width: 220px; font-size: 0.82em; }
.app[data-look="pixel"] .reframe-block { rotate: 0deg; border-radius: 0; }
.app[data-look="neon"] .reframe-block { background: color-mix(in srgb, var(--yellow) 12%, var(--bg)); color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 12px color-mix(in srgb, var(--yellow) 35%, transparent); }
.app[data-look="neon"] .reframe-block.tA { background: color-mix(in srgb, var(--teamA) 12%, var(--bg)); color: var(--teamA); border-color: var(--teamA); box-shadow: 0 0 12px color-mix(in srgb, var(--teamA) 35%, transparent); }
.app[data-look="neon"] .reframe-block.tB { background: color-mix(in srgb, var(--teamB) 12%, var(--bg)); color: var(--teamB); border-color: var(--teamB); box-shadow: 0 0 12px color-mix(in srgb, var(--teamB) 35%, transparent); }
.app[data-look="neon"] .reframe-base-shape .b { fill: var(--panel); stroke: var(--accent); }
.app[data-look="neon"] .reframe-roof.on path { fill: color-mix(in srgb, var(--accent) 18%, var(--bg)); stroke: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); }
.app[data-look="neon"] .reframe-roof-star { color: var(--accent); }

/* ---------- Profi-Reframes ---------- */
.reframe-profis { display: flex; flex-direction: column; gap: 14px; }
.reframe-profi {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 18px 22px;
  font-size: clamp(1.2em, 1.3vw + 0.8em, 1.75em);
  line-height: 1.28;
}
.reframe-profi p { min-width: 0; text-wrap: pretty; }
.reframe-profi b { font-weight: 700; }
.reframe-profi-ic { flex: none; color: var(--yellow); display: grid; margin-top: 3px; }
.reframe-profi-wer { color: var(--muted); }
.reframe-was { font-size: 1.15em; }
.reframe-was s { font-family: var(--font-display); text-decoration-thickness: 3px; text-decoration-color: var(--teamB); color: var(--muted); }

/* ---------- Speed-Match ---------- */
.reframe-bolt {
  width: 104px; height: 104px; display: grid; place-items: center;
  border-radius: 50%; border: var(--bw) solid var(--line);
  background: var(--yellow); color: var(--yellow-ink);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  animation: floaty 3s ease-in-out infinite;
}
.app[data-look="pixel"] .reframe-bolt { border-radius: 0; }
.app[data-look="neon"] .reframe-bolt { background: transparent; color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 26px color-mix(in srgb, var(--yellow) 50%, transparent); }
.reframe-q {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: clamp(16px, 2.4vw, 28px);
}
.reframe-q .reframe-face-kicker { color: var(--yellow); opacity: 1; }
.reframe-q-text {
  font-family: var(--font-display);
  font-size: clamp(1.55em, 2.2vw + 0.9em, 2.6em);
  line-height: 1.12;
  text-wrap: balance;
}
.reframe-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.reframe-opt {
  display: flex; align-items: center; gap: 14px;
  min-height: 72px;
  padding: 10px 16px 10px 12px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line);
  font-size: 1.15em; font-weight: 700; line-height: 1.2;
  transition: opacity 300ms, background 300ms, transform 120ms;
  min-width: 0;
}
.reframe-opt.as-btn { appearance: none; font-family: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; touch-action: manipulation; }
.reframe-opt.as-btn:hover { background: var(--panel2); }
.reframe-opt.as-btn:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.reframe-opt.as-btn[disabled] { cursor: default; }
.reframe-opt-text { min-width: 0; overflow-wrap: break-word; }
.reframe-letter {
  width: 48px; height: 48px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--radius-sm); border: var(--bw) solid var(--line);
  font-family: var(--font-display); font-size: 1.5em;
}
.reframe-letter.lA { background: var(--teamA); color: var(--teamA-ink); }
.reframe-letter.lB { background: var(--teamB); color: var(--teamB-ink); }
.reframe-letter.lC { background: var(--good); color: var(--good-ink); }
.reframe-letter.lD { background: var(--yellow); color: var(--yellow-ink); }
.reframe-opt.ok { background: color-mix(in srgb, var(--good) 22%, var(--panel)); border-color: var(--good); box-shadow: 0 0 0 3px var(--good), 0 var(--lift) 0 var(--line); animation: reframe-bump 500ms cubic-bezier(.2,1.6,.4,1) both; }
.reframe-opt.nope { opacity: 0.5; }
.reframe-opt.nope .reframe-opt-text { text-decoration: line-through; text-decoration-thickness: 3px; }
.reframe-opt.dim { opacity: 0.55; }
.reframe-opt-ic { margin-left: auto; color: var(--good); display: grid; flex: none; }
.app[data-look="neon"] .reframe-letter { background: transparent; }
.app[data-look="neon"] .reframe-letter.lA { color: var(--teamA); border-color: var(--teamA); }
.app[data-look="neon"] .reframe-letter.lB { color: var(--teamB); border-color: var(--teamB); }
.app[data-look="neon"] .reframe-letter.lC { color: var(--good); border-color: var(--good); }
.app[data-look="neon"] .reframe-letter.lD { color: var(--yellow); border-color: var(--yellow); }
.reframe-ask { text-align: center; font-size: 1.45em; }
.reframe-reveal { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
.reframe-reveal > .stack { flex: 1 1 320px; }
.reframe-reveal > .reframe-flip { flex: 0 1 340px; margin: 0; }
.reframe-ov-hint { text-align: center; }

/* ---------- Finale ---------- */
.reframe-split.final { align-items: end; grid-template-columns: minmax(0, 1fr) minmax(250px, 360px); }
.reframe-split.final .reframe-tower { max-width: 360px; font-size: 1.1em; }
.reframe-final-l { gap: 14px; }
.reframe-final-scores { display: flex; flex-wrap: wrap; gap: 12px; }
.reframe-total { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-family: var(--font-display); font-size: 1.35em; color: var(--yellow); text-transform: var(--display-case); letter-spacing: var(--display-track); }
.reframe-total-num { font-size: 1.7em; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- Animationen ---------- */
@keyframes reframe-demo {
  0%, 30% { transform: rotateY(0deg); }
  42%, 80% { transform: rotateY(180deg); }
  92%, 100% { transform: rotateY(360deg); }
}
@keyframes reframe-drop {
  0% { transform: translateY(-170px); opacity: 0; }
  55% { transform: translateY(8px); opacity: 1; }
  75% { transform: translateY(-4px); }
  100% { transform: none; opacity: 1; }
}
@keyframes reframe-drop-mini {
  0% { transform: translateY(-30px); opacity: 0; }
  70% { transform: translateY(2px); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
@keyframes reframe-bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* ---------- iPad hochkant: etwas größer, Turm groß unter dem Text ---------- */
@media (orientation: portrait) and (min-width: 701px) {
  .wrap.reframe-screen { font-size: 1.16em; gap: 26px; }
  .reframe-split.intro { grid-template-columns: 1fr; }
  .reframe-split.intro .reframe-steps { flex-direction: row; }
  .reframe-split.intro .reframe-step { flex: 1 1 0; flex-direction: column; align-items: flex-start; }
  .reframe-duo .reframe-panel { padding: 30px 22px 24px; }
  .reframe-split.final { grid-template-columns: 1fr; align-items: start; }
  .reframe-split.final .reframe-tower { max-width: 420px; font-size: 1.25em; }
  .reframe-split.final .reframe-final-l { align-items: center; text-align: center; }
  .reframe-split.final .reframe-final-scores, .reframe-split.final .reframe-total { justify-content: center; }
}

/* ---------- Kleine Bildschirme ---------- */
@media (max-width: 700px) {
  .reframe-split, .reframe-split.final { grid-template-columns: 1fr; }
  .reframe-demo { padding-left: 22px; }
  .reframe-tower, .reframe-split.final .reframe-tower { max-width: 280px; font-size: 1em; }
}
@media (max-width: 640px) {
  .reframe-duo { grid-template-columns: 1fr; }
  .reframe-think { position: relative; flex-wrap: wrap; justify-content: center; padding: 16px; }
  .reframe-think-txt { flex-basis: 100%; }
  .reframe-think-txt h2 { padding-right: 84px; min-height: 60px; }
  .reframe-timer { position: absolute; top: 10px; right: 10px; width: 80px; height: 80px; }
  .reframe-timer .timer { width: 80px; height: 80px; }
  .reframe-timer .timer .num { font-size: 1.6em; }
  .reframe-flip { rotate: -0.6deg; width: calc(100% - 10px); }
  .reframe-flip.small { rotate: 0.6deg; }
  .reframe-face { min-height: 116px; padding: 18px 18px 18px 58px; }
  .reframe-face.front::before { left: 20px; }
  .reframe-face.front::after { display: none; }
  .reframe-res-l .reframe-flip, .reframe-demo .reframe-flip { margin-left: 0; width: calc(100% - 10px); }
  .reframe-demo, .reframe-solo-demo { padding-left: 0; }
}
@media (max-width: 520px) {
  .reframe-hud { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label mini" "scores scores"; }
  .reframe-scores { justify-content: stretch; }
  .reframe-scores .reframe-score { flex: 1 1 0; min-width: 0; justify-content: space-between; }
  .reframe-scores .reframe-score:only-child { flex: 0 1 auto; margin-left: auto; }
  .reframe-score-name { font-size: 0.78em; overflow: hidden; text-overflow: ellipsis; }
  .reframe-opts { grid-template-columns: 1fr; }
  .reframe-opt { min-height: 60px; }
  .reframe-teams-row { flex-direction: column; gap: 4px; }
  .reframe-result { grid-template-columns: minmax(0, 1fr) auto; }
  .reframe-result-msg { display: none; }
}

/* ---- solo/solo-zone.css ---- */
/* Solo-Zone: „Chill-Zone“ und „Gefühls-Decoder“ – alle Klassen mit Präfix solo- */

/* Pixel-Schrift: Ligaturen („fi“, „fl“) sehen dort kaputt aus */
.app[data-look="pixel"] .solo-screen { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }

/* =========================================================
   Chill-Zone: Menü
   ========================================================= */
.solo-ex-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.solo-ex { gap: 10px; align-items: stretch; min-height: 0; }
.solo-ex-art {
  display: grid; place-items: center;
  height: clamp(110px, 16vh, 150px);
  border-radius: var(--radius-sm);
  background: radial-gradient(120% 100% at 50% 100%, color-mix(in srgb, var(--good) 16%, transparent) 0%, transparent 70%), var(--bg2);
  border: 2px solid color-mix(in srgb, var(--line) 70%, transparent);
  overflow: hidden;
}
.solo-ex-art svg { width: 100%; height: 100%; display: block; }
.solo-ex-text { display: flex; flex-direction: column; gap: 6px; }
.solo-ex-pill { align-self: flex-start; }

/* Menü-Bilder (Farben aus den Tokens) */
.solo-art-bg { fill: var(--panel); }
.solo-art-halo { fill: var(--good); opacity: 0.14; }
.solo-art-ring { fill: none; stroke: var(--text); stroke-width: 4; opacity: 0.85; }
.solo-art-wave { fill: var(--good); }
.solo-art-wave2 { fill: var(--teamA); opacity: 0.7; }
.solo-art-shine { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0.45; }
.solo-art-slide { animation: solo-slide 4.5s linear infinite; }
.solo-art-slide.rev { animation-duration: 3.2s; animation-direction: reverse; }
@keyframes solo-slide { from { transform: translateX(0); } to { transform: translateX(60px); } }
.solo-art-shadow { fill: var(--ink); opacity: 0.35; }
.solo-art-liquid { fill: var(--teamA); opacity: 0.22; }
.solo-art-glass { fill: none; stroke: var(--text); stroke-width: 4; opacity: 0.9; }
.solo-art-lid { fill: var(--accent); stroke: var(--ink); stroke-width: 3; }
.solo-art-c1 { fill: var(--yellow); } .solo-art-c2 { fill: var(--accent); } .solo-art-c3 { fill: var(--good); }
.solo-art-c4 { fill: var(--teamA); } .solo-art-c5 { fill: var(--teamB); }
.solo-art-path { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 4 7; opacity: 0.6; }
.solo-art-num circle { stroke: var(--ink); stroke-width: 3; }
.solo-art-num text { font-family: var(--font-display); font-size: 17px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
.solo-art-num.n0 circle { fill: var(--accent); } .solo-art-num.n1 circle { fill: var(--yellow); }
.solo-art-num.n2 circle { fill: var(--good); } .solo-art-num.n3 circle { fill: var(--teamA); }
.solo-art-num.n4 circle { fill: var(--teamB); }

/* =========================================================
   Chill-Zone: Abschluss „Wie ist es jetzt?“
   ========================================================= */
.solo-done-badge {
  width: 92px; height: 92px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--good); color: var(--good-ink);
  border: var(--bw) solid var(--line);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
}
.app[data-look="pixel"] .solo-done-badge { border-radius: 0; }
.app[data-look="neon"] .solo-done-badge { background: transparent; color: var(--good); border-color: var(--good); box-shadow: 0 0 22px color-mix(in srgb, var(--good) 50%, transparent); }
.solo-checkout { width: 100%; align-items: center; text-align: center; box-sizing: border-box; }
.solo-feel-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; }
.solo-feel {
  appearance: none; font: inherit; color: var(--text); font-weight: 600;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 112px; padding: 12px 8px;
  background: var(--panel2);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  cursor: pointer; touch-action: manipulation;
  transition: transform 120ms ease, background 160ms;
}
.solo-feel:active { transform: translateY(2px); }
.solo-feel.sel { background: var(--bg2); color: var(--yellow); outline: 4px solid var(--yellow); outline-offset: 2px; }
.solo-feel-answer { color: var(--muted); min-height: 2.8em; text-wrap: pretty; }
.solo-feel-answer.on { color: var(--text); font-weight: 600; }

/* =========================================================
   Atem-Welle: Einstellungen
   ========================================================= */
.solo-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.solo-seg-btn, .solo-rh {
  appearance: none; font: inherit; color: var(--text);
  background: var(--panel2);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line);
  cursor: pointer; touch-action: manipulation;
  transition: transform 100ms ease, background 160ms;
}
.solo-seg-btn { min-height: 76px; display: flex; align-items: baseline; justify-content: center; gap: 8px; padding: 10px; }
.solo-seg-btn b { font-family: var(--font-display); font-weight: 400; font-size: 2.2em; line-height: 1; }
.solo-seg-btn span { font-weight: 700; color: var(--muted); }
.solo-seg-btn.sel { background: var(--yellow); color: var(--yellow-ink); }
.solo-seg-btn.sel span { color: var(--yellow-ink); }
.solo-seg-btn:active, .solo-rh:active { transform: translateY(3px); box-shadow: none; }
.app[data-look="neon"] .solo-seg-btn.sel { background: transparent; color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 14px color-mix(in srgb, var(--yellow) 45%, transparent); }
.app[data-look="neon"] .solo-seg-btn.sel span { color: var(--yellow); }

.solo-rh-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.solo-rh { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; min-height: 96px; }
.solo-rh.sel { border-color: var(--yellow); outline: 3px solid var(--yellow); outline-offset: 0; background: color-mix(in srgb, var(--yellow) 12%, var(--panel2)); }
.solo-rh-art { flex: none; width: 70px; height: 46px; display: grid; place-items: center; }
.solo-rh-art svg { width: 100%; height: 100%; }
.solo-rh-line { fill: none; stroke: var(--good); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.solo-rh-dot { fill: var(--yellow); stroke: var(--ink); stroke-width: 2; }
.solo-rh-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.solo-rh-title { font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: 1.25em; line-height: 1.1; }
.solo-rh-nums { font-weight: 700; color: var(--yellow); letter-spacing: 0.04em; }
.solo-rh-desc { color: var(--muted); font-size: 0.88em; }

/* =========================================================
   Atem-Welle: Übung
   ========================================================= */
.solo-breath-head { align-items: center; }
.solo-breath { display: grid; grid-template-columns: 1fr; justify-items: center; align-items: center; align-content: center; gap: 22px; text-align: center; flex: 1; }
.solo-breath-side { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 520px; }
.solo-port { position: relative; width: min(46vh, 86vw, 520px); aspect-ratio: 1; }
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .solo-breath { grid-template-columns: auto minmax(0, 1fr); justify-items: start; text-align: left; gap: clamp(24px, 4vw, 56px); }
  .solo-breath-side { align-items: flex-start; }
  .solo-phases { justify-content: flex-start; }
  .solo-port { width: min(64vh, 44vw, 540px); }
}
.solo-port-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.solo-port-halo { fill: var(--good); opacity: 0.2; }
.solo-port-bg { fill: var(--bg2); }
.solo-port-ring { fill: none; stroke: var(--line); stroke-width: 9; }
.solo-port-shine { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; opacity: 0.3; }
.solo-wave.front { fill: var(--good); opacity: 0.92; }
.solo-wave.back { fill: var(--teamA); opacity: 0.6; }
.solo-wave-line { fill: none; stroke: #fff; stroke-width: 3; opacity: 0.35; }
.solo-bubble { fill: #fff; opacity: 0.35; }
.app[data-look="neon"] .solo-port-ring { stroke: var(--accent); stroke-width: 5; filter: drop-shadow(0 0 8px var(--accent)); }
.app[data-look="neon"] .solo-wave.front { opacity: 0.75; }
.app[data-look="pixel"] .solo-port-ring { stroke-width: 12; }
.solo-port-num {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-size: clamp(3em, 11vmin, 6.5em);
  line-height: 1;
  color: var(--text);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.app[data-look="neon"] .solo-port-num { -webkit-text-stroke: 0; text-shadow: 0 0 22px var(--accent); }
.solo-phase-label { font-size: clamp(2.1em, 3.6vw + 0.8em, 3.4em); color: var(--text); transition: color 400ms ease; }
.solo-phase-label[data-phase="in"] { color: var(--good); }
.solo-phase-label[data-phase="hold"], .solo-phase-label[data-phase="rest"] { color: var(--yellow); }
.solo-phase-label[data-phase="out"] { color: var(--teamA); }
.solo-phase-hint { min-height: 1.4em; }
.solo-phases { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.solo-phase {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; min-height: 44px; box-sizing: border-box;
  border-radius: 99px;
  background: var(--panel);
  border: 2px solid var(--line);
  font-weight: 700;
  transition: background 300ms ease, color 300ms ease;
}
.solo-phase b { font-family: var(--font-display); font-weight: 400; color: var(--muted); }
.solo-phase.on { background: var(--yellow); color: var(--yellow-ink); }
.solo-phase.on b { color: var(--yellow-ink); }
.app[data-look="pixel"] .solo-phase { border-radius: 0; }
.app[data-look="neon"] .solo-phase.on { background: transparent; color: var(--yellow); border-color: var(--yellow); }
.app[data-look="neon"] .solo-phase.on b { color: var(--yellow); }
.solo-thin { height: 14px; width: 100%; max-width: 420px; }

/* =========================================================
   Glitzerglas
   ========================================================= */
.solo-jar-head { align-items: flex-end; }
.solo-jar-box {
  position: relative;
  width: 100%;
  height: clamp(280px, calc(100vh - 320px), 780px);
  touch-action: none;
}
@supports (height: 100dvh) { .solo-jar-box { height: clamp(280px, calc(100dvh - 320px), 780px); } }
.solo-jar-canvas { display: block; touch-action: none; cursor: grab; }
.solo-jar-canvas:active { cursor: grabbing; }
.solo-jar-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.solo-jar-msg { flex: 1 1 320px; min-height: 2.6em; display: flex; align-items: center; text-wrap: balance; }
.solo-jar-btns { flex-wrap: nowrap; }

/* =========================================================
   5-4-3-2-1
   ========================================================= */
.solo-sense-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.solo-sense-mini {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  min-width: 104px; padding: 14px 12px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line);
  font-weight: 600;
}
.solo-sense-mini b { font-size: 2.2em; font-weight: 400; color: var(--yellow); line-height: 1; }

.solo-sense-track { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.solo-sense-pip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; min-height: 40px; box-sizing: border-box;
  border-radius: 99px;
  border: 2px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  font-family: var(--font-display);
  transition: background 200ms, color 200ms, transform 200ms;
}
.solo-sense-pip.done { background: var(--good); color: var(--good-ink); }
.solo-sense-pip.now { background: var(--yellow); color: var(--yellow-ink); transform: scale(1.08); }
.app[data-look="pixel"] .solo-sense-pip { border-radius: 0; }
.app[data-look="neon"] .solo-sense-pip.done { background: transparent; color: var(--good); border-color: var(--good); }
.app[data-look="neon"] .solo-sense-pip.now { background: transparent; color: var(--yellow); border-color: var(--yellow); }

.solo-sense-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
  gap: clamp(18px, 3vw, 36px);
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: clamp(18px, 3vw, 36px);
}
.solo-sense-big { position: relative; width: clamp(120px, 17vw, 180px); aspect-ratio: 1; display: grid; place-items: center; }
.solo-sense-num {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--accent-2, var(--accent)) 0%, var(--accent) 65%);
  color: var(--accent-ink);
  border: var(--bw) solid var(--line);
  box-shadow: 0 var(--lift) 0 var(--line);
  font-size: clamp(4em, 8vw, 6.2em);
  line-height: 1;
}
.solo-sense-icon {
  position: absolute; right: -16px; bottom: -8px;
  width: 62px; height: 62px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--yellow); color: var(--yellow-ink);
  border: var(--bw) solid var(--line);
}
.app[data-look="pixel"] .solo-sense-num, .app[data-look="pixel"] .solo-sense-icon { border-radius: 0; }
.app[data-look="neon"] .solo-sense-num { background: transparent; color: var(--accent); border-color: var(--accent); box-shadow: 0 0 26px color-mix(in srgb, var(--accent) 45%, transparent); }
.app[data-look="neon"] .solo-sense-icon { background: var(--bg); color: var(--yellow); border-color: var(--yellow); }
.solo-sense-text { gap: 10px; min-width: 0; }
.solo-sense-task {
  font-family: var(--font-display);
  font-size: clamp(1.5em, 2.2vw + 0.7em, 2.5em);
  line-height: 1.15;
  text-wrap: balance;
}
.app[data-look="pixel"] .solo-sense-task { font-size: clamp(1.3em, 1.8vw + 0.6em, 2.1em); }

.solo-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.solo-dot {
  appearance: none; font: inherit;
  width: 76px; height: 76px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: var(--bw) dashed var(--muted);
  background: color-mix(in srgb, var(--panel) 60%, transparent);
  color: var(--muted);
  font-family: var(--font-display); font-size: 1.5em;
  cursor: pointer; touch-action: manipulation;
  transition: background 160ms, color 160ms, transform 120ms;
}
.solo-dot:active { transform: scale(0.94); }
.solo-dot.on { border-style: solid; border-color: var(--line); background: var(--good); color: var(--good-ink); animation: pop-in 280ms cubic-bezier(.2,1.5,.4,1) both; box-shadow: 0 4px 0 var(--line); }
.app[data-look="pixel"] .solo-dot { border-radius: 0; }
.app[data-look="neon"] .solo-dot.on { background: transparent; color: var(--good); border-color: var(--good); box-shadow: 0 0 16px color-mix(in srgb, var(--good) 55%, transparent); }

.btn.solo-ready { animation: solo-ready 1.4s ease-in-out infinite; }
@keyframes solo-ready {
  0%, 100% { box-shadow: 0 var(--lift) 0 var(--line), 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); }
  50% { box-shadow: 0 var(--lift) 0 var(--line), 0 0 0 10px color-mix(in srgb, var(--good) 0%, transparent); }
}

/* =========================================================
   Gefühls-Decoder
   ========================================================= */
.solo-dec-hud { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.solo-pips { display: flex; gap: 5px; flex-wrap: wrap; }
.solo-pips i { display: block; width: 22px; height: 9px; border-radius: 99px; background: var(--panel2); border: 2px solid var(--line); }
.solo-pips i.done { background: var(--good); }
.solo-pips i.now { background: var(--yellow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 30%, transparent); }
.app[data-look="pixel"] .solo-pips i { border-radius: 0; }
.solo-dec-stats { gap: 8px; }
.solo-streak, .solo-score {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; min-height: 42px; box-sizing: border-box;
  border-radius: 99px;
  background: var(--panel);
  border: 2px solid var(--line);
  font-weight: 700;
}
.solo-streak b, .solo-score b { font-family: var(--font-display); font-weight: 400; font-size: 1.3em; line-height: 1; font-variant-numeric: tabular-nums; }
.solo-score { color: var(--yellow); }
.solo-streak { color: var(--muted); }
.solo-streak.hot { color: var(--accent); border-color: var(--accent); }
.solo-stat-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.app[data-look="pixel"] .solo-streak, .app[data-look="pixel"] .solo-score { border-radius: 0; }

/* Szene */
.solo-dec-scene {
  position: relative;
  display: grid;
  grid-template-columns: clamp(108px, 15vw, 164px) minmax(0, 1fr);
  gap: clamp(14px, 2.4vw, 28px);
  align-items: start;
  padding: clamp(16px, 2.6vw, 28px);
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, color-mix(in srgb, var(--text) 3%, transparent) 3px 4px),
    var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
}
.solo-dec-ava { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.solo-dec-ava-img, .solo-dec-hero-ava {
  position: relative;
  width: 100%;
  aspect-ratio: 120 / 130;
  overflow: hidden;
  border-radius: var(--radius);
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--good) 26%, var(--bg2)) 0%, var(--bg2) 72%);
  border: 2px solid color-mix(in srgb, var(--good) 55%, var(--line));
}
.solo-ava-svg { width: 100%; height: 100%; display: block; }
.solo-scanline {
  position: absolute; left: 0; right: 0; top: -30%;
  height: 28%;
  background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--good) 28%, transparent) 88%, var(--good) 96%, transparent 100%);
  animation: solo-scan 2.8s ease-in-out infinite;
  pointer-events: none;
}
@keyframes solo-scan { 0% { top: -30%; } 60%, 100% { top: 108%; } }
.solo-brackets {
  position: absolute; inset: 7px; pointer-events: none;
  --c: var(--good); --l: 16px; --t: 3px;
  background:
    linear-gradient(var(--c), var(--c)) top left / var(--l) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) top left / var(--t) var(--l) no-repeat,
    linear-gradient(var(--c), var(--c)) top right / var(--l) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) top right / var(--t) var(--l) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--l) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--t) no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--l) no-repeat;
}
.solo-dec-name {
  font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track);
  font-size: 1.2em; line-height: 1;
  padding: 7px 14px;
  border-radius: 99px;
  background: var(--panel2);
  border: 2px solid var(--line);
}
.app[data-look="pixel"] .solo-dec-name { border-radius: 0; }
.solo-dec-body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.solo-dec-line { display: flex; gap: 12px; align-items: flex-start; }
.solo-dec-line p { margin: 0; font-size: 1.12em; text-wrap: pretty; }
.solo-dec-line.sit p { color: var(--text); }
.solo-dec-line.body p { color: var(--text); font-weight: 600; }
.solo-dec-tag {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--panel2);
  color: var(--muted);
  border: 2px solid var(--line);
}
.solo-dec-line.body .solo-dec-tag { color: var(--good); }
.app[data-look="pixel"] .solo-dec-tag { border-radius: 0; }
.solo-dec-quote {
  position: relative;
  align-self: flex-start;
  max-width: 100%;
  margin-left: 48px;
  padding: 14px 22px;
  background: var(--text);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1.45em, 2vw + 0.8em, 2.35em);
  line-height: 1.12;
  text-wrap: balance;
  border: var(--bw) solid var(--line);
  border-radius: 22px;
  box-shadow: 0 var(--lift) 0 var(--line);
  box-sizing: border-box;
}
.solo-dec-quote::before {
  content: ""; position: absolute; left: -14px; top: 18px;
  width: 22px; height: 22px;
  background: var(--text);
  border-left: var(--bw) solid var(--line);
  border-bottom: var(--bw) solid var(--line);
  transform: rotate(45deg);
}
.app[data-look="pixel"] .solo-dec-quote { border-radius: 0; font-size: clamp(1.25em, 1.6vw + 0.7em, 2em); }
.app[data-look="neon"] .solo-dec-quote { background: transparent; color: var(--text); border-color: var(--accent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 40%, transparent); }
.app[data-look="neon"] .solo-dec-quote::before { background: var(--panel); border-color: var(--accent); }
.solo-dec-q { font-size: clamp(1.25em, 1.4vw + 0.8em, 1.75em); }

.solo-dec-answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.solo-dec-answers.lv { display: flex; flex-direction: column; gap: 12px; }
.solo-opt { justify-content: flex-start; gap: 14px; font-size: 1.3em; min-height: 74px; white-space: normal; text-align: left; }
.solo-opt span:last-child { overflow-wrap: anywhere; }
.btn.sel[disabled] { opacity: 1; outline: 4px solid var(--yellow); outline-offset: 3px; }
.solo-dot-emo { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); box-sizing: border-box; }
.app[data-look="pixel"] .solo-dot-emo { border-radius: 0; }
.solo-dec-chosen { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.solo-chip-static { pointer-events: none; cursor: default; font-weight: 700; }
.solo-lv-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.solo-lv { flex-direction: column; gap: 10px; min-height: 108px; font-size: 1.25em; }

/* Stärke-Balken */
.solo-meter { display: inline-flex; align-items: flex-end; gap: 4px; height: 30px; }
.solo-meter i { display: block; width: 11px; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent); border: 2px solid var(--line); box-sizing: border-box; }
.solo-meter i:nth-child(1) { height: 42%; } .solo-meter i:nth-child(2) { height: 70%; } .solo-meter i:nth-child(3) { height: 100%; }
.solo-meter i.on { background: var(--yellow); }
.solo-meter.big { height: 40px; } .solo-meter.big i { width: 15px; }
.app[data-look="pixel"] .solo-meter i { border-radius: 0; }
.app[data-look="neon"] .solo-meter i.on { box-shadow: 0 0 8px var(--yellow); }

/* Auflösung */
.solo-dec-reveal { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 18px; align-items: stretch; }
.solo-dec-result {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 10px;
  padding: clamp(16px, 2.6vw, 28px);
  background:
    radial-gradient(130% 90% at 0% 0%, color-mix(in srgb, var(--good) 14%, transparent) 0%, transparent 60%),
    var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  min-width: 0;
}
.solo-dec-mini { flex: none; width: 54px; height: 58px; border-radius: 12px; overflow: hidden; background: var(--bg2); border: 2px solid var(--line); }
.solo-dec-mini svg { width: 100%; height: 100%; display: block; }
.app[data-look="pixel"] .solo-dec-mini { border-radius: 0; }
.solo-dec-recap { font-weight: 600; overflow-wrap: anywhere; }
.solo-dec-word {
  font-size: clamp(2.3em, 4.2vw + 0.8em, 4.3em);
  line-height: 1.02;
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink);
  overflow-wrap: anywhere;
  max-width: 100%;
}
.app[data-look="neon"] .solo-dec-word { -webkit-text-stroke: 0; text-shadow: 0 0 18px currentColor; }
.app[data-look="pixel"] .solo-dec-word { -webkit-text-stroke: 0; text-shadow: 3px 3px 0 var(--ink); font-size: clamp(1.8em, 3.2vw + 0.8em, 3.4em); }
.solo-dec-yours { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 4px; padding-top: 10px; border-top: 2px dashed color-mix(in srgb, var(--muted) 35%, transparent); }
.solo-dec-yours .solo-meter { height: 22px; }
.solo-dec-yours .solo-meter i { width: 8px; }
.solo-dec-side { gap: 14px; min-width: 0; }
.solo-dec-fb {
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px 18px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-left-width: 10px;
  border-radius: var(--radius);
}
.solo-dec-fb.right { border-left-color: var(--good); }
.solo-dec-fb.right h3 { color: var(--good); }
.solo-dec-fb.also { border-left-color: var(--yellow); }
.solo-dec-fb.also h3 { color: var(--yellow); }
.solo-dec-fb.other { border-left-color: var(--teamA); }
.solo-dec-fb.other h3 { color: var(--teamA); }
.solo-pts { font-size: 1.05em; font-family: var(--font-display); letter-spacing: 0.02em; }
.solo-dec-why { gap: 10px; }
.solo-sign {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  border: 2px solid var(--line);
  font-size: 0.8em; font-weight: 700;
  color: var(--muted);
  opacity: 0.5;
}
.solo-sign.on { opacity: 1; background: var(--good); color: var(--good-ink); }
.app[data-look="pixel"] .solo-sign { border-radius: 0; }
