  /* ---------- Sitzkreis: Wer ist Radar-Profi? ---------- */
  // Platz 0 = Lehrkraft (unten). Von oben gesehen ist „links von der Lehrkraft“ im Uhrzeigersinn.
  function seatMap(n, seat, fromSeat) {
    const W = 240, H = 252, c = 120, cy = 114, R = 80;
    const total = n + 1;
    const step = (2 * Math.PI) / total;
    const pos = (a, r) => [+(c + r * Math.sin(a)).toFixed(1), +(cy - r * Math.cos(a)).toFixed(1)];
    const seatA = (k) => Math.PI + k * step;
    let s = `<svg class="radar-seats" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sitzkreis: Radar-Profi ist Platz ${seat} links von der Lehrkraft">`;
    s += `<circle class="table" cx="${c}" cy="${cy}" r="${R - 32}"/>`;
    s += `<circle class="table-ring" cx="${c}" cy="${cy}" r="${R - 46}"/>`;
    // Pfeil: vom letzten Radar-Profi (oder der Lehrkraft) zum neuen
    const ra = R + 27;
    const gap = Math.min(0.3, step * 0.3);
    const a0 = seatA(fromSeat) + gap;
    let a1 = seatA(seat) - gap;
    while (a1 <= a0) a1 += 2 * Math.PI;
    const p0 = pos(a0, ra), p1 = pos(a1, ra);
    s += `<path class="arrow" d="M${p0[0]} ${p0[1]} A${ra} ${ra} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${p1[0]} ${p1[1]}"/>`;
    const tx = Math.cos(a1), ty = Math.sin(a1); // Richtung am Pfeilende
    const nx = Math.sin(a1), ny = -Math.cos(a1);
    const hA = [p1[0] - 9 * tx + 6 * nx, p1[1] - 9 * ty + 6 * ny], hB = [p1[0] - 9 * tx - 6 * nx, p1[1] - 9 * ty - 6 * ny];
    s += `<path class="arrow" d="M${hA[0].toFixed(1)} ${hA[1].toFixed(1)} L${p1[0]} ${p1[1]} L${hB[0].toFixed(1)} ${hB[1].toFixed(1)}"/>`;
    for (let k = 0; k <= n; k++) {
      const q = pos(seatA(k), R);
      const cls = k === 0 ? 'lk' : k === seat ? 'profi' : '';
      if (k === seat) s += `<circle class="ring" cx="${q[0]}" cy="${q[1]}" r="18"/>`;
      s += `<circle class="seat ${cls}" cx="${q[0]}" cy="${q[1]}" r="18"/>`;
      s += `<text class="${cls}" x="${q[0]}" y="${q[1]}">${k === 0 ? 'L' : k}</text>`;
    }
    s += `<text class="cap" x="${c}" y="${H - 8}">L = Lehrkraft</text>`;
    s += '</svg>';
    const holder = document.createElement('div');
    holder.innerHTML = s;
    return holder.firstChild;
  }

  /* ---------- kleine Bausteine ---------- */
  // Bildschirm aufbauen + eigene Klasse (für Look-Feinheiten, z. B. Pixel-Schrift ohne Ligaturen)
  function scr(ctx, children, opts) {
    const w = ctx.screen(children, opts);
    w.classList.add('radar-screen');
    return w;
  }
  function pips(h, r, total) {
    return h('span', { class: 'radar-pips', 'aria-hidden': 'true' }, Array.from({ length: total }, (_, i) => h('i', { class: i < r ? 'done' : i === r ? 'now' : '' })));
  }
  function head(ctx, r, total, title, right) {
    const { h } = ctx;
    return h('div', { class: 'row between radar-head enter' },
      h('div', { class: 'stack', style: { gap: '6px' } },
        h('div', { class: 'row', style: { gap: '12px' } }, h('span', { class: 'eyebrow' }, 'Runde ' + (r + 1) + ' von ' + total), pips(h, r, total)),
        h('h2', null, title)),
      right || null);
  }
  function situationStrip(ctx, card) {
    const { h } = ctx;
    return h('div', { class: 'radar-sit enter' }, CREW.icon('chat', 22), h('span', null, card.text));
  }

  /* ---------- Intro ---------- */
  async function intro(ctx) {
    const { h, ui } = ctx;
    const d = dial({ decor: true, idle: true });
    const step = (n, title, text, extra) => h('div', { class: 'radar-step card' },
      h('span', { class: 'radar-stepnum' }, String(n)),
      h('div', { class: 'stack', style: { gap: '6px' } }, h('b', { class: 'radar-steptitle' }, title), h('span', { class: 'muted' }, text), extra || null));
    const w = scr(ctx, [
      h('div', { class: 'stack enter', style: { gap: '6px' } }, h('span', { class: 'eyebrow' }, 'Mission · Gefühls-Radar'), h('h2', null, 'Gleiche Situation. Gleiches Gefühl?')),
      h('div', { class: 'radar-intro enter-2' },
        h('div', { class: 'radar-dialbox' }, d.el),
        h('div', { class: 'stack' },
          step(1, 'Gefühl wählen', 'Lies die Situation. Wähl geheim ein Gefühl.', ui.paddleHint('emo')),
          step(2, 'Radar-Profi schätzt', 'Eine Person tippt: Wie stark fühlt die Crew das?'),
          step(3, 'Stärke zeigen', 'Alle zeigen 0 bis 10. Trifft der Tipp?', ui.paddleHint('zahl')))),
    ]);
    await ctx.waitFor(ui.choice(w, [{ label: 'Radar an!', value: 'go', iconRight: 'right' }], { align: 'end' }));
  }

  /* ---------- Schritt A: Welches Gefühl? ---------- */
  async function stepFeeling(ctx, card, r, total) {
    const { h, ui } = ctx;
    const N = ctx.crewSize;
    const w1 = scr(ctx, [
      head(ctx, r, total, 'Welches Gefühl?', ui.paddleHint('emo')),
      ui.say(card.text, { eyebrow: 'Situation', cls: 'radar-sitcard' }),
      h('div', { class: 'radar-legend enter-2', 'aria-hidden': 'true' }, EMOS.map((e) => h('span', { class: 'radar-lg' }, emoBadge(e.id, 30), h('span', null, e.id)))),
      h('p', { class: 'lead enter-3' }, 'Welches Gefühl kommt bei dir zuerst? Wähl es geheim.'),
    ]);
    const a1 = await ctx.waitFor(ui.choice(w1, [{ label: 'Alle bereit', value: 'go', iconRight: 'right' }], { align: 'end' }));
    if (a1 === ctx.SKIP) return { skip: 'replace' };

    await ui.threeTwoOne('Zeigt her!');
    const ta = ui.tally(EMOS.map((e) => ({ id: e.id, label: e.id, icon: emoBadge(e.id, 46) })), { max: N, onFull: () => ui.autoNext('radar-mix', () => ta.total() >= N) });
    ta.el.querySelectorAll('.t-item').forEach((it, i) => { it.classList.add('radar-titem'); it.style.setProperty('--emo', EMOS[i].color); });
    const w2 = scr(ctx, [
      head(ctx, r, total, 'Was zeigt die Crew?'),
      h('div', { class: 'row between' }, h('p', { class: 'muted' }, 'Tippe pro Karte einmal auf ihr Gefühl.'), ui.scanBar()),
      h('div', { class: 'radar-tally' }, ta.el),
    ]);
    const a2 = await ctx.waitFor(ui.choice(w2, [{ label: 'Überspringen', value: 'skip', variant: 'ghost' }, { label: 'Mix zeigen', value: 'go', iconRight: 'right', id: 'radar-mix' }], { align: 'end' }));
    if (a2 === ctx.SKIP) return { skip: 'round' };
    const counts = ta.get();
    const shown = EMOS.filter((e) => counts[e.id] > 0).sort((x, y) => counts[y.id] - counts[x.id]);
    if (a2 === 'skip' || !shown.length) return { counts: null, shown: [] };

    // Gefühle-Mix
    const total2 = shown.reduce((a, e) => a + counts[e.id], 0);
    const kinds = shown.length;
    let title, line;
    if (total2 === 1) { title = 'Auf dem Radar: ' + shown[0].id; line = 'Danke fürs Zeigen. Jede Antwort zählt.'; }
    else if (kinds === 1) { title = 'Alle auf einer Welle: ' + shown[0].id + '!'; line = 'Eher selten. Oft fühlen Menschen hier ganz verschieden.'; }
    else { title = kinds + ' verschiedene Gefühle!'; line = kinds >= 3 ? 'Gleiche Situation, anderer Film im Kopf. Völlig normal.' : 'Gleiche Situation, anderes Gefühl. Das ist normal.'; }
    const segs = shown.map((e) => {
      const seg = h('div', { class: 'seg', title: e.id + ': ' + counts[e.id] }, counts[e.id] / total2 >= 0.12 ? emoBadge(e.id, 0).firstChild : null);
      seg.style.setProperty('--emo', e.color);
      return seg;
    });
    const bar = h('div', { class: 'radar-mix', role: 'img', 'aria-label': 'Gefühle-Mix: ' + shown.map((e) => e.id + ' ' + counts[e.id]).join(', ') }, segs);
    const w3 = scr(ctx, [
      h('div', { class: 'stack enter', style: { alignItems: 'center', textAlign: 'center', gap: '8px' } }, h('span', { class: 'eyebrow' }, 'Gefühle-Mix'), h('h2', null, title)),
      bar,
      h('div', { class: 'row center radar-legend2' }, shown.map((e, i) => h('span', { class: 'radar-lchip pop', style: { animationDelay: 300 + i * 90 + 'ms' } }, emoBadge(e.id, 34), h('span', null, e.id), h('b', null, '× ' + counts[e.id])))),
      h('p', { class: 'lead enter-3', style: { textAlign: 'center' } }, line),
      h('p', { class: 'muted enter-3', style: { textAlign: 'center' } }, 'Wer mag: Warum gerade dieses Gefühl?'),
    ], { center: true });
    CREW.sound.play('reveal');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      segs.forEach((seg, i) => { seg.style.flexBasis = (counts[shown[i].id] / total2) * 100 + '%'; });
    }));
    // Wort-Upgrade nur in der ersten Runde (spart Zeit)
    const a3 = await ctx.waitFor(ui.choice(w3, (r === 0 ? [{ label: 'Wort-Upgrade', value: 'up', variant: 'ghost', icon: 'sparkle' }] : []).concat([{ label: 'Wie stark?', value: 'go', iconRight: 'right' }])));
    if (a3 === ctx.SKIP) return { skip: 'round', counts, shown };
    if (a3 === 'up') {
      const more = (card.gefuehle || []).filter((g) => EMO[g] && !shown.some((e) => e.id === g)).map((g) => EMO[g]);
      const r4 = await wordUpgrade(ctx, shown.concat(more).slice(0, 4));
      if (r4 === ctx.SKIP) return { skip: 'round', counts, shown };
    }
    return { counts, shown };
  }

  /* ---------- Schritt C: Gefühls-Wort-Upgrade (freiwillig, ohne Punkte) ---------- */
  async function wordUpgrade(ctx, options) {
    const { h, ui } = ctx;
    let cur = options[0];
    const area = h('div', { class: 'stack' });
    const draw = () => {
      CREW.util.clear(area);
      const words = cur.words.map((wd, i) => {
        const b = h('button', { type: 'button', class: 'radar-word' },
          h('span', { class: 'w' }, wd),
          h('span', { class: 'radar-signal', 'aria-label': 'Stärke ' + (i + 1) + ' von 4' }, [0, 1, 2, 3].map((j) => h('i', { class: j <= i ? 'on' : '', style: { height: 30 + j * 23 + '%' } }))));
        b.style.setProperty('--emo', cur.color);
        b.addEventListener('click', () => {
          CREW.sound.play('tap');
          area.querySelectorAll('.radar-word').forEach((x) => x.classList.toggle('sel', x === b && !b.classList.contains('sel')));
        });
        return b;
      });
      CREW.util.append(area, [
        h('div', { class: 'row between' },
          h('div', { class: 'row', style: { gap: '14px' } }, emoBadge(cur.id, 60), h('h2', null, cur.id + ' hat viele Stufen.')),
          options.length > 1 ? h('div', { class: 'row radar-switch' }, options.filter((e) => e !== cur).map((e) => {
            const c = h('button', { type: 'button', class: 'chip', 'aria-label': 'Wörter für ' + e.id }, emoBadge(e.id, 28), e.id);
            c.addEventListener('click', () => { CREW.sound.play('tap'); cur = e; draw(); });
            return c;
          })) : null),
        h('div', { class: 'radar-scale' }, h('span', null, 'schwach'), h('i'), h('span', null, 'stark')),
        h('div', { class: 'radar-words' }, words),
      ]);
      area.querySelector('.radar-scale').style.setProperty('--emo', cur.color);
    };
    draw();
    const w = scr(ctx, [
      h('div', { class: 'stack enter', style: { gap: '6px' } }, h('span', { class: 'eyebrow' }, 'Gefühls-Wort-Upgrade'), h('p', { class: 'lead' }, 'Welches Wort passt für dich am besten? Wer will, sagt es laut.')),
      area,
    ]);
    return ctx.waitFor(ui.choice(w, [{ label: 'Weiter', value: 'go', iconRight: 'right' }], { align: 'end' }));
  }

  /* ---------- Schritt B: Wie stark? ---------- */
  async function stepStrength(ctx, card, r, total, profiTurn) {
    const { h, ui } = ctx;
    const N = ctx.crewSize;
    const seat = (profiTurn % N) + 1;
    const fromSeat = profiTurn === 0 ? 0 : ((profiTurn - 1) % N) + 1;
    const mini = dial({ needle: false, sweep: false });
    const st = ui.stepper({ value: 5, min: 0, max: 10, onChange: (v) => mini.setPred(v) });
    mini.setPred(5);
    const w1 = scr(ctx, [
      head(ctx, r, total, 'Wie stark?', ui.paddleHint('zahl', 'Stärke')),
      situationStrip(ctx, card),
      h('div', { class: 'radar-profi enter-2' },
        h('div', { class: 'card stack radar-profi-who' },
          seatMap(N, seat, fromSeat),
          h('div', { class: 'stack', style: { gap: '4px', textAlign: 'center' } },
            h('span', { class: 'eyebrow' }, 'Radar-Profi'),
            h('b', { class: 'radar-steptitle' }, profiTurn === 0 ? 'Die Person direkt links von der Lehrkraft.' : 'Die nächste Person links davon.'))),
        h('div', { class: 'card stack radar-profi-tipp', id: 'radar-tipp' },
          h('div', { class: 'radar-mini' }, h('span', { class: 'radar-stepnum small' }, '1'), h('span', null, h('b', null, 'Alle: '), 'Stell geheim ein, wie stark du das fühlst.')),
          h('div', { class: 'radar-mini' }, h('span', { class: 'radar-stepnum small' }, '2'), h('span', null, h('b', null, 'Radar-Profi: '), 'Sag laut, wie stark die Crew das im Schnitt fühlt.')),
          h('div', { class: 'radar-minidial' }, mini.el),
          h('div', { class: 'row center', style: { gap: '14px' } }, h('span', { class: 'display', style: { fontSize: '1.3em' } }, 'Tipp'), st.el))),
    ]);
    const b1 = await ctx.waitFor(ui.choice(w1, [{ label: 'Zeigt her!', value: 'go', iconRight: 'right' }], { align: 'end' }));
    if (b1 === ctx.SKIP) return { skip: true };
    const pred = st.get();

    await ui.threeTwoOne('Zeigt her!');
    const vp = ui.valuePad({ count: N, min: 0, max: 10, placeholder: 'Tippe die gezeigten Zahlen ein …', onFull: () => ui.autoNext('radar-go', () => vp.get().length >= N) });
    const w2 = scr(ctx, [
      head(ctx, r, total, 'Welche Zahlen seht ihr?'),
      h('div', { class: 'row between' }, h('p', { class: 'muted' }, 'Tippe alle Zahlen ein. Die Reihenfolge ist egal.'), ui.scanBar()),
      h('div', { class: 'card radar-pad' }, vp.el),
    ]);
    const b2 = await ctx.waitFor(ui.choice(w2, [{ label: 'Überspringen', value: 'skip', variant: 'ghost' }, { label: 'Radar starten', value: 'go', iconRight: 'right', id: 'radar-go' }], { align: 'end' }));
    if (b2 === ctx.SKIP) return { skip: true };
    const values = vp.get();
    if (b2 === 'skip' || !values.length) { if (b2 !== 'skip') ui.toast('Keine Zahlen? Dann geht’s direkt weiter.'); return { skip: true }; }

    // Auflösung auf dem Radar
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    const diff = Math.abs(avg - pred);
    const lo = Math.min(...values), hi = Math.max(...values);
    const d = dial({});
    d.setPred(pred);
    const avgNum = h('span', { class: 'radar-big' }, '0');
    const verdict = h('div', { class: 'radar-verdict stack' });
    const last = r + 1 >= total;
    const w3 = scr(ctx, [
      head(ctx, r, total, 'Radar-Check'),
      h('div', { class: 'radar-reveal' },
        h('div', { class: 'radar-dialbox' }, d.el),
        h('div', { class: 'radar-side stack' },
          h('div', { class: 'radar-stat' }, h('span', { class: 'lbl' }, h('i', { class: 'radar-key needle' }), 'Crew-Schnitt'), avgNum),
          h('div', { class: 'radar-stat' }, h('span', { class: 'lbl' }, h('i', { class: 'radar-key tipp' }), 'Tipp vom Radar-Profi'), h('span', { class: 'radar-big tipp' }, String(pred))),
          verdict)),
    ]);
    CREW.sound.play('drum');
    await ctx.sleep(450);
    const seen = {};
    for (const v of values.slice().sort((a, b) => a - b)) {
      d.addBlip(v, (seen[v] = (seen[v] || 0) + 1) - 1);
      CREW.sound.play('tick');
      await ctx.sleep(170);
    }
    await ctx.sleep(250);
    d.stopSweep();
    d.setNeedle(avg);
    CREW.sound.play('whoosh');
    await Promise.all([tweenNumber(avgNum, avg, 1400), ctx.sleep(1500)]);

    let title, text, cls;
    if (diff <= 0.5) { title = diff < 0.2 ? 'Perfekt! Volltreffer!' : 'Volltreffer!'; text = 'Der Radar-Profi hat die Crew genau gelesen.'; cls = 'hit'; }
    else if (diff <= 1.5) { title = 'Knapp dran!'; text = 'Nur ' + fmt(diff) + ' daneben. Guter Riecher.'; cls = 'near'; }
    else if (avg > pred) { title = 'Stärker als gedacht!'; text = 'Die Crew fühlt das heftiger. Spannend, oder?'; cls = 'miss'; }
    else { title = 'Schwächer als gedacht!'; text = 'Die Crew nimmt das lockerer. Interessant.'; cls = 'miss'; }
    let spread = null;
    if (values.length >= 2) {
      if (hi - lo >= 5) spread = 'Von ' + lo + ' bis ' + hi + ': riesige Unterschiede';
      else if (hi - lo <= 2) spread = 'Ihr fühlt es ähnlich stark';
      else spread = 'Spannweite: ' + lo + ' bis ' + hi;
    }
    CREW.util.append(verdict, [
      h('h2', { class: 'radar-vtitle ' + cls }, title),
      h('p', { class: 'lead' }, text),
      spread ? h('span', { class: 'pill' + (hi - lo >= 5 ? ' accent' : '') }, spread) : null,
      hi - lo >= 5 ? h('p', { class: 'muted small' }, 'Wer mag: Was macht es für dich so stark – oder so schwach?') : null,
    ]);
    verdict.classList.add('on');
    if (cls === 'hit') { d.hit(true); CREW.sound.play('great'); ui.confetti(160); }
    else if (cls === 'near') CREW.sound.play('good');
    else CREW.sound.play('soft');

    const b3 = await ctx.waitFor(ui.choice(w3, [{ label: last ? 'Weiter' : 'Nächste Runde', value: 'go', iconRight: 'right' }], { align: 'end' }));
    return { skip: false, pred, values, avg, hit: diff <= 0.5, near: diff > 0.5 && diff <= 1.5, skipped: b3 === ctx.SKIP };
  }

  CREW.registerMission({
    id: 'radar',
    day: 2,
    title: 'Gefühls-Radar',
    tagline: 'Gleiche Situation – wie fühlt sich die Crew?',
    hook: '2 Runden · Radar-Profi schätzt',
    color: '#12a877',
    minutes: 5,
    themes: ['Gefühle', 'Fremdwahrnehmung', 'Empathie'],
    etep: 'III–IV',
    eldib: [
      { code: 'K-21', text: 'erkennt und benennt, wie sich andere fühlen' },
      { code: 'K-26', text: 'spricht in der Gruppe über eigene Gefühle' },
      { code: 'K-29', text: 'erklärt, warum eine Situation ein Gefühl auslöst' },
      { code: 'SOZ-31', text: 'merkt, dass andere in derselben Situation anders reagieren' },
      { code: 'SOZ-37', text: 'versteht die Gefühle anderer und nimmt sie ernst' },
    ],
    teacherNote: 'Zwei Antwort-Karten: „Gefühl“ und „Zahl 0–10“. 2 Runden. Situation vorlesen, alle wählen geheim ein Gefühl und halten auf „Zeigt her!“ hoch. Du zählst mit. Dann schätzt der Radar-Profi laut den Crew-Schnitt (0–10). Der Radar-Profi wechselt reihum, beginnend links von dir. Du stellst den Tipp ein, alle zeigen ihre Stärke, du tippst die Zahlen ein. ±0,5 = Volltreffer, ±1,5 = knapp. Sind alle Karten eingetippt, geht es von allein weiter. Das Wort-Upgrade (nur Runde 1) ist freiwillig und nur zum Reden. Es gibt keine falschen Gefühle. X-Karte beim Lesen = neue Situation.',
    debrief: [
      'Warum fühlen Menschen in der gleichen Situation so verschieden?',
      'Welche Situation hat die meisten verschiedenen Gefühle ausgelöst? Warum wohl?',
      'Woran merkst du bei anderen, wie es ihnen gerade geht?',
      'Woran merkst du bei dir selbst, dass ein Gefühl stark wird?',
      'Was hilft dir, wenn ein Gefühl auf 9 oder 10 steht?',
      'Was kann die Crew tun, wenn bei jemandem das Radar auf 10 steht?',
      'Welches Gefühlswort nimmst du heute mit?',
      'War es schwer, die Crew einzuschätzen? Was hat geholfen?',
    ],

    async run(ctx) {
      const ROUNDS = 2;
      const MAX_REPLACE = 4;
      const queue = ctx.pick('radar', ROUNDS);
      const seenIds = new Set(queue.map((c) => c.id));
      const stats = { played: 0, hits: 0, near: 0, emoSeen: new Set() };
      let round = 0;
      let profiTurn = 0;
      let replaced = 0;

      await intro(ctx);

      while (round < ROUNDS) {
        if (!ctx.roundGate(round, ROUNDS)) break;
        let card = queue.shift();
        if (!card) {
          const extra = ctx.pick('radar', 1, (it) => !seenIds.has(it.id));
          if (!extra.length) break;
          card = extra[0];
        }
        seenIds.add(card.id);

        // A) Welches Gefühl? (+ freiwilliges Wort-Upgrade)
        const a = await stepFeeling(ctx, card, round, ROUNDS);
        if (a.skip === 'replace' && replaced < MAX_REPLACE) { replaced++; continue; } // X-Karte: neue Situation, gleiche Runde
        let playedThis = false;
        if (a.shown && a.shown.length) { playedThis = true; a.shown.forEach((e) => stats.emoSeen.add(e.id)); }

        // B) Wie stark?
        if (!a.skip) {
          const b = await stepStrength(ctx, card, round, ROUNDS, profiTurn);
          profiTurn++;
          if (!b.skip) {
            playedThis = true;
            if (b.hit) stats.hits++;
            if (b.near) stats.near++;
          }
        }
        if (playedThis) stats.played++;
        round++;
      }

      let summary;
      if (!stats.played) summary = 'Danke fürs Reinschauen, Crew.';
      else if (stats.hits >= 2) summary = 'Euer Radar ist messerscharf!';
      else if (stats.hits >= 1) summary = 'Starkes Radar, Crew!';
      else if (stats.near >= 1) summary = 'Knapp dran – euer Radar wird besser.';
      else summary = 'Ihr habt heute viel übereinander gelernt.';
      // Die Bilanz zeigt jetzt der gemeinsame Abschluss-Bildschirm (spart einen Bildschirm)

      // Energie: Mitmachen + Treffer (5–10), nie unter 4
      const energy = stats.played
        ? Math.max(5, Math.min(10, Math.round(4 + stats.played * 1.25 + stats.hits * 2 + stats.near)))
        : 4;
      const emos = stats.emoSeen.size;
      return { energy, summary, points: stats.hits * 2 + stats.near, stats: stats.played ? [[stats.hits, 'Volltreffer'], [emos, emos === 1 ? 'Gefühl entdeckt' : 'Gefühle entdeckt']] : [] };
    },
  });
})();

/* ---- missions/reframe.js ---- */
/* Mission Freitag: „Reframe-Battle“ – Selbstwert und Stärken.
   Nach dem ISA-Material „Reframing: Mëch selwer nei gesinn“: Ein Etikett („Du bist zu laut.“)
   wird zu einer Stärke umgedreht („Wer laut ist, traut sich, etwas zu sagen.“).
   Ablauf: Team A gegen Team B.
     1) Battle (3 Runden): Etikett erscheint, 45 Sekunden Bedenkzeit, beide Teams sagen ihren Reframe laut.
        Jedes Team bewertet das ANDERE Team mit der Ja/Nein-Karte („Überzeugt?“), die Lehrkraft stimmt mit.
        Jede Ja-Stimme = 1 Punkt. Überzeugt die Mehrheit, wächst der Stärken-Turm um einen Block.
        Danach zeigt das Spiel zwei Profi-Reframes zur Inspiration.
     2) Speed-Match (2 Runden): Ein Profi-Reframe erscheint. Welches Etikett steckt dahinter (A–D)?
        Das schnellste Team mit der richtigen Karte punktet.
   Der Stärken-Turm (nach dem ISA-Blatt „Mein Stärken-Turm“) gehört der ganzen Crew.
   Crew-Energie = Punkte beider Teams zusammen. Keine Einzelwertung.
   Zusätzlich als Solo-Spiel „Reframe-Rush“. */
(function () {
  const CREW = window.CREW;
  const { h, shuffle, clamp } = CREW.util;

  const BATTLES = 2;
  const SPEEDS = 1;
  const THINK = 30;          // Sekunden Bedenkzeit pro Etikett
  const SOLO_CARDS = 8;
  const LETTERS = ['A', 'B', 'C', 'D'];
  // Farben wie auf der Antwort-Karte (A blau, B pink, C grün, D gelb)
  const LETTER_VARIANT = { A: 'teamA', B: 'teamB', C: 'good', D: 'yellow' };

  /* Bedeutungs-Gruppen, die sich zu ähnlich sind. Aus ihnen kommen im Speed-Match keine falschen
     Antworten, sonst wäre die Lösung nicht eindeutig. */
  const NEAR = (() => {
    const raw = {
      power: ['tempo', 'klartext', 'frei', 'herz'],
      tempo: ['frei', 'boss'],
      still: ['sorgfalt', 'gefuehl', 'herz'],
      sorgfalt: ['kopf', 'boss'],
      kopf: ['klartext', 'frei'],
      gefuehl: ['herz', 'klartext'],
      klartext: ['boss'],
      boss: ['herz'],
    };
    const m = {};
    const add = (a, b) => { (m[a] = m[a] || new Set()).add(b); };
    Object.entries(raw).forEach(([a, list]) => list.forEach((b) => { add(a, b); add(b, a); }));
    return m;
  })();
  const isNear = (a, b) => a === b || !!(NEAR[a] && NEAR[a].has(b));

  const other = (t) => (t === 'A' ? 'B' : 'A');
  const quote = (s) => '„' + s + '“';
  const fullReframe = (card, k) => card.wer + ', ' + card.reframes[k];
  const people = (n) => n + (n === 1 ? ' Person' : ' Leute');

  /* Alle Karten, die gerade erlaubt sind (heikle nur mit Freigabe) */
  function allowed(ctx) {
    const sens = ctx.state.settings.sensitive;
    return (CREW.content.reframe || []).filter((c) => sens || !c.heikel);
  }

  /* 4 Antwort-Optionen: richtige Karte + 3 aus weit entfernten, verschiedenen Gruppen */
  function buildOptions(ctx, card) {
    const pool = shuffle(allowed(ctx).filter((c) => c.id !== card.id && c.etikett !== card.etikett));
    const picked = [];
    const groups = [card.gruppe];
    for (const c of pool) {
      if (picked.length >= 3) break;
      if (groups.some((g) => isNear(g, c.gruppe))) continue;
      picked.push(c);
      groups.push(c.gruppe);
    }
    // Notfall (sehr kleiner Stapel): Hauptsache verschieden
    for (const c of pool) {
      if (picked.length >= 3) break;
      if (!picked.includes(c) && c.gruppe !== card.gruppe) picked.push(c);
    }
    return shuffle([card, ...picked]).map((c, i) => ({ card: c, letter: LETTERS[i], ok: c === card }));
  }

  /* Bildschirm mit fester Knopf-Zone unten (nichts springt, wenn die Knöpfe später erscheinen).
     Der Inhalt sitzt senkrecht in der Mitte zwischen Kopfzeile und Knöpfen. */
  function view(ctx, kids, o) {
    const opts = o || {};
    const acts = h('div', { class: 'reframe-acts' });
    const w = ctx.screen([...kids, acts], opts);
    w.classList.add('reframe-screen');
    if (opts.top) w.classList.add('reframe-top'); // oben bündig (Inhalt wächst während des Spiels)
    return { w, acts };
  }

  /* ---------- Etikett-Karte (dreht sich um: vorne Spruch, hinten Stärke) ---------- */
  function flipTag(card, o) {
    const opts = o || {};
    const front = h('div', { class: 'reframe-face front' },
      h('span', { class: 'reframe-face-kicker' }, 'Spruch'),
      h('span', { class: 'reframe-face-text' }, quote(card.satz)));
    const back = h('div', { class: 'reframe-face back' },
      h('span', { class: 'reframe-face-kicker' }, 'Stärke'),
      h('span', { class: 'reframe-face-text', lang: 'de' }, card.staerke),
      opts.second ? h('span', { class: 'reframe-face-sub' }, '+ ' + card.staerke2) : null);
    const el = h('div', { class: 'reframe-flip' + (opts.small ? ' small' : '') + (opts.demo ? ' demo' : '') },
      h('div', { class: 'reframe-flip-inner' }, front, back));
    return {
      el,
      flip() { el.classList.add('flipped'); CREW.sound.play('reveal'); },
    };
  }

  /* ---------- Stärken-Turm ---------- */
  // Lange Wörter etwas kleiner, damit sie nicht mitten im Wort umbrechen
  const sizeCls = (w) => (w.length > 14 ? ' xlong' : w.length > 11 ? ' long' : '');
  // G.blocks: [{ word, team: 'A' | 'B' }]; fresh = Anzahl der neuesten Blöcke, die hereinfallen
  function tower(G, o) {
    const opts = o || {};
    const fresh = opts.fresh || 0;
    const n = G.blocks.length;
    const list = h('div', { class: 'reframe-blocks' }, G.blocks.map((b, i) =>
      h('div', { class: 'reframe-block t' + b.team + sizeCls(b.word) + (i >= n - fresh ? ' fresh' : ''), lang: 'de', style: i >= n - fresh ? { animationDelay: (i - (n - fresh)) * 260 + 'ms' } : null },
        h('span', null, b.word))));
    const roof = h('div', { class: 'reframe-roof' + (opts.roof ? ' on' : '') + (opts.roofFresh ? ' fresh' : ''), 'aria-hidden': 'true',
      html: '<svg viewBox="0 0 200 80" preserveAspectRatio="none"><path d="M100 5 L195 75 H5 Z" vector-effect="non-scaling-stroke"/></svg>' },
      opts.roof ? h('span', { class: 'reframe-roof-star' }, CREW.icon('star', 22)) : null);
    const base = h('div', { class: 'reframe-base' },
      h('div', { class: 'reframe-base-shape', 'aria-hidden': 'true',
        html: '<svg viewBox="0 0 200 60" preserveAspectRatio="none"><path class="b" d="M16 4 H184 L196 57 H4 Z" vector-effect="non-scaling-stroke"/><path class="d" d="M88 57 V36 A12 12 0 0 1 112 36 V57 Z" vector-effect="non-scaling-stroke"/></svg>' }),
      h('b', { class: 'reframe-base-name' }, G.crewName));
    return h('div', { class: 'reframe-tower', role: 'img', 'aria-label': 'Crew-Tower mit ' + n + ' Blöcken' + (n ? ': ' + G.blocks.map((b) => b.word).join(', ') : '') },
      roof, list, base);
  }

  /* Kleiner Turm für die Kopfzeile */
  function miniTower(G, pop) {
    const bars = h('div', { class: 'reframe-mini-bars' }, G.blocks.map((b, i) => h('i', { class: 't' + b.team + (pop && i === G.blocks.length - 1 ? ' fresh' : '') })));
    return h('div', { class: 'reframe-mini', title: 'Crew-Tower', 'aria-label': 'Crew-Tower: ' + G.blocks.length + ' Blöcke' },
      h('div', { class: 'reframe-mini-tower' }, bars, h('i', { class: 'base' })),
      h('span', { class: 'reframe-mini-num' }, h('b', null, String(G.blocks.length)), h('small', null, 'Turm')));
  }

  /* Kopfzeile: Runde, Turm, Punkte (beide Teams oder Solo-Treffer) */
  function hud(G, label, o) {
    const opts = o || {};
    const chip = (cls, name, value, key) => {
      const num = h('b', { class: 'reframe-score-num' }, String(value));
      if (key) G.nums[key] = num;
      return h('div', { class: 'reframe-score ' + cls }, h('span', { class: 'reframe-score-name' }, name), num);
    };
    G.miniSlot = h('div', { class: 'reframe-mini-slot' }, miniTower(G, opts.pop));
    const scores = opts.solo
      ? [chip('tC', 'Treffer', opts.solo.hits)]
      : ['A', 'B'].map((t) => chip('t' + t, G.teams[t].name, opts.before ? opts.before[t] : G.score[t], t));
    return h('div', { class: 'reframe-hud' },
      h('span', { class: 'eyebrow reframe-hud-label' }, label),
      G.miniSlot,
      h('div', { class: 'reframe-scores' }, scores));
  }
  function refreshMini(G) {
    if (G.miniSlot) G.miniSlot.replaceChildren(miniTower(G, true));
  }
  // Punkte in der Kopfzeile hochzählen
  function bumpScores(G, before) {
    ['A', 'B'].forEach((t) => {
      const el = G.nums[t];
      if (!el || before[t] === G.score[t]) return;
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      CREW.ui.countUp(el, before[t], G.score[t], 700);
    });
  }

  function teamChip(G, t, extra) {
    return h('span', { class: 'reframe-teamchip t' + t }, G.teams[t].name, extra ? h('small', null, extra) : null);
  }

  /* ---------- 0) Intro ---------- */
  async function intro(ctx, G) {
    const { ui } = ctx;
    const demoCard = (CREW.content.reframe || []).find((c) => c.id === 'rf07') || { satz: 'Du bist zu ruhig.', staerke: 'Zuhören' };
    const step = (n, title, text) => h('div', { class: 'reframe-step' }, h('span', { class: 'reframe-step-n' }, String(n)), h('div', null, h('b', null, title), h('span', { class: 'muted' }, text)));
    const { acts } = view(ctx, [
      h('div', { class: 'stack enter', style: { gap: '4px' } },
        h('span', { class: 'eyebrow' }, 'Freitag · Battle'),
        h('h1', { class: 'outline-text' }, 'Konter-Battle'),
        h('p', { class: 'lead' }, 'Aus einem blöden Spruch wird eine Stärke.')),
      h('div', { class: 'reframe-split intro enter-2' },
        h('div', { class: 'reframe-demo' },
          flipTag(demoCard, { demo: true }).el,
          h('div', { class: 'reframe-teams' },
            h('span', { class: 'muted small' }, 'Teilt euch in zwei Teams auf:'),
            h('div', { class: 'reframe-teams-row' },
              teamChip(G, 'A', people(G.size.A)),
              h('span', { class: 'reframe-vs' }, 'vs'),
              teamChip(G, 'B', people(G.size.B))))),
        h('div', { class: 'reframe-steps' },
          step(1, 'Spruch', 'Jemand bekommt einen blöden Spruch gesagt.'),
          step(2, 'Kontern', 'Euer Team macht in 30 Sekunden eine Stärke daraus.'),
          step(3, 'Überzeugt?', 'Das andere Team stimmt ab. Jedes Ja = 1 Punkt.'))),
    ]);
    await ctx.waitFor(ui.choice(acts, [{ label: 'Battle starten', value: 'go', iconRight: 'play', id: 'rf-start' }]));
  }

  /* ---------- 1) Battle-Runde ---------- */
  async function battle(ctx, G, card, i) {
    const { ui, SKIP } = ctx;
    const first = i % 2 === 0 ? 'A' : 'B';
    const second = other(first);
    const label = 'Battle ' + (i + 1) + ' von ' + BATTLES;

    // a) Etikett + Bedenkzeit
    const tipSlot = h('div', { class: 'reframe-tip' });
    tipSlot.appendChild(ui.btn('Tipp', () => {
      tipSlot.replaceChildren(h('span', { class: 'reframe-chip pop' }, 'Stichwort: ', h('b', null, card.staerke)));
      CREW.sound.play('soft');
    }, { variant: 'ghost', small: true, icon: 'sparkle', id: 'rf-tip' }));
    let timeUp;
    const timeP = new Promise((r) => { timeUp = r; });
    const tm = ui.timer(THINK, { onDone: () => { CREW.sound.play('go'); timeUp('time'); } });
    const v1 = view(ctx, [
      hud(G, label),
      h('div', { class: 'reframe-center enter' },
        h('div', { class: 'reframe-kicker' }, h('span', null, 'Jemand bekommt gesagt:'), ui.speakBtn('Jemand bekommt gesagt: ' + card.satz + ' Dreht es um! ' + card.wer + ', …')),
        flipTag(card).el),
      h('div', { class: 'reframe-think enter-2' },
        h('div', { class: 'reframe-think-txt' },
          h('h2', null, 'Dreht es um!'),
          h('p', { class: 'lead' }, 'Findet im Team die Stärke darin. Startet so:'),
          h('div', { class: 'reframe-starter' }, card.wer + ', …'),
          tipSlot),
        h('div', { class: 'reframe-timer' }, tm.el)),
    ]);
    CREW.sound.play('whoosh');
    const r1 = await ctx.waitFor(Promise.race([ui.choice(v1.acts, [{ label: 'Fertig – Bühne frei', value: 'go', iconRight: 'right', id: 'rf-think-done' }]), timeP]));
    tm.stop();
    if (r1 === SKIP) return;

    // b) Beide Teams sagen ihren Satz
    const panel = (t, k) => h('div', { class: 'reframe-panel t' + t },
      h('div', { class: 'reframe-panel-head' }, h('span', { class: 'reframe-order' }, String(k + 1)), h('b', null, G.teams[t].name), h('span', { class: 'muted small' }, k === 0 ? 'zuerst' : 'danach')),
      h('div', { class: 'reframe-starter small' }, card.wer + ', …'));
    const v2 = view(ctx, [
      hud(G, label),
      h('div', { class: 'reframe-headrow enter' },
        h('div', { class: 'stack', style: { gap: '6px' } }, h('h2', null, 'Bühne frei!'), h('p', { class: 'lead' }, 'Sagt euren Satz laut. Das andere Team hört genau zu.')),
        flipTag(card, { small: true }).el),
      h('div', { class: 'reframe-duo enter-2' }, panel(first, 0), panel(second, 1)),
      h('div', { class: 'row between enter-3' },
        h('p', { class: 'muted' }, 'Gleich bewertet jedes Team das andere.'),
        ui.paddleHint('janein', 'Überzeugt?')),
    ]);
    const r2 = await ctx.waitFor(ui.choice(v2.acts, [{ label: 'Abstimmen', value: 'go', iconRight: 'right', id: 'rf-vote-go' }]));
    if (r2 === SKIP) return;

    // c) Abstimmung: Ja-Stimmen zählen (Lehrkraft stimmt immer mit)
    await ui.threeTwoOne('Überzeugt?');
    const judges = { A: G.size.B + 1, B: G.size.A + 1 };
    const steppers = { A: ui.stepper({ value: 0, min: 0, max: judges.A }), B: ui.stepper({ value: 0, min: 0, max: judges.B }) };
    const votePanel = (t) => h('div', { class: 'reframe-panel vote t' + t, 'data-team': t },
      h('div', { class: 'reframe-panel-head' }, h('b', null, 'Ja für ' + G.teams[t].name)),
      h('span', { class: 'muted small' }, G.teams[other(t)].name + ' + Lehrkraft · höchstens ' + judges[t]),
      steppers[t].el);
    const v3 = view(ctx, [
      hud(G, label),
      h('div', { class: 'stack enter', style: { gap: '6px' } }, h('h2', null, 'Wie viele Ja?'), h('p', { class: 'muted' }, 'Tippt die Ja-Karten ein. Jedes Ja bringt auch Crew-Energie.')),
      h('div', { class: 'reframe-duo enter-2' }, votePanel(first), votePanel(second)),
    ]);
    const r3 = await ctx.waitFor(ui.choice(v3.acts, [{ label: 'Auswerten', value: 'go', iconRight: 'right', id: 'rf-vote-done' }]));
    if (r3 === SKIP) return;

    // d) Ergebnis: Karte dreht sich um, Turm wächst
    const before = { A: G.score.A, B: G.score.B };
    const yes = { A: steppers.A.get(), B: steppers.B.get() };
    const convinced = {};
    const added = [];
    [first, second].forEach((t) => {
      G.score[t] += yes[t];
      convinced[t] = yes[t] > 0 && yes[t] * 2 >= judges[t];
      if (convinced[t]) added.push({ word: added.length ? card.staerke2 : card.staerke, team: t });
    });
    G.maxPoints += judges.A + judges.B;
    G.battles++;
    const line = (t) => h('div', { class: 'reframe-result t' + t + (convinced[t] ? ' yes' : '') },
      h('div', { class: 'reframe-result-l' }, h('b', null, G.teams[t].name), h('span', { class: 'reframe-result-ja' }, yes[t] + ' × Ja')),
      h('span', { class: 'reframe-result-msg' }, convinced[t] ? 'Überzeugt!' : yes[t] ? 'Knapp dran' : 'Diesmal nicht'),
      h('span', { class: 'reframe-plus' }, '+' + yes[t]));
    const head = added.length === 2 ? 'Doppelt überzeugt! Zwei neue Blöcke.' : added.length === 1 ? 'Überzeugt! Ein neuer Block.' : 'Noch kein Block. Die Profis helfen.';
    const tag = flipTag(card, { second: added.length === 2 });
    const towerSlot = h('div', { class: 'reframe-tower-slot' }, tower(G));
    const v4 = view(ctx, [
      hud(G, label, { before }),
      h('div', { class: 'reframe-split' },
        h('div', { class: 'stack reframe-res-l' },
          h('h2', { class: 'enter' }, head),
          tag.el,
          h('div', { class: 'stack enter-2', style: { gap: '8px' } }, line(first), line(second))),
        towerSlot),
    ]);
    await ctx.sleep(500);
    tag.flip();
    bumpScores(G, before);
    await ctx.sleep(650);
    if (added.length) {
      G.blocks.push(...added);
      towerSlot.replaceChildren(tower(G, { fresh: added.length }));
      refreshMini(G);
      CREW.sound.play('unlock');
      if (added.length === 2) setTimeout(() => CREW.sound.play('great'), 300);
    } else {
      CREW.sound.play('soft');
    }
    const r4 = await ctx.waitFor(ui.choice(v4.acts, [{ label: 'Profi-Konter', value: 'go', iconRight: 'right', id: 'rf-profi' }]));
    if (r4 === SKIP) return;

    // e) Zwei Profi-Reframes zur Inspiration
    const two = shuffle([0, 1, 2]).slice(0, 2);
    const v5 = view(ctx, [
      hud(G, label),
      h('div', { class: 'row between enter', style: { flexWrap: 'nowrap', alignItems: 'flex-end' } },
        h('div', { class: 'stack', style: { gap: '4px' } }, h('span', { class: 'eyebrow' }, 'Zur Inspiration'), h('h2', null, 'So drehen es Profis um')),
        ui.speakBtn(two.map((k) => fullReframe(card, k)).join(' '))),
      h('p', { class: 'reframe-was enter' }, h('span', { class: 'muted' }, 'Statt '), h('s', null, quote(card.satz)), h('span', { class: 'muted' }, ' sagen sie:')),
      h('div', { class: 'reframe-profis' }, two.map((k, n) => h('div', { class: 'reframe-profi enter-' + (n + 2) },
        h('span', { class: 'reframe-profi-ic' }, CREW.icon('sparkle', 30)),
        h('p', null, h('span', { class: 'reframe-profi-wer' }, card.wer + ', '), h('b', null, card.reframes[k]))))),
      h('div', { class: 'row enter-3' }, h('span', { class: 'muted' }, 'Stärken darin:'), h('span', { class: 'reframe-chip' }, card.staerke), h('span', { class: 'reframe-chip' }, card.staerke2)),
    ]);
    await ctx.waitFor(ui.choice(v5.acts, [{ label: i < BATTLES - 1 ? 'Nächster Spruch' : 'Weiter', value: 'go', iconRight: 'right', id: 'rf-next' }]));
  }

  /* ---------- 2) Speed-Match ---------- */
  async function speedIntro(ctx, G) {
    const { ui } = ctx;
    const v = view(ctx, [
      hud(G, 'Runde 2'),
      h('div', { class: 'reframe-center enter' },
        h('span', { class: 'reframe-bolt' }, CREW.icon('bolt', 54)),
        h('h1', { class: 'outline-text' }, 'Speed-Match'),
        h('p', { class: 'lead' }, 'Jetzt andersrum: Ihr seht eine Stärke. Welcher Spruch steckt dahinter?'),
        h('p', { class: 'muted' }, 'Schnellstes Team mit der richtigen Karte: +3. Zweiter Versuch: +2.'),
        ui.paddleHint('abcd')),
    ]);
    return ctx.waitFor(ui.choice(v.acts, [{ label: 'Los!', value: 'go', iconRight: 'play', id: 'rf-speed-go' }]));
  }

  function optionGrid(options, st) {
    const s = st || {};
    return h('div', { class: 'reframe-opts' }, options.map((o) => {
      let cls = 'reframe-opt';
      if (s.reveal && o.ok) cls += ' ok';
      else if ((s.wrong || []).includes(o.letter)) cls += ' nope';
      else if (s.reveal) cls += ' dim';
      return h('div', { class: cls, 'data-letter': o.letter, 'data-ok': o.ok ? '1' : null },
        h('span', { class: 'reframe-letter l' + o.letter }, o.letter),
        h('span', { class: 'reframe-opt-text' }, o.card.etikett),
        s.reveal && o.ok ? h('span', { class: 'reframe-opt-ic' }, CREW.icon('check', 28)) : null);
    }));
  }

  function questionCard(ctx, card, k, kicker) {
    return h('div', { class: 'reframe-q' },
      h('div', { class: 'row between', style: { flexWrap: 'nowrap' } }, h('span', { class: 'reframe-face-kicker' }, kicker), ctx.ui.speakBtn('Wer so ist, ' + card.reframes[k] + ' Welcher Spruch steckt dahinter?')),
      h('div', { class: 'reframe-q-text' }, '… ' + card.reframes[k]));
  }

  async function speed(ctx, G, card, j, total) {
    const { ui, SKIP } = ctx;
    const label = 'Speed-Match ' + (j + 1) + ' von ' + total;
    const k = Math.floor(Math.random() * card.reframes.length);
    const options = buildOptions(ctx, card);
    const correct = options.find((o) => o.ok).letter;
    const wrong = [];

    // a) Rennen: Wer hält zuerst die Karte hoch?
    const v1 = view(ctx, [
      hud(G, label),
      h('div', { class: 'enter' }, questionCard(ctx, card, k, 'Profi-Konter')),
      h('div', { class: 'enter-2' }, optionGrid(options)),
      h('h3', { class: 'reframe-ask enter-3' }, 'Welches Team war zuerst?'),
    ]);
    CREW.sound.play('whoosh');
    const firstTeam = await ctx.waitFor(ui.choice(v1.acts, [
      { label: G.teams.A.name, value: 'A', variant: 'teamA', id: 'rf-first-A' },
      { label: G.teams.B.name, value: 'B', variant: 'teamB', id: 'rf-first-B' },
      { label: 'Keiner weiß es', value: 'none', variant: 'ghost', id: 'rf-first-none' }]));
    if (firstTeam === SKIP) return;

    // b) Buchstaben eintippen (bei Fehler darf das andere Team)
    let winner = null;
    let gain = 0;
    const order = firstTeam === 'none' ? [] : [firstTeam, other(firstTeam)];
    for (let n = 0; n < order.length; n++) {
      const t = order[n];
      const left = LETTERS.filter((L) => !wrong.includes(L));
      const v2 = view(ctx, [
        hud(G, label),
        questionCard(ctx, card, k, 'Profi-Konter'),
        optionGrid(options, { wrong }),
        h('h3', { class: 'reframe-ask pop' }, n === 0 ? 'Welche Karte zeigt ' + G.teams[t].name + '?' : 'Nicht ganz! ' + G.teams[t].name + ', eure Chance:'),
      ]);
      const letter = await ctx.waitFor(ui.choice(v2.acts, left.map((L) => ({ label: L, value: L, variant: LETTER_VARIANT[L], id: 'rf-letter-' + L })).concat(n === 1 ? [{ label: 'Weiß nicht', value: 'pass', variant: 'ghost', id: 'rf-pass' }] : [])));
      if (letter === SKIP) return;
      if (letter === 'pass') break;
      if (letter === correct) { winner = t; gain = n === 0 ? 3 : 2; break; }
      wrong.push(letter);
      CREW.sound.play('soft');
    }

    // c) Auflösung
    G.speeds++;
    G.maxPoints += 3;
    const before = { A: G.score.A, B: G.score.B };
    const award = (t, pts) => {
      G.score[t] += pts;
      G.blocks.push({ word: card.staerke, team: t });
    };
    if (winner) award(winner, gain);
    const tag = flipTag(card, { small: true });
    const msg = h('div', { class: 'stack reframe-reveal-msg' },
      h('h2', null, winner ? 'Richtig! +' + gain + ' für ' + G.teams[winner].name : 'Der Spruch war: ' + card.etikett),
      h('p', { class: 'lead' }, h('span', { class: 'muted' }, 'Profi-Satz: '), fullReframe(card, k)));
    const v3 = view(ctx, [
      hud(G, label, { before }),
      h('div', { class: 'reframe-reveal' }, msg, tag.el),
      optionGrid(options, { reveal: true, wrong }),
    ]);
    CREW.sound.play('drum');
    await ctx.sleep(400);
    tag.flip();
    if (winner) {
      CREW.sound.play('great');
      bumpScores(G, before);
      refreshMini(G);
    }
    // Gute Begründung für eine andere Karte? Die Lehrkraft darf trotzdem Punkte geben.
    const actions = [];
    if (!winner) order.forEach((t, idx) => { if (idx < wrong.length) actions.push({ label: '+2 ' + G.teams[t].name, value: 'ov' + t, variant: 'ghost', icon: 'star', id: 'rf-override-' + t }); });
    actions.push({ label: 'Weiter', value: 'go', iconRight: 'right', id: 'rf-speed-next' });
    if (actions.length > 1) v3.acts.appendChild(h('p', { class: 'muted small reframe-ov-hint' }, 'Gute Begründung für eine andere Karte? Dann zählt sie trotzdem.'));
    const r = await ctx.waitFor(ui.choice(v3.acts, actions));
    if (typeof r === 'string' && r.startsWith('ov')) {
      const t = r.slice(2);
      const b2 = { A: G.score.A, B: G.score.B };
      award(t, 2);
      bumpScores(G, b2);
      refreshMini(G);
      CREW.sound.play('good');
      msg.replaceChildren(h('h2', null, 'Gut begründet! +2 für ' + G.teams[t].name), h('p', { class: 'lead' }, h('span', { class: 'muted' }, 'Profi-Satz: '), fullReframe(card, k)));
      v3.acts.replaceChildren();
      await ctx.waitFor(ui.next(v3.acts, 'Weiter', { variant: '' }));
    }
  }

  /* ---------- 3) Finale: der ganze Turm ---------- */
  async function finale(ctx, G) {
    const { ui } = ctx;
    const total = G.score.A + G.score.B;
    const n = G.blocks.length;
    let headline;
    if (n >= 6) headline = n + ' Stärken. Ein Turm. Eine Crew.';
    else if (n >= 1) headline = n === 1 ? 'Eine Stärke im Turm. Gut umgedreht!' : n + ' Stärken im Turm. Gut umgedreht!';
    else headline = 'Der Turm steht. Nächstes Mal wächst er.';
    const lead = 'Alle Punkte zählen für die ganze Crew.';
    const totalNum = h('b', { class: 'reframe-total-num' }, '0');
    const v = view(ctx, [
      h('div', { class: 'reframe-split final' },
        h('div', { class: 'stack reframe-final-l' },
          h('span', { class: 'eyebrow enter' }, 'Euer Crew-Tower'),
          h('h2', { class: 'enter' }, headline),
          h('div', { class: 'reframe-final-scores enter-2' },
            h('div', { class: 'reframe-score tA big' }, h('span', { class: 'reframe-score-name' }, G.teams.A.name), h('b', { class: 'reframe-score-num' }, String(G.score.A))),
            h('div', { class: 'reframe-score tB big' }, h('span', { class: 'reframe-score-name' }, G.teams.B.name), h('b', { class: 'reframe-score-num' }, String(G.score.B)))),
          h('div', { class: 'reframe-total enter-2' }, CREW.icon('bolt', 30), h('span', null, 'Zusammen'), totalNum, h('span', null, 'Punkte')),
          h('p', { class: 'muted enter-3' }, lead + ' Der Turm gehört allen.'),
          h('p', { class: 'lead enter-3' }, 'Eine Stärke im Turm gehört dir. Welche?')),
        h('div', { class: 'reframe-tower-slot' }, tower(G, { roof: true, roofFresh: true }))),
    ]);
    CREW.sound.play('great');
    if (n >= 3) ui.confetti(120);
    ui.countUp(totalNum, 0, total, 900);
    await ctx.waitFor(ui.choice(v.acts, [{ label: 'Weiter', value: 'go', iconRight: 'right', id: 'rf-done' }]));
  }

  /* ---------- Mission ---------- */
  CREW.registerMission({
    id: 'reframe',
    day: 5,
    title: 'Konter-Battle',
    tagline: 'Aus einem blöden Spruch wird eine Stärke.',
    hook: 'Team gegen Team · 2 Battles',
    color: '#a64dff',
    minutes: 5,
    themes: ['Selbstwert', 'Stärken', 'Selbst- & Fremdbild'],
    etep: 'III–V',
    eldib: [
      { code: 'K-19', text: 'benennt eigene Eigenschaften, Stärken und Schwächen' },
      { code: 'K-20', text: 'beschreibt Eigenschaften von anderen' },
      { code: 'SOZ-33', text: 'zeigt Interesse daran, wie andere ihn/sie sehen' },
      { code: 'K-28', text: 'macht anderen mit Worten Mut und lobt sie' },
      { code: 'K-32', text: 'würdigt Beiträge anderer und baut auf ihren Ideen auf' },
    ],
    teacherNote: 'Im Spiel heißt die Mission „Konter-Battle“, das Etikett „Spruch“ und der Stärken-Turm „Crew-Tower“. Zwei Teams. Battle (2 Runden): Ein Etikett erscheint („Du bist zu laut.“). 30 Sekunden überlegt jedes Team einen Reframe („Wer laut ist, …“). Beide Teams sagen ihren Satz laut. Dann bewertet jedes Team das ANDERE Team mit der Ja/Nein-Karte, du stimmst immer mit. Tippe die Ja-Stimmen ein: Jedes Ja ist ein Punkt, bei Mehrheit wächst der Stärken-Turm. Danach zeigt das Spiel zwei Profi-Reframes. Speed-Match (1 Runde, nur wenn die Zeit reicht): Ein Profi-Reframe erscheint, die Teams halten die passende Buchstaben-Karte (A–D) hoch. Du tippst, welches Team zuerst war und welche Karte es zeigt. Bei guter Begründung für eine andere Karte kannst du trotzdem +2 geben. Die Etiketten sind allgemein. Bitte darauf achten, dass niemand sie auf eine Person im Raum bezieht. Eigene Etiketten nennen ist in der Nachbesprechung freiwillig.',
    debrief: [
      'Welcher Konter hat dich heute überrascht?',
      'Kennst du einen Spruch, den du selbst schon gehört hast? Welche Stärke steckt darin? (Nur wenn du magst.)',
      'Wie fühlt es sich an, wenn dich jemand mit einem einzigen Wort beschreibt?',
      'Welche Stärke aus dem Turm nimmst du heute mit?',
      'Woher kommen solche Sprüche eigentlich? Wer sagt so etwas?',
      'Wie kann man Kritik sagen, ohne jemandem einen Stempel zu verpassen?',
      'War es leichter, selbst umzudrehen oder das andere Team zu bewerten?',
    ],

    async run(ctx) {
      const N = ctx.crewSize;
      const sizeA = Math.max(1, Math.ceil(N / 2));
      const G = {
        teams: ctx.teams,
        size: { A: sizeA, B: Math.max(1, N - sizeA) },
        score: { A: 0, B: 0 },
        blocks: [],
        nums: {},
        miniSlot: null,
        battles: 0,
        speeds: 0,
        maxPoints: 0,
        crewName: (ctx.state.crew && ctx.state.crew.name) || 'Crew',
      };
      const cards = ctx.pick('reframe', BATTLES + SPEEDS);
      const battleCards = cards.slice(0, BATTLES);
      const speedCards = cards.slice(BATTLES);

      await intro(ctx, G);
      for (let i = 0; i < battleCards.length; i++) {
        if (!ctx.roundGate(i, battleCards.length)) break;
        await battle(ctx, G, battleCards[i], i);
      }
      if (speedCards.length && ctx.minutesLeft() > 3.5) {
        await speedIntro(ctx, G); // X-Karte hier überspringt nur die Erklärung
        for (let j = 0; j < speedCards.length; j++) await speed(ctx, G, speedCards[j], j, speedCards.length);
      }
      await finale(ctx, G);

      const total = G.score.A + G.score.B;
      const ratio = G.maxPoints ? total / G.maxPoints : 0;
      const energy = clamp(4 + Math.round(6 * ratio), 4, 10);
      const n = G.blocks.length;
      let summary = 'Ihr habt blöde Sprüche umgedreht. Das ist nicht leicht.';
      if (n >= 4) summary = 'Euer Crew-Tower ist richtig hoch. Stark gekontert!';
      else if (n >= 2) summary = n + ' Stärken im Turm. Gut gekontert, Crew!';
      else if (n >= 1) summary = 'Der Crew-Tower wächst. Gut gekontert!';
      return { energy, summary, points: total };
    },
  });

  /* ---------- Solo: „Reframe-Rush“ ---------- */
  async function soloRound(ctx) {
    const { ui, SKIP } = ctx;
    const G = { blocks: [], crewName: 'Dein Turm', nums: {} };
    const cards = ctx.pick('reframe', SOLO_CARDS);
    let hits = 0;
    let played = 0;

    const demoCard = (CREW.content.reframe || []).find((c) => c.id === 'rf01') || cards[0];
    const vi = view(ctx, [
      h('div', { class: 'reframe-center enter' },
        h('span', { class: 'eyebrow' }, 'Solo · Stärken-Training'),
        h('h1', { class: 'outline-text' }, 'Konter-Rush'),
        h('p', { class: 'lead' }, 'Du siehst eine Stärke. Welcher Spruch steckt dahinter?'),
        h('p', { class: 'muted' }, SOLO_CARDS + ' Karten. Kein Zeitdruck. Jeder Treffer baut deinen Turm.')),
      h('div', { class: 'reframe-solo-demo enter-2' }, flipTag(demoCard, { demo: true, small: true }).el),
    ]);
    await ctx.waitFor(ui.choice(vi.acts, [{ label: 'Start', value: 'go', iconRight: 'play', id: 'rf-solo-start' }]));

    for (let i = 0; i < cards.length; i++) {
      const card = cards[i];
      const k = Math.floor(Math.random() * card.reframes.length);
      const options = buildOptions(ctx, card);
      const label = 'Karte ' + (i + 1) + ' von ' + cards.length;
      let pickResolve;
      const pickP = new Promise((r) => { pickResolve = r; });
      const grid = h('div', { class: 'reframe-opts' }, options.map((o) => {
        const b = h('button', { type: 'button', class: 'reframe-opt as-btn', 'data-letter': o.letter, 'data-ok': o.ok ? '1' : null },
          h('span', { class: 'reframe-letter l' + o.letter }, o.letter),
          h('span', { class: 'reframe-opt-text' }, o.card.etikett));
        b.addEventListener('click', () => { CREW.sound.play('tap'); pickResolve(o); });
        return b;
      }));
      const feedback = h('div', { class: 'reframe-solo-fb' });
      const hudSlot = h('div', { class: 'reframe-hudslot' }, hud(G, label, { solo: { hits } }));
      const v = view(ctx, [hudSlot, h('div', { class: 'enter' }, questionCard(ctx, card, k, 'Welcher Spruch steckt dahinter?')), h('div', { class: 'enter-2' }, grid), feedback], { top: true });
      const chosen = await ctx.waitFor(pickP);
      if (chosen === SKIP) continue;
      played++;
      grid.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      const ok = chosen.ok;
      if (ok) { G.blocks.push({ word: card.staerke, team: ['A', 'B', 'C'][hits % 3] }); hits++; CREW.sound.play('good'); } else CREW.sound.play('soft');
      options.forEach((o, idx) => {
        const b = grid.children[idx];
        if (o.ok) { b.classList.add('ok'); b.appendChild(h('span', { class: 'reframe-opt-ic' }, CREW.icon('check', 28))); } else if (o === chosen) b.classList.add('nope'); else b.classList.add('dim');
      });
      const tag = flipTag(card, { small: true });
      hudSlot.replaceChildren(hud(G, label, { solo: { hits }, pop: ok }));
      feedback.replaceChildren(h('div', { class: 'reframe-reveal pop' },
        h('div', { class: 'stack reframe-reveal-msg' },
          h('h2', null, ok ? 'Treffer! Neuer Block.' : 'Nicht ganz. Es war: ' + card.etikett),
          h('p', { class: 'lead' }, fullReframe(card, k))),
        tag.el));
      const nextP = ui.next(v.acts, i < cards.length - 1 ? 'Nächste Karte' : 'Fertig', { variant: '' });
      // Kleine Bildschirme: Rückmeldung und Knopf ins Bild holen
      try { v.acts.scrollIntoView({ behavior: 'smooth', block: 'end' }); } catch (e) { /* egal */ }
      await ctx.sleep(350);
      tag.flip();
      await ctx.waitFor(nextP);
    }

    // Ende: dein Turm + Bestwert (ohne Namen)
    const best = played ? ctx.best('treffer', hits, true) : null;
    const v = view(ctx, [
      h('div', { class: 'reframe-split final' },
        h('div', { class: 'stack reframe-final-l' },
          h('span', { class: 'eyebrow enter' }, 'Dein Tower'),
          h('h2', { class: 'enter' }, hits + ' von ' + cards.length + ' Treffern'),
          best ? h('p', { class: 'lead enter-2' }, best.isNew && hits > 0 ? 'Neuer Bestwert!' : 'Dein Bestwert: ' + best.best) : null,
          h('p', { class: 'muted enter-3' }, hits ? 'Jede Stärke im Turm war vorher ein blöder Spruch.' : 'Knifflig heute. Beim nächsten Mal wächst der Turm.')),
        h('div', { class: 'reframe-tower-slot' }, tower(G, { roof: true, roofFresh: true }))),
    ]);
    CREW.sound.play(hits >= cards.length / 2 ? 'great' : 'good');
    if (best && best.isNew && hits > 0) ui.confetti(90);
    const r = await ctx.waitFor(ui.choice(v.acts, [{ label: 'Nochmal', value: 'again', variant: 'ghost', icon: 'shuffle', id: 'rf-solo-again' }, { label: 'Fertig', value: 'done', iconRight: 'right', id: 'rf-solo-done' }]));
    return r === 'again' ? 'again' : 'done';
  }

  CREW.registerSolo({
    id: 'reframe',
    title: 'Konter-Rush',
    desc: 'Du siehst eine Stärke. Welcher Spruch steckt dahinter?',
    icon: 'sparkle',
    async run(ctx) {
      for (;;) {
        const r = await soloRound(ctx);
        if (r !== 'again') return;
      }
    },
  });

  // Für Tests: Hilfsfunktionen offenlegen (ohne Zustand)
  CREW.reframe = { NEAR, isNear, buildOptions };
})();

/* ---- missions/stehauf.js ---- */
/* Mission Montag: „Wer steht?“ (Karten „Steh auf, wenn …“) + Schätzrunde.
   Idee aus den ISA-Materialien (Kennenlern-Spiel), erweitert um eine Schätzrunde:
   Wer die Crew richtig einschätzt, bringt Energie. */
(function () {
  const CREW = window.CREW;

  CREW.registerMission({
    id: 'stehauf',
    day: 1,
    title: 'Wer steht?',
    tagline: 'Wie gut kennst du deine Crew?',
    hook: 'Schätzen · Goldene Karte · Blitzrunde',
    color: '#e0a100',
    minutes: 5,
    themes: ['Zusammenhalt', 'Fremdwahrnehmung', 'Selbstwahrnehmung'],
    etep: 'III–IV',
    eldib: [
      { code: 'K-15', text: 'erzählt von sich selbst' },
      { code: 'K-20', text: 'beschreibt Eigenschaften anderer' },
      { code: 'SOZ-31', text: 'merkt, dass er/sie anders handelt als andere' },
      { code: 'SOZ-32', text: 'hört zu und respektiert andere Meinungen' },
    ],
    teacherNote: '3 Karten, die dritte ist golden (Punkte ×2), danach eine Blitzrunde ohne Schätzen. Pro Karte: Alle schätzen geheim auf der Antwort-Karte (Zahl), wie viele gleich aufstehen. Auf „Aufstehen!“ stehen alle auf, für die der Satz stimmt. Du tippst so viele Figuren an, wie stehen (keine Namen). Dann zeigen alle ihre Schätzung, du tippst die Zahlen ein. Das Spiel wertet selbst aus: genau = +2, ±1 = +1. Aufstehen ist freiwillig. Wer steht, darf etwas erzählen, muss aber nicht.',
    debrief: [
      'Was hat euch heute überrascht?',
      'Mit wem hattest du heute etwas gemeinsam, das du nicht erwartet hast?',
      'Wie fühlt es sich an, aufzustehen, wenn nur wenige stehen?',
      'Warum schätzen wir andere manchmal falsch ein?',
      'Welche Karte hat heute gefehlt? Denkt euch eine für nächstes Mal aus.',
      'Woran merkt man, dass jemand etwas lieber nicht vor der Gruppe sagen will?',
    ],

    async run(ctx) {
      const { h, ui } = ctx;
      const N = ctx.crewSize;
      const ROUNDS = 3;
      const cards = ctx.pick('stehauf', ROUNDS + 3);
      const main = cards.slice(0, ROUNDS);
      const blitz = cards.slice(ROUNDS);
      let pts = 0;
      let maxPts = 0;
      let played = 0;
      let hitsAll = 0;
      const clean = (t) => t.replace(/^…\s*/, '');

      for (let i = 0; i < main.length; i++) {
        if (!ctx.roundGate(i, main.length)) break;
        const card = main[i];
        const gold = i === main.length - 1 && main.length > 1;
        const full = 'Steh auf, wenn du ' + clean(card.text);

        // 1) Karte + geheim schätzen
        if (gold) CREW.sound.play('unlock');
        const w1 = ctx.screen([
          h('div', { class: 'row between' }, h('span', { class: 'eyebrow' }, gold ? 'Goldene Karte · Punkte ×2' : 'Karte ' + (i + 1) + ' von ' + main.length), ui.paddleHint('zahl', 'Schätzen')),
          ui.say(h('span', null, h('span', { class: 'muted' }, 'Steh auf, wenn du '), clean(card.text)), { speakText: full, cls: gold ? 'sa-gold' : '' }),
          h('p', { class: 'lead' }, 'Schätzt geheim: Wie viele von euch ', h('b', null, N), ' stehen gleich auf?'),
          h('p', { class: 'muted' }, 'Sitzen bleiben ist immer okay. Keiner muss was erklären.'),
        ]);
        const r1 = await ctx.waitFor(ui.choice(w1, [{ label: 'Alle haben geschätzt', value: 'go', iconRight: 'right' }]));
        if (r1 === ctx.SKIP) continue;

        // 2) Aufstehen: Lehrkraft tippt die Figuren an, die stehen (nur Anzahl, keine Namen)
        await ui.threeTwoOne('Aufstehen!');
        let standing = 0;
        const people = Array.from({ length: N }, () => {
          const b = h('button', { type: 'button', class: 'sa-person', 'aria-pressed': 'false', 'aria-label': 'Figur' }, CREW.icon('user', 48));
          b.addEventListener('click', () => {
            const up = b.getAttribute('aria-pressed') !== 'true';
            b.setAttribute('aria-pressed', String(up));
            b.classList.toggle('up', up);
            standing += up ? 1 : -1;
            CREW.sound.play(up ? 'tick' : 'tap');
            cnt.textContent = String(standing);
          });
          return b;
        });
        const cnt = h('b', { class: 'display' }, '0');
        const w2 = ctx.screen([
          h('div', { class: 'row between' }, h('span', { class: 'eyebrow' }, 'Wer steht?'), ui.scanBar()),
          h('h2', null, 'Tippe so viele Figuren an, wie gerade stehen.'),
          h('div', { class: 'sa-crowd' }, people),
          h('p', { class: 'lead', style: { textAlign: 'center' } }, 'Stehen: ', cnt),
        ]);
        const r2 = await ctx.waitFor(ui.choice(w2, [{ label: 'Weiter', value: 'go', iconRight: 'right', id: 'sa-standing' }]));
        if (r2 === ctx.SKIP) continue;

        // 3) Schätzungen zeigen
        await ui.threeTwoOne('Zeigt eure Schätzung!');
        const vp = ui.valuePad({ count: N, min: 0, max: N, placeholder: 'Tippe die gezeigten Zahlen ein …', onFull: () => ui.autoNext('sa-reveal', () => vp.get().length >= N) });
        const w3 = ctx.screen([
          h('div', { class: 'row between' }, h('span', { class: 'eyebrow' }, 'Schätzungen'), ui.scanBar()),
          h('h2', null, 'Welche Zahlen seht ihr?'),
          h('div', { class: 'card' }, vp.el),
        ]);
        const r3 = await ctx.waitFor(ui.choice(w3, [{ label: 'Auflösen', value: 'go', iconRight: 'right', id: 'sa-reveal' }]));
        if (r3 === ctx.SKIP) continue;
        const guesses = vp.get();

        // 4) Auflösung: Zahlenstrahl mit allen Schätzungen, der Ball fällt auf die echte Zahl
        const exact = guesses.filter((g) => g === standing).length;
        const near = guesses.filter((g) => Math.abs(g - standing) === 1).length;
        const mult = gold ? 2 : 1;
        const got = (exact * 2 + near) * mult;
        const cols = Array.from({ length: N + 1 }, (_, v) => h('div', { class: 'sa-col' + (v === standing ? ' real' : '') },
          h('div', { class: 'sa-chips' }, guesses.filter((g) => g === v).map(() => h('span', { class: 'sa-chip' }))),
          h('span', { class: 'sa-num' }, String(v))));
        const ball = h('div', { class: 'sa-ball', style: { left: 'calc(' + ((standing + 0.5) / (N + 1)) * 100 + '% - 20px)' } });
        const line = h('div', { class: 'sa-line' }, cols, ball);
        const verdict = h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center', visibility: 'hidden' } },
          h('h2', null, standing + ' von ' + N + ' stehen'),
          h('div', { class: 'row center' },
            h('span', { class: 'pill good' }, exact + ' × Volltreffer'),
            h('span', { class: 'pill' }, near + ' × knapp'),
            h('span', { class: 'pill accent' }, '+' + got + ' Crew-Punkte' + (gold ? ' (×2)' : ''))),
          h('p', { class: 'lead' }, standing === 0 ? 'Niemand. Auch das sagt etwas über die Crew.' : standing === N ? 'Alle! Da habt ihr etwas gemeinsam.' : 'Wer steht, darf was sagen. Muss aber nicht.'));
        const w4 = ctx.screen([
          h('span', { class: 'eyebrow' }, 'Auflösung'),
          line,
          verdict,
        ], { center: true });
        CREW.sound.play('drum');
        await ctx.sleep(900);
        ball.classList.add('drop');
        CREW.sound.play('reveal');
        await ctx.sleep(500);
        verdict.style.visibility = '';
        verdict.classList.add('pop');
        if (exact) { CREW.sound.play('great'); ui.confetti(exact * 40); }
        pts += got;
        maxPts += 2 * N * mult;
        hitsAll += exact;
        played++;
        const r4 = await ctx.waitFor(ui.choice(w4, [{ label: i < main.length - 1 ? 'Nächste Karte' : 'Weiter', value: 'go', iconRight: 'right' }]));
        if (r4 === ctx.SKIP) continue;
      }

      // Blitzrunde: drei Sätze, je 5 Sekunden, ohne Schätzen
      if (blitz.length && ctx.minutesLeft() > 4) {
        const w5 = ctx.screen([
          h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } }, h('span', { class: 'eyebrow' }, 'Blitzrunde'), h('h2', null, 'Drei Sätze. Je 5 Sekunden. Nur aufstehen.')),
        ], { center: true });
        const r5 = await ctx.waitFor(ui.choice(w5, [{ label: 'Los!', value: 'go', iconRight: 'play' }]));
        if (r5 !== ctx.SKIP) {
          for (const b of blitz) {
            ctx.screen([
              h('span', { class: 'eyebrow' }, 'Blitzrunde'),
              ui.say(h('span', null, h('span', { class: 'muted' }, 'Steh auf, wenn du '), clean(b.text)), { speakText: 'Steh auf, wenn du ' + clean(b.text) }),
              h('div', { class: 'sa-fuse' }),
            ], { center: true });
            CREW.sound.play('go');
            await ctx.sleep(5000);
          }
        }
      }

      const acc = maxPts ? pts / maxPts : 0;
      const energy = played ? 4 + Math.round(6 * Math.min(1, acc * 1.5)) : 3;
      let summary = 'Gut gespielt!';
      if (acc >= 0.45) summary = 'Ihr kennt euch richtig gut!';
      else if (acc >= 0.25) summary = 'Ihr kennt euch schon ganz gut.';
      else if (played) summary = 'Ihr habt heute viel Neues übereinander erfahren.';
      return { energy, summary, points: pts, stats: played ? [[hitsAll, 'Volltreffer']] : [] };
    },
  });
})();

/* ---- solo/solo-chill.js ---- */
/* Solo: „Chill-Zone“ – drei ruhige Übungen zum Runterkommen, alleine am iPad.
   Idee aus den ISA-Materialien (Atemübungen, Glitzerglas, Achtsamkeit / Sinne).
   Keine Punkte, keine Zeitmessung, nichts wird über die Person gespeichert. */
(function () {
  const CREW = window.CREW;
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  // Bildschirm aufbauen und als Solo-Bildschirm markieren (für modul-eigenes CSS)
  function scr(ctx, kids, opts) { const w = ctx.screen(kids, opts); w.classList.add('solo-screen'); return w; }
  const fast = () => !!window.__fast; // nur in automatischen Tests (Physik schneller)
  const { sleep } = CREW.util;
  let uid = 0;

  /* ---------- Farben aus den Design-Tokens (für Canvas) ---------- */
  function token(name, fallback) {
    const app = document.getElementById('app');
    const v = app ? getComputedStyle(app).getPropertyValue(name).trim() : '';
    return v || fallback;
  }
  function rgba(hex, a) {
    let s = String(hex).trim().replace('#', '');
    if (!/^[0-9a-f]+$/i.test(s)) return hex;
    if (s.length === 3 || s.length === 4) s = s.split('').map((c) => c + c).join('');
    const r = parseInt(s.slice(0, 2), 16), g = parseInt(s.slice(2, 4), 16), b = parseInt(s.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  /* ---------- Kleine Bilder fürs Menü (Farben kommen per CSS aus den Tokens) ---------- */
  const ART = {
    welle: () => {
