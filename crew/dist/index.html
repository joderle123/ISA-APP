  // Bullauge mit Welle (SVG). draw(level 0..1, Zeit) malt Wasserstand und Wellen.
  function makeWave() {
    const id = 'solo-clip-' + (++uid);
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 400 400');
    svg.setAttribute('class', 'solo-port-svg');
    svg.setAttribute('aria-hidden', 'true');
    const bubbles = Array.from({ length: 7 }, () => '<circle class="solo-bubble" r="4" cx="-20" cy="-20"/>').join('');
    svg.innerHTML = `<defs><clipPath id="${id}"><circle cx="200" cy="200" r="172"/></clipPath>
        <filter id="${id}-b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter></defs>
      <circle class="solo-port-halo" cx="200" cy="200" r="180" filter="url(#${id}-b)"/>
      <circle class="solo-port-bg" cx="200" cy="200" r="172"/>
      <g clip-path="url(#${id})">
        <path class="solo-wave back"/>
        <path class="solo-wave front"/>
        <g>${bubbles}</g>
        <path class="solo-wave-line"/>
      </g>
      <circle class="solo-port-ring" cx="200" cy="200" r="172"/>
      <path class="solo-port-shine" d="M86 126 A 132 132 0 0 1 150 76"/>`;
    const back = svg.querySelector('.back'), front = svg.querySelector('.front'), line = svg.querySelector('.solo-wave-line');
    const halo = svg.querySelector('.solo-port-halo');
    const calm = reduced();
    const bs = Array.from(svg.querySelectorAll('.solo-bubble')).map((el) => ({
      el, x: 60 + Math.random() * 280, y: 380 + Math.random() * 120, v: 14 + Math.random() * 22, r: 2 + Math.random() * 4, w: Math.random() * 6,
    }));
    let last = 0;
    const surface = (base, amp, phase, freq) => {
      const pts = [];
      for (let x = 0; x <= 400; x += 10) pts.push(x + ' ' + (base + Math.sin(x * freq + phase) * amp).toFixed(1));
      return pts;
    };
    function draw(level, now) {
      const t = calm ? 0 : now / 1000;
      const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      const base = 372 - level * 344;
      const b = surface(base - 7, 8, t * 0.8 + 1.4, 0.021);
      const f = surface(base, 10, -t * 1.1, 0.016);
      back.setAttribute('d', 'M0 400 L' + b.join(' L') + ' L400 400 Z');
      front.setAttribute('d', 'M0 400 L' + f.join(' L') + ' L400 400 Z');
      line.setAttribute('d', 'M' + f.join(' L'));
      halo.setAttribute('r', (168 + level * 26).toFixed(1));
      halo.style.opacity = String(0.1 + level * 0.5);
      bs.forEach((q) => {
        if (calm) { q.el.setAttribute('cy', '-20'); return; }
        q.y -= q.v * dt;
        const sx = q.x + Math.sin(t * 1.3 + q.w) * 5;
        if (q.y < base + 14) { q.y = 392 + Math.random() * 60; q.x = 60 + Math.random() * 280; }
        q.el.setAttribute('cx', sx.toFixed(1));
        q.el.setAttribute('cy', q.y.toFixed(1));
        q.el.setAttribute('r', q.r.toFixed(1));
      });
    }
    return { el: svg, draw };
  }

  const ease = (k) => 0.5 - Math.cos(Math.PI * k) / 2;

  async function breathe(ctx) {
    const { h, ui } = ctx;
    const R = RHYTHMS.find((r) => r.id === pref.rhythm) || RHYTHMS[0];
    const cycleLen = R.phases.reduce((a, [, s]) => a + s, 0);
    const cycles = Math.max(2, Math.round((pref.min * 60) / cycleLen));
    const total = cycles * cycleLen;

    const wave = makeWave();
    const num = h('div', { class: 'solo-port-num' }, '3');
    const label = h('div', { class: 'display solo-phase-label', 'aria-live': 'polite' }, 'Gleich geht’s los');
    const hint = h('p', { class: 'lead muted solo-phase-hint' }, 'Setz dich bequem hin. Schultern locker.');
    const chips = R.phases.map(([ph, s]) => h('span', { class: 'solo-phase' }, PHASE[ph].short, h('b', null, String(s))));
    const count = h('span', { class: 'pill' }, 'Atemzug 1 von ' + cycles);
    const bar = h('i');
    let stopFn;
    const stopP = new Promise((res) => { stopFn = res; });
    scr(ctx, [
      h('div', { class: 'row between solo-breath-head' },
        h('span', { class: 'eyebrow' }, 'Atem-Welle · ' + R.title), count),
      h('div', { class: 'solo-breath' },
        h('div', { class: 'solo-port' }, wave.el, num),
        h('div', { class: 'solo-breath-side' },
          label, hint,
          h('div', { class: 'solo-phases' }, chips),
          h('div', { class: 'progress solo-thin' }, bar),
          h('div', { class: 'row' }, ui.btn('Beenden', () => stopFn('stop'), { variant: 'ghost', small: true, icon: 'x', id: 'breath-stop' })))),
    ]);

    // Zustand für die Animation (läuft per requestAnimationFrame, Takt per Sekunden-Schritten)
    const st = { stop: false, from: LOW, to: LOW, secs: 1, idx: 0, t0: performance.now() };
    const dead = () => st.stop || !ctx.alive();
    (function frame(now) {
      if (dead() || !document.body.contains(wave.el)) return;
      const k = Math.min(1, (st.idx + Math.min(1, (now - st.t0) / 1000)) / st.secs);
      wave.draw(st.from + (st.to - st.from) * ease(k), now);
      requestAnimationFrame(frame);
    })(performance.now());

    const loop = (async () => {
      // Vorlauf 3 – 2 – 1
      for (let s = 3; s > 0; s--) {
        num.textContent = String(s);
        await sleep(1000);
        if (dead()) return 'dead';
      }
      let elapsed = 0;
      for (let c = 0; c < cycles; c++) {
        count.textContent = 'Atemzug ' + (c + 1) + ' von ' + cycles;
        for (let pi = 0; pi < R.phases.length; pi++) {
          const [ph, secs] = R.phases[pi];
          const P = PHASE[ph];
          label.textContent = P.label + ' …';
          hint.textContent = P.hint;
          label.dataset.phase = ph;
          chips.forEach((x, i) => x.classList.toggle('on', i === pi));
          st.from = st.to;
          st.to = ph === 'in' ? HIGH : ph === 'out' ? LOW : st.from;
          st.secs = secs;
          if (ph === 'in') CREW.sound.play('breatheIn');
          else if (ph === 'out') CREW.sound.play('breatheOut');
          for (let s = 0; s < secs; s++) {
            st.idx = s;
            st.t0 = performance.now();
            num.textContent = String(secs - s);
            await sleep(1000);
            if (dead()) return 'dead';
            elapsed++;
            bar.style.width = Math.round((elapsed / total) * 100) + '%';
          }
        }
      }
      return 'done';
    })().catch(() => 'dead');

    let r;
    try {
      r = await ctx.waitFor(Promise.race([loop, stopP]));
    } finally {
      st.stop = true;
    }
    if (r === ctx.SKIP) return 'menu';
    if (r === 'done') return outro(ctx, { title: 'Geschafft.', text: cycles + ' ruhige Atemzüge. Das geht auch unauffällig: im Bus, vor einem Test, beim Warten.' });
    return outro(ctx, { title: 'Auch kurz hilft.', text: 'Schon ein paar ruhige Atemzüge machen einen Unterschied.' });
  }

  async function atemWelle(ctx) {
    for (;;) {
      const s = await breathSetup(ctx);
      if (s !== 'go') return; // Zurück oder X-Karte
      const r = await breathe(ctx);
      if (r !== 'again') return;
    }
  }

  /* =========================================================
     (b) Glitzerglas – Canvas mit ein paar hundert Glitzerteilchen
     ========================================================= */
  function jarSim(canvas, box, cb) {
    const app = document.getElementById('app');
    const look = (app && app.dataset.look) || 'arena';
    const pixel = look === 'pixel', neon = look === 'neon';
    const COLS = [token('--yellow', '#ffc93c'), token('--accent', '#ff6b3d'), token('--good', '#2ee6c5'), token('--teamA', '#3da5ff'), token('--teamB', '#ff4fa3'), '#ffffff'];
    const INK = token('--ink', '#0e0a26');
    const LINE = neon ? token('--accent', '#00e5ff') : token('--line', '#0e0a26');
    const TEXT = token('--text', '#fff8ee');
    const LIQ = neon ? token('--accent', '#00e5ff') : token('--teamA', '#3da5ff');
    const LID = token('--accent', '#ff6b3d');
    const PANEL = token('--panel', '#141433');
    const g = canvas.getContext('2d');
    const calm = reduced();
    const SPEED = fast() ? 8 : 1;
    let W = 0, H = 0, dpr = 1, jar = null, ps = [];
    let running = true, raf = 0, last = performance.now();
    let turb = 0, lastStir = performance.now(), settled = false, ptr = null;

    // Boden des Glases (unten abgerundet)
    function floorAt(x) {
      const r = jar.r * 0.9;
      const dx = Math.min(x - jar.bx0, jar.bx1 - x);
      if (r <= 0 || dx >= r) return jar.by1;
      const k = r - Math.max(0, dx);
      return jar.by1 - (r - Math.sqrt(Math.max(0, r * r - k * k)));
    }
    function restY(p) { return floorAt(p.x) - p.s - jar.pile * Math.pow(p.u, 1.8); }

    function makeParticle(shaken) {
      const s = 1.3 + Math.pow(Math.random(), 2.2) * 3.4;
      const p = {
        x: jar.bx0 + 6 + Math.random() * (jar.bx1 - jar.bx0 - 12), y: 0, vx: 0, vy: 0,
        s, w: 0.65 + s / 4.5, c: Math.floor(Math.random() * COLS.length), flake: Math.random() < 0.3,
        a: Math.random() * 6.3, va: (Math.random() - 0.5) * 3, u: Math.random(), rest: !shaken,
      };
      if (shaken) {
        p.y = jar.by0 + Math.random() * (jar.by1 - jar.by0);
        p.vx = (Math.random() - 0.5) * 120; p.vy = (Math.random() - 0.5) * 120;
      } else p.y = restY(p);
      return p;
    }

    function layout() {
      const r = box.getBoundingClientRect();
      const nw = Math.max(220, Math.round(r.width)), nh = Math.max(240, Math.round(r.height));
      if (nw === W && nh === H && jar) return;
      const old = jar;
      W = nw; H = nh;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      const jh = H * 0.95;
      const jw = Math.min(W * 0.9, jh * 0.74);
      const x0 = (W - jw) / 2, y0 = (H - jh) / 2;
      const lidH = Math.max(18, jh * 0.075);
      const bw = Math.max(5, jw * 0.022);
      jar = { x0, y0, w: jw, h: jh, lidH, r: pixel ? 0 : jw * 0.16, bx0: x0 + bw + 2, bx1: x0 + jw - bw - 2, by0: y0 + lidH + jh * 0.05, by1: y0 + jh - bw - 2, bw };
      jar.pile = (jar.by1 - jar.by0) * 0.08;
      if (!old) {
        const area = (jar.bx1 - jar.bx0) * (jar.by1 - jar.by0);
        const n = Math.round(Math.max(320, Math.min(900, area / 240)));
        ps = Array.from({ length: n }, () => makeParticle(!calm));
        ps.sort((a, b) => a.c - b.c); // nach Farbe sortiert = schneller malen
        if (!calm) { turb = 3; lastStir = performance.now(); }
      } else {
        const sx = (jar.bx1 - jar.bx0) / (old.bx1 - old.bx0), sy = (jar.by1 - jar.by0) / (old.by1 - old.by0);
        ps.forEach((p) => {
          p.x = jar.bx0 + (p.x - old.bx0) * sx;
          p.y = jar.by0 + (p.y - old.by0) * sy;
          if (p.rest) p.y = restY(p);
        });
      }
    }

    function step(dt, now) {
      const drag = Math.exp(-1.7 * dt);
      const G = 26;
      turb *= Math.exp(-1.3 * dt);
      let moving = 0;
      for (const p of ps) {
        if (p.rest) continue;
        moving++;
        p.vy += G * p.w * dt;
        if (turb > 0.05) { p.vx += (Math.random() - 0.5) * turb * 60 * dt; p.vy += (Math.random() - 0.5) * turb * 60 * dt; }
        p.vx += (Math.random() - 0.5) * 8 * dt;
        p.vx *= drag; p.vy *= drag;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.a += p.va * dt;
        if (p.x < jar.bx0 + p.s) { p.x = jar.bx0 + p.s; p.vx = Math.abs(p.vx) * 0.4; }
        if (p.x > jar.bx1 - p.s) { p.x = jar.bx1 - p.s; p.vx = -Math.abs(p.vx) * 0.4; }
        if (p.y < jar.by0 + p.s) { p.y = jar.by0 + p.s; p.vy = Math.abs(p.vy) * 0.3; }
        const fy = restY(p);
        if (p.y >= fy) {
          p.y = fy;
          if (Math.abs(p.vy) < 70 && turb < 0.8) { p.rest = true; p.vx = 0; p.vy = 0; } else p.vy = -Math.abs(p.vy) * 0.25;
        }
      }
      if (!settled && moving <= ps.length * 0.03 && !ptr && now - lastStir > 1200) {
        settled = true;
        cb.onSettle();
      }
    }

    function bodyPath() {
      const { x0, y0, w, h, lidH, r } = jar;
      const top = y0 + lidH * 0.6, bottom = y0 + h, rt = r * 0.45;
      g.beginPath();
      g.moveTo(x0 + rt, top);
      g.lineTo(x0 + w - rt, top);
      g.quadraticCurveTo(x0 + w, top, x0 + w, top + rt);
      g.lineTo(x0 + w, bottom - r);
      g.quadraticCurveTo(x0 + w, bottom, x0 + w - r, bottom);
      g.lineTo(x0 + r, bottom);
      g.quadraticCurveTo(x0, bottom, x0, bottom - r);
      g.lineTo(x0, top + rt);
      g.quadraticCurveTo(x0, top, x0 + rt, top);
      g.closePath();
    }

    function shine(x, y, sw, sh, a) {
      const gr = g.createLinearGradient(0, y, 0, y + sh);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.25, `rgba(255,255,255,${a})`);
      gr.addColorStop(0.7, `rgba(255,255,255,${a})`);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr;
      g.beginPath();
      if (g.roundRect && !pixel) g.roundRect(x, y, sw, sh, sw / 2); else g.rect(x, y, sw, sh);
      g.fill();
    }
    function draw(now) {
      const { x0, y0, w, h, lidH } = jar;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      // Schatten
      g.fillStyle = rgba(INK, 0.35);
      g.beginPath();
      g.ellipse(x0 + w / 2, y0 + h + 2, w * 0.46, Math.max(6, h * 0.018), 0, 0, Math.PI * 2);
      g.fill();
      // Flüssigkeit
      g.save();
      bodyPath();
      g.clip();
      const grad = g.createLinearGradient(0, y0, 0, y0 + h);
      grad.addColorStop(0, rgba(LIQ, 0.08));
      grad.addColorStop(1, rgba(LIQ, 0.3));
      g.fillStyle = grad;
      g.fillRect(x0, y0, w, h);
      // Glitzer: erst runde Teilchen gebündelt pro Farbe, dann funkelnde Plättchen
      if (neon) g.globalCompositeOperation = 'lighter';
      const t = now / 1000;
      let cur = -1;
      g.beginPath();
      for (const p of ps) {
        if (p.flake) continue;
        if (p.c !== cur) { if (cur >= 0) g.fill(); g.beginPath(); cur = p.c; g.fillStyle = COLS[cur]; }
        if (pixel) { const s = Math.max(2, Math.round(p.s * 1.4)); g.rect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s); }
        else { g.moveTo(p.x + p.s, p.y); g.arc(p.x, p.y, p.s, 0, Math.PI * 2); }
      }
      if (cur >= 0) g.fill();
      for (const p of ps) {
        if (!p.flake) continue;
        const ang = p.a + (calm ? 0 : t * (p.rest ? 0.6 : 0) * p.va);
        g.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(ang * 1.7));
        g.fillStyle = COLS[p.c];
        const s = p.s * 1.5;
        if (pixel) { g.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), Math.max(2, Math.round(s)), Math.max(2, Math.round(s * 0.6))); continue; }
        const ca = Math.cos(ang) * s, sa = Math.sin(ang) * s;
        g.beginPath();
        g.moveTo(p.x + ca, p.y + sa);
        g.lineTo(p.x - sa * 0.45, p.y + ca * 0.45);
        g.lineTo(p.x - ca, p.y - sa);
        g.lineTo(p.x + sa * 0.45, p.y - ca * 0.45);
        g.closePath();
        g.fill();
      }
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      // Glanz auf dem Glas
      shine(x0 + w * 0.1, y0 + lidH + h * 0.06, Math.max(6, w * 0.055), h * 0.55, 0.13);
      shine(x0 + w * 0.83, y0 + lidH + h * 0.1, Math.max(4, w * 0.028), h * 0.28, 0.08);
      g.restore();
      // Glasrand
      g.lineJoin = 'round';
      if (neon) { g.shadowColor = LINE; g.shadowBlur = 16; }
      g.lineWidth = jar.bw * 1.4;
      g.strokeStyle = neon ? LINE : rgba(LINE, 1);
      bodyPath();
      g.stroke();
      g.shadowBlur = 0;
      if (!neon) {
        g.lineWidth = Math.max(2, jar.bw * 0.45);
        g.strokeStyle = rgba(TEXT, 0.4);
        bodyPath();
        g.stroke();
      }
      // Deckel
      const lx = x0 + w * 0.07, lw = w * 0.86, lr = pixel ? 0 : Math.min(8, lidH * 0.3);
      g.beginPath();
      if (g.roundRect) g.roundRect(lx, y0, lw, lidH, lr); else g.rect(lx, y0, lw, lidH);
      if (neon) { g.fillStyle = PANEL; g.fill(); g.fillStyle = rgba(LID, 0.22); }
      else g.fillStyle = LID;
      g.fill();
      g.lineWidth = Math.max(3, jar.bw * 0.9);
      g.strokeStyle = neon ? LID : LINE;
      g.stroke();
      g.strokeStyle = rgba(neon ? LID : INK, 0.3);
      g.lineWidth = 2;
      for (let x = lx + 12; x < lx + lw - 6; x += 12) { g.beginPath(); g.moveTo(x, y0 + 5); g.lineTo(x, y0 + lidH - 5); g.stroke(); }
    }

    function frame(now) {
      if (!running) return;
      if (!document.body.contains(canvas)) { stop(); return; }
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)) * SPEED;
      last = now;
      step(dt, now);
      draw(now);
      raf = requestAnimationFrame(frame);
    }

    // Umrühren: in der Nähe des Fingers bekommen die Teilchen Schwung
    function stir(x, y, vx, vy, burst) {
      const R = Math.max(60, jar.w * 0.22);
      const k = calm ? 0.5 : 1;
      for (const p of ps) {
        const dx = p.x - x, dy = p.y - y;
        const d2 = dx * dx + dy * dy;
        if (d2 > R * R) continue;
        const d = Math.sqrt(d2) || 1;
        const f = (1 - d / R) * k;
        if (burst) {
          p.vx += (dx / d) * 170 * f + (Math.random() - 0.5) * 40;
          p.vy += (dy / d) * 170 * f - 90 * f;
        } else {
          p.vx += vx * 0.32 * f - (dy / d) * 40 * f;
          p.vy += vy * 0.32 * f + (dx / d) * 40 * f - 30 * f;
        }
        const sp = Math.hypot(p.vx, p.vy);
        if (sp > 900) { p.vx *= 900 / sp; p.vy *= 900 / sp; }
        p.rest = false;
      }
      lastStir = performance.now();
      if (settled) { settled = false; cb.onStir(); }
    }
    const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
    const onDown = (e) => {
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
      ptr = pos(e);
      stir(ptr.x, ptr.y, 0, 0, true);
      CREW.sound.play('whoosh');
    };
    const onMove = (e) => {
      if (!ptr) return;
      const q = pos(e);
      const dt = Math.max(0.008, (q.t - ptr.t) / 1000);
      stir(q.x, q.y, Math.max(-2200, Math.min(2200, (q.x - ptr.x) / dt)), Math.max(-2200, Math.min(2200, (q.y - ptr.y) / dt)), false);
      ptr = q;
    };
    const onUp = () => { ptr = null; lastStir = performance.now(); };
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    const ro = window.ResizeObserver ? new ResizeObserver(() => layout()) : null;
    if (ro) ro.observe(box); else window.addEventListener('resize', layout);

    function shake() {
      for (const p of ps) {
        p.rest = false;
        p.vx = (Math.random() - 0.5) * (calm ? 120 : 320);
        p.vy = -Math.random() * (calm ? 160 : 420);
      }
      turb = calm ? 1 : 4;
      lastStir = performance.now();
      CREW.sound.play('whoosh');
      if (settled) { settled = false; cb.onStir(); }
    }
    function stop() {
      running = false;
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect(); else window.removeEventListener('resize', layout);
    }

    layout();
    if (calm) { settled = true; cb.onSettle(true); }
    raf = requestAnimationFrame(frame);
    return { shake, stop, count: () => ps.length, moving: () => ps.filter((p) => !p.rest).length };
  }

  async function glitzerglas(ctx) {
    const { h, ui } = ctx;
    for (;;) {
      const canvas = h('canvas', { class: 'solo-jar-canvas', role: 'img', 'aria-label': 'Glitzerglas. Wische durch das Glas, um den Glitzer aufzuwirbeln.' });
      const box = h('div', { class: 'solo-jar-box', 'data-settled': '0' }, canvas);
      const status = h('span', { class: 'pill solo-jar-status' }, 'Wirbelt …');
      const msg = h('p', { class: 'lead solo-jar-msg', 'aria-live': 'polite' }, 'Wisch mit dem Finger durchs Glas. Dann schau einfach zu.');
      let done;
      const p = new Promise((res) => { done = res; });
      let sim = null;
      scr(ctx, [
        h('div', { class: 'row between solo-jar-head' },
          h('div', { class: 'stack', style: { gap: '2px' } }, h('span', { class: 'eyebrow' }, 'Chill-Zone'), h('h2', null, 'Glitzerglas')),
          status),
        box,
        h('div', { class: 'solo-jar-foot' },
          msg,
          h('div', { class: 'row solo-jar-btns' },
            ui.btn('Schütteln', () => sim && sim.shake(), { variant: 'ghost', icon: 'sparkle', id: 'jar-shake' }),
            ui.btn('Fertig', () => done('done'), { variant: 'good', icon: 'check', id: 'jar-done' }))),
      ]);
      sim = jarSim(canvas, box, {
        onSettle(initial) {
          box.dataset.settled = '1';
          status.textContent = 'Alles gesetzt';
          status.classList.add('good');
          msg.textContent = initial
            ? 'Wisch mit dem Finger durchs Glas. Oder tipp auf „Schütteln“.'
            : 'Alles hat sich gesetzt. Oft sind dann auch die Gedanken ruhiger.';
          if (!initial) CREW.sound.play('soft');
        },
        onStir() {
          box.dataset.settled = '0';
          status.textContent = 'Wirbelt …';
          status.classList.remove('good');
          msg.textContent = 'Schau einfach zu, wie alles langsam sinkt.';
        },
      });
      let r;
      try {
        r = await ctx.waitFor(p);
      } finally {
        sim.stop();
      }
      if (r === ctx.SKIP) return;
      const o = await outro(ctx, { title: 'Schön ruhig.', text: 'Du hast dir eine Pause gegönnt. Das Glas kannst du jederzeit wieder schütteln.', again: 'Nochmal schütteln' });
      if (o !== 'again') return;
    }
  }

  /* =========================================================
     (c) 5-4-3-2-1 – mit den Sinnen zurück ins Hier und Jetzt
     ========================================================= */
  const SENSES = [
    { n: 5, id: 'sehen', title: 'Sehen', task: 'Finde 5 Dinge, die du sehen kannst.', ex: ['etwas Blaues', 'etwas Rundes', 'eine Lampe', 'deine Schuhe', 'ein Muster', 'etwas ganz Kleines', 'etwas, das glänzt'] },
    { n: 4, id: 'hoeren', title: 'Hören', task: 'Hör genau hin. Finde 4 Geräusche.', ex: ['deinen Atem', 'Schritte', 'ein leises Summen', 'Stimmen weiter weg', 'ein Auto draußen', 'ein Klicken', 'den Wind'] },
    { n: 3, id: 'fuehlen', title: 'Spüren', task: 'Spür 3 Dinge an deinem Körper.', ex: ['deine Füße auf dem Boden', 'den Stuhl unter dir', 'deine Kleidung', 'die Luft auf der Haut', 'deine Hände', 'etwas Kühles'] },
    { n: 2, id: 'riechen', title: 'Riechen', task: 'Such 2 Gerüche.', ex: ['deine Kleidung', 'die Luft im Raum', 'deine Hände', 'Seife'], note: 'Riechst du nichts? Denk an 2 Gerüche, die du magst.' },
    { n: 1, id: 'schmecken', title: 'Schmecken', task: 'Was schmeckst du gerade?', ex: ['einen Schluck Wasser', 'deinen Kaugummi', 'den Rest vom Frühstück'], note: 'Nichts? Denk an deinen Lieblingsgeschmack.' },
  ];

  async function sinneIntro(ctx) {
    const { h, ui } = ctx;
    let done;
    const p = new Promise((res) => { done = res; });
    scr(ctx, [
      h('div', { class: 'stack enter', style: { gap: '6px', alignItems: 'center', textAlign: 'center' } },
        h('span', { class: 'eyebrow' }, 'Chill-Zone · 5-4-3-2-1'),
        h('h2', null, 'Zurück ins Hier und Jetzt'),
        h('p', { class: 'lead muted', style: { maxWidth: '40ch' } }, 'Wenn der Kopf zu voll ist, helfen die Sinne. Du musst nichts aufschreiben.')),
      h('div', { class: 'solo-sense-strip enter-2' }, SENSES.map((s) =>
        h('div', { class: 'solo-sense-mini' }, h('b', { class: 'display' }, String(s.n)), senseIcon(s.id, 30), h('span', null, s.title)))),
      h('div', { class: 'row center enter-3' },
        ui.btn('Zurück', () => done('back'), { variant: 'ghost', icon: 'left' }),
        ui.btn('Los geht’s', () => done('go'), { variant: 'good', big: true, iconRight: 'right', id: 'sinne-go' })),
    ], { center: true });
    return ctx.waitFor(p);
  }

  async function sinneStep(ctx, idx) {
    const { h, ui, util } = ctx;
    const S = SENSES[idx];
    const ex = util.shuffle(S.ex).slice(0, 2);
    let done;
    const p = new Promise((res) => { done = res; });
    const nextBtn = ui.btn(idx < SENSES.length - 1 ? 'Weiter' : 'Fertig', () => done('next'), { variant: 'good', iconRight: 'right', id: 'sinne-next' });
    let on = 0;
    const dots = h('div', { class: 'solo-dots', role: 'group', 'aria-label': 'Gefundene Dinge' }, Array.from({ length: S.n }, (_, i) => {
      const d = h('button', { type: 'button', class: 'solo-dot', 'aria-pressed': 'false', 'aria-label': 'Ding ' + (i + 1) }, h('span', null, String(i + 1)));
      d.addEventListener('click', () => {
        const now = !d.classList.contains('on');
        d.classList.toggle('on', now);
        d.setAttribute('aria-pressed', String(now));
        on += now ? 1 : -1;
        CREW.sound.play(now ? 'tap' : 'soft');
        if (on === S.n) { CREW.sound.play('good'); nextBtn.classList.add('solo-ready'); } else nextBtn.classList.remove('solo-ready');
      });
      return d;
    }));
    const speak = S.task + ' Zum Beispiel: ' + ex.join(' oder ') + '.' + (S.note ? ' ' + S.note : '');
    scr(ctx, [
      h('div', { class: 'solo-sense-track' }, SENSES.map((s, i) =>
        h('span', { class: 'solo-sense-pip' + (i < idx ? ' done' : '') + (i === idx ? ' now' : '') }, senseIcon(s.id, 20), h('b', null, String(s.n))))),
      h('div', { class: 'solo-sense-card enter', 'data-sense': S.id },
        h('div', { class: 'solo-sense-big' },
          h('span', { class: 'display solo-sense-num' }, String(S.n)),
          h('span', { class: 'solo-sense-icon' }, senseIcon(S.id, 48))),
        h('div', { class: 'stack solo-sense-text' },
          h('div', { class: 'row between' }, h('span', { class: 'eyebrow' }, S.title), ui.speakBtn(speak)),
          h('p', { class: 'solo-sense-task' }, S.task),
          h('p', { class: 'muted' }, 'Zum Beispiel: ' + ex.join(' oder ') + '.'),
          S.note ? h('p', { class: 'muted small' }, S.note) : null)),
      h('div', { class: 'stack enter-2', style: { alignItems: 'center', gap: '10px' } },
        dots,
        h('p', { class: 'muted small', style: { textAlign: 'center' } }, 'Tippe für jedes Ding auf eine Zahl. Nur im Kopf, nichts aufschreiben.')),
      h('div', { class: 'row between enter-3' },
        ui.btn('Abbrechen', () => done('quit'), { variant: 'ghost', small: true, icon: 'x' }),
        nextBtn),
    ]);
    const r = await ctx.waitFor(p);
    return r === ctx.SKIP ? 'skip' : r;
  }

  async function sinne(ctx) {
    for (;;) {
      const i0 = await sinneIntro(ctx);
      if (i0 !== 'go') return;
      for (let i = 0; i < SENSES.length; i++) {
        const r = await sinneStep(ctx, i);
        // X-Karte beendet die Übung (so steht es auch im Menü)
        if (r === 'quit' || r === 'skip') return;
      }
      const o = await outro(ctx, { title: 'Du bist hier. Jetzt.', text: 'Dein Kopf hat gerade Pause gemacht. Das geht überall: im Bus, vor einer Prüfung, beim Warten.' });
      if (o !== 'again') return;
    }
  }

  /* =========================================================
     Registrierung
     ========================================================= */
  CREW.registerSolo({
    id: 'chill',
    title: 'Chill-Zone',
    desc: 'Atem-Welle, Glitzerglas und Sinne-Übung. Runterkommen ohne Punkte.',
    icon: 'leaf',
    themes: ['Stressbewältigung', 'Achtsamkeit', 'Selbstregulation'],
    eldib: [
      { code: 'V-21', text: 'behält auch in unruhigen Momenten die Kontrolle über Körper und Worte' },
      { code: 'V-25', text: 'setzt eine passende Alternative ein, statt auszurasten' },
      { code: 'V-24', text: 'lässt sich kontrolliert auf etwas Neues ein' },
      { code: 'K-26', text: 'kann sagen, wie es ihm/ihr gerade geht' },
    ],
    async run(ctx) {
      for (;;) {
        const pick = await menu(ctx);
        if (pick === 'back' || pick === ctx.SKIP) return;
        if (pick === 'welle') await atemWelle(ctx);
        else if (pick === 'glas') await glitzerglas(ctx);
        else if (pick === 'sinne') await sinne(ctx);
      }
    },
  });
})();

/* ---- solo/solo-decoder.js ---- */
/* Solo: „Gefühls-Decoder“ – Trainingsspiel zum Gefühle-Lesen, alleine am iPad.
   Idee aus den ISA-Materialien (Gefühle erkennen, „Alles eine Frage der Perspektive“):
   10 kurze Szenen. Welches Gefühl? Wie stark? Danach immer: warum (Körper, Worte, Situation).
   Punkte und Rekord nur für die Person selbst, ohne Namen, ohne Rangliste. */
(function () {
  const CREW = window.CREW;
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  // Bildschirm aufbauen und als Solo-Bildschirm markieren (für modul-eigenes CSS)
  function scr(ctx, kids, opts) { const w = ctx.screen(kids, opts); w.classList.add('solo-screen'); return w; }
  const SCENES = 10;

  /* ---------- Gefühls-Wörter ----------
     Jedes Wort gehört zu einem der 8 Grundgefühle der Antwort-Karte (Familie)
     oder ist eine Mischung. So lernt man genauere Wörter dazu. */
  const BASE = {
    Wut: '#ff5a4f', Angst: '#a98bff', Trauer: '#4aa3ff', Freude: '#ffc93c',
    Scham: '#ff8fc0', Stolz: '#ff9a3c', Ekel: '#8bdc5a', 'Überraschung': '#2ee6c5',
  };
  const WORDS = {

  function h0(tag, props, ...kids) { return CREW.util.h(tag, props, ...kids); }

  /* Stärke-Anzeige: drei Balken */
  function meter(level, cls) {
    return h0('span', { class: 'solo-meter' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
      [1, 2, 3].map((n) => h0('i', { class: n <= level ? 'on' : '' })));

  /* Buchstaben-Scramble beim Decodieren */
  function scramble(el, word, ms) {
    if (reduced()) { el.textContent = word; return; }
    const chars = 'ABCDEFGHKLMNOPRSTUVWXZ0123456789#%';
    const t0 = performance.now();
    (function f(now) {
      if (!document.body.contains(el)) return;
      const k = Math.min(1, (now - t0) / ms);
      const n = Math.floor(k * word.length);
      el.textContent = word.slice(0, n) + Array.from(word.slice(n)).map((c) => (c === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)])).join('');
      if (k < 1) requestAnimationFrame(f); else el.textContent = word;
    })(t0);
  }

  /* ---------- Eine Szene: Gefühl wählen, dann Stärke ---------- */
  async function scene(ctx, sc, i, total, run) {
    const { h, ui } = ctx;
    const opts = ctx.util.shuffle(sc.options);
    const shown = (el) => el && el.style.display !== 'none';
    const speakText = () => sc.text + (shown(sayEl) ? ' ' + sc.who + ' sagt: ' + sc.say : '') + (shown(bodyEl) ? ' ' + sc.body : '') + ' Was fühlt ' + sc.who + ' wohl?';
    const q = h('h3', { class: 'solo-dec-q' }, 'Was fühlt ' + sc.who + ' wohl am ehesten?');
    const area = h('div', { class: 'solo-dec-answers' });
    // Clue-Reveal: erst nur die Situation (3 Punkte). „Mehr Hinweise“ zeigt Worte (2) und Körper (1).
    const sayEl = sc.say ? h('div', { class: 'solo-dec-quote', style: { display: 'none' } }, '„' + sc.say + '“') : null;
    const bodyEl = sc.body ? h('div', { class: 'solo-dec-line body', style: { display: 'none' } }, h('span', { class: 'solo-dec-tag', html: BODY }), h('p', null, sc.body)) : null;
    const clues = [sayEl, bodyEl].filter(Boolean);
    let stage = 0;
    const moreLabel = () => 'Mehr Hinweise (dann max. ' + (3 - stage - 1) + ' Punkte)';
    const moreBtn = clues.length ? ctx.ui.btn(moreLabel(), () => {
      const el = clues[stage];
      if (!el) return;
      el.style.display = '';
      el.classList.add('pop');
      stage++;
      if (stage >= clues.length) moreBtn.remove(); else moreBtn.querySelector('span:last-child').textContent = moreLabel();
    }, { variant: 'ghost', small: true, icon: 'eye', id: 'dec-more' }) : null;
    const moreRow = moreBtn ? h('div', { class: 'row' }, moreBtn) : null;
    scr(ctx, [
      hud(ctx, run, i, total),
      h('div', { class: 'solo-dec-scene enter', 'data-scene': sc.id },
        h('div', { class: 'solo-dec-ava' },
          h('div', { class: 'solo-dec-ava-img', html: avatarSvg(sc.who) }, h('span', { class: 'solo-scanline' }), h('span', { class: 'solo-brackets' })),
          h('div', { class: 'row center', style: { gap: '8px' } }, h('span', { class: 'solo-dec-name' }, sc.who), ui.speakBtn(speakText))),
        h('div', { class: 'solo-dec-body' },
          h('div', { class: 'solo-dec-line sit' }, h('span', { class: 'solo-dec-tag', html: PIN }), h('p', null, sc.text)),
          sayEl, bodyEl)),
      h('div', { class: 'stack enter-2', style: { gap: '12px' } }, q, area, moreRow),
    ]);

    // 1) Gefühl
    const pick = await ctx.waitFor(new Promise((res) => {
      opts.forEach((w) => {
        const b = h('button', { type: 'button', class: 'btn ghost solo-opt', 'data-word': w },
          h('span', { class: 'solo-dot-emo', style: dotStyle(w) }), h('span', null, w));

        area.appendChild(b);

    }));
    if (pick === ctx.SKIP) return { skipped: true };
    // Nach der Wahl alle Hinweise zeigen (für die Stärke)
    clues.forEach((el) => { el.style.display = ''; });
    if (moreRow) moreRow.remove();

    // 2) Stärke
    await ctx.sleep(180);
    q.textContent = 'Und wie stark ist das bei ' + sc.who + '?';
    CREW.util.clear(area);
    area.classList.add('lv');
    area.appendChild(h('div', { class: 'solo-dec-chosen' }, h('span', { class: 'muted small' }, 'Dein Tipp:'), h('span', { class: 'chip sel solo-chip-static' }, h('span', { class: 'solo-dot-emo', style: dotStyle(pick) }), pick)));
    const level = await ctx.waitFor(new Promise((res) => {
      const row = h('div', { class: 'solo-lv-row' });

        const b = h('button', { type: 'button', class: 'btn ghost solo-lv', 'data-level': n }, meter(n), h('span', null, LEVELS[n][0].toUpperCase() + LEVELS[n].slice(1)));
        b.addEventListener('click', () => { CREW.sound.play('tap'); row.querySelectorAll('button').forEach((x) => { x.disabled = true; }); b.classList.add('sel'); res(n); });
        row.appendChild(b);
      });
      area.appendChild(row);
    }));
    if (level === ctx.SKIP) return { skipped: true };
    return { pick, level, stage };
  }

  /* ---------- Auflösung ---------- */
  async function reveal(ctx, sc, res, i, total, run) {
    const { h, ui } = ctx;
    const right = res.pick === sc.answer;
    const also = !right && (sc.also || []).includes(res.pick);
    const diff = Math.abs(res.level - sc.intensity);
    const ptsFeel = right ? 3 - (res.stage || 0) : also ? 1 : 0;
    const ptsLv = diff === 0 ? 1 : 0;
    const pts = ptsFeel + ptsLv;
    run.score += pts;
    run.played++;
    if (right || also) { run.found++; run.streak++; } else run.streak = 0;
    if (ptsLv) run.exact++;
    run.maxStreak = Math.max(run.maxStreak, run.streak);
    // Welche Hinweise haben geholfen? (für die Bilanz)
    (sc.signs || []).forEach((s) => { run.signs[s] = (run.signs[s] || 0) + 1; });

    const word = h('div', { class: 'display solo-dec-word', style: { color: colorOf(sc.answer) } }, sc.answer);
    const fbTitle = right ? 'Richtig gelesen!' : also ? 'Auch drin!' : 'Andere Spur';
    const fbText = right ? 'Die Hinweise passen genau.'
      : also ? res.pick + ' steckt auch mit drin. Am stärksten ist aber ' + sc.answer + '.'
        : 'Die Hinweise zeigen eher auf ' + sc.answer + '.';
    const lvText = diff === 0 ? 'Stärke genau getroffen: ' + LEVELS[sc.intensity] + '.'
      : diff === 1 ? 'Stärke knapp daneben. Eher ' + LEVELS[sc.intensity] + '.'
        : 'Stärke: eher ' + LEVELS[sc.intensity] + '.';
    const last = i >= total - 1;
    const wrap = scr(ctx, [
      hud(ctx, run, i, total, 'Auflösung'),
      h('div', { class: 'solo-dec-reveal' },
        h('div', { class: 'solo-dec-result enter', 'data-result': right ? 'right' : also ? 'also' : 'other' },
          h('div', { class: 'row', style: { gap: '10px', flexWrap: 'nowrap' } },
            h('div', { class: 'solo-dec-mini', html: avatarSvg(sc.who) }),
            h('span', { class: 'muted solo-dec-recap' }, sc.say ? '„' + sc.say + '“' : sc.who)),
          h('span', { class: 'eyebrow' }, 'Decodiert'),
          word,
          h('div', { class: 'row', style: { gap: '10px' } }, meter(sc.intensity, 'big'), h('b', null, LEVELS[sc.intensity])),
          h('p', { class: 'muted small' }, familyText(sc.answer))),
        h('div', { class: 'stack solo-dec-side' },
          h('div', { class: 'solo-dec-fb enter-2 ' + (right ? 'right' : also ? 'also' : 'other') },
            h('div', { class: 'row between', style: { flexWrap: 'nowrap' } },
              h('h3', null, fbTitle),
              h('span', { class: 'pill solo-pts pop' + (pts ? ' good' : '') }, '+' + pts)),
            h('p', null, fbText),
            h('p', { class: 'muted' }, lvText),
            h('div', { class: 'solo-dec-yours' },
              h('span', { class: 'muted small' }, 'Dein Tipp:'),
              h('span', { class: 'solo-dot-emo', style: dotStyle(res.pick) }),
              h('b', null, res.pick),
              meter(res.level),
              h('span', { class: 'muted small' }, LEVELS[res.level]))),
          h('div', { class: 'card stack solo-dec-why enter-3' },
            h('div', { class: 'row between' }, h('b', null, 'Warum?'),
              h('div', { class: 'row', style: { gap: '6px' } }, Object.entries(SIGNS).map(([k, s]) =>
                h('span', { class: 'solo-sign' + ((sc.signs || []).includes(k) ? ' on' : ''), title: s.label }, s.icon(), h('span', null, s.label))))),
            h('p', { class: 'solo-dec-clue' }, sc.clue)))),
    ]);
    scramble(word, sc.answer, 650);
    CREW.sound.play('reveal');
    // Serie feiern
    const s = run.streak;
    if ((right || also) && [3, 5, 7, 10].includes(s)) {
      const msg = { 3: '3er-Serie! Du hast den Blick.', 5: '5er-Serie! Echter Gefühls-Profi.', 7: '7er-Serie! Stark.', 10: 'Alle 10! Perfekter Scan.' }[s];
      setTimeout(() => { CREW.sound.play('great'); ui.toast(msg, 2600); if (s >= 5) ui.confetti(s >= 10 ? 180 : 90); }, 500);
    } else {
      setTimeout(() => CREW.sound.play(right || also ? 'good' : 'soft'), 450);
    }
    const r = await ctx.waitFor(ui.choice(wrap, [{ label: last ? 'Zur Bilanz' : 'Nächste Szene', value: 'next', iconRight: 'right', id: 'dec-next' }], { align: 'end' }));

  /* ---------- Bilanz ---------- */
  async function summary(ctx, run, total) {

      return r0 === ctx.SKIP ? 'done' : r0;
    }
    const b = ctx.best('score', run.score);
    ctx.best('serie', run.maxStreak);
    const ratio = run.score / (run.played * 4);
    const praise = ratio >= 0.8 ? 'Du liest Menschen richtig gut.'
      : ratio >= 0.55 ? 'Starker Blick für Gefühle.'
        : ratio >= 0.3 ? 'Gute Spur! Jede Runde schärft den Blick.'
          : 'Gefühle lesen ist schwer. Genau das trainierst du gerade.';
    const topSign = Object.entries(run.signs).sort((a, c) => c[1] - a[1])[0];
    const num = h('span', { class: 'display solo-dec-big' }, '0');
    const wrap = scr(ctx, [
      h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center', gap: '8px' } },

      h('div', { class: 'row center' }, b.isNew
        ? h('span', { class: 'pill good pop', id: 'dec-newrecord' }, CREW.icon('trophy', 18), 'Neuer Rekord!')
        : h('span', { class: 'pill', id: 'dec-record' }, CREW.icon('trophy', 18), 'Dein Rekord: ' + b.best)),
      h('div', { class: 'solo-dec-tiles' },
        h('div', { class: 'card solo-dec-tile' }, h('b', { class: 'display' }, run.found + '/' + run.played), h('span', { class: 'muted small' }, 'Gefühle erkannt')),
        h('div', { class: 'card solo-dec-tile' }, h('b', { class: 'display' }, String(run.exact)), h('span', { class: 'muted small' }, 'Stärke genau')),

      h('div', { class: 'card soft row solo-dec-tip', style: { flexWrap: 'nowrap' } }, CREW.icon('chat', 26),
        h('p', null, (topSign ? 'Oft half der Blick auf: ' + SIGNS[topSign[0]].label + '. ' : '') + 'Im echten Leben kannst du auch einfach fragen: „Alles okay?“')),
      h('p', { class: 'muted small', style: { textAlign: 'center' } }, 'Punkte und Rekord sieht nur dieses Gerät. Ohne Namen.'),
    ], { center: true, narrow: true });
    CREW.sound.play(b.isNew ? 'great' : 'good');
    if (b.isNew) ui.confetti(120);
    ui.countUp(num, 0, run.score, 900);
    const r = await ctx.waitFor(ui.choice(wrap, [
      { label: 'Nochmal', value: 'again', variant: 'ghost', icon: 'undo', id: 'dec-again' },
      { label: 'Fertig', value: 'done', icon: 'check', id: 'dec-done' },
    ]));
    return r === ctx.SKIP ? 'done' : r;
  }

  /* =========================================================
     Registrierung
     ========================================================= */
  CREW.registerSolo({
    id: 'decoder',
    title: 'Gefühls-Decoder',
    desc: 'Kurze Szenen: Welches Gefühl steckt dahinter? Und wie stark?',
    icon: 'eye',
    themes: ['Gefühle erkennen', 'Fremdwahrnehmung', 'Empathie'],
    eldib: [
      { code: 'K-21', text: 'erkennt Gefühle bei anderen' },
      { code: 'KOG-38', text: 'erklärt, warum sich jemand so verhält (Ursache – Wirkung)' },
      { code: 'K-29', text: 'beschreibt Zusammenhänge zwischen Situation, Verhalten und Gefühl' },
      { code: 'SOZ-37', text: 'versteht die Lage und Gefühle anderer und respektiert sie' },
    ],
    async run(ctx) {
      const first = await intro(ctx);
      if (first === 'back') return;
      for (;;) {
        const cards = ctx.pick('decoder', SCENES);
        const total = cards.length;
        const run = { score: 0, streak: 0, maxStreak: 0, played: 0, found: 0, exact: 0, signs: {} };
        for (let i = 0; i < total; i++) {
          const res = await scene(ctx, cards[i], i, total, run);
          if (res.skipped) continue; // X-Karte: Szene auslassen, ohne Folgen
          const r = await reveal(ctx, cards[i], res, i, total, run);
          if (r === ctx.SKIP) continue;
        }
        const end = await summary(ctx, run, total);
        if (end !== 'again') return;
      }
    },
  });
})();

(function () {

  /* Raum in Zentralperspektive: Fluchtpunkt (VX|VY), Rückwand WX0..WX1 / WY0..WY1 */

    5: [366, 330, 160, 305], 6: [850, 380, 170, 258], 7: [44, 420, 262, 392], 8: [1316, 400, 240, 416],
    9: [908, 640, 372, 230], 10: [744, 96, 112, 124], 11: [248, 740, 356, 152], 12: [708, 112, 632, 500],

  const pts = (arr) => arr.map((p) => p[0] + ',' + p[1]).join(' ');

  // Kleiner Zufall mit festem Startwert: jedes Mal gleiches Bild
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* Crew-Namen für die Graffiti-Wand in 1–3 Zeilen teilen.
     Gewählt wird die Aufteilung mit der größten Schrift. Nur wenn ein Wort
     viel zu lang ist, wird es in der Mitte mit Bindestrich getrennt. */
  const MUR_W = 390, MUR_H = 250, CHAR = 0.62, FS_MIN = 52;

  const fontFor = (lines) => Math.min(FS_MAX[lines.length - 1], (MUR_W * 0.95) / (Math.max.apply(null, lines.map((x) => x.length)) * CHAR), MUR_H / (lines.length * 0.95 + 0.25));
  function bestSplit(words) {
    let best = null;
    const tryIt = (lines) => { const fs = fontFor(lines); if (!best || fs > best.fs + 0.5) best = { lines, fs }; };
    const W = words.length;
    tryIt([joinWords(words)]);
    for (let i = 1; i < W; i++) {
      tryIt([joinWords(words.slice(0, i)), joinWords(words.slice(i))]);
      for (let j = i + 1; j < W; j++) tryIt([joinWords(words.slice(0, i)), joinWords(words.slice(i, j)), joinWords(words.slice(j))]);
    }
    return best;
  }
  function nameLayout(name) {
    const words = String(name || '').replace(SHY, '').trim().toUpperCase().split(/\s+/).filter(Boolean);
    if (!words.length) words.push('CREW');
    let best = bestSplit(words);
    if (best.fs < FS_MIN * 0.83) {
      const cut = [];
      words.forEach((w) => { if (w.length > 12) { const k = Math.ceil(w.length / 2); cut.push(w.slice(0, k) + SHY, w.slice(k)); } else cut.push(w); });
      const b2 = bestSplit(cut);

    /* ---------- Level 7: Arcade-Automat ---------- */
    if (has(7)) {

      // Mini-Spiel auf dem Bildschirm

      ar += rect(140, 600, 12, 6, 'hq-ship') + rect(144, 596, 4, 4, 'hq-ship');

      // Steuerpult
      ar += poly([[58, 640], [234, 640], [246, 664], [46, 664]], 'hq-f2 hq-o') + rect(46, 664, 200, 20, 'hq-f2 hq-o', 3) + rect(46, 672, 200, 12, 'hq-dk', 0);
      ar += line(98, 654, 94, 628, 'hq-stick') + circ(94, 626, 9, 'hq-cp hq-o1');
      ar += ell(148, 656, 9, 5, 'hq-cy hq-o1') + ell(174, 650, 9, 5, 'hq-cg hq-o1') + ell(200, 656, 9, 5, 'hq-cp hq-o1');
      ar += rect(112, 714, 68, 66, 'hq-bezel hq-o1', 5) + rect(126, 732, 10, 22, 'hq-coin') + rect(156, 732, 10, 22, 'hq-coin');

    }

    /* ---------- Level 9: Tischkicker ---------- */
    if (has(9)) {
      let ki = shadow(1112, 866, 190, 14);

      const tFL = [950, 732], tFR = [1270, 732], tBL = toward(950, 732, 0.2), tBR = toward(1270, 732, 0.2);
      ki += poly([tFL, tBL, toward(950, 790, 0.2), [950, 790]], 'hq-f hq-o') + poly([tFL, tBL, toward(950, 790, 0.2), [950, 790]], 'hq-dk');
      ki += poly([tFL, tFR, tBR, tBL], 'hq-f hq-o');
      // Spielfeld
      const iFL = [966, 726], iFR = [1254, 726], iBL = toward(966, 726, 0.17), iBR = toward(1254, 726, 0.17);

      const mF = [(iFL[0] + iFR[0]) / 2, 726], mB = [(iBL[0] + iBR[0]) / 2, iBL[1]];

      ki += rect(958, 790, 18, 74, 'hq-leg hq-o1') + rect(1244, 790, 18, 74, 'hq-leg hq-o1') + rect(976, 836, 268, 8, 'hq-leg');

    /* ---------- Level 8: Kühlschrank mit Snacks ---------- */

    ghost.forEach((n) => { if (!owns(n)) svg.querySelectorAll('.hq-i' + n).forEach((e) => e.classList.add('hq-ghost')); });

  }

    CREW.util.append(bar, [
      h('button', { type: 'button', class: 'crew-badge', style: { background: 'none', border: 0, color: 'inherit', padding: 0, cursor: 'pointer' }, onclick: () => goHome(), 'aria-label': 'Zum Start' },
        h('span', { class: 'logo', html: CREW.LOGO }),

      h('div', { class: 'energy-mini', title: 'Crew-Energie' },

        h('div', { class: 'bar' }, fill)),
      h('div', { class: 'spacer' }),

      run ? ui.iconBtn('pause', showPause, { label: 'Pause', id: 'btn-pause' }) : null,
      ui.iconBtn(S.settings.speech ? 'speaker' : 'speakerOff', () => { S.settings.speech = !S.settings.speech; CREW.save(); if (!S.settings.speech) CREW.stopSpeaking(); renderTopbar(); ui.toast(S.settings.speech ? 'Vorlesen an' : 'Vorlesen aus'); }, { label: 'Vorlesen an/aus', cls: S.settings.speech ? 'on' : '' }),
      ui.iconBtn('help', showHelp, { label: 'Hilfe', id: 'btn-help' }),
      ui.iconBtn('home', () => goHome(), { label: 'Start', id: 'btn-home' })]);
  }

  async function goHome(force) {
    if (run && !run.solo && !force) {
      const txt = run.phase === 'after'
        ? ['Zum Start?', 'Die Energie ist schon gespeichert.', 'Zum Start']
        : run.inMission
          ? ['Session beenden?', 'Die Mission wird abgebrochen. Energie aus dieser Runde gibt es dann nicht.', 'Beenden']
          : ['Session abbrechen?', 'Ihr seid noch vor der Mission.', 'Abbrechen'];
      const wasPaused = ui.isPaused();
      ui.setPaused(true);
      const ok = await ui.confirm(txt[0], txt[1], txt[2], 'Weiterspielen');
      if (!ok) { ui.setPaused(wasPaused); return; }
    }
    endRun();
    renderHome();
  }
  function endRun() {
    if (run) {
      run.token = -1;
      if (run.abort) run.abort();
      (run.cleanups || []).forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });

    if (!run) return;

      const w = run.skipWaiter;

      run.onX = null;
      ui.toast('Übersprungen. Alles gut.');

      run.pendingSkip = true;
      ui.toast('X-Karte: wird übersprungen.');

    ui.overlays().appendChild(ov);
  }

  /* Hilfe: immer erreichbar */
  function showHelp() {
    const nums = [
      ['Kanner- a Jugendtelefon', '116 111', 'anonym und kostenlos'],

    const body = h('div', { class: 'stack' },

  /* ---------- Missionen ---------- */

  /* Kontext, den jede Mission bekommt */
  function makeCtx(mission, crewSize) {
    const token = run.token;
    const alive = () => run && run.token === token;
    const ctx = {
      SKIP,
      mission,
      crewSize,
      teams: makeTeams(),
      h, ui, sound: CREW.sound, speak: CREW.speak, icon: CREW.icon, util: CREW.util,
      state: S,
      pick: (pool, n, filter) => CREW.pickContent(pool, n, filter),
      alive,
      // Bildschirm neu aufbauen (bricht ab, wenn die Session beendet wurde)
      screen(children, opts) {
        if (!alive()) throw new Abort();
        return ui.screen(children, opts);
      },
      // Auf eine Eingabe warten; X-Karte liefert ctx.SKIP
      waitFor(promise) {
        if (!alive()) return Promise.reject(new Abort());
        // X-Karte wurde während einer Animation gedrückt: diese Karte gleich überspringen
        if (run.pendingSkip) { run.pendingSkip = false; ui.toast('Übersprungen. Alles gut.'); return Promise.resolve(SKIP); }
        return new Promise((resolve, reject) => {
          run.skipWaiter = resolve;
          run.abort = () => reject(new Abort());
          Promise.resolve(promise).then((v) => {
            if (run && run.skipWaiter === resolve) run.skipWaiter = null;
            resolve(v);
          }, reject);
        });
      },
      // Warten, das bei Pause anhält und bei gedrückter X-Karte abkürzt
      async sleep(ms) {
        let left = ms;
        while (left > 0) {
          const step = Math.min(100, left);
          await sleep(step);
          if (!alive()) throw new Abort();
          if (run.pendingSkip) return;
          if (!ui.isPaused()) left -= step;
        }
      },
      // Sitzungs-Uhr: Die ganze Session soll in etwa 10 Minuten passen
      minutesLeft: () => (run && run.startedAt ? 10 - (Date.now() - run.startedAt) / 60000 : 10),
      // Vor jeder weiteren Runde fragen: Reicht die Zeit noch? (false = Mission beenden)
      roundGate(i, total) {
        if (i <= 0 || i === ctx._gateAt) return true; // gleiche Runde nochmal (z. B. nach X-Karte): kein neuer Check
        ctx._gateAt = i;
        if (ctx._lastRound || ctx.minutesLeft() < 3.5) { ui.toast('Zeit ist um. Stark gespielt!'); return false; }
        if (i === total - 1 || ctx.minutesLeft() < 5.5) { ctx._lastRound = true; ui.toast('Letzte Runde!'); }
        return true;
      },
      // Aufräumen (Animationen, Listener), wenn die Session endet oder abgebrochen wird
      onCleanup(fn) { if (run && run.token === token) (run.cleanups = run.cleanups || []).push(fn); },
      isPaused: () => ui.isPaused(),
    };
    return ctx;
  }

  /* ---------- Session-Ablauf ---------- */
  async function startSession(forcedMission) {
    endRun();
    run = { token: ++tokenCounter, skipWaiter: null, inMission: false, phase: 'setup', startedAt: Date.now() };

      // 1) Wer ist da?

      // 3) Mission wählen

      // 4) Mission spielen
      run.inMission = true;
      run.phase = 'mission';
      const ctx = makeCtx(mission, size);
      const result = (await mission.run(ctx)) || {};
      if (!run || !ctx.alive()) return;
      run.inMission = false;
      run.pendingSkip = false;
      // 5) Energie sofort sichern (auch wenn danach jemand auf „Start“ tippt)

      run.phase = 'after';
      // 6) Nachspielzeit

      // 7) Belohnung zeigen
      await finish(mission, result, gain);
    } catch (e) {
      if (e instanceof Abort) return;

  }

  /* Nachspielzeit: kurz, freiwillig */
  async function doDebrief(mission, ctx) {
    const t = guard();
    const qs = mission.debrief && mission.debrief.length ? mission.debrief : ['Was nehmt ihr aus der Runde mit?'];
    let q = pick(qs);
    const card = ui.say(q, { eyebrow: 'Nachspielzeit', speakText: () => q });
    const tm = ui.timer(90, { autostart: false });
    const wrap = ui.screen([
      card,
      h('div', { class: 'row between' },
        h('p', { class: 'muted', style: { maxWidth: '46ch' } }, 'Wer will, sagt was. Passen ist okay.'),
        h('div', { class: 'row' }, tm.el, ui.btn('Timer', () => tm.start(), { variant: 'ghost', small: true, icon: 'timer' }))),
    ]);

      if (r === 'done') break;
      const rest = qs.filter((x) => x !== q);
      q = rest.length ? pick(rest) : q;
      card.querySelector('.say').textContent = q;
      wrap.lastChild.remove();
    }
    tm.stop();
  }

  /* Energie sofort speichern, direkt nach der Mission */
  function commitResult(mission, result, checkin) {
    const base = Math.max(2, Math.min(12, Math.round(result.energy || 5)));
    const bonus = checkin && !checkin.skipped ? 2 : 0;
    const gained = base + bonus;
    const before = CREW.levelInfo(S.energy);
    ownedItems(before.level);
    S.energy += gained;
    S.history.push({ date: todayISO(), mission: mission.id, energy: gained });
    if (S.history.length > 400) S.history = S.history.slice(-400);
    // Crew-Rekord (nur Crew-Punkte, nie Einzelne)
    let record = null;
    if (typeof result.points === 'number') {
      S.records = S.records || {};
      const old = S.records[mission.id];
      record = { old, isNew: old == null || result.points > old };
      if (record.isNew) S.records[mission.id] = result.points;
    }
    CREW.save();
    return { gained, bonus, before, after: CREW.levelInfo(S.energy), record };
  }

  function nextMissionTeaser() {
    const ms = activeMissions();
    for (let i = 1; i <= 7; i++) {
      const d = (weekday() + i) % 7;
      const m = ms.find((x) => x.day === d);
      if (m) return (i === 1 ? 'Morgen: ' : WEEKDAYS[d] + ': ') + m.title + '. ' + (m.tagline || '');
    }
    return null;
  }

  async function finish(mission, result, gain) {
    const t = guard();
    const { gained, bonus, before, after, record } = gain;
    const alive = () => run && run.token === t;
    const num = h('span', { class: 'display', style: { fontSize: '4em', color: 'var(--yellow)' } }, '0');
    const bar = h('i', { style: { width: before.pct + '%' } });
    const pts = typeof result.points === 'number';
    const teaser = nextMissionTeaser();
    const wrap = ui.screen([
      h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } },
        h('span', { class: 'eyebrow' }, 'Mission geschafft'),
        h('h2', null, result.summary || 'Stark gespielt, Crew!'),
        pts ? h('div', { class: 'row center' }, h('span', { class: 'pill' }, result.points + ' Crew-Punkte'), h('span', { class: 'display' }, '→')) : null,
        h('div', { class: 'row center' }, CREW.icon('bolt', 54), num, h('span', { class: 'display', style: { fontSize: '1.6em' } }, 'Energie')),
        h('div', { class: 'row center' },
          bonus ? h('span', { class: 'pill good' }, '+' + bonus + ' Check-in-Bonus') : null,
          record && record.isNew && record.old != null ? h('span', { class: 'pill accent pop' }, 'Crew-Rekord: ' + record.old + ' → NEU: ' + result.points + '!') : null,
          record && !record.isNew ? h('span', { class: 'pill' }, 'Crew-Rekord: ' + record.old + (record.old - result.points <= 3 ? ' · noch ' + (record.old - result.points + 1) + ' bis zum Rekord' : '')) : null),
        (result.stats || []).length ? h('div', { class: 'row center' }, result.stats.map(([n, l]) => h('span', { class: 'pill' }, h('b', null, String(n)), ' ' + l))) : null,
        result.note || null),
      h('div', { class: 'card stack' },
        h('div', { class: 'row between' }, h('b', null, after.level ? 'Crew-HQ Level ' + after.level : 'Crew-HQ · Rohbau'), h('span', { class: 'muted' }, after.max ? 'Maximal ausgebaut' : 'noch ' + after.toNext + ' bis zum nächsten Teil')),
        h('div', { class: 'progress' }, bar),
        weekPips(),
        teaser ? h('p', { class: 'muted small' }, teaser) : null),
    ], { center: true, narrow: true });
    CREW.sound.play('good');
    await ui.countUp(num, 0, gained, 900);
    if (!alive()) return;
    renderTopbar();
    if (record && record.isNew && record.old != null) { CREW.sound.play('great'); ui.confetti(120); }
    requestAnimationFrame(() => { bar.style.width = (after.level > before.level ? 100 : after.pct) + '%'; });
    await sleep(1100);
    if (!alive()) return;
    for (let lv = before.level + 1; lv <= after.level; lv++) {
      await showUnlock(lv);
      if (!alive()) return;
    }
    const r = await run_wait(ui.choice(wrap, [{ label: 'Crew-HQ ansehen', value: 'base', variant: 'ghost', icon: 'base' }, { label: 'Bis morgen!', value: 'home', iconRight: 'home' }]), t);
    endRun();
    if (r === 'base') renderBase(after.level > before.level ? S.hq.owned[S.hq.owned.length - 1] : null); else renderHome();
  }

  async function startSolo(g) {
    endRun();
    run = { token: ++tokenCounter, skipWaiter: null, inMission: false, solo: true };
    renderTopbar();
    const ctx = makeCtx(g, 1);
    ctx.solo = true;
    ctx.best = (key, value, higherIsBetter) => {
      const k = g.id + ':' + key;
      const cur = S.solo[k];
      const better = cur == null || (higherIsBetter === false ? value < cur : value > cur);
      if (better) { S.solo[k] = value; CREW.save(); }
      return { best: better ? value : cur, isNew: better };
    };
    try {
      await g.run(ctx);
    } catch (e) {
      if (e instanceof Abort) return;
      console.error(e);
    }
    if (!ctx.alive()) return;
    endRun();
    renderSoloHub();
  }

  /* ---------- Lehrermodus ---------- */
  // Falsche PIN: nach 3 Versuchen 30 Sekunden Sperre (gilt bis zum Neuladen der Seite)
  const gate = { fails: 0, lockedUntil: 0 };
  function renderTeacherGate() {
    endRun();
    let code = '';
    const dots = h('div', { class: 'display', style: { fontSize: '2.6em', letterSpacing: '0.3em', minHeight: '1.2em' } }, '');
    const msg = h('p', { class: 'muted', 'aria-live': 'polite' }, 'PIN eingeben.');
    const pad = h('div', { class: 'valuepad', style: { maxWidth: '360px', gridTemplateColumns: 'repeat(3, 1fr)' } });
    const locked = () => Date.now() < gate.lockedUntil;
    const press = (d) => {
      if (locked()) { msg.textContent = 'Gesperrt. Noch ' + Math.ceil((gate.lockedUntil - Date.now()) / 1000) + ' Sekunden.'; return; }
      if (d === 'del') code = code.slice(0, -1); else if (code.length < 8) code += d;
      dots.textContent = '•'.repeat(code.length);
      if (code === String(S.settings.pin)) {
        gate.fails = 0;
        CREW.sound.play('good');
        if (String(S.settings.pin) === '1234') forceNewPin(); else renderTeacher('missionen');
      } else if (code.length >= String(S.settings.pin).length && code.length >= 4) {
        gate.fails++;
        if (gate.fails >= 3) { gate.fails = 0; gate.lockedUntil = Date.now() + 30000; msg.textContent = 'Zu oft falsch. 30 Sekunden warten.'; }
        dots.classList.add('shake'); CREW.sound.play('soft');
        setTimeout(() => { code = ''; dots.textContent = ''; dots.classList.remove('shake'); }, 450);
      }
    };
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0'].forEach((d) => pad.appendChild(ui.btn(d === 'del' ? null : d, () => press(d), { variant: 'ghost', icon: d === 'del' ? 'left' : null, aria: d === 'del' ? 'Löschen' : d })));
    ui.screen([
      h('div', { class: 'stack', style: { alignItems: 'center' } }, CREW.icon('lock', 48), h('h2', null, 'Lehrermodus'), msg, dots, pad),
    ], { center: true });
  }
  // Mit der Start-PIN geht es erst weiter, wenn eine eigene PIN gesetzt ist
  async function forceNewPin() {
    const inp = h('input', { type: 'password', id: 't-newpin', inputmode: 'numeric', maxlength: '8', placeholder: 'Neue PIN (4–8 Ziffern)' });
    const err = h('p', { class: 'muted small', 'aria-live': 'polite' }, 'Die Start-PIN kennen zu viele. Bitte jetzt eine eigene wählen.');
    for (;;) {
      const ok = await ui.modal({ title: 'Eigene PIN festlegen', body: h('div', { class: 'stack' }, err, inp), actions: [{ label: 'Abbrechen', value: false, variant: 'ghost' }, { label: 'PIN speichern', value: true, icon: 'check' }], dismissable: false });
      if (!ok) { renderHome(); return; }
      const v = inp.value.trim();
      if (/^\d{4,8}$/.test(v) && v !== '1234') { S.settings.pin = v; CREW.save(); ui.toast('Neue PIN gespeichert.'); renderTeacher('missionen'); return; }
      err.textContent = 'Bitte 4 bis 8 Ziffern, nicht 1234.';
    }
  }

      h('h3', null, 'Solo-Spiele (alleine auf dem iPad)'),
      h('div', { class: 'list' }, CREW.soloGames.map((g) => h('div', { class: 'li', style: { flexDirection: 'column', alignItems: 'stretch' } },
        h('div', { class: 'row between' }, h('b', null, g.title), ui.btn('Ausprobieren', () => startSolo(g), { small: true, icon: 'play' })),
        g.desc ? h('p', { class: 'small muted' }, g.desc) : null,
        g.themes ? h('div', { class: 'row' }, g.themes.map((x) => h('span', { class: 'pill' }, x))) : null,
        g.eldib && g.eldib.length ? h('div', { class: 'small muted' }, h('b', null, 'ELDiB-Bezug (Vorschlag): '), g.eldib.map((e) => e.code + ' ' + e.text).join(' · ')) : null))));
  }

  function teacherContent() {
    const pools = Object.entries(CREW.content).filter(([, v]) => Array.isArray(v));
    const sens = ui.btn(S.settings.sensitive ? 'Heikle Karten: AN' : 'Heikle Karten: AUS', () => { S.settings.sensitive = !S.settings.sensitive; CREW.save(); renderTeacher('inhalte'); }, { variant: S.settings.sensitive ? 'yellow' : 'ghost' });
    return h('div', { class: 'stack' },
      h('div', { class: 'card stack' },
        h('div', { class: 'switch' }, h('div', null, h('h3', null, 'Heikle Karten'), h('p', { class: 'muted small' }, 'Karten zu Familie, Geld, Körper, Verlust und ähnlichen Themen sind markiert und standardmäßig aus. Nur einschalten, wenn die Gruppe stabil ist.')), sens)),
      h('div', { class: 'card stack' }, h('h3', null, 'Kartenstapel'),
        h('div', { class: 'list' }, pools.map(([k, v]) => h('div', { class: 'li' }, h('b', null, k), h('span', { class: 'muted' }, v.length + ' Karten · ' + v.filter((x) => x.heikel).length + ' heikel · ' + (S.used[k] || []).length + ' schon gespielt')))),
        ui.btn('Gespielte Karten zurücksetzen', () => { S.used = {}; CREW.save(); ui.toast('Alle Karten wieder frisch.'); renderTeacher('inhalte'); }, { variant: 'ghost', small: true, icon: 'undo' })));
  }

  function teacherSettings() {
    const lookRow = h('div', { class: 'row' }, LOOKS.map((L) => ui.btn(L.label, () => { S.crew.look = L.id; CREW.save(); applyLook(); renderTeacher('einstellungen'); }, { variant: S.crew.look === L.id ? 'yellow' : 'ghost', small: true })));
    const nameIn = h('input', { type: 'text', id: 't-crewname', maxlength: '24', value: S.crew.name });
    const pinIn = h('input', { type: 'password', id: 't-pin', inputmode: 'numeric', maxlength: '8', placeholder: 'Neue PIN (4–8 Ziffern)' });
    return h('div', { class: 'stack' },
      h('div', { class: 'card stack' }, h('h3', null, 'Look'), lookRow),
      h('div', { class: 'card stack' }, h('h3', null, 'Crew-Name'), nameIn, h('div', { class: 'row end' }, ui.btn('Speichern', () => { const v = nameIn.value.trim().slice(0, 24); if (v) { S.crew.name = v; CREW.save(); renderTopbar(); ui.toast('Gespeichert.'); } }, { small: true }))),
      h('div', { class: 'card stack' }, h('h3', null, 'Ton & Vorlesen'),
        h('div', { class: 'row' },
          ui.btn(S.settings.sound ? 'Töne: AN' : 'Töne: AUS', () => { S.settings.sound = !S.settings.sound; CREW.save(); renderTeacher('einstellungen'); }, { variant: S.settings.sound ? 'good' : 'ghost', small: true }),
          ui.btn(S.settings.speech ? 'Vorlesen: AN' : 'Vorlesen: AUS', () => { S.settings.speech = !S.settings.speech; CREW.save(); renderTopbar(); renderTeacher('einstellungen'); }, { variant: S.settings.speech ? 'good' : 'ghost', small: true }),
          ui.btn('Vorlesen testen', () => CREW.speak('Moien Crew! So klingt die Vorlesestimme.'), { variant: 'ghost', small: true, icon: 'speaker' }))),
      h('div', { class: 'card stack' }, h('h3', null, 'PIN ändern'), pinIn, h('div', { class: 'row end' }, ui.btn('PIN speichern', () => { const v = pinIn.value.trim(); if (!/^\d{4,8}$/.test(v)) { ui.toast('Bitte 4 bis 8 Ziffern.'); return; } S.settings.pin = v; CREW.save(); pinIn.value = ''; ui.toast('Neue PIN gespeichert.'); }, { small: true }))));
  }

  function teacherProgress() {
    const li = CREW.levelInfo(S.energy);
    const last = S.history.slice(-12).reverse();
    const codeBox = h('textarea', { id: 't-export', readonly: true }, CREW.exportCode());
    const importBox = h('textarea', { id: 't-import', placeholder: 'Sicherungscode hier einfügen …' });
    const copy = () => {
      const txt = codeBox.value;
      const fallback = () => { codeBox.focus(); codeBox.select(); ui.toast('Code markiert. Jetzt kopieren.'); };
      try { navigator.clipboard.writeText(txt).then(() => ui.toast('Code kopiert.'), fallback); } catch (e) { fallback(); }
    };
    const download = () => {
      try {
        const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
        const a = h('a', { href: URL.createObjectURL(blob), download: 'crew-spielstand-' + todayISO() + '.json' });
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { ui.toast('Download geht hier nicht. Bitte Code kopieren.'); }
    };
    return h('div', { class: 'stack' },
      h('div', { class: 'card stack' },
        h('div', { class: 'row between' }, h('h3', null, 'Crew-Energie'), h('span', { class: 'display', style: { fontSize: '1.6em' } }, S.energy + ' · Level ' + li.level)),
        h('p', { class: 'muted small' }, 'Gespeichert wird nur: Crew-Name, Look, Energie, gespielte Missionen mit Datum und welche Karten schon dran waren. Keine Namen, keine Antworten einzelner Jugendlicher.'),
        last.length ? h('div', { class: 'list' }, last.map((x) => { const m = CREW.missions.find((mm) => mm.id === x.mission); return h('div', { class: 'li' }, h('span', null, x.date), h('span', null, m ? m.title : x.mission), h('b', null, '+' + x.energy)); })) : h('p', { class: 'muted' }, 'Noch keine Session gespielt.')),
      h('div', { class: 'card stack' }, h('h3', null, 'Sichern'), h('p', { class: 'muted small' }, 'Der Spielstand liegt nur auf diesem Gerät. Zum Übertragen auf ein anderes Gerät: Code kopieren und dort einfügen.'), codeBox,
        h('div', { class: 'row' }, ui.btn('Code kopieren', copy, { small: true, icon: 'copy' }), ui.btn('Als Datei speichern', download, { small: true, variant: 'ghost', icon: 'download' }))),
      h('div', { class: 'card stack' }, h('h3', null, 'Laden'), importBox,
        h('div', { class: 'row' }, ui.btn('Spielstand laden', async () => {
          try { CREW.importCode(importBox.value); applyLook(); renderTopbar(); ui.toast('Spielstand geladen.'); renderTeacher('fortschritt'); } catch (e) { ui.toast(e.message || 'Code ungültig.'); }
        }, { small: true }))),
      h('div', { class: 'card stack' }, h('h3', null, 'Neue Saison'), h('p', { class: 'muted small' }, 'Setzt Energie, Crew-HQ und Crew-Namen zurück. Die PIN bleibt.'),
        h('div', { class: 'row' }, ui.btn('Alles zurücksetzen', async () => {
          const ok = await ui.confirm('Wirklich alles zurücksetzen?', 'Energie, Level, Crew-Name und Verlauf werden gelöscht.', 'Zurücksetzen', 'Abbrechen');
          if (ok) { CREW.resetState(); applyLook(); renderHome(); }
        }, { small: true, variant: 'teamB', icon: 'undo' }))));
  }

  function teacherGuide() {
    const byDay = [1, 2, 3, 4, 5].map((d) => { const m = CREW.missions.find((x) => x.day === d); return h('div', { class: 'li' }, h('b', null, WEEKDAYS[d]), h('span', null, m ? m.title : '–')); });
    const credits = CREW.CREDITS || [];
    return h('div', { class: 'stack' },
      h('div', { class: 'card stack' }, h('h3', null, 'So läuft eine Session (ca. 10 Minuten)'),
        h('ol', { class: 'stack', style: { margin: 0, paddingLeft: '1.2em' } },
          h('li', null, 'CREW am Beamer oder auf dem Lehrer-iPad öffnen. Die Jugendlichen öffnen auf ihren iPads die „Antwort-Karte“.'),
          h('li', null, 'Wetter-Check (1 Min.): Jede:r stellt geheim das Wetter ein und dreht die Karte nur zu dir. Die anderen schauen nach vorn. Du tippst einmal: sonnig, gemischt oder Sturm. „Genauer zählen“ ist freiwillig; genaue Zahlen erscheinen erst ab 6 Leuten.'),
          h('li', null, 'Mission des Tages (4–5 Min.): Jeder Wochentag hat ein eigenes Spiel. Mit „Andere Mission“ kannst du tauschen. Eine Sitzungs-Uhr kürzt Runden, wenn die Zeit knapp wird.'),
          h('li', null, 'Nachspielzeit (1–2 Min.): Eine Frage, freiwillig. Das ist der wichtigste Teil.'),
          h('li', null, 'Energie fließt ins gemeinsame Crew-HQ und wird sofort nach der Mission gespeichert. Beim Level-up wählt die Crew per A/B ein neues Teil. Es gibt keine Einzel-Rangliste.'))),
      h('div', { class: 'card stack' }, h('h3', null, 'Wochenplan'), h('div', { class: 'list' }, byDay)),
      h('div', { class: 'card stack' }, h('h3', null, 'Sicherheitsregeln im Spiel'),
        h('ul', { class: 'stack', style: { margin: 0, paddingLeft: '1.2em' } },
          h('li', null, 'X-Karte (oben rechts): Jede:r darf jede Karte ohne Begründung überspringen. Auch während Animationen: Dann wird die nächste Karte übersprungen.'),
          h('li', null, 'Start-PIN 1234: Beim ersten Öffnen musst du eine eigene PIN wählen. Nach 3 falschen Versuchen ist der Zugang 30 Sekunden gesperrt.'),
          h('li', null, 'Pause-Knopf mit Atemkreis. Hilfe-Knopf mit Kanner- a Jugendtelefon (116 111), BEE SECURE Helpline (8002 1234), Notruf 112, Polizei 113.'),
          h('li', null, 'Heikle Karten sind aus, bis du sie unter „Inhalte“ einschaltest.'),
          h('li', null, 'Gespeichert wird nur auf diesem Gerät, ohne Namen.'))),
      credits.length ? h('div', { class: 'card stack' }, h('h3', null, 'Danke & Lizenzen'), h('ul', { class: 'small', style: { margin: 0, paddingLeft: '1.2em' } }, credits.map((c) => h('li', null, c)))) : null);
  }

  /* ---------- Start ---------- */
  function boot() {
    CREW.missions.sort((a, b) => (a.day || 9) - (b.day || 9));
    applyLook();
    renderHome();
    // Offline-Unterstützung (nur auf der echten Webseite, nicht in der Vorschau)
    try {
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    } catch (e) { /* egal */ }
  }

  CREW.app = { renderHome, startSession, renderPaddle, renderSoloHub, renderBase, renderTeacher, goHome, applyLook, LOOKS };
  // Für automatische Tests
  CREW.debug = {
    found(name, look) { S.crew.name = name || 'Test Crew'; S.crew.look = look || 'arena'; S.crew.founded = true; CREW.save(); renderHome(); },
    startMission(id) { const m = CREW.missions.find((x) => x.id === id); if (m) startSession(m); return !!m; },
    startSolo(id) { const g = CREW.soloGames.find((x) => x.id === id); if (g) startSolo(g); return !!g; },
    addEnergy(n) { S.energy += n; CREW.save(); renderTopbar(); },
    xcard: onXCard,
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
