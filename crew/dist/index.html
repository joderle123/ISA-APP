/* ---- core/styles.css ---- */
/* =========================================================
   CREW – Design-System
   Drei Looks (die Crew stimmt ab): arena (Standard), pixel, neon.
   Alle Farben laufen über Tokens auf .app[data-look].
   ========================================================= */

:root {
  color-scheme: dark;
  --ink: #0e0a26;
  --bg: #1b1446;
  --bg2: #2a1e6e;
  --panel: #2d2378;
  --panel2: #3a2e92;
  --line: #0e0a26;
  --text: #fff8ee;
  --muted: #c3bdf0;
  --accent: #ff6b3d;
  --accent-2: #ff8a5c;
  --accent-ink: #1a0b05;
  --yellow: #ffc93c;
  --yellow-ink: #2a1c00;
  --good: #2ee6c5;
  --good-ink: #03211c;
  --warn: #ffb020;
  --teamA: #3da5ff;
  --teamA-ink: #03182b;
  --teamB: #ff4fa3;
  --teamB-ink: #2b0418;
  --radius: 18px;
  --radius-sm: 12px;
  --bw: 3px;
  --lift: 5px;
  --glow: none;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Rubik", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display-case: none;
  --display-track: 0.01em;
  --bg-image: radial-gradient(1200px 700px at 15% -10%, #3b2a9a 0%, transparent 60%),
              radial-gradient(900px 600px at 110% 110%, #5a1f6e 0%, transparent 55%);
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ---------- Looks ---------- */
.app[data-look="arena"] { /* nutzt :root */ }

.app[data-look="pixel"] {
  --ink: #05070d;
  --bg: #10141f;
  --bg2: #182033;
  --panel: #1e2a3a;
  --panel2: #29384d;
  --line: #05070d;
  --text: #f0f4f8;
  --muted: #9fb3c8;
  --accent: #f7b32b;
  --accent-2: #ffd166;
  --accent-ink: #1c1300;
  --yellow: #ffe066;
  --good: #5ad17a;
  --good-ink: #04200c;
  --teamA: #4cc9f0;
  --teamB: #f15bb5;
  --radius: 0px;
  --radius-sm: 0px;
  --bw: 4px;
  --lift: 4px;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Pixelify Sans", "Courier New", monospace;
  --display-case: uppercase;
  --display-track: 0.04em;
  --bg-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
}
.app[data-look="pixel"] { background-size: 16px 16px, 16px 16px; }

.app[data-look="neon"] {
  --ink: #000008;
  --bg: #0a0a1a;
  --bg2: #120f2e;
  --panel: #141433;
  --panel2: #1d1d48;
  --line: #3b3bff55;
  --text: #eef6ff;
  --muted: #9aa6d6;
  --accent: #00e5ff;
  --accent-2: #6ff3ff;
  --accent-ink: #001a1f;
  --yellow: #ffe45e;
  --good: #b8ff3c;
  --good-ink: #142000;
  --teamA: #00e5ff;
  --teamA-ink: #001a1f;
  --teamB: #ff2e88;
  --teamB-ink: #2a0013;
  --radius: 14px;
  --radius-sm: 10px;
  --bw: 2px;
  --lift: 0px;
  --glow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --display-case: uppercase;
  --display-track: 0.06em;
  --bg-image: radial-gradient(800px 500px at 80% -10%, #2a0f5a 0%, transparent 60%),
              radial-gradient(700px 500px at -10% 110%, #003a4a 0%, transparent 60%);
}

/* ---------- App-Gerüst ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  background-color: var(--bg);
  background-image: var(--bg-image);
  color: var(--text);
  font-family: var(--font-body);
  font-size: clamp(17px, 0.9vw + 10px, 23px);
  line-height: 1.4;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  min-height: 64px;
}
.topbar .spacer { flex: 1; }
.crew-badge {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  font-size: 1.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40vw;
}
.crew-badge .logo {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  background: var(--accent);
  color: var(--accent-ink);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line), var(--glow);
}
.energy-mini {
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.energy-mini .bar {
  width: clamp(80px, 12vw, 180px); height: 14px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.app[data-look="pixel"] .energy-mini .bar { border-radius: 0; }
.energy-mini .bar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--yellow), var(--accent));
  width: 0;
  transition: width 900ms cubic-bezier(.2,.8,.2,1);
}

.stage {
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  outline: none;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 100%;
}
.wrap.center { justify-content: center; align-items: center; text-align: center; }
.wrap.narrow { max-width: 760px; }

/* ---------- Typo ---------- */
.display, h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  text-wrap: balance;
  margin: 0;
  line-height: 1.08;
}
.app[data-look="neon"] .display, .app[data-look="neon"] h1, .app[data-look="neon"] h2 { font-weight: 600; }
h1 { font-size: clamp(2.1em, 4vw + 1em, 3.6em); }
h2 { font-size: clamp(1.5em, 2vw + 0.9em, 2.3em); }
h3 { font-size: 1.25em; }
.outline-text {
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink);
}
.app[data-look="neon"] .outline-text { -webkit-text-stroke: 0; text-shadow: 0 0 14px var(--accent); }
.app[data-look="pixel"] .outline-text { -webkit-text-stroke: 0; text-shadow: 4px 4px 0 var(--ink); }
.lead { font-size: 1.15em; color: var(--text); margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }
.eyebrow {
  font-size: 0.8em; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--yellow);
}
p { margin: 0; }

/* Große Karte für Beamer-Text */
.bigcard {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: clamp(20px, 3vw, 40px);
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
}
.bigcard .say {
  font-family: var(--font-display);
  text-transform: none;
  font-size: clamp(1.6em, 2.6vw + 0.8em, 2.8em);
  line-height: 1.15;
  text-wrap: balance;
}
.app[data-look="pixel"] .bigcard .say { font-size: clamp(1.4em, 2.2vw + 0.7em, 2.4em); }

/* ---------- Layout-Helfer ---------- */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

/* ---------- Karten & Kacheln ---------- */
.card {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: 0 var(--lift) 0 var(--line);
}
.card.soft { box-shadow: none; background: color-mix(in srgb, var(--panel) 70%, transparent); }

.tile {
  appearance: none;
  font: inherit; color: inherit; text-align: left;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 20px;
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 120ms ease, box-shadow 120ms ease, background 160ms;
  min-height: 120px;
}
.tile:hover { background: var(--panel2); }
.tile:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.tile .t-title { font-family: var(--font-display); font-size: 1.45em; text-transform: var(--display-case); letter-spacing: var(--display-track); line-height: 1.1; }
.tile .t-sub { color: var(--muted); font-size: 0.92em; }
.tile .t-icon {
  width: 56px; height: 56px; display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: var(--bw) solid var(--line);
  background: var(--accent); color: var(--accent-ink);
}
.tile.hero { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--accent-ink); }
.tile.hero .t-sub { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
.tile.hero .t-icon { background: var(--yellow); color: var(--yellow-ink); }
.app[data-look="neon"] .tile.hero { background: transparent; color: var(--accent); border-color: var(--accent); }
.app[data-look="neon"] .tile.hero .t-sub { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  font: inherit;
  font-family: var(--font-display);
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  font-size: 1.1em;
  line-height: 1;
  color: var(--accent-ink);
  background: var(--accent);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) - 4px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 16px 24px;
  min-height: 60px;
  min-width: 60px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 90ms ease, box-shadow 90ms ease, filter 120ms;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.btn:focus-visible, .tile:focus-visible, .icon-btn:focus-visible, .chip:focus-visible {
  outline: 3px solid var(--yellow); outline-offset: 3px;
}
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn.big { font-size: 1.45em; padding: 20px 34px; min-height: 76px; }
.btn.small { font-size: 0.9em; padding: 10px 16px; min-height: 48px; }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--panel); color: var(--text); }
.btn.good { background: var(--good); color: var(--good-ink); }
.btn.yellow { background: var(--yellow); color: var(--yellow-ink); }
.btn.teamA { background: var(--teamA); color: var(--teamA-ink); }
.btn.teamB { background: var(--teamB); color: var(--teamB-ink); }
.app[data-look="neon"] .btn { background: transparent; color: var(--accent); border-color: currentColor; }
.app[data-look="neon"] .btn.good { color: var(--good); }
.app[data-look="neon"] .btn.yellow { color: var(--yellow); }
.app[data-look="neon"] .btn.teamA { color: var(--teamA); }
.app[data-look="neon"] .btn.teamB { color: var(--teamB); }
.app[data-look="neon"] .btn.ghost { color: var(--text); border-color: var(--line); box-shadow: none; }

.icon-btn {
  appearance: none; font: inherit; color: var(--text);
  width: 52px; height: 52px; flex: none;
  display: grid; place-items: center;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line);
  cursor: pointer; touch-action: manipulation;
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.icon-btn.on { background: var(--yellow); color: var(--yellow-ink); }
.icon-btn.xcard { background: var(--teamB); color: var(--teamB-ink); font-family: var(--font-display); font-size: 1.2em; }
.app[data-look="neon"] .icon-btn.on { background: transparent; color: var(--yellow); border-color: var(--yellow); }
.app[data-look="neon"] .icon-btn.xcard { background: transparent; color: var(--teamB); border-color: var(--teamB); }

.chip {
  appearance: none; font: inherit; color: var(--text);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; min-height: 48px;
  border-radius: 99px;
  border: var(--bw) solid var(--line);
  background: var(--panel);
  cursor: pointer; touch-action: manipulation;
}
.app[data-look="pixel"] .chip { border-radius: 0; }
.chip.sel { background: var(--yellow); color: var(--yellow-ink); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78em; font-weight: 700;
  padding: 5px 12px; border-radius: 99px;
  background: var(--panel2); color: var(--text);
  border: 2px solid var(--line);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.pill.good { background: var(--good); color: var(--good-ink); }
.pill.teamA { background: var(--teamA); color: var(--teamA-ink); }
.pill.teamB { background: var(--teamB); color: var(--teamB-ink); }
.app[data-look="pixel"] .pill { border-radius: 0; }

/* Hinweis: welche Antwort-Karte */
.paddle-hint {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--good) 20%, transparent);
  border: 2px dashed var(--good);
  color: var(--text);
  font-weight: 600;
  font-size: 0.9em;
}

/* ---------- Stepper / Tally / Zahlenfeld ---------- */
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper .val {
  font-family: var(--font-display);
  font-size: 3em; min-width: 1.6em; text-align: center;
  font-variant-numeric: tabular-nums;
}
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tally .t-item {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.tally .t-count { font-family: var(--font-display); font-size: 2.2em; font-variant-numeric: tabular-nums; }
.tally .t-label { font-weight: 600; text-align: center; }
.tally .t-ctrl { display: flex; gap: 8px; }

.valuepad { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 10px; }
.valuepad .btn { font-size: 1.4em; min-height: 64px; padding: 10px; }
.valuechips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; align-items: center; }
.valuechips .v {
  font-family: var(--font-display); font-size: 1.3em;
  min-width: 48px; height: 48px; padding: 0 10px;
  display: grid; place-items: center;
  background: var(--yellow); color: var(--yellow-ink);
  border: 2px solid var(--line); border-radius: 12px;
}

/* Fortschritt */
.progress {
  height: 26px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}
.app[data-look="pixel"] .progress { border-radius: 0; }
.progress > i {
  display: block; height: 100%; width: 0;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, var(--accent) 14px 28px);
  transition: width 1200ms cubic-bezier(.2,.8,.2,1);
}

/* Timer-Ring */
.timer { position: relative; width: 120px; height: 120px; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 2.2em; font-variant-numeric: tabular-nums;
}

/* ---------- Overlays ---------- */
.overlay-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.overlay {
  position: absolute; inset: 0;
  background: color-mix(in srgb, var(--ink) 78%, transparent);
  display: grid; place-items: center;
  padding: 16px;
  pointer-events: auto;
  animation: fade-in 160ms ease both;
}
.modal {
  width: min(640px, 100%);
  max-height: calc(100% - 32px);
  overflow: auto;
  background: var(--bg2);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 24px;
  display: flex; flex-direction: column; gap: 16px;
  animation: pop-in 220ms cubic-bezier(.2,1.4,.4,1) both;
}
.toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateX(-50%);
  background: var(--yellow); color: var(--yellow-ink);
  border: var(--bw) solid var(--line);
  border-radius: 99px;
  padding: 12px 22px;
  font-weight: 700;
  box-shadow: 0 4px 0 var(--line);
  animation: toast-in 240ms cubic-bezier(.2,1.4,.4,1) both;
  max-width: calc(100% - 32px);
  text-align: center;
}
.countdown-big {
  font-family: var(--font-display);
  font-size: clamp(6em, 18vw, 14em);
  color: var(--yellow);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 10px 0 var(--ink);
  animation: count-pop 700ms cubic-bezier(.2,1.4,.4,1) both;
  line-height: 1;
  text-align: center;
}
.app[data-look="neon"] .countdown-big { -webkit-text-stroke: 0; text-shadow: 0 0 30px var(--yellow); }
.confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ---------- Antwort-Karte (Schüler-iPad) ---------- */
.paddle { display: flex; flex-direction: column; gap: 16px; height: 100%; }
.paddle-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.paddle-tabs .chip { flex: none; }
.paddle-body { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.paddle-grid { display: grid; gap: 12px; flex: 1; }
.paddle-grid .btn { font-size: 1.6em; min-height: 88px; white-space: normal; }
.paddle-grid .btn.sel { outline: 5px solid var(--yellow); outline-offset: 3px; }
.paddle-show {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  padding: 24px;
  pointer-events: auto;
  text-align: center;
  animation: fade-in 120ms ease both;
}
.paddle-show .answer {
  font-family: var(--font-display);
  font-size: clamp(5em, 30vmin, 18em);
  line-height: 1;
  -webkit-text-stroke: 5px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 10px 0 var(--ink);
}
.paddle-show .answer.wordy { font-size: clamp(3em, 14vmin, 8em); }
.app[data-look="neon"] .paddle-show .answer { -webkit-text-stroke: 0; text-shadow: 0 0 40px currentColor; }

/* Wetter-Icons */
.wx { display: inline-grid; place-items: center; }
.wx svg { width: 100%; height: 100%; }

/* Liste im Lehrermodus */
.list { display: flex; flex-direction: column; gap: 10px; }
.list .li {
  display: flex; gap: 14px; align-items: flex-start; justify-content: space-between;
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius-sm);
  padding: 14px 16px;
}
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
textarea, input[type="text"], input[type="password"] {
  font: inherit; color: var(--text);
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  width: 100%;
  user-select: text; -webkit-user-select: text;
}
textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 0.8em; }
.selectable { user-select: text; -webkit-user-select: text; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.kbd { font-family: ui-monospace, Menlo, monospace; background: var(--panel2); padding: 2px 8px; border-radius: 6px; }

/* ---------- Animationen ---------- */
.enter { animation: slide-up 360ms cubic-bezier(.2,1,.3,1) both; }
.enter-2 { animation: slide-up 360ms 80ms cubic-bezier(.2,1,.3,1) both; }
.enter-3 { animation: slide-up 360ms 160ms cubic-bezier(.2,1,.3,1) both; }
.pop { animation: pop-in 300ms cubic-bezier(.2,1.5,.4,1) both; }
.shake { animation: shake 420ms ease both; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.float { animation: floaty 3s ease-in-out infinite; }
@keyframes slide-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes count-pop { 0% { opacity: 0; transform: scale(2.2); } 40% { opacity: 1; transform: scale(.92); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes breathe { 0%,100% { transform: scale(.6); } 50% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

@media (max-width: 640px) {
  .topbar { gap: 6px; padding-left: 12px; padding-right: 12px; }
  .crew-badge .name { display: none; }
  .energy-mini .lvl { display: none; }
  .energy-mini .bar { width: 56px; }
  .topbar .icon-btn { width: 44px; height: 44px; }
  .btn { white-space: normal; }
  .btn.big { font-size: 1.2em; padding: 16px 22px; }
}
@media (max-width: 420px) {
  .energy-mini { display: none; }
  .topbar .icon-btn { width: 42px; height: 42px; }
}

</style>

<div id="app" class="app">
  <header class="topbar" id="topbar"></header>
  <main class="stage" id="stage" tabindex="-1"></main>
  <div class="overlay-root" id="overlays"></div>
</div>

<script>
/* ---- core/util.js ---- */
/* CREW – Grundwerkzeuge: DOM-Helfer, Zufall, Speicher, Zustand. */
(function () {

  // h('div', {class:'x', onclick:fn, style:{...}, dataset:{...}}, kids...)
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);

    append(el, kids);

  }
  function append(el, kids) {
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false || kid === true) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  /* ---------- Zufall & Kleinkram ---------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const weekday = () => new Date().getDay(); // 0 = So, 1 = Mo … 6 = Sa
  const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- Speicher (nur lokal, mit Präfix) ---------- */
  const PREFIX = 'crew_v1_';
  const memory = {};
  const store = {
    get(key, fallback) {
      try {
        const raw = window.localStorage.getItem(PREFIX + key);
        if (raw != null) return JSON.parse(raw);
      } catch (e) { /* privat/gesperrt: Speicher im RAM */ }
      return key in memory ? memory[key] : fallback;
    },
    set(key, value) {
      memory[key] = value;
      try { window.localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* egal */ }
    },
    del(key) {
      delete memory[key];
      try { window.localStorage.removeItem(PREFIX + key); } catch (e) { /* egal */ }
    },
  };

  /* ---------- Zustand ---------- */
  // Es werden KEINE Namen oder Daten einzelner Jugendlicher gespeichert.
  const DEFAULT_STATE = () => ({
    v: 1,
    crew: { name: '', look: 'arena', founded: false },
    energy: 0,
    history: [],          // [{date, mission, energy}]
    used: {},             // pool -> [ids] schon gespielt
    lastCrewSize: 5,
    settings: {
      pin: '1234',
      sound: true,
      speech: true,
      sensitive: false,   // heikle Karten zeigen?
      disabled: [],       // ausgeschaltete Missionen
    },
    solo: {},             // Bestwerte pro Solo-Spiel (ohne Namen)
  });

  function deepMerge(base, extra) {
    if (!extra || typeof extra !== 'object') return base;
    for (const [k, v] of Object.entries(extra)) {
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        deepMerge(base[k], v);
      } else {
        base[k] = v;
      }
    }
    return base;
  }

  const state = deepMerge(DEFAULT_STATE(), store.get('state', null));
  const listeners = new Set();
  function save() {
    store.set('state', state);
    listeners.forEach((fn) => { try { fn(state); } catch (e) { console.error(e); } });
  }
  function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function resetState() {
    const fresh = DEFAULT_STATE();
    fresh.settings.pin = state.settings.pin;
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, fresh);
    save();
  }
  function importState(obj) {
    if (!obj || typeof obj !== 'object' || obj.v !== 1) throw new Error('Das ist kein gültiger CREW-Spielstand.');
    const fresh = deepMerge(DEFAULT_STATE(), obj);
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, fresh);
    save();
  }
  function exportCode() {
    const json = JSON.stringify(state);
    return btoa(unescape(encodeURIComponent(json)));
  }
  function importCode(code) {
    const json = decodeURIComponent(escape(atob(String(code).trim())));
    importState(JSON.parse(json));
  }

  /* ---------- Levels der Crew-Basis ---------- */
  // Schnelle erste Erfolge, später langsamer (ca. 8 Energie pro Tag).
  const LEVELS = [0, 15, 35, 60, 90, 125, 165, 210, 260, 315, 375, 440, 510];
  function levelInfo(energy) {
    let lvl = 0;
    for (let i = 0; i < LEVELS.length; i++) if (energy >= LEVELS[i]) lvl = i;
    const cur = LEVELS[lvl];
    const next = LEVELS[lvl + 1];
    const max = next == null;
    return {
      level: lvl,
      max,
      cur,
      next: max ? cur : next,
      pct: max ? 100 : Math.round(((energy - cur) / (next - cur)) * 100),
      toNext: max ? 0 : next - energy,
    };
  }

  /* ---------- Inhalte ziehen ---------- */
  // Zieht n Einträge aus CREW.content[pool], bevorzugt noch nicht gespielte.
  // Heikle Einträge (heikel: true) nur, wenn die Lehrkraft sie freigibt.
  function pickContent(pool, n, filter) {
    const all = (CREW.content[pool] || []).filter((it) => (state.settings.sensitive || !it.heikel) && (!filter || filter(it)));
    if (!all.length) return [];
    const used = new Set(state.used[pool] || []);
    let fresh = all.filter((it) => !used.has(it.id));
    if (fresh.length < n) {
      state.used[pool] = [];
      fresh = all;
    }
    const chosen = shuffle(fresh).slice(0, n);
    state.used[pool] = [...(state.used[pool] || []), ...chosen.map((c) => c.id)];
    save();
    return chosen;
  }

  CREW.content = CREW.content || {};
  CREW.util = { h, append, clear, shuffle, pick, clamp, sleep, todayISO, weekday, WEEKDAYS, escapeHtml };
  CREW.store = store;
  CREW.state = state;
  CREW.save = save;
  CREW.onChange = onChange;
  CREW.resetState = resetState;
  CREW.exportCode = exportCode;
  CREW.importCode = importCode;
  CREW.LEVELS = LEVELS;
  CREW.levelInfo = levelInfo;
  CREW.pickContent = pickContent;

  /* ---------- Registrierung von Modulen ---------- */
  CREW.missions = CREW.missions || [];
  CREW.soloGames = CREW.soloGames || [];
  CREW.registerMission = (m) => { CREW.missions.push(m); };
  CREW.registerSolo = (g) => { CREW.soloGames.push(g); };
})();

/* ---- core/sound.js ---- */
/* CREW – Töne (selbst erzeugt mit WebAudio, keine Dateien) und Vorlesen. */
(function () {
  'use strict';
  const CREW = window.CREW;
  let ctx = null;
  let master = null;

  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // iPad: Ton erst nach der ersten Berührung erlaubt
  ['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
    window.addEventListener(ev, () => { if (CREW.state.settings.sound) ac(); }, { once: true, passive: true })
  );

  function tone(freq, start, dur, type, vol, slideTo) {
    const a = ac();
    if (!a) return;
    const t0 = a.currentTime + start;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  function noise(start, dur, vol, fromHz, toHz) {
    const a = ac();
    if (!a) return;
    const t0 = a.currentTime + start;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(fromHz || 800, t0);
    f.frequency.exponentialRampToValueAtTime(toHz || 3000, t0 + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0);
  }

  const SFX = {
    tap: () => tone(660, 0, 0.07, 'triangle', 0.25),
    tick: () => tone(1200, 0, 0.04, 'square', 0.08),
    count: () => tone(520, 0, 0.12, 'triangle', 0.35),
    go: () => { tone(784, 0, 0.1, 'square', 0.2); tone(1046, 0.08, 0.22, 'square', 0.2); },
    good: () => { tone(660, 0, 0.1, 'triangle', 0.35); tone(990, 0.08, 0.18, 'triangle', 0.35); },
    great: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.07, 0.22, 'triangle', 0.32)),
    soft: () => { tone(392, 0, 0.14, 'sine', 0.3); tone(330, 0.1, 0.22, 'sine', 0.25); },
    reveal: () => { noise(0, 0.45, 0.25, 400, 5000); tone(880, 0.35, 0.25, 'triangle', 0.3); },
    whoosh: () => noise(0, 0.3, 0.18, 2000, 400),
    unlock: () => {
      [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, i * 0.09, 0.28, 'square', 0.14));
      noise(0.55, 0.5, 0.12, 3000, 8000);
    },
    drum: () => { for (let i = 0; i < 14; i++) tone(120 + (i % 2) * 20, i * 0.06, 0.05, 'triangle', 0.25 + i * 0.015); },
    breatheIn: () => tone(220, 0, 3.8, 'sine', 0.12, 330),
    breatheOut: () => tone(330, 0, 5.5, 'sine', 0.1, 196),
  };

  function play(name) {
    if (!CREW.state.settings.sound) return;
    try { (SFX[name] || SFX.tap)(); } catch (e) { /* Ton ist Bonus */ }
  }

  /* ---------- Vorlesen ---------- */
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = window.speechSynthesis.getVoices().filter((v) => /^de(-|_|$)/i.test(v.lang));
    voice = vs.find((v) => /de-DE/i.test(v.lang) && /anna|helena|petra|google|markus|yannick/i.test(v.name)) || vs[0] || null;
    return voice;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return false;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[*_#]/g, ''));
      u.lang = 'de-DE';
      if (voice || pickVoice()) u.voice = voice;
      u.rate = 0.95;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  function stopSpeaking() {
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) { /* egal */ }
  }

  CREW.sound = { play, unlock: ac };
  CREW.speak = speak;
  CREW.stopSpeaking = stopSpeaking;
  CREW.canSpeak = () => 'speechSynthesis' in window;
})();

(function () {
  'use strict';
  const CREW = window.CREW;
  const { h, clear, sleep } = CREW.util;

  const stage = () => document.getElementById('stage');
  const overlays = () => document.getElementById('overlays');

  /* Bildschirm ersetzen */
  function screen(children, opts) {
    const o = opts || {};
    const st = stage();
    CREW.stopSpeaking();
    clear(st);
    const wrap = h('div', { class: 'wrap' + (o.center ? ' center' : '') + (o.narrow ? ' narrow' : '') }, children);
    st.appendChild(wrap);
    st.scrollTop = 0;
    return wrap;
  }

  function btn(label, onClick, opts) {
    const o = opts || {};
    const cls = ['btn', o.variant || '', o.big ? 'big' : '', o.small ? 'small' : '', o.wide ? 'wide' : '', o.cls || ''].filter(Boolean).join(' ');
    const b = h('button', { type: 'button', class: cls, id: o.id, disabled: o.disabled, 'aria-label': o.aria },
      o.icon ? CREW.icon(o.icon, o.big ? 30 : 24) : null,
      label != null ? h('span', null, label) : null,
      o.iconRight ? CREW.icon(o.iconRight, o.big ? 30 : 24) : null);
    b.addEventListener('click', (e) => {
      if (!o.silent) CREW.sound.play('tap');
      if (onClick) onClick(e);
    });
    return b;
  }

  function iconBtn(name, onClick, opts) {
    const o = opts || {};
    const b = h('button', { type: 'button', class: 'icon-btn ' + (o.cls || ''), 'aria-label': o.label, title: o.label, id: o.id }, o.text ? o.text : CREW.icon(name, 24));
    b.addEventListener('click', (e) => { CREW.sound.play('tap'); if (onClick) onClick(e); });
    return b;
  }

  function speakBtn(text, opts) {
    if (!CREW.state.settings.speech || !CREW.canSpeak()) return null;
    return iconBtn('speaker', () => CREW.speak(typeof text === 'function' ? text() : text), { label: 'Vorlesen', cls: (opts && opts.cls) || '' });
  }

  /* Große Karte mit Text zum Vorlesen */
  function say(text, opts) {
    const o = opts || {};
    const sb = speakBtn(o.speakText || text);
    return h('div', { class: 'bigcard enter' + (o.cls ? ' ' + o.cls : '') },
      o.eyebrow ? h('div', { class: 'row between' }, h('span', { class: 'eyebrow' }, o.eyebrow), sb) : null,
      h('div', { class: 'say' }, text),
      !o.eyebrow && sb ? h('div', { class: 'row end' }, sb) : null,
      o.extra || null);
  }

  /* Knöpfe anzeigen und auf Wahl warten */
  function choice(container, options, opts) {
    const o = opts || {};
    return new Promise((resolve) => {
      const row = h('div', { class: 'row ' + (o.align || 'center') });
      options.forEach((opt) => {
        row.appendChild(btn(opt.label, () => { row.querySelectorAll('button').forEach((b) => (b.disabled = true)); resolve(opt.value !== undefined ? opt.value : opt.label); }, {
          variant: opt.variant, big: o.big !== false, icon: opt.icon, iconRight: opt.iconRight, id: opt.id,
        }));
      });
      container.appendChild(row);
    });
  }
  const next = (container, label, opts) => choice(container, [{ label: label || 'Weiter', value: true, iconRight: 'right', variant: (opts && opts.variant) || '' }], opts);

  /* Zahl einstellen */
  function stepper(o) {
    let v = o.value != null ? o.value : o.min || 0;
    const val = h('div', { class: 'val', 'aria-live': 'polite' }, String(v));
    const set = (n) => {
      v = Math.max(o.min != null ? o.min : 0, Math.min(o.max != null ? o.max : 99, n));
      val.textContent = String(v);
      if (o.onChange) o.onChange(v);
    };
    const el = h('div', { class: 'stepper' },
      iconBtn('minus', () => set(v - 1), { label: 'weniger' }),
      val,
      iconBtn('plus', () => set(v + 1), { label: 'mehr' }));
    return { el, get: () => v, set };
  }

  /* Strichliste: Anzahl pro Option */
  function tally(options, o) {
    const counts = Object.fromEntries(options.map((x) => [x.id, 0]));
    const max = (o && o.max) || 99;
    const total = () => Object.values(counts).reduce((a, b) => a + b, 0);
    const el = h('div', { class: 'tally' });
    options.forEach((opt) => {
      const num = h('div', { class: 't-count' }, '0');
      const set = (n) => {
        const others = total() - counts[opt.id];
        counts[opt.id] = Math.max(0, Math.min(n, max - others));
        num.textContent = String(counts[opt.id]);
        if (o && o.onChange) o.onChange(counts, total());
      };
      el.appendChild(h('div', { class: 't-item' },
        opt.icon || null,
        h('div', { class: 't-label' }, opt.label),
        num,
        h('div', { class: 't-ctrl' },
          iconBtn('minus', () => set(counts[opt.id] - 1), { label: opt.label + ' weniger' }),
          iconBtn('plus', () => set(counts[opt.id] + 1), { label: opt.label + ' mehr' }))));
    });
    return { el, get: () => ({ ...counts }), total };
  }

  /* Gezeigte Zahlen schnell eintippen */
  function valuePad(o) {
    const values = [];
    const chips = h('div', { class: 'valuechips', 'aria-live': 'polite' });
    const render = () => {
      clear(chips);
      if (!values.length) chips.appendChild(h('span', { class: 'muted' }, o.placeholder || 'Tippe die gezeigten Zahlen ein …'));
      values.forEach((v) => chips.appendChild(h('span', { class: 'v' }, String(v))));
      if (o.onChange) o.onChange(values.slice());
    };
    const pad = h('div', { class: 'valuepad' });
    for (let n = o.min || 0; n <= (o.max != null ? o.max : 10); n++) {
      pad.appendChild(btn(String(n), () => { if (!o.count || values.length < o.count) { values.push(n); render(); } }, { variant: 'ghost' }));
    }
    const undo = btn('Zurück', () => { values.pop(); render(); }, { variant: 'ghost', small: true, icon: 'undo' });
    render();
    const el = h('div', { class: 'stack' }, chips, pad, h('div', { class: 'row end' }, undo));
    return { el, get: () => values.slice() };
  }

  /* Timer-Ring */
  function timer(seconds, o) {
    const opts = o || {};
    const R = 52, C = 2 * Math.PI * R;
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    ring.setAttribute('viewBox', '0 0 120 120');
    ring.innerHTML = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="10"/><circle class="arc" cx="60" cy="60" r="${R}" fill="none" stroke="var(--yellow)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>`;
    const num = h('div', { class: 'num' }, String(seconds));
    const el = h('div', { class: 'timer', role: 'timer' }, ring, num);
    let left = seconds, iv = null;
    const arc = ring.querySelector('.arc');
    const tick = () => {
      left -= 1;
      num.textContent = String(Math.max(0, left));
      arc.setAttribute('stroke-dashoffset', String(C * (1 - left / seconds)));
      if (left <= 5 && left > 0) CREW.sound.play('tick');
      if (left <= 0) { stop(); if (opts.onDone) opts.onDone(); }
    };
    const start = () => { if (!iv) iv = setInterval(() => { if (!document.body.contains(el)) return stop(); tick(); }, 1000); };
    const stop = () => { clearInterval(iv); iv = null; };
    if (opts.autostart !== false) start();
    return { el, start, stop };
  }

  /* 3 – 2 – 1 – Zeigt her! */
  async function threeTwoOne(text) {
    const root = overlays();
    const ov = h('div', { class: 'overlay', style: { background: 'color-mix(in srgb, var(--ink) 55%, transparent)' } });
    root.appendChild(ov);
    for (const n of ['3', '2', '1']) {
      clear(ov);
      ov.appendChild(h('div', { class: 'countdown-big' }, n));
      CREW.sound.play('count');
      await sleep(650);
    }
    clear(ov);
    ov.appendChild(h('div', { class: 'countdown-big', style: { fontSize: 'clamp(3em, 10vw, 7em)' } }, text || 'Zeigt her!'));
    CREW.sound.play('go');
    await sleep(900);
    ov.remove();
  }

  /* Dialog (ersetzt confirm/alert, die im Rahmen nicht gehen) */
  function modal(o) {
    return new Promise((resolve) => {
      const root = overlays();
      const close = (v) => { ov.remove(); resolve(v); };
      const actions = h('div', { class: 'row end' });
      (o.actions || [{ label: 'OK', value: true }]).forEach((a) => actions.appendChild(btn(a.label, () => close(a.value), { variant: a.variant || '', icon: a.icon })));
      const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
        o.title ? h('h2', null, o.title) : null,
        o.body instanceof Node ? o.body : o.body ? h('p', { class: 'lead' }, o.body) : null,
        actions);
      const ov = h('div', { class: 'overlay' }, box);
      if (o.dismissable !== false) ov.addEventListener('click', (e) => { if (e.target === ov) close(null); });
      root.appendChild(ov);
      const first = actions.querySelector('button');
      if (first) first.focus();
    });
  }
  const confirm = (title, body, yes, no) =>
    modal({ title, body, actions: [{ label: no || 'Abbrechen', value: false, variant: 'ghost' }, { label: yes || 'Ja', value: true }] }).then((v) => v === true);

  function toast(msg, ms) {
    const t = h('div', { class: 'toast', role: 'status' }, msg);
    overlays().appendChild(t);
    setTimeout(() => t.remove(), ms || 2200);
  }

  /* Konfetti */
  function confetti(amount) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = h('canvas', { class: 'confetti-canvas' });
    document.body.appendChild(c);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    const css = getComputedStyle(document.getElementById('app'));
    const cols = ['--yellow', '--accent', '--good', '--teamA', '--teamB'].map((v) => css.getPropertyValue(v).trim() || '#ffc93c');
    const N = amount || 140;
    const ps = Array.from({ length: N }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * 0.55,
      vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 18 - 6,
      r: Math.random() * 6 + 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4,
      c: cols[Math.floor(Math.random() * cols.length)],
    }));
    let f = 0;
    (function loop() {
      g.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach((p) => {
        p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore();
      });
      if (++f < 150) requestAnimationFrame(loop); else c.remove();
    })();
  }

  /* Zahl hochzählen */
  function countUp(el, from, to, ms) {
    const t0 = performance.now();
    const dur = ms || 900;
    return new Promise((res) => {
      (function frame(t) {
        const k = Math.min(1, (t - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);
        el.textContent = String(Math.round(from + (to - from) * e));
        if (k < 1) requestAnimationFrame(frame); else res();
      })(t0);
    });
  }

  /* Hinweis, welche Antwort-Karte die Jugendlichen öffnen sollen */
  const PADDLES = {
    wetter: 'Wetter', zahl: 'Zahl 0–10', janein: 'Ja / Nein', abcd: 'A B C D', team: 'Team', emo: 'Gefühl',
  };
  function paddleHint(type, extra) {
    return h('div', { class: 'paddle-hint' }, CREW.icon('phone', 22), h('span', null, 'Antwort-Karte: ', h('b', null, PADDLES[type] || type), extra ? ' · ' + extra : ''));
  }

  CREW.ui = { screen, btn, iconBtn, speakBtn, say, choice, next, stepper, tally, valuePad, timer, threeTwoOne, modal, confirm, toast, confetti, countUp, paddleHint, PADDLES, stage, overlays };
})();

/* ---- missions/stehauf.js ---- */
/* Mission Montag: „Steh auf, wenn …“ + Schätzrunde.
   Idee aus den ISA-Materialien (Kennenlern-Spiel), erweitert um eine Schätzrunde:
   Wer die Crew richtig einschätzt, bringt Energie. */
(function () {
  const CREW = window.CREW;

  CREW.registerMission({
    id: 'stehauf',
    day: 1,
    title: 'Steh auf, wenn …',
    tagline: 'Wie gut kennst du deine Crew?',
    minutes: 7,
    themes: ['Zusammenhalt', 'Fremdwahrnehmung', 'Selbstwahrnehmung'],
    etep: 'III–IV',
    eldib: [
      { code: 'K-15', text: 'erzählt von sich selbst' },
      { code: 'K-20', text: 'beschreibt Eigenschaften anderer' },
      { code: 'SOZ-31', text: 'merkt, dass er/sie anders handelt als andere' },
      { code: 'SOZ-32', text: 'hört zu und respektiert andere Meinungen' },
    ],
    teacherNote: 'Pro Karte: Erst schätzen alle geheim auf der Antwort-Karte (Zahl), wie viele gleich aufstehen. Dann stehen alle auf, für die der Satz stimmt. Du tippst ein, wie viele stehen und wie viele richtig geschätzt haben (±1 zählt). Aufstehen ist freiwillig. Wer steht, darf etwas erzählen, muss aber nicht.',
    debrief: [
      'Was hat euch heute überrascht?',
      'Mit wem hattest du heute etwas gemeinsam, das du nicht erwartet hast?',
      'Wie fühlt es sich an, aufzustehen, wenn nur wenige stehen?',
      'Warum schätzen wir andere manchmal falsch ein?',
      'Welche Karte hat heute gefehlt? Denkt euch eine für nächstes Mal aus.',
      'Woran merkt man, dass jemand etwas lieber nicht vor der Gruppe sagen will?',
    ],

    async run(ctx) {
      const { h, ui } = ctx;
      const N = ctx.crewSize;
      const ROUNDS = 5;
      const cards = ctx.pick('stehauf', ROUNDS);
      let right = 0;
      let possible = 0;
      let played = 0;

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const full = 'Steh auf, wenn du ' + card.text.replace(/^…\s*/, '');

        // 1) Schätzen
        const w1 = ctx.screen([
          h('div', { class: 'row between' }, h('span', { class: 'eyebrow' }, 'Karte ' + (i + 1) + ' von ' + cards.length), ui.paddleHint('zahl', 'Schätzen')),
          ui.say(h('span', null, h('span', { class: 'muted' }, 'Steh auf, wenn du '), card.text.replace(/^…\s*/, '')), { speakText: full }),
          h('p', { class: 'lead' }, 'Schätzt heimlich: Wie viele von euch ', h('b', null, N), ' stehen gleich auf?'),
        ]);
        const r1 = await ctx.waitFor(ui.choice(w1, [{ label: 'Alle haben geschätzt', value: 'go', iconRight: 'right' }]));
        if (r1 === ctx.SKIP) continue;

        // 2) Aufstehen
        await ui.threeTwoOne('Aufstehen!');
        const st = ui.stepper({ value: Math.round(N / 2), min: 0, max: N });
        const w2 = ctx.screen([
          h('span', { class: 'eyebrow' }, 'Wer steht?'),
          h('h2', null, 'Wie viele stehen gerade?'),
          st.el,
        ], { center: true });
        const r2 = await ctx.waitFor(ui.choice(w2, [{ label: 'Auflösen', value: 'go', iconRight: 'right' }]));
        if (r2 === ctx.SKIP) continue;
        const standing = st.get();

        // 3) Auflösung
        const big = h('div', { class: 'countdown-big', style: { animation: 'none' } }, '0');
        const correct = ui.stepper({ value: 0, min: 0, max: N });
        const w3 = ctx.screen([
          h('span', { class: 'eyebrow' }, 'Auflösung'),
          h('div', { class: 'row center' }, big, h('span', { class: 'display', style: { fontSize: '2em' } }, 'von ' + N)),
          h('p', { class: 'lead' }, standing === 0 ? 'Niemand. Auch das sagt etwas über die Crew.' : standing === N ? 'Alle! Da habt ihr etwas gemeinsam.' : standing === 1 ? 'Nur eine Person. Respekt fürs Aufstehen!' : 'Wer steht, darf kurz etwas dazu sagen. Muss aber nicht.'),
          h('div', { class: 'card stack', style: { alignItems: 'center' } }, h('b', null, 'Wie viele lagen mit ihrer Schätzung richtig? (±1 zählt)'), correct.el),
        ], { center: true });
        CREW.sound.play('drum');
        await ctx.sleep(700);
        CREW.sound.play('reveal');
        await ui.countUp(big, 0, standing, 700);
        const r3 = await ctx.waitFor(ui.choice(w3, [{ label: i < cards.length - 1 ? 'Nächste Karte' : 'Fertig', value: 'go', iconRight: 'right' }]));
        if (r3 === ctx.SKIP) continue;
        right += correct.get();
        possible += N;
        played++;
        if (correct.get() >= Math.ceil(N / 2)) { CREW.sound.play('great'); ui.toast('Ihr kennt euch gut!'); }
      }

      const acc = possible ? right / possible : 0;
      const energy = played ? 4 + Math.round(6 * acc) : 3;
      let summary = 'Gut gespielt!';
      if (acc >= 0.7) summary = 'Ihr kennt euch richtig gut!';
      else if (acc >= 0.4) summary = 'Ihr kennt euch schon ganz gut.';
      else if (played) summary = 'Ihr habt heute viel Neues übereinander erfahren.';
      return { energy, summary };
    },
  });
})();

/* ---- core/app.js ---- */
/* CREW – App: Startbildschirm, Tages-Session, Antwort-Karte, Solo, Crew-HQ, Lehrermodus.
   Diese Datei wird als LETZTE eingebunden und startet das Spiel. */
(function () {
  'use strict';
  const CREW = window.CREW;
  const { h, clear, pick, sleep, todayISO, weekday, WEEKDAYS } = CREW.util;
  const ui = CREW.ui;
  const S = CREW.state;
  const SKIP = Symbol('skip');
  CREW.SKIP = SKIP;

  /* ---------- Look ---------- */
  const LOOKS = [
    { id: 'arena', label: 'Arena', desc: 'Dick, bunt, wie ein Handyspiel' },
    { id: 'pixel', label: 'Pixel', desc: 'Retro wie ein altes Arcade-Spiel' },

  function makeTeams() {
    return { A: { id: 'A', name: pick(TEAM_A), cls: 'teamA' }, B: { id: 'B', name: pick(TEAM_B), cls: 'teamB' } };
  }

  /* ---------- Laufzeit ---------- */
  let run = null; // aktuelle Session { token, skipWaiter, inMission }
  let tokenCounter = 0;

  class Abort extends Error {}

  /* ---------- Kopfzeile ---------- */
  function renderTopbar() {
    const bar = document.getElementById('topbar');
    clear(bar);
    const li = CREW.levelInfo(S.energy);
    const fill = h('i', { style: { width: li.pct + '%' } });
    CREW.util.append(bar, [
      h('button', { type: 'button', class: 'crew-badge', style: { background: 'none', border: 0, color: 'inherit', padding: 0, cursor: 'pointer' }, onclick: () => goHome(), 'aria-label': 'Zum Start' },
        h('span', { class: 'logo', html: CREW.LOGO }),
        h('span', { class: 'name' }, S.crew.name || 'CREW')),
      h('div', { class: 'energy-mini', title: 'Crew-Energie' },
        CREW.icon('bolt', 22),
        h('span', { class: 'lvl' }, 'Level ' + li.level),
        h('div', { class: 'bar' }, fill)),
      h('div', { class: 'spacer' }),
      run ? ui.iconBtn(null, onXCard, { text: 'X', cls: 'xcard', label: 'X-Karte: Diese Karte überspringen', id: 'btn-x' }) : null,
      run ? ui.iconBtn('pause', showPause, { label: 'Pause', id: 'btn-pause' }) : null,
      ui.iconBtn(S.settings.speech ? 'speaker' : 'speakerOff', () => { S.settings.speech = !S.settings.speech; CREW.save(); if (!S.settings.speech) CREW.stopSpeaking(); renderTopbar(); ui.toast(S.settings.speech ? 'Vorlesen an' : 'Vorlesen aus'); }, { label: 'Vorlesen an/aus', cls: S.settings.speech ? 'on' : '' }),

  async function goHome(force) {

      const ok = await ui.confirm('Session beenden?', 'Die Mission wird abgebrochen. Energie aus dieser Runde gibt es dann nicht.', 'Beenden', 'Weiterspielen');
      if (!ok) return;
    }
    endRun();
    renderHome();
  }
  function endRun() {
    if (run) { run.token = -1; if (run.abort) run.abort(); }
    run = null;
    CREW.stopSpeaking();
    renderTopbar();
  }

  /* X-Karte: jederzeit ohne Begründung überspringen */
  function onXCard() {
    if (run && run.skipWaiter) {
      const w = run.skipWaiter;
      run.skipWaiter = null;
      ui.toast('Übersprungen. Alles gut.');

  /* Pause mit Atemkreis */

  }

  /* Hilfe: immer erreichbar */
  function showHelp() {
    const nums = [
      ['Kanner- a Jugendtelefon', '116 111', 'anonym und kostenlos'],
      ['BEE SECURE Helpline', '8002 1234', 'bei Problemen im Internet'],

      ['Polizei', '113', ''],
    ];
    const body = h('div', { class: 'stack' },
      h('p', { class: 'lead' }, 'Wenn dich etwas belastet: Sprich mit einer erwachsenen Person, der du vertraust. Zum Beispiel hier in der Annexe.'),
      h('div', { class: 'list' }, nums.map(([n, t, d]) => h('div', { class: 'li' }, h('div', null, h('b', null, n), d ? h('div', { class: 'muted small' }, d) : null), h('span', { class: 'display selectable', style: { fontSize: '1.4em' } }, t)))),
      h('p', { class: 'muted small' }, 'X-Karte: Mit dem X oben rechts darfst du jede Karte überspringen. Ohne Begründung.'));
    ui.modal({ title: 'Hilfe', body, actions: [{ label: 'Schließen', value: true }] });
  }

  /* ---------- Startbildschirm ---------- */
  function renderHome() {
    applyLook();
    renderTopbar();
    if (!S.crew.founded) return renderFounding();
    const li = CREW.levelInfo(S.energy);
    const wd = weekday();
    const m = missionForToday();
    const playedToday = S.history.some((x) => x.date === todayISO());
    ui.screen([
      h('div', { class: 'stack enter', style: { gap: '6px', paddingTop: '8px' } },
        h('span', { class: 'eyebrow' }, 'Moien! Heute ist ' + WEEKDAYS[wd]),
        h('h1', { class: 'outline-text' }, S.crew.name || 'CREW')),
      h('div', { class: 'grid two enter-2' },
        tile({ hero: true, icon: 'play', title: playedToday ? 'Noch eine Session' : 'Crew-Session starten', sub: m ? 'Heute: ' + m.title + ' · ca. 10 Minuten' : 'ca. 10 Minuten', onClick: startSession, id: 'tile-session' }),
        tile({ icon: 'phone', title: 'Antwort-Karte', sub: 'Auf dem eigenen iPad: Zahl, Wetter, Ja/Nein … hochhalten', onClick: renderPaddle, id: 'tile-paddle' })),
      h('div', { class: 'grid three enter-3' },
        tile({ icon: 'leaf', title: 'Alleine spielen', sub: 'Chillen und trainieren', onClick: renderSoloHub, id: 'tile-solo' }),
        tile({ icon: 'base', title: 'Crew-HQ', sub: li.max ? 'Voll ausgebaut!' : 'Level ' + li.level + ' · noch ' + li.toNext + ' Energie bis Level ' + (li.level + 1), onClick: renderBase, id: 'tile-base' }),
        tile({ icon: 'lock', title: 'Lehrkraft', sub: 'Missionen, Einstellungen, Fortschritt', onClick: renderTeacherGate, id: 'tile-teacher' })),
    ]);
  }
  function tile(o) {
    const t = h('button', { type: 'button', class: 'tile' + (o.hero ? ' hero' : ''), id: o.id },
      h('span', { class: 't-icon' }, CREW.icon(o.icon, 30)),
      h('span', { class: 't-title' }, o.title),
      o.sub ? h('span', { class: 't-sub' }, o.sub) : null);
    t.addEventListener('click', () => { CREW.sound.play('tap'); o.onClick(); });
    return t;
  }

  /* ---------- Crew gründen (erster Start) ---------- */
  const NAME_A = ['Die Nachtfalken', 'Crew Zero', 'Die Unaufhaltbaren', 'Team Turbo', 'Die Wölfe', 'Squad 404', 'Die Legenden', 'Crew Galaxy', 'Die Phantome', 'Neon Crew', 'Die Rebellen', 'Crew Titan'];
  async function renderFounding() {
    let look = S.crew.look || 'arena';
    let names = CREW.util.shuffle(NAME_A).slice(0, 3);
    let chosen = null;
    const draw = () => {
      applyLook(look);
      const nameRow = h('div', { class: 'row' }, names.map((n) => {
        const c = h('button', { type: 'button', class: 'chip' + (chosen === n ? ' sel' : '') }, n);
        c.addEventListener('click', () => { CREW.sound.play('tap'); chosen = n; input.value = ''; draw(); });
        return c;
      }), ui.iconBtn('shuffle', () => { names = CREW.util.shuffle(NAME_A).slice(0, 3); draw(); }, { label: 'Neue Vorschläge' }));
      const input = h('input', { type: 'text', id: 'crew-name', maxlength: '24', placeholder: 'oder eigenen Crew-Namen eintippen (ohne echte Namen)', value: chosen && !names.includes(chosen) ? chosen : '' });
      input.addEventListener('input', () => { chosen = input.value.trim() || null; });
      const lookRow = h('div', { class: 'grid three' }, LOOKS.map((L) => {
        const t = h('button', { type: 'button', class: 'tile' + (look === L.id ? ' hero' : ''), 'data-look': L.id },
          h('span', { class: 't-title' }, L.label), h('span', { class: 't-sub' }, L.desc));
        t.addEventListener('click', () => { CREW.sound.play('tap'); look = L.id; draw(); });
        return t;
      }));
      ui.screen([
        h('div', { class: 'stack enter' }, h('span', { class: 'eyebrow' }, 'Neue Crew'), h('h1', { class: 'outline-text' }, 'Gründet eure Crew'),
          h('p', { class: 'lead muted' }, 'Stimmt gemeinsam ab. Die Lehrkraft kann alles später im Lehrermodus ändern.')),
        h('div', { class: 'card stack enter-2' }, h('h3', null, '1. Wie heißt eure Crew?'), nameRow, input),
        h('div', { class: 'card stack enter-3' }, h('h3', null, '2. Welcher Look?'), h('p', { class: 'muted small' }, 'Tippt die Looks an, um sie auszuprobieren.'), lookRow),
        h('div', { class: 'row end' }, ui.btn('Crew gründen', async () => {
          const name = (input.value.trim() || chosen || '').slice(0, 24);
          if (!name) { ui.toast('Wählt zuerst einen Namen.'); return; }
          S.crew.name = name; S.crew.look = look; S.crew.founded = true; CREW.save();
          CREW.sound.play('unlock'); ui.confetti();
          renderHome();
        }, { big: true, icon: 'check', id: 'btn-found' })),
      ]);
    };
    draw();
  }

  /* ---------- Missionen ---------- */
  function activeMissions() {
    return CREW.missions.filter((m) => !S.settings.disabled.includes(m.id));
  }
  function missionForToday() {
    const wd = weekday();
    const ms = activeMissions();
    return ms.find((m) => m.day === wd) || null;
  }

  /* Kontext, den jede Mission bekommt */
  function makeCtx(mission, crewSize) {
    const token = run.token;
    const alive = () => run && run.token === token;
    const ctx = {
      SKIP,
      mission,
      crewSize,
      teams: makeTeams(),
      h, ui, sound: CREW.sound, speak: CREW.speak, icon: CREW.icon, util: CREW.util,
      state: S,
      pick: (pool, n, filter) => CREW.pickContent(pool, n, filter),
      alive,
      // Bildschirm neu aufbauen (bricht ab, wenn die Session beendet wurde)
      screen(children, opts) {
        if (!alive()) throw new Abort();
        return ui.screen(children, opts);
      },
      // Auf eine Eingabe warten; X-Karte liefert ctx.SKIP
      waitFor(promise) {
        if (!alive()) return Promise.reject(new Abort());
        return new Promise((resolve, reject) => {
          run.skipWaiter = resolve;
          run.abort = () => reject(new Abort());
          Promise.resolve(promise).then((v) => {
            if (run && run.skipWaiter === resolve) run.skipWaiter = null;
            resolve(v);
          }, reject);
        });
      },
      sleep: (ms) => sleep(ms).then(() => { if (!alive()) throw new Abort(); }),
    };
    return ctx;
  }

  /* ---------- Session-Ablauf ---------- */
  async function startSession(forcedMission) {
    endRun();
    run = { token: ++tokenCounter, skipWaiter: null, inMission: false };
    renderTopbar();
    try {
      // 1) Wer ist da?
      const size = await askCrewSize();
      // 2) Check-in
      const checkin = await doCheckin(size);
      // 3) Mission wählen
      const mission = forcedMission || (await chooseMission());
      if (!mission) return goHome(true);
      // 4) Mission spielen
      run.inMission = true;
      const ctx = makeCtx(mission, size);
      const result = (await mission.run(ctx)) || {};
      run.inMission = false;
      // 5) Nachbesprechung
      await doDebrief(mission, ctx);
      // 6) Energie & Belohnung
      await finish(mission, result, checkin);
    } catch (e) {
      if (e instanceof Abort) return;
      console.error(e);
      ui.screen([h('div', { class: 'card stack' }, h('h2', null, 'Ups, da ist etwas schiefgelaufen.'), h('p', { class: 'muted' }, String(e && e.message || e)), ui.btn('Zum Start', () => goHome(true)))]);
      endRun();
    }
  }

  function guard() { if (!run) throw new Abort(); return run.token; }

  async function askCrewSize() {
    const t = guard();
    const st = ui.stepper({ value: S.lastCrewSize || 5, min: 2, max: 10 });
    const wrap = ui.screen([
      h('div', { class: 'stack enter' }, h('span', { class: 'eyebrow' }, 'Crew-Session'), h('h1', { class: 'outline-text' }, 'Moien Crew!')),
      h('div', { class: 'card stack enter-2', style: { alignItems: 'center', textAlign: 'center' } },
        h('h3', null, 'Wie viele spielen heute mit?'), st.el),
    ], { narrow: true });
    await run_wait(ui.next(wrap, 'Los geht’s', { variant: '' }), t);
    S.lastCrewSize = st.get(); CREW.save();
    return st.get();
  }
  function run_wait(p, t) {
    return new Promise((res, rej) => {
      run.abort = () => rej(new Abort());
      p.then((v) => { if (!run || run.token !== t) rej(new Abort()); else res(v); });
    });
  }

  /* Check-in: Inneres Wetter, anonym */
  async function doCheckin(size) {
    const t = guard();
    const wx = CREW.WEATHER;
    const legend = h('div', { class: 'grid three' }, wx.map((w) => h('div', { class: 'card soft row', style: { flexWrap: 'nowrap' } }, CREW.weatherIcon(w.id, 60), h('div', null, h('b', null, w.label), h('div', { class: 'muted small' }, w.hint)))));
    const wrap = ui.screen([
      h('div', { class: 'row between enter' }, h('div', { class: 'stack', style: { gap: '4px' } }, h('span', { class: 'eyebrow' }, 'Check-in · 1 Minute'), h('h2', null, 'Wie ist dein inneres Wetter?')), ui.paddleHint('wetter')),
      h('p', { class: 'lead muted enter-2' }, 'Stellt es geheim auf eurer Antwort-Karte ein. Oder zeigt es mit der Hand. Niemand muss etwas erklären.'),
      h('div', { class: 'enter-2' }, legend),
    ]);
    const r = await run_wait(ui.choice(wrap, [{ label: 'Überspringen', value: 'skip', variant: 'ghost' }, { label: 'Alle bereit', value: 'go', iconRight: 'right' }]), t);
    if (r === 'skip') return { skipped: true };
    await ui.threeTwoOne('Zeigt her!');
    // Lehrkraft zählt, was gezeigt wird
    const ta = ui.tally(wx.map((w) => ({ id: w.id, label: w.label, icon: CREW.weatherIcon(w.id, 56) })), { max: size });
    const w2 = ui.screen([
      h('div', { class: 'stack' }, h('span', { class: 'eyebrow' }, 'Check-in'), h('h2', null, 'Was zeigt die Crew?')),
      h('p', { class: 'muted' }, 'Tippt kurz mit, wie oft welches Wetter gezeigt wird. Namen werden nicht gespeichert.'),
      ta.el,
    ]);
    await run_wait(ui.next(w2, 'Crew-Wetter anzeigen'), t);
    const counts = ta.get();
    const stormy = (counts.regen || 0) + (counts.gewitter || 0);
    const sunny = (counts.sonne || 0) + (counts.wolkig || 0);
    let line;
    if (!ta.total()) line = 'Danke fürs Mitmachen.';
    else if (stormy === 0 && sunny >= ta.total() / 2) line = 'Gute Aussichten heute. Nutzt die Energie!';
    else if (stormy >= Math.max(2, ta.total() / 2)) line = 'Heute ist bei einigen Sturm. Wir nehmen Rücksicht aufeinander.';
    else if (stormy > 0) line = 'Nicht bei allen scheint die Sonne. Das ist okay. Wir nehmen Rücksicht.';
    else line = 'Gemischtes Wetter. Ganz normal für eine Crew.';
    const board = h('div', { class: 'row center', style: { gap: '18px' } }, wx.filter((w) => counts[w.id]).map((w) =>
      h('div', { class: 'stack pop', style: { alignItems: 'center', gap: '4px' } }, CREW.weatherIcon(w.id, 96), h('span', { class: 'display', style: { fontSize: '2em' } }, '× ' + counts[w.id]))));
    CREW.sound.play('reveal');
    const w3 = ui.screen([
      h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } }, h('span', { class: 'eyebrow' }, 'Crew-Wetter'), h('h2', null, line)),
      board,
    ], { center: true });
    const opts = [{ label: 'Zur Mission', value: 'go', iconRight: 'right' }];
    if (stormy > 0) opts.unshift({ label: '1 Minute runterkommen', value: 'chill', variant: 'good', icon: 'leaf' });
    const r2 = await run_wait(ui.choice(w3, opts), t);
    if (r2 === 'chill') await miniBreathing(t);
    return { skipped: false, counts };
  }

  async function miniBreathing(t) {
    const circle = h('div', { style: { width: 'min(40vmin, 300px)', aspectRatio: '1', borderRadius: '50%', background: 'radial-gradient(circle, var(--good) 0%, color-mix(in srgb, var(--good) 25%, transparent) 70%)', border: 'var(--bw) solid var(--line)', animation: 'breathe 10s ease-in-out infinite' } });
    const label = h('div', { class: 'display', style: { fontSize: '2.2em' } }, 'Einatmen …');
    const wrap = ui.screen([h('span', { class: 'eyebrow' }, 'Gemeinsam atmen'), circle, label, h('p', { class: 'muted' }, 'Folgt dem Kreis. Sechs Atemzüge.')], { center: true });
    for (let i = 0; i < 6; i++) {
      label.textContent = 'Einatmen …'; CREW.sound.play('breatheIn');
      await sleep(5000); if (!run || run.token !== t) throw new Abort();
      label.textContent = 'Ausatmen …'; CREW.sound.play('breatheOut');
      await sleep(5000); if (!run || run.token !== t) throw new Abort();
    }
    await run_wait(ui.next(wrap, 'Weiter'), t);
  }

  async function chooseMission() {
    const t = guard();
    const ms = activeMissions();
    let m = missionForToday();
    if (!ms.length) {
      ui.screen([h('div', { class: 'card' }, h('h2', null, 'Keine Mission aktiv.'), h('p', null, 'Im Lehrermodus Missionen einschalten.'))]);
      await sleep(1500);
      return null;
    }
    for (;;) {
      if (!m) m = await pickMissionList(ms, t);
      const wrap = ui.screen([
        h('div', { class: 'stack enter', style: { alignItems: 'center', textAlign: 'center' } },
          h('span', { class: 'eyebrow' }, 'Mission des Tages'),
          h('h1', { class: 'outline-text' }, m.title),
          m.tagline ? h('p', { class: 'lead' }, m.tagline) : null,
          h('div', { class: 'row center' }, h('span', { class: 'pill accent' }, 'ca. ' + (m.minutes || 7) + ' Min'), (m.themes || []).slice(0, 3).map((x) => h('span', { class: 'pill' }, x)))),
      ], { center: true });
      const r = await run_wait(ui.choice(wrap, [{ label: 'Andere Mission', value: 'other', variant: 'ghost', icon: 'shuffle' }, { label: 'Start!', value: 'go', iconRight: 'play' }]), t);
      if (r === 'go') return m;
      m = null;

  }
  function pickMissionList(ms, t) {
    return run_wait(new Promise((resolve) => {
      ui.screen([
        h('div', { class: 'stack' }, h('span', { class: 'eyebrow' }, 'Mission wählen'), h('h2', null, 'Worauf habt ihr Lust?')),
        h('div', { class: 'grid two' }, ms.map((m) => {
          const t2 = h('button', { type: 'button', class: 'tile', 'data-mission': m.id },
            h('span', { class: 't-title' }, m.title),
            h('span', { class: 't-sub' }, (m.tagline || '') + (m.day ? ' · sonst ' + WEEKDAYS[m.day] : '')));
          t2.addEventListener('click', () => { CREW.sound.play('tap'); resolve(m); });
          return t2;
        })),
      ]);
    }), t);
  }

  /* Nachbesprechung: kurz, freiwillig */
  async function doDebrief(mission, ctx) {
    const t = guard();
    const qs = mission.debrief && mission.debrief.length ? mission.debrief : ['Was nehmt ihr aus der Runde mit?'];
    let q = pick(qs);
    const card = ui.say(q, { eyebrow: 'Kurz drüber reden' });
    const tm = ui.timer(90, { autostart: false });
    const wrap = ui.screen([
      card,
      h('div', { class: 'row between' },
        h('p', { class: 'muted', style: { maxWidth: '46ch' } }, 'Wer will, sagt etwas. Passen ist erlaubt. Die Lehrkraft moderiert.'),
        h('div', { class: 'row' }, tm.el, ui.btn('Timer', () => tm.start(), { variant: 'ghost', small: true, icon: 'timer' }))),
    ]);
    for (;;) {
      const r = await run_wait(ui.choice(wrap, [{ label: 'Andere Frage', value: 'other', variant: 'ghost', icon: 'shuffle' }, { label: 'Fertig', value: 'done', iconRight: 'right' }]), t);
      if (r === 'done') break;
      const rest = qs.filter((x) => x !== q);
      q = rest.length ? pick(rest) : q;
      card.querySelector('.say').textContent = q;
      wrap.lastChild.remove();
    }
    tm.stop();
  }

  async function finish(mission, result, checkin) {
    const t = guard();
    const base = Math.max(2, Math.min(12, Math.round(result.energy || 5)));
    const bonus = checkin && !checkin.skipped ? 2 : 0;

        h('ul', { class: 'stack', style: { margin: 0, paddingLeft: '1.2em' } },
          h('li', null, 'X-Karte (oben rechts): Jede:r darf jede Karte ohne Begründung überspringen.'),
          h('li', null, 'Pause-Knopf mit Atemkreis. Hilfe-Knopf mit Kanner- a Jugendtelefon (116 111), BEE SECURE Helpline (8002 1234), Notruf 112, Polizei 113.'),
          h('li', null, 'Heikle Karten sind aus, bis du sie unter „Inhalte“ einschaltest.'),
          h('li', null, 'Gespeichert wird nur auf diesem Gerät, ohne Namen.'))),
      credits.length ? h('div', { class: 'card stack' }, h('h3', null, 'Danke & Lizenzen'), h('ul', { class: 'small', style: { margin: 0, paddingLeft: '1.2em' } }, credits.map((c) => h('li', null, c)))) : null);
  }

  /* ---------- Start ---------- */
  function boot() {
    CREW.missions.sort((a, b) => (a.day || 9) - (b.day || 9));
    applyLook();
    renderHome();
    // Offline-Unterstützung (nur auf der echten Webseite, nicht in der Vorschau)
    try {
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    } catch (e) { /* egal */ }
  }

  CREW.app = { renderHome, startSession, renderPaddle, renderSoloHub, renderBase, renderTeacher, goHome, applyLook, LOOKS };
  // Für automatische Tests
  CREW.debug = {
    found(name, look) { S.crew.name = name || 'Test Crew'; S.crew.look = look || 'arena'; S.crew.founded = true; CREW.save(); renderHome(); },
    startMission(id) { const m = CREW.missions.find((x) => x.id === id); if (m) startSession(m); return !!m; },
    startSolo(id) { const g = CREW.soloGames.find((x) => x.id === id); if (g) startSolo(g); return !!g; },
    addEnergy(n) { S.energy += n; CREW.save(); renderTopbar(); },
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
