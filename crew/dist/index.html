.app[data-look="neon"] .solo-sign.on { background: transparent; color: var(--good); border-color: var(--good); }
.solo-dec-clue { font-size: 1.12em; text-wrap: pretty; }

/* Intro */
.solo-dec-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
.solo-dec-hero-art { position: relative; display: flex; align-items: center; padding: 8px 18px 8px 0; }
.solo-dec-hero-ava { width: clamp(110px, 16vw, 180px); box-shadow: 0 var(--lift) 0 var(--line); }
.solo-dec-hero-bubble {
  position: relative; margin-right: 14px; transform: rotate(-4deg);
  padding: 10px 16px;
  background: var(--text); color: var(--ink);
  font-family: var(--font-display); font-size: 1.2em; white-space: nowrap;
  border: var(--bw) solid var(--line); border-radius: 18px;
  box-shadow: 0 var(--lift) 0 var(--line);
}
.solo-dec-hero-bubble::after {
  content: ""; position: absolute; right: -11px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
  background: var(--text); border-right: var(--bw) solid var(--line); border-top: var(--bw) solid var(--line);
  transform: rotate(45deg);
}
.solo-dec-hero-q {
  position: absolute; right: 2px; top: -4px;
  width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 50%;
  background: var(--yellow); color: var(--yellow-ink);
  border: var(--bw) solid var(--line);
  font-family: var(--font-display); font-size: 1.5em;
  box-shadow: 0 3px 0 var(--line);
}
.app[data-look="pixel"] .solo-dec-hero-bubble, .app[data-look="pixel"] .solo-dec-hero-q { border-radius: 0; }
.app[data-look="neon"] .solo-dec-hero-bubble { background: transparent; color: var(--text); border-color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); }
.app[data-look="neon"] .solo-dec-hero-bubble::after { background: var(--bg); border-color: var(--accent); }
.app[data-look="neon"] .solo-dec-hero-q { background: transparent; color: var(--yellow); border-color: var(--yellow); }
.solo-signs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.solo-sign-card { display: flex; align-items: center; gap: 14px; }
.solo-sign-ic {
  flex: none; width: 52px; height: 52px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  background: var(--accent); color: var(--accent-ink);
  border: var(--bw) solid var(--line);
}
.app[data-look="neon"] .solo-sign-ic { background: transparent; color: var(--accent); border-color: var(--accent); }

.solo-dec-start { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }

/* Bilanz */
.solo-dec-total { gap: 14px; color: var(--yellow); }
.solo-dec-big { font-size: clamp(3.6em, 8vw, 5em); color: var(--yellow); line-height: 1; font-variant-numeric: tabular-nums; }
.solo-dec-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; }
.solo-dec-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 14px 10px; }
.solo-dec-tile b { font-size: 2.1em; font-weight: 400; line-height: 1; }
.solo-dec-tip { gap: 12px; align-items: center; text-align: left; width: 100%; box-sizing: border-box; }
.solo-dec-tip .ic { color: var(--good); flex: none; }

/* ---------- Schmale Bildschirme ---------- */
@media (max-width: 860px) {
  .solo-dec-reveal { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .solo-dec-scene { grid-template-columns: 1fr; }
  .solo-dec-ava { flex-direction: row; justify-content: flex-start; }
  .solo-dec-ava-img { width: 84px; flex: none; }
  .solo-dec-quote { margin-left: 0; }
  .solo-dec-quote::before { display: none; }
  .solo-dec-answers { grid-template-columns: 1fr 1fr; gap: 10px; }
  .solo-opt { font-size: 1.05em; min-height: 64px; padding: 12px; gap: 10px; }
  .solo-lv { min-height: 92px; font-size: 1em; padding: 10px 6px; }
  .solo-stat-label { display: none; }
  .solo-dec-hero { grid-template-columns: 1fr; }
  .solo-dec-hero-art { display: none; }
  .solo-dec-start-btns { width: 100%; flex-direction: row-reverse; flex-wrap: nowrap; }
  .solo-dec-start-btns .btn { flex: 1 1 0; padding-left: 12px; padding-right: 12px; }
  .solo-jar-box { height: clamp(260px, calc(100vh - 390px), 600px); }
  .solo-jar-msg { text-align: center; justify-content: center; }
  .solo-jar-btns { width: 100%; justify-content: center; }
  .solo-sense-card { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .solo-sense-card .row.between { justify-content: center; gap: 12px; }
  .solo-sense-big { width: 116px; }
  .solo-sense-icon { width: 46px; height: 46px; right: -18px; bottom: -6px; }
  .solo-ex { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-areas: "art text" "art pill"; column-gap: 14px; row-gap: 8px; align-items: center; padding: 14px; }
  .solo-ex-art { grid-area: art; height: 92px; }
  .solo-ex-text { grid-area: text; }
  .solo-ex-pill { grid-area: pill; justify-self: start; }
  .solo-dec-word { font-size: 2.6em; }
  .app[data-look="pixel"] .solo-dec-word { font-size: 2.3em; }
  .solo-ex .t-title { font-size: 1.25em; }
  .solo-ex .t-sub { font-size: 0.85em; }
  .solo-dot { width: 60px; height: 60px; font-size: 1.2em; }
  .solo-feel { min-height: 96px; font-size: 0.9em; }
  .solo-dec-tiles { gap: 8px; }
  .solo-dec-tile b { font-size: 1.6em; }
  .solo-sense-mini { min-width: 0; flex: 1 1 56px; padding: 10px 6px; font-size: 0.85em; }
  .solo-seg-btn b { font-size: 1.8em; }
}

/* ---- base/hq.css ---- */
/* Crew-HQ – Szene als Inline-SVG. Alle Klassen mit Präfix hq-.
   Farben laufen über Variablen, damit das HQ in Arena, Pixel und Neon passt. */

.hq-scene {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  background: var(--bg);
  font-family: var(--font-display);
  /* Raum (Arena) */
  --hq-ceil: #150f3e;
  --hq-wall: #35297f;
  --hq-side: #261c66;
  --hq-side-r: #221960;
  --hq-edge: #1a1350;
  --hq-floor: #4e2f60;
  --hq-plank: #3a2150;
  --hq-trim: #1c1448;
  --hq-pipe: #54479f;
  --hq-pipe2: #2b2270;
  --hq-brick: #7a3d68;
  --hq-brick2: #6a345d;
  --hq-mortar: #43307a;
  --hq-plaster: #473a9a;
  --hq-stroke: #0e0a26;
  --hq-sw: 4px;
  --hq-dark: #07041c;
  --hq-shade: .26;
  --hq-light: .16;
}

/* ---------- Pixel: dunkles Schiefer-Blau, harte Kanten ---------- */
.app[data-look="pixel"] .hq-scene {
  shape-rendering: crispEdges;
  --hq-ceil: #0b0f18;
  --hq-wall: #26344c;
  --hq-side: #1a2436;
  --hq-side-r: #172031;
  --hq-edge: #0b0f18;
  --hq-floor: #4a3530;
  --hq-plank: #2f211d;
  --hq-trim: #0e131d;
  --hq-pipe: #3f5470;
  --hq-pipe2: #1b2535;
  --hq-brick: #86493a;
  --hq-brick2: #733d31;
  --hq-mortar: #3a3a48;
  --hq-plaster: #34455f;
  --hq-stroke: #05070d;
  --hq-dark: #03050a;
}
.app[data-look="pixel"] .hq-scene .hq-o,
.app[data-look="pixel"] .hq-scene .hq-o1 { stroke-linejoin: miter; stroke-linecap: square; }

/* ---------- Neon: fast schwarz, Konturen leuchten ---------- */
.app[data-look="neon"] .hq-scene {
  --hq-ceil: #05050f;
  --hq-wall: #0f0f2c;
  --hq-side: #0a0a22;
  --hq-side-r: #09091f;

.hq-halos .hq-tw:nth-child(3n+1) { animation-delay: -0.9s; animation-duration: 3.4s; }
.hq-halos .hq-tw:nth-child(4n+2) { animation-delay: -1.7s; animation-duration: 2.2s; }

.hq-star.hq-tw { animation: hq-twinkle 3.2s ease-in-out infinite; }

.hq-woof { transform-origin: center; animation: hq-thump .52s ease-out infinite; }
.hq-woof + .hq-woof { animation-delay: -.26s; }
.hq-ring { animation: hq-hue 6s linear infinite; }
.hq-nt { transform-origin: center; animation: hq-note 3.6s ease-in-out infinite; opacity: 0; }
.hq-nt2 { animation-delay: -1.2s; }
.hq-nt3 { animation-delay: -2.4s; }

.hq-mote { animation: hq-drift 7s ease-in-out infinite; }
.hq-m1 { animation-delay: -2s; animation-duration: 9s; }
.hq-m2 { animation-delay: -4s; animation-duration: 6s; }
.hq-m3 { animation-delay: -5.5s; animation-duration: 8s; }

.hq-sway { transform-origin: 50% 0%; animation: hq-sway 6s ease-in-out infinite; }
.hq-sway2 { transform-origin: 50% 100%; animation: hq-sway 7s ease-in-out infinite; }

.hq-game { transform-origin: center; animation: hq-invader 2.4s steps(6) infinite; }
.hq-screen { animation: hq-screen 3s steps(3) infinite; }

.hq-cars { animation: hq-car 7s linear infinite; }
.hq-cars2 { animation: hq-car-back 9s linear infinite; }
.hq-blink { animation: hq-blink 1.6s steps(1) infinite; }

.hq-spk { transform-origin: center; animation: hq-spark 2.2s ease-in-out infinite; }

.hq-spk3 { animation-delay: -0.6s; }
.hq-spk4 { animation-delay: -1.6s; }
.hq-dots ellipse { animation: hq-dot 3s ease-in-out infinite; }
.hq-dots ellipse:nth-child(2n) { animation-delay: -1s; animation-duration: 2.4s; }
.hq-dots ellipse:nth-child(3n) { animation-delay: -2s; animation-duration: 3.6s; }

.hq-flick { animation: hq-flicker 8s steps(1) infinite; }

/* Neu freigeschaltet: Teil ploppt rein, Abzeichen wippt */
.hq-new { transform-origin: 50% 100%; animation: hq-pop 900ms 250ms cubic-bezier(.2, 1.5, .4, 1) both; }
.hq-badge { transform-origin: center; animation: hq-bob 1.4s ease-in-out infinite; }
.hq-spot { animation: hq-fade 700ms ease both; }

@keyframes hq-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes hq-glowpulse { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }
@keyframes hq-thump { 0% { transform: scale(1.06); } 60%, 100% { transform: scale(1); } }
@keyframes hq-hue { 0%, 100% { stroke: var(--good); } 33% { stroke: var(--teamB); } 66% { stroke: var(--teamA); } }
@keyframes hq-note { 0% { opacity: 0; transform: translate(0, 16px) rotate(-8deg); } 25% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -44px) rotate(8deg); } }
@keyframes hq-drift { 0%, 100% { transform: translate(0, 0); opacity: .2; } 50% { transform: translate(14px, -26px); opacity: .7; } }
@keyframes hq-sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
@keyframes hq-invader { 0% { transform: translateX(-26px); } 50% { transform: translateX(26px); } 100% { transform: translateX(-26px); } }
@keyframes hq-screen { 0%, 100% { fill: #0c1a3c; } 50% { fill: #111f48; } }
@keyframes hq-car { from { transform: translateX(0); } to { transform: translateX(340px); } }
@keyframes hq-car-back { from { transform: translateX(0); } to { transform: translateX(-340px); } }
@keyframes hq-blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .15; } }
@keyframes hq-spark { 0%, 100% { transform: scale(.4) rotate(0deg); opacity: .2; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
@keyframes hq-dot { 0%, 100% { opacity: .15; } 50% { opacity: .7; } }
@keyframes hq-flicker { 0%, 88%, 90%, 93%, 100% { opacity: 1; } 89%, 92% { opacity: .35; } }
@keyframes hq-pop { 0% { opacity: 0; transform: translateY(-30px) scale(.5); } 60% { opacity: 1; transform: translateY(0) scale(1.08); } 100% { opacity: 1; transform: none; } }
@keyframes hq-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes hq-fade { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .hq-scene *, .hq-scene *::before, .hq-scene *::after { animation: none !important; }
  .hq-nt { opacity: .9; }
}

<noscript>CREW braucht JavaScript.</noscript>
<script>
/* ---- core/util.js ---- */
/* CREW – Grundwerkzeuge: DOM-Helfer, Zufall, Speicher, Zustand. */
(function () {
  'use strict';
  const CREW = (window.CREW = window.CREW || {});

  /* ---------- DOM ---------- */
  // h('div', {class:'x', onclick:fn, style:{...}, dataset:{...}}, kids...)
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    append(el, kids);
    return el;
  }
  function append(el, kids) {
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false || kid === true) continue;
      el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  /* ---------- Zufall & Kleinkram ---------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const weekday = () => new Date().getDay(); // 0 = So, 1 = Mo … 6 = Sa
  const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- Speicher (nur lokal, mit Präfix) ---------- */
  const PREFIX = 'crew_v1_';
  const memory = {};
  const store = {
    get(key, fallback) {
      try {
        const raw = window.localStorage.getItem(PREFIX + key);
        if (raw != null) return JSON.parse(raw);
      } catch (e) { /* privat/gesperrt: Speicher im RAM */ }
      return key in memory ? memory[key] : fallback;
    },
    set(key, value) {
      memory[key] = value;
      try { window.localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* egal */ }
    },
    del(key) {
      delete memory[key];
      try { window.localStorage.removeItem(PREFIX + key); } catch (e) { /* egal */ }
    },
  };

  /* ---------- Zustand ---------- */
  // Es werden KEINE Namen oder Daten einzelner Jugendlicher gespeichert.
  const DEFAULT_STATE = () => ({
    v: 1,
    crew: { name: '', look: 'arena', founded: false },
    energy: 0,
    history: [],          // [{date, mission, energy}]
    used: {},             // pool -> [ids] schon gespielt
    lastCrewSize: 5,
    settings: {
      pin: '1234',
      sound: true,
      speech: true,
      sensitive: false,   // heikle Karten zeigen?
      disabled: [],       // ausgeschaltete Missionen
    },
    solo: {},             // Bestwerte pro Solo-Spiel (ohne Namen)
    hq: { owned: [] },    // Crew-HQ: freigeschaltete Teile (Nummern 1–12), von der Crew gewählt
    records: {},          // Crew-Rekord (beste Punkte) pro Mission – nur für die ganze Crew
  });

  function deepMerge(base, extra) {
    if (!extra || typeof extra !== 'object') return base;
    for (const [k, v] of Object.entries(extra)) {
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        deepMerge(base[k], v);
      } else {
        base[k] = v;
      }
    }
    return base;
  }

  const state = deepMerge(DEFAULT_STATE(), store.get('state', null));
  const listeners = new Set();
  function save() {
    store.set('state', state);
    listeners.forEach((fn) => { try { fn(state); } catch (e) { console.error(e); } });
  }
  function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function resetState() {
    const fresh = DEFAULT_STATE();
    fresh.settings.pin = state.settings.pin;
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, fresh);
    save();
  }
  function importState(obj) {
    if (!obj || typeof obj !== 'object' || obj.v !== 1) throw new Error('Das ist kein gültiger CREW-Spielstand.');
    const fresh = deepMerge(DEFAULT_STATE(), obj);
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, fresh);
    save();
  }
  function exportCode() {
    const json = JSON.stringify(state);
    return btoa(unescape(encodeURIComponent(json)));
  }
  function importCode(code) {
    const json = decodeURIComponent(escape(atob(String(code).trim())));
    importState(JSON.parse(json));
  }

  /* ---------- Levels der Crew-Basis ---------- */
  // Schnelle erste Erfolge: Session 1 schaltet immer Level 1 frei, in Woche 1 fast jede Session etwas,
  // später alle 3–4 Sessions (ca. 10 Wochen pro Saison).
  const LEVELS = [0, 6, 18, 34, 54, 78, 106, 138, 174, 214, 258, 306, 358];
  function levelInfo(energy) {
    let lvl = 0;
    for (let i = 0; i < LEVELS.length; i++) if (energy >= LEVELS[i]) lvl = i;
    const cur = LEVELS[lvl];
    const next = LEVELS[lvl + 1];
    const max = next == null;
    return {
      level: lvl,
      max,
      cur,
      next: max ? cur : next,
      pct: max ? 100 : Math.round(((energy - cur) / (next - cur)) * 100),
      toNext: max ? 0 : next - energy,
    };
  }

  /* ---------- Inhalte ziehen ---------- */
  // Zieht n Einträge aus CREW.content[pool], bevorzugt noch nicht gespielte.
  // Heikle Einträge (heikel: true) nur, wenn die Lehrkraft sie freigibt.
  function pickContent(pool, n, filter) {
    const all = (CREW.content[pool] || []).filter((it) => (state.settings.sensitive || !it.heikel) && (!filter || filter(it)));
    if (!all.length) return [];
    const used = new Set(state.used[pool] || []);
    let fresh = all.filter((it) => !used.has(it.id));
    if (fresh.length < n) {
      state.used[pool] = [];
      fresh = all;
    }
    const chosen = shuffle(fresh).slice(0, n);
    state.used[pool] = [...(state.used[pool] || []), ...chosen.map((c) => c.id)];
    save();
    return chosen;
  }

  CREW.content = CREW.content || {};
  CREW.util = { h, append, clear, shuffle, pick, clamp, sleep, todayISO, weekday, WEEKDAYS, escapeHtml };
  CREW.store = store;
  CREW.state = state;
  CREW.save = save;
  CREW.onChange = onChange;
  CREW.resetState = resetState;
  CREW.exportCode = exportCode;
  CREW.importCode = importCode;
  CREW.LEVELS = LEVELS;
  CREW.levelInfo = levelInfo;
  CREW.pickContent = pickContent;

  /* ---------- Registrierung von Modulen ---------- */
  CREW.missions = CREW.missions || [];
  CREW.soloGames = CREW.soloGames || [];
  CREW.registerMission = (m) => { CREW.missions.push(m); };
  CREW.registerSolo = (g) => { CREW.soloGames.push(g); };
})();

/* CREW – Töne (selbst erzeugt mit WebAudio, keine Dateien) und Vorlesen. */
(function () {
  'use strict';
  const CREW = window.CREW;
  let ctx = null;
  let master = null;

  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  // iPad: Ton erst nach der ersten Berührung erlaubt
  ['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
    window.addEventListener(ev, () => { if (CREW.state.settings.sound) ac(); }, { once: true, passive: true })
  );

  function tone(freq, start, dur, type, vol, slideTo) {
    const a = ac();
    if (!a) return;
    const t0 = a.currentTime + start;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  function noise(start, dur, vol, fromHz, toHz) {
    const a = ac();
    if (!a) return;
    const t0 = a.currentTime + start;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(fromHz || 800, t0);
    f.frequency.exponentialRampToValueAtTime(toHz || 3000, t0 + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t0);
  }

    tap: () => tone(660, 0, 0.07, 'triangle', 0.25),
    tick: () => tone(1200, 0, 0.04, 'square', 0.08),
    count: () => tone(520, 0, 0.12, 'triangle', 0.35),
    go: () => { tone(784, 0, 0.1, 'square', 0.2); tone(1046, 0.08, 0.22, 'square', 0.2); },
    good: () => { tone(660, 0, 0.1, 'triangle', 0.35); tone(990, 0.08, 0.18, 'triangle', 0.35); },
    great: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.07, 0.22, 'triangle', 0.32)),
    soft: () => { tone(392, 0, 0.14, 'sine', 0.3); tone(330, 0.1, 0.22, 'sine', 0.25); },
    reveal: () => { noise(0, 0.45, 0.25, 400, 5000); tone(880, 0.35, 0.25, 'triangle', 0.3); },
    whoosh: () => noise(0, 0.3, 0.18, 2000, 400),
    unlock: () => {
      [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, i * 0.09, 0.28, 'square', 0.14));
      noise(0.55, 0.5, 0.12, 3000, 8000);
    },
    drum: () => { for (let i = 0; i < 14; i++) tone(120 + (i % 2) * 20, i * 0.06, 0.05, 'triangle', 0.25 + i * 0.015); },
    breatheIn: () => tone(220, 0, 3.8, 'sine', 0.12, 330),
    breatheOut: () => tone(330, 0, 5.5, 'sine', 0.1, 196),

  function play(name) {
    if (!CREW.state.settings.sound) return;
    try { (SFX[name] || SFX.tap)(); } catch (e) { /* Ton ist Bonus */ }
  }

  /* ---------- Vorlesen ---------- */
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = window.speechSynthesis.getVoices().filter((v) => /^de(-|_|$)/i.test(v.lang));
    voice = vs.find((v) => /de-DE/i.test(v.lang) && /anna|helena|petra|google|markus|yannick/i.test(v.name)) || vs[0] || null;
    return voice;
  }

    pickVoice();

  }
  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return false;
    try {

      u.lang = 'de-DE';

    } catch (e) { return false; }

    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) { /* egal */ }
  }

  CREW.stopSpeaking = stopSpeaking;
  CREW.canSpeak = () => 'speechSynthesis' in window;
})();

      front = `<path d="M47 68 C41 36 62 23 84 25 C107 26 119 43 113 63 C106 50 94 44 80 45 C66 46 55 54 50 72 Z" fill="${hair}" ${S}/>`;
    }
    // Gesicht je nach Stimmung
    let eyes;
    if (mood === 'froh') eyes = `<path d="M73 71 Q78 64 83 71 M95 71 Q100 64 105 71" ${L}/>`;
    else if (mood === 'wut' || mood === 'genervt') eyes = `<ellipse cx="78" cy="70" rx="3.8" ry="3.3" fill="${INK}"/><ellipse cx="100" cy="70" rx="3.8" ry="3.3" fill="${INK}"/>`;
    else eyes = `<ellipse cx="78" cy="69" rx="3.6" ry="4.6" fill="${INK}"/><ellipse cx="100" cy="69" rx="3.6" ry="4.6" fill="${INK}"/>`;
    const mouth = {
      wut: `<path d="M81 94 Q91 83 101 94 Q91 97 81 94 Z" fill="${INK}"/>`,
      genervt: `<path d="M83 91 L99 88" ${L}/>`,
      neutral: `<path d="M83 89 Q91 91 99 89" ${L}/>`,
      ruhig: `<path d="M82 87 Q91 94 100 87" ${L}/>`,
      froh: `<path d="M80 86 Q91 101 102 86 Z" fill="${INK}"/><path d="M85 89 Q91 91.5 97 89" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>`,
    }[mood] || '';
    let extra = '';
    if (p.extra === 'kopfhoerer') extra = `<path d="M60 119 Q80 133 100 119" stroke="#2b2744" stroke-width="6" fill="none"/><rect x="46" y="108" width="15" height="21" rx="6" fill="#2b2744" ${S}/><rect x="99" y="108" width="15" height="21" rx="6" fill="#2b2744" ${S}/><circle cx="53.5" cy="118.5" r="3" fill="${acc}"/><circle cx="106.5" cy="118.5" r="3" fill="${acc}"/>`;
    else if (p.extra === 'brille') extra = `<g fill="rgba(255,255,255,.2)" stroke="${INK}" stroke-width="3"><rect x="68" y="60.5" width="20" height="16" rx="5.5"/><rect x="90" y="60.5" width="20" height="16" rx="5.5"/></g><path d="M88 67 h2 M68 66 L53 63" ${L} stroke-width="3"/>`;
    else if (p.extra === 'ohrring') extra = `<circle cx="49" cy="84" r="3.8" fill="#ffc93c" stroke="${INK}" stroke-width="2"/>`;
    // Wut: kleiner Blitz am Kopf (wie der Blitz zwischen den zwei Wegen auf dem Treppen-Plakat)
    const vein = mood === 'wut' ? `<path d="M124 6 L110 27 H118.5 L112 45 L130 20 H121.5 L129 6 Z" fill="#ffc93c" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>` : '';
    return `<svg viewBox="0 0 160 170" aria-hidden="true" focusable="false"><g${flip ? ' transform="translate(160 0) scale(-1 1)"' : ''}>` +
      `<path d="M70 94 h20 v26 h-20 z" fill="${skin}" ${S}/>` +
      `<path d="M18 170 C18 131 45 115 80 115 C115 115 142 131 142 170 Z" fill="${col}" ${S}/>` +
      `<path d="M55 117 C60 137 100 137 105 117" fill="rgba(0,0,0,.22)" ${S}/>` +
      `<path d="M71 132 l-2 20 M89 132 l2 20" stroke="rgba(255,255,255,.85)" stroke-width="3.5" stroke-linecap="round"/>` +
      back +
      `<ellipse cx="50" cy="71" rx="7" ry="10" fill="${skin}" ${S}/>` +
      `<ellipse cx="80" cy="66" rx="32" ry="37" fill="${skin}" ${S}/>` +
      front + eyes +
      `<path d="${BROWS[mood] || BROWS.neutral}" ${L} stroke-width="4"/>` +
      `<path d="M96 72 Q101 79 95 81" ${L} stroke-width="2.8"/>` +
      mouth + extra + vein +
      '</g></svg>';
  }
  function makeAvatar(p, mood, flip) {
    const el = h('div', { class: 'clash-ava', role: 'img', 'aria-label': p.name });
    el.dataset.mood = mood;
    el.innerHTML = avatarSVG(p, mood, flip);
    return {
      el,
      set(m) {
        if (el.dataset.mood === m) return;
        el.dataset.mood = m;
        el.innerHTML = avatarSVG(p, m, flip);
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
      },
    };
  }
  const person = (G, side) => (side === 'B' ? G.scene.personB : G.scene.personA);

  /* ---------- Hitze-Meter 0–100 ---------- */
  const heatWord = (v) => (v < 25 ? 'cool' : v < 50 ? 'warm' : v < 75 ? 'heiß' : 'kocht');
  const heatLevel = (v) => (v < 25 ? 0 : v < 50 ? 1 : v < 75 ? 2 : 3);
  function heatMeter(start) {
    let v = clamp(Math.round(start), 0, 100);
    const cover = h('i', { class: 'clash-heat-cover', style: { width: 100 - v + '%' } });
    const num = h('b', { class: 'num' }, String(v));
    const word = h('span', { class: 'word' }, heatWord(v));
    const el = h('div', { class: 'clash-heat', role: 'meter', 'aria-label': 'Hitze-Meter', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(v) },
      h('div', { class: 'clash-heat-head' }, h('span', { class: 'clash-flame' }, ownIcon('flame', 26)), h('span', { class: 'lbl' }, 'Hitze'), word, num),
      h('div', { class: 'clash-heat-track' }, cover));
    el.dataset.level = String(heatLevel(v));
    function set(n) {
      const from = v;
      v = clamp(Math.round(n), 0, 100);
      if (v === from) return;
      cover.style.width = 100 - v + '%';
      el.dataset.level = String(heatLevel(v));
      el.setAttribute('aria-valuenow', String(v));
      word.textContent = heatWord(v);
      el.classList.remove('up', 'down');
      void el.offsetWidth;
      el.classList.add(v > from ? 'up' : 'down');
      CREW.ui.countUp(num, from, v, 900);
    }
    return { el, set, get: () => v };
  }

  /* ---------- Friedenstreppe: zwei Wege (A oben, B unten), ab Stufe 4 gemeinsam ---------- */
  // In der Gruppe spielt pro Level 1–3 nur eine Seite (TURNS_GROUP)
  const groupLane = (s) => TURNS_GROUP.filter(([st]) => st === s).map(([, sd]) => sd);
  function stairs(G, opts) {
    const big = !!(opts && opts.big);
    const cell = (key, side, s) => {
      let state = '';
      if (G.done.has(key)) state = G.skipped.has(key) ? ' skip' : ' done';
      else if (G.now === key) state = ' now';
      return h('div', { class: 'clash-cell ' + side + state, 'data-key': key }, stepIcon(s, big ? 26 : 18), big || side === 'j' ? h('b', { class: 'n' }, String(s)) : null);
    };
    const steps = h('div', { class: 'clash-stairs' + (big ? ' big' : ''), role: 'img', 'aria-label': 'Fünf Level zum Frieden' },
      [1, 2, 3, 4, 5].map((s) => h('div', { class: 'clash-col s' + s },
        h('div', { class: 'clash-lanes' }, s <= 3
          ? (G.solo ? [cell(s + 'A', 'a', s), cell(s + 'B', 'b', s)] : groupLane(s).map((sd) => cell(s + sd, sd.toLowerCase(), s)))
          : cell(String(s), 'j', s)),
        big ? h('div', { class: 'clash-cap' }, STUFEN[s].kurz) : null)));
    if (!big) return steps;
    return h('div', { class: 'clash-stairs-big' }, steps,
      h('div', { class: 'clash-legend' }, [1, 2, 3, 4, 5].map((s) => h('span', null, h('b', null, String(s)), ' ' + STUFEN[s].kurz))));
  }
  const hud = (G, meter) => h('div', { class: 'clash-hud' },
    h('div', { class: 'clash-stairs-wrap' }, h('span', { class: 'eyebrow' }, '5 Level zum Frieden'), stairs(G)),
    (meter || heatMeter(G.heat)).el);

  /* ---------- Comic-Bild: zwei Figuren + Sprechblasen ---------- */
  function nameTag(G, side) {
    const p = person(G, side);
    const t = G.ctx.teams[side];
    return h('div', { class: 'clash-name ' + side.toLowerCase() }, h('b', null, p.name), G.solo ? null : h('span', null, t.name));
  }
  function comic(G, opts) {
    const o = opts || {};
    const m = moodFor(G.heat);
    const avA = makeAvatar(G.scene.personA, o.moodA || m, false);
    const avB = makeAvatar(G.scene.personB, o.moodB || m, true);
    const sideA = h('div', { class: 'clash-side a' }, avA.el, nameTag(G, 'A'));
    const sideB = h('div', { class: 'clash-side b' }, avB.el, nameTag(G, 'B'));
    const talk = h('div', { class: 'clash-talk', 'aria-live': 'polite' });
    const el = h('div', { class: 'clash-comic' },
      h('div', { class: 'clash-caption' }, G.scene.ort || G.scene.title),
      h('div', { class: 'clash-cast' }, sideA, talk, sideB));
    el.style.setProperty('--clash-h', String(G.heat / 100));
    const talking = (side) => { sideA.classList.toggle('talking', side === 'A'); sideB.classList.toggle('talking', side === 'B'); };
    return {
      el,
      say(side, text) {
        talking(side);
        const b = h('div', { class: 'clash-bubble ' + side.toLowerCase() }, text);
        talk.appendChild(b);
        return b;
      },
      typing(side) {
        talking(side);
        const b = h('div', { class: 'clash-bubble typing ' + side.toLowerCase(), 'aria-label': 'schreibt' }, h('span', { class: 'clash-dots' }, h('i'), h('i'), h('i')));
        talk.appendChild(b);
        return b;
      },
      mood(heat) {
        avA.set(moodFor(heat));
        avB.set(moodFor(heat));
        el.style.setProperty('--clash-h', String(heat / 100));
      },
      stamp(text) {
        talking(null);
        el.classList.add('stopped');
        const big = h('div', { class: 'clash-stamp', 'aria-hidden': 'true' }, text);
        el.appendChild(big);
        // Nach dem Knall: kleiner Stempel oben rechts, Blasen wieder gut lesbar
        setTimeout(() => {
          big.remove();
          el.classList.remove('stopped');
          el.appendChild(h('div', { class: 'clash-stamp small', 'aria-hidden': 'true' }, text));
        }, 1500);
      },
    };
  }

  /* Knöpfe unten anzeigen, auf kleinen Bildschirmen ins Bild holen, und auf die Wahl warten */
  function ask(G, wrap, options, align, scroll) {
    const p = G.ctx.ui.choice(wrap, options, { align: align || 'end' });
    const row = wrap.lastElementChild;
    if (scroll) requestAnimationFrame(() => {
      const r = row.getBoundingClientRect();
      if (r.bottom > window.innerHeight) row.scrollIntoView({ block: 'end', behavior: 'smooth' });
    });
    return G.ctx.waitFor(p);
  }

  /* ---------- Bildschirme ---------- */

  // 1) Comic-Intro: der Streit schaukelt sich hoch
  async function intro(G) {
    const { ctx } = G;
    const ui = ctx.ui;
    const sc = G.scene;
    G.heat = 12;
    G.now = null;
    const meter = heatMeter(G.heat);
    const cm = comic(G, { moodA: 'neutral', moodB: 'neutral' });
    const readAll = () => sc.intro.map((b) => person(G, b.who).name + ': ' + b.text).join(' ');
    const wrap = ctx.screen([
      h('div', { class: 'clash-hud' },
        h('div', { class: 'stack clash-title' }, h('span', { class: 'eyebrow' }, G.solo ? 'Solo · Clash' : 'Mission Clash'), h('h2', null, sc.title)),
        meter.el),
      cm.el,
      h('div', { class: 'row between clash-foot' }, h('p', { class: 'muted' }, 'Wie schaukelt sich der Streit hoch?'), ui.speakBtn(readAll)),
    ]);
    wrap.dataset.clash = 'intro';
    const n = sc.intro.length;
    const top = sc.hitze || 82;
    for (let i = 0; i < n; i++) {
      await ctx.sleep(i ? 1300 : 500);
      const b = sc.intro[i];
      cm.say(b.who, b.text);
      G.heat = Math.round(12 + ((i + 1) * (top - 12)) / n);
      meter.set(G.heat);
      cm.mood(G.heat);
      CREW.sound.play(i === n - 1 ? 'drum' : 'whoosh');
    }
    await ctx.sleep(1000);
    cm.stamp('Stopp!');
    CREW.sound.play('go');
    await ctx.sleep(450);
    const r = await ask(G, wrap, [
      { label: 'Andere Szene', value: 'swap', variant: 'ghost', icon: 'shuffle' },
      { label: 'Clash lösen', value: 'go', iconRight: 'right' },
    ]);
    // X-Karte auf dem Intro: diese Szene lieber nicht – eine andere nehmen
    return r === ctx.SKIP ? 'swap' : r;
  }

  // 2) Crew aufteilen und die Treppe zeigen
  async function crewSplit(G) {
    const { ctx } = G;
    const ui = ctx.ui;
    const A = G.scene.personA;
    const B = G.scene.personB;
    const teamCard = (side) => {
      const p = person(G, side);
      const t = ctx.teams[side];
      return h('div', { class: 'card clash-teamcard ' + side.toLowerCase() },
        makeAvatar(p, 'genervt', side === 'B').el,
        h('div', { class: 'stack', style: { gap: '6px' } },
          h('span', { class: 'pill ' + t.cls }, G.solo ? (side === 'A' ? 'Seite 1' : 'Seite 2') : t.name),
          h('div', { class: 'clash-teamcard-name' }, G.solo ? 'Du bist ' : 'spricht für ', h('b', null, p.name))));
    };
    G.now = '1A';
    const wrap = ctx.screen([
      h('div', { class: 'stack', style: { gap: '4px' } },
        h('span', { class: 'eyebrow' }, 'Stopp. Jetzt wird gelöst.'),
        h('h2', null, G.solo ? 'Du sprichst für beide.' : 'Ihr sprecht jetzt für die beiden.')),
      h('div', { class: 'clash-teams' }, teamCard('A'), teamCard('B')),
      h('div', { class: 'card clash-stairs-card' },
        stairs(G, { big: true }),
        h('p', { class: 'lead' }, G.solo
          ? 'Level 1 bis 3: abwechselnd für ' + A.name + ' und ' + B.name + '. Level 4 und 5: für beide.'
          : 'Level 1 bis 3: Jedes Team spricht für seine Person. Level 4 und 5: alle zusammen.')),
      G.solo ? null : h('div', { class: 'row' }, ui.paddleHint('abcd', 'Team einigt sich leise')),
    ]);
    wrap.dataset.clash = 'crew';
    await ask(G, wrap, [{ label: 'Los: Level 1', value: 'go', iconRight: 'right' }]);
  }

  // Zwei kleine Figuren für die gemeinsamen Stufen
  function duo(G) {
    const m = moodFor(G.heat);
    return h('div', { class: 'clash-duo' }, makeAvatar(G.scene.personA, m, false).el, makeAvatar(G.scene.personB, m, true).el);
  }

  // 3) Auswahl: A/B/C (Stufe 1–3, ein Team) oder A/B/C/D (Stufe 4–5, alle)
  function chooseScreen(G, cfg) {
    const { ctx } = G;
    const ui = ctx.ui;
    const sc = G.scene;
    const joint = cfg.step >= 4;
    const st = STUFEN[cfg.step];
    let done;
    const picked = new Promise((r) => { done = r; });
    const btns = cfg.list.map((o, i) => {
      const L = LETTERS[i];
      const tried = cfg.tried.has(o);
      const by = joint ? (o.by || 'A') : null;
      const b = h('button', { type: 'button', class: 'clash-opt enter' + (tried ? ' tried' : ''), 'data-kind': o.kind, 'data-letter': L, style: { animationDelay: 80 + i * 70 + 'ms' } },
        h('span', { class: 'clash-letter l' + L }, L),
        h('span', { class: 'clash-opt-text' }, by ? h('span', { class: 'clash-by ' + by.toLowerCase() }, person(G, by).name) : null, o.text),
        tried ? h('span', { class: 'clash-tried' }, CREW.icon('undo', 16), 'probiert') : null);
      b.addEventListener('click', () => {
        CREW.sound.play('tap');
        btns.forEach((x) => { x.disabled = true; });
        b.classList.add('picked');
        setTimeout(() => done(o), 220);
      });
      return b;
    });
    const speaker = joint ? null : person(G, cfg.side);
    const q = joint ? st.frage(sc.personA, sc.personB) : st.frage(speaker);
    const sideCls = joint ? 'j' : cfg.side.toLowerCase();
    const tag = joint
      ? h('span', { class: 'pill good' }, G.solo ? 'Beide zusammen' : 'Alle zusammen')
      : h('span', { class: 'pill ' + (cfg.side === 'A' ? 'teamA' : 'teamB') }, G.solo ? 'Du bist ' + speaker.name : ctx.teams[cfg.side].name + ' ist ' + speaker.name);
    const readAll = () => q + ' ' + cfg.list.map((o, i) => LETTERS[i] + ': ' + o.text).join(' ');
    // Satzanfänge: in der Gruppe hinter „Tipp“ versteckt (wie im Reframe)
    const starters = h('div', { class: 'clash-starters' }, st.start.map((x) => h('span', null, x)));
    const tipBtn = G.solo ? null : ui.btn('Tipp', () => { tipBtn.replaceWith(starters); }, { variant: 'ghost', small: true, icon: 'sparkle', id: 'clash-tip' });
    const card = h('div', { class: 'card clash-q ' + sideCls },
      joint ? duo(G) : makeAvatar(speaker, moodFor(G.heat), cfg.side === 'B').el,
      h('div', { class: 'clash-q-main' },
        h('div', { class: 'row clash-q-top' }, h('span', { class: 'eyebrow' }, 'Level ' + cfg.step + ' · ' + st.lang), tag),
        h('h2', null, q),
        G.solo ? starters : null),
      ui.speakBtn(readAll, { cls: 'clash-speak' }));
    const foot = G.solo
      ? h('p', { class: 'muted small clash-foot' }, cfg.tried.size ? 'Probier eine andere Antwort.' : 'Was würdest du sagen? Tippe an.')
      : h('div', { class: 'row between clash-foot' },
        ui.paddleHint('abcd', joint ? 'Alle zeigen · Mehrheit zählt' : ctx.teams[cfg.side].name + ' zeigt'),
        h('div', { class: 'row' }, tipBtn,
          ui.btn('3-2-1', () => ui.threeTwoOne('Zeigt her!'), { variant: 'ghost', small: true, icon: 'timer', id: 'clash-321' })));
    const wrap = ctx.screen([hud(G), card, h('div', { class: 'clash-opts' }, btns), foot]);
    wrap.dataset.clash = joint ? 'joint' : 'turn';
    return picked;
  }

  // 4) Wirkung: Satz, Reaktion der anderen Person, Hitze-Meter
  async function resultScreen(G, cfg) {
    const { ctx } = G;
    const ui = ctx.ui;
    const opt = cfg.opt;
    const joint = cfg.step >= 4;
    const speakSide = joint ? (opt.by || 'A') : cfg.side;
    const listenSide = speakSide === 'A' ? 'B' : 'A';
    const info = KIND[opt.kind] || KIND.weg;
    const delta = typeof opt.heat === 'number' ? opt.heat : DEFAULT_HEAT[opt.kind] || 0;
    const meter = heatMeter(G.heat);
    const cm = comic(G);
    // Tipp aus der Friedenstreppe: „Auch dem anderen gut zuhören und wiederholen.“
    const listenTip = cfg.step === 1 && info.good && !G.solo
      ? h('p', { class: 'muted small' }, h('b', null, ctx.teams[listenSide].name + ': '), 'Checkt kurz: Was hat ' + person(G, speakSide).name + ' gemeint?')
      : null;
    const fb = h('div', { class: 'card clash-feedback ' + (info.good ? 'good' : 'hot') },
      h('div', { class: 'row', style: { gap: '10px' } },
        h('span', { class: 'pill ' + (info.good ? 'good' : 'accent') }, info.label),
        h('span', { class: 'clash-delta ' + (delta <= 0 ? 'down' : 'up') }, 'Hitze ' + (delta <= 0 ? '−' : '+') + Math.abs(delta))),
      h('p', { class: 'lead' }, info.line),
      listenTip);
    fb.style.visibility = 'hidden';
    const wrap = ctx.screen([hud(G, meter), cm.el, fb]);
    wrap.dataset.clash = 'result';
    await ctx.sleep(250);
    cm.say(speakSide, opt.text);
    CREW.sound.play('whoosh');
    await ctx.sleep(1200);
    const typing = cm.typing(listenSide);
    await ctx.sleep(900);
    typing.remove();
    cm.say(listenSide, opt.reaction);
    G.heat = clamp(G.heat + delta, 5, 100);
    meter.set(G.heat);
    cm.mood(G.heat);
    if (info.good) CREW.sound.play('good');
    else {
      CREW.sound.play('soft');
      if (delta >= 8) cm.el.classList.add('shake');
    }
    fb.style.visibility = '';
    fb.classList.add('pop');
    await ctx.sleep(300);
    const opts = info.good
      ? [{ label: 'Weiter', value: 'next', iconRight: 'right' }]
      : [{ label: 'Trotzdem weiter', value: 'next', variant: 'ghost' }, { label: 'Zurückspulen', value: 'rewind', icon: 'undo', variant: 'yellow', id: 'clash-rewind' }];
    const r = await ask(G, wrap, opts, 'end', true);
    return r === ctx.SKIP ? 'skip' : r;
  }

  // Zurückspulen: kurzer Videorekorder-Effekt, dann gleiche Stufe nochmal
  async function rewindFx(G) {
    CREW.sound.play('whoosh');
    const ov = h('div', { class: 'overlay clash-rewind', 'aria-hidden': 'true' }, h('div', { class: 'clash-rw' }, ownIcon('rewind', 64), h('b', null, 'Zurückspulen')));
    CREW.ui.overlays().appendChild(ov);
    try { await G.ctx.sleep(850); } finally { ov.remove(); }
  }

  // Eine Stufe spielen (für eine Seite oder gemeinsam). X-Karte: Stufe überspringen, ohne Folgen.
  async function playStep(G, step, side) {
    const { ctx } = G;
    const joint = step >= 4;
    const src = joint ? (step === 4 ? G.scene.versoehnung : G.scene.vereinbarung) : G.scene.steps[step][side];
    // Immer vier Antworten (A–D). Gemeinsam: aus fünf gezogen, mindestens eine gute ist immer dabei.
    let list = shuffle(src).slice(0, 4);
    if (!list.some((o) => KIND[o.kind] && KIND[o.kind].good)) list = shuffle([src.find((o) => KIND[o.kind] && KIND[o.kind].good)].concat(list.slice(0, 3)));
    const key = joint ? String(step) : step + side;
    const tried = new Set();
    G.now = key;
    for (;;) {
      const opt = await ctx.waitFor(chooseScreen(G, { step, side, list, tried }));
      if (opt === ctx.SKIP) {
        G.done.add(key);
        G.skipped.add(key);
        G.log.push({ key, skipped: true });
        return;
      }
      const before = G.heat;
      const res = await resultScreen(G, { step, side, opt });
      if (res === 'skip') {
        // X-Karte auf der Wirkung: zählt nicht, Hitze wie vorher
        G.heat = before;
        G.done.add(key);
        G.skipped.add(key);
        G.log.push({ key, skipped: true });
        return;
      }
      if (res === 'rewind') {
        G.heat = before;
        tried.add(opt);
        G.rewinds++;
        await rewindFx(G);
        continue;
      }
      G.log.push({ key, kind: opt.kind, rewound: tried.size > 0 });
      G.done.add(key);
      if (step === 5) G.pact = opt;
      return;
    }
  }

  // 5) Oben angekommen: Frieden!
  async function finale(G) {
    const { ctx } = G;
    const ui = ctx.ui;
    const A = G.scene.personA;
    const B = G.scene.personB;
    G.now = null;
    const meter = heatMeter(G.heat);
    const hot = G.heat >= 50;
    const pact = G.pact;
    const wrap = ctx.screen([
      hud(G, meter),
      h('div', { class: 'clash-finale' },
        h('h1', { class: 'outline-text clash-peace' }, 'Frieden!'),
        h('div', { class: 'clash-top' },
          h('div', { class: 'clash-summit' }, makeAvatar(A, 'froh', false).el, h('span', { class: 'clash-hands' }, ownIcon('peace', 64)), makeAvatar(B, 'froh', true).el),
          h('div', { class: 'clash-plate' }, stepIcon(5, 24), h('span', null, 'Level 5 · ganz oben'))),
        h('p', { class: 'lead' }, (hot ? 'Der Weg war heiß. Aber ' : '') + A.name + ' und ' + B.name + ' sind oben angekommen.'),
        pact ? h('div', { class: 'card clash-pact' },
          h('span', { class: 'eyebrow' }, 'Der Pakt'),
          h('div', { class: 'clash-pact-text' }, '„' + pact.text + '“'),
          pact.kind === 'vage' ? h('p', { class: 'muted small' }, 'Tipp: Je konkreter, desto besser hält der Pakt.') : null) : null),
    ]);
    wrap.dataset.clash = 'finale';
    CREW.sound.play('great');
    ui.confetti(160);
    await ctx.sleep(500);
    G.heat = 6;
    meter.set(G.heat);
    await ctx.sleep(500);
    await ask(G, wrap, [{ label: 'Weiter', value: 'go', iconRight: 'right' }], 'center', true);
  }

  /* ---------- Ablauf ---------- */
  async function play(ctx) {
    const G = { ctx, solo: !!ctx.solo, scene: null, heat: 12, done: new Set(), skipped: new Set(), now: null, log: [], rewinds: 0, pact: null };
    G.scene = ctx.pick('clash', 1)[0];
    if (!G.scene) return null;
    // Szene: X-Karte oder „Andere Szene“ tauscht sie aus
    for (let swaps = 0; ; swaps++) {
      const r = await intro(G);
      if (r === 'go') break;
      const other = swaps < 6 ? ctx.pick('clash', 1, (s) => s.id !== G.scene.id)[0] : null;
      if (!other) break;
      G.scene = other;
    }
    await crewSplit(G);
    for (const [step, side] of (G.solo ? TURNS : TURNS_GROUP)) await playStep(G, step, side);
    await playStep(G, 4);
    await playStep(G, 5);
    await finale(G);
    return G;
  }

  // Wie cool war der Weg? 0…1 (Überspringen zählt nicht; Zurückspulen ist fast so gut wie direkt)
  function score(G) {
    const played = G.log.filter((x) => !x.skipped);
    if (!played.length) return 0;
    const pts = played.reduce((a, x) => a + (KIND[x.kind] && KIND[x.kind].good ? (x.rewound ? 0.85 : 1) : x.kind === 'weg' ? 0.4 : 0.2), 0);
    return pts / played.length;
  }

  CREW.registerMission({
    id: 'clash',
    day: 3,
    title: 'Clash',
    tagline: 'Ein Streit, zwei Seiten. Bringt beide nach oben.',
    hook: 'Team gegen Streit · 5 Level',
    color: '#e8532f',
    minutes: 5,
    themes: ['Konfliktlösung', 'Perspektivenwechsel', 'Gefühle'],
    etep: 'III–IV',

      { code: 'K-21', text: 'erkennt, wie sich andere fühlen' },
      { code: 'K-26', text: 'sagt in der Gruppe passend, was er/sie fühlt' },
      { code: 'K-31', text: 'wählt im Streit beruhigende, versöhnliche Worte' },
      { code: 'SOZ-34', text: 'schlägt bei Streit faire Lösungen vor' },
    ],
    teacherNote: 'Nach der ISA-Friedenstreppe. Eine Streit-Szene pro Session (Comic mit zwei Fantasiefiguren). Teilt die Crew in zwei Teams: Team A spricht für die linke Person, Team B für die rechte. In der Gruppe drei Züge auf Level 1–3 (Sicht, Gefühl, Bedürfnis; im Spiel „Replay“, „Innen drin“, „Was ich brauch“), abwechselnd Team A, B, A. Das Team einigt sich leise auf A–D und zeigt es mit der Antwort-Karte; du tippst die Antwort an. Pro Level gibt es vier Antworten: Ich-Botschaft („Klartext“), Vorwurf („Angriff“), Ausweichen („Abgetaucht“) und einen getarnten Vorwurf, der wie eine Ich-Botschaft klingt („Getarnter Angriff“). Die Satzanfänge liegen hinter dem Knopf „Tipp“. Es gibt kein Falsch: Nach einer schwachen Antwort könnt ihr zurückspulen. Level 4 (Versöhnen) und 5 (Deal) wählt die ganze Crew, die Mehrheit zählt. Tipp aus dem Material: Das andere Team wiederholt kurz, was es gehört hat. Satzanfänge für echte Streits: „Aus meiner Sicht …“, „Ich habe mich … gefühlt“, „Ich brauche …“, „Wäre es okay für dich, wenn …“, „Können wir uns darauf einigen, dass …“. Passt eine Szene gerade nicht (z. B. echter Streit in der Gruppe): „Andere Szene“ oder X-Karte auf dem ersten Bild.',
    debrief: [
      'Welches Level war heute am schwierigsten? Warum?',
      'Was hilft dir, erst mal runterzukommen, bevor du redest?',
      'Kennst du so einen Streit? Du musst keine Namen sagen.',
      'Woran merkst du im Körper, dass die Hitze steigt?',
      'Wie klingt eine Entschuldigung, die man wirklich glaubt?',
      'Wie war es, für die andere Person zu sprechen?',
      'Wen könntest du fragen, wenn ein Streit festhängt?',
    ],
    async run(ctx) {
      const G = await play(ctx);
      if (!G) return { energy: 5, summary: 'Heute gab es keine Szene. Nächstes Mal!' };
      const s = score(G);
      const playedN = G.log.filter((x) => !x.skipped).length;
      if (!playedN) return { energy: 3, summary: 'Heute nur reingeschaut.' };
      const energy = clamp(5 + Math.round(5 * s), 5, 10);
      const cool = G.log.filter((x) => !x.skipped && KIND[x.kind] && KIND[x.kind].good && !x.rewound).length;
      let summary = 'Ihr habt ausprobiert, was passiert. Und seid oben angekommen.';
      if (s >= 0.85) summary = 'Stark! Ihr habt die Hitze richtig cool runtergeholt.';
      else if (s >= 0.6) summary = 'Gut gemacht! Ihr habt den Weg zum Frieden gefunden.';
      return { energy, summary, points: cool, stats: [[cool, 'cool beim ersten Versuch'], [G.rewinds, 'mal zurückgespult']] };
    },
  });

  /* ---------- Solo: eine Person spricht für beide Seiten ---------- */
  async function soloEnd(G, cool, total, best) {
    const { ctx } = G;
    const ui = ctx.ui;
    const num = h('span', { class: 'display clash-big' }, '0');
    const wrap = ctx.screen([
      h('div', { class: 'stack', style: { alignItems: 'center', textAlign: 'center' } },
        h('span', { class: 'eyebrow' }, 'Solo · Clash'),
        h('h2', null, 'Beim ersten Versuch cool geblieben'),
        h('div', { class: 'row center' }, num, h('span', { class: 'display', style: { fontSize: '2em' } }, 'von ' + total)),
        best.isNew && cool > 0 ? h('span', { class: 'pill good' }, 'Neuer Bestwert!') : h('span', { class: 'pill' }, 'Dein Bestwert: ' + best.best),
        h('p', { class: 'muted' }, 'Zurückspulen ist kein Fehler. So findest du raus, was wirkt.')),
    ], { center: true, narrow: true });
    wrap.dataset.clash = 'solo-end';
    CREW.sound.play('good');
    await ui.countUp(num, 0, cool, 800);
    return ask(G, wrap, [{ label: 'Nochmal', value: 'again', variant: 'ghost', icon: 'shuffle' }, { label: 'Fertig', value: 'done', iconRight: 'right' }], 'center', true);
  }

  CREW.registerSolo({
    id: 'clash',
    title: 'Clash-Solo',
    desc: 'Ein Streit, zwei Seiten. Bring beide nach oben.',
    icon: 'heart',
    async run(ctx) {
      for (;;) {
        const G = await play(ctx);
        if (!G) return;
        const played = G.log.filter((x) => !x.skipped);
        const cool = played.filter((x) => KIND[x.kind] && KIND[x.kind].good && !x.rewound).length;
        const best = ctx.best('cool', cool, true);
        const r = await soloEnd(G, cool, played.length, best);
        if (r !== 'again') return;
      }
    },
  });
})();

  const SYS = '<svg viewBox="0 0 66 14" width="60" height="13" aria-hidden="true"><g fill="currentColor"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></g><path d="M24.5 5.5a9 9 0 0 1 12 0M27 8.4a5 5 0 0 1 7 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="30.5" cy="11.3" r="1.7" fill="currentColor"/><rect x="41" y="1" width="21" height="12" rx="3.5" stroke="currentColor" stroke-width="1.6" fill="none"/><rect x="43.5" y="3.5" width="13" height="7" rx="1.5" fill="currentColor"/><rect x="63" y="5" width="2" height="4" rx="1" fill="currentColor"/></svg>';
  const clock = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const statusBar = () => h('div', { class: 'feed-status' }, h('b', null, clock()), h('span', { class: 'feed-island' }), h('span', { class: 'feed-sys', html: SYS }));
  const appHead = () => h('div', { class: 'feed-apphead' }, h('span', { class: 'feed-logo' }, 'glimmr'), h('span', { class: 'feed-grow' }), ownIcon('plus', 22), CREW.icon('heart', 22), ownIcon('send', 22));
  function chatHead(c) {
    return h('div', { class: 'feed-apphead chat' }, CREW.icon('left', 20), ava(c.name, 34),

  function phoneShell(head, kids, opts) {

  function postEl(p) {

  // F = echt (nachprüfbar und stimmt), M = Meinung, X = Fake (klingt nach Fakt, stimmt aber nicht)
  function stampEl(truth, big) {

  // Szene für „Was machst du?“: Post oder Gruppenchat

  // Sperrbildschirm fürs Intro: Benachrichtigungen prasseln rein
  function lockPhone() {
    const d = new Date();
    const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const NOTIS = [
      { t: '9B Chaos', b: '23 neue Nachrichten' },
      { t: 'Jeff', b: 'Hast du das gesehen??' },
      { t: 'kirchberg.daily', b: 'Neuer Beitrag: Das glaubt ihr nie …' },
      { t: 'Squad', b: 'Heute 17 Uhr? Du kommst doch, oder?' },
      { t: 'Aylin', b: 'hat dich in einem Beitrag markiert' },

    const notis = h('div', { class: 'feed-notis' });

      h('div', { class: 'feed-screen feed-lock' }, statusBar(),
        h('div', { class: 'feed-lock-date' }, CREW.util.WEEKDAYS[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()]),
        h('div', { class: 'feed-lock-time' }, clock()),
        notis, h('div', { class: 'feed-homebar' })));

            h('span', { class: 'feed-noti-ic' }, 'g'),

          CREW.sound.play('tick');
        }

  /* ---------- Kopfzeile: Runde + Punkte ---------- */
  function typeIcon(type, size, big) {
    const T = TYPES[type];

  function scoreboard(G) {
    G.scEl = {};
    if (G.solo) {
      const n = h('b', null, String(G.pts.solo));
      const el = h('span', { class: 'feed-sc crew' }, CREW.icon('star', 18), h('span', { class: 'nm' }, 'Punkte'), n);
      G.scEl.solo = { el, n };
      return h('div', { class: 'feed-score' }, el);
    }
    const mk = (side) => {
      const t = G.ctx.teams[side];
      const n = h('b', null, String(G.pts[side]));
      const el = h('span', { class: 'feed-sc ' + t.cls }, h('span', { class: 'dot' }), h('span', { class: 'nm' }, t.name), n);
      G.scEl[side] = { el, n };
      return el;
    };
    const cn = h('b', null, String(G.pts.A + G.pts.B));
    const crew = h('span', { class: 'feed-sc crew' }, CREW.icon('bolt', 18), h('span', { class: 'nm' }, 'Crew'), cn);

  }
  // Punkte gutschreiben (max = was möglich war; zählt für die Crew-Energie)
  function score(G, side, got, max) {
    G.max[side] += max;
    if (!got) return;
    const bump = (e, a, b) => {
      if (!e) return;
      CREW.ui.countUp(e.n, a, b, 600);
      e.el.classList.remove('bump');
      void e.el.offsetWidth;
      e.el.classList.add('bump');
    };
    const from = G.pts[side];
    G.pts[side] += got;
    bump(G.scEl[side], from, G.pts[side]);
    if (!G.solo) bump(G.scEl.crew, G.pts.A + G.pts.B - got, G.pts.A + G.pts.B);
  }
  function hud(G, type, sub) {
    return h('div', { class: 'feed-hud' },
      h('div', { class: 'feed-hud-l' }, typeIcon(type, 26),
        h('div', { class: 'stack', style: { gap: '2px' } },
          h('span', { class: 'eyebrow' }, 'Runde ' + G.round + ' von ' + G.total + (sub ? ' · ' + sub : '')),
          h('h3', null, TYPES[type].name))),
      scoreboard(G));
  }
  function layout(G, type, phoneEl, sideKids, sub) {
    return [hud(G, type, sub), h('div', { class: 'feed-main' }, h('div', { class: 'feed-left' }, phoneEl), h('div', { class: 'feed-side' }, sideKids))];
  }
  const teamPill = (G, side) => (side === 'solo' ? h('span', { class: 'pill accent' }, 'Du') : h('span', { class: 'pill ' + G.ctx.teams[side].cls }, G.ctx.teams[side].name));
  const letterChip = (L) => h('span', { class: 'feed-l l' + L }, L);

  const ptsChip = (p) => h('span', { class: 'feed-pts' + (p ? '' : ' zero') }, '+' + p);
  // Überschrift der Frage: optional kleine Zeile davor (lage) und eine Aufforderung danach (post)
  function question(G, lage, title, speakText, post) {
    return h('div', { class: 'feed-q' },
      h('div', { class: 'stack', style: { gap: '4px' } },

  /* ---------- Eingabe ---------- */
  // Für Tests und Übergänge: Welcher Bildschirm ist gerade bedienbar?
  function mark(G, stage) {
    G.seq++;
    if (G.wrap) { G.wrap.dataset.feed = stage; G.wrap.dataset.seq = String(G.seq); }
  }
  // Knopf ins Bild holen, falls er unten aus dem Bildschirm ragt (einmal sofort, einmal nach dem Einblenden)
  function scrollIn(el) {
    const go = () => {
      if (!el || !el.isConnected) return;
      const r = el.getBoundingClientRect();
      if (r.bottom > window.innerHeight - 4) el.scrollIntoView({ block: 'end', behavior: 'smooth' });
    };
    requestAnimationFrame(go);
    setTimeout(go, 420);
  }
  function ask(G, container, options, stage, align) {
    const p = G.ctx.ui.choice(container, options, { align: align || 'end' });
    mark(G, stage);
    scrollIn(container.lastElementChild);
    return G.ctx.waitFor(p);
  }
  const nextLabel = (G) => (G.round < G.total ? 'Nächste Runde' : 'Zum Ergebnis');

  // Gruppe: „Zeigt her!“ → 3-2-1 → Lehrkraft tippt, was jedes Team zeigt.
  async function callTeams(G, holder, cfg) {
    const { ctx } = G;
    const ui = ctx.ui;
    let go;
    const p1 = new Promise((r) => { go = r; });
    clear(holder);
    const showBtn = ui.btn('Zeigt her!', () => go('go'), { variant: 'yellow', icon: 'eye', id: 'feed-show' });
    holder.appendChild(h('div', { class: 'feed-callbar' }, ui.paddleHint(cfg.paddle, cfg.hint), showBtn));
    mark(G, cfg.stage + '-ask');
    scrollIn(showBtn);
    const r1 = await ctx.waitFor(p1);
    if (r1 === ctx.SKIP) return ctx.SKIP;
    await ui.threeTwoOne('Zeigt her!');
    const optsEl = G.wrap && G.wrap.querySelector('.feed-opts');
    if (optsEl) optsEl.classList.add('compact');
    const sel = {};
    const teams = cfg.teams || ['A', 'B'];
    let done;
    const p2 = new Promise((r) => { done = r; });
    const rows = teams.map((side) => {
      const t = ctx.teams[side];
      const btns = cfg.choices.map((c) => {
        const b = h('button', { type: 'button', class: 'feed-seg ' + (c.cls || ''), 'data-team': side, 'data-v': c.v, 'aria-pressed': 'false' },
          h('span', null, c.label), c.sub ? h('small', null, c.sub) : null);
        b.addEventListener('click', () => {
          CREW.sound.play('tap');
          sel[side] = sel[side] === c.v ? null : c.v;
          btns.forEach((x) => { const on = x.dataset.v === sel[side]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', String(on)); });
        });
        return b;
      });
      return h('div', { class: 'feed-call-row' }, h('span', { class: 'pill ' + t.cls }, t.name), h('div', { class: 'feed-segs' }, btns));
    });
    const reveal = ui.btn('Auflösen', () => {
      if (!teams.some((s) => sel[s] != null)) { ui.toast('Tippt an, was die Teams zeigen.'); return; }
      done({ ...sel });
    }, { iconRight: 'right', id: 'feed-reveal' });
    clear(holder);
    holder.appendChild(h('div', { class: 'card feed-call enter' },
      h('div', { class: 'feed-call-h' }, CREW.icon('eye', 22), h('b', null, 'Was zeigen die Teams?')),
      rows, h('div', { class: 'row end' }, reveal)));
    mark(G, cfg.stage + '-call');
    scrollIn(reveal);
    return ctx.waitFor(p2);
  }

  // Solo: Knöpfe unter dem Bild
  function soloChoice(G, holder, stage, options) {
    clear(holder);
    const p = G.ctx.ui.choice(holder, options.map((o) => ({ label: o.label, value: o.v, variant: o.variant, icon: o.icon, id: 'feed-solo-' + o.v })), { align: 'start' });

    scrollIn(holder.lastElementChild);
    return G.ctx.waitFor(p);
  }

  // Antworten A–D: in der Gruppe nur Anzeige, solo zum Antippen
  function optionList(G, opts) {
    let pickFn;
    const picked = new Promise((r) => { pickFn = r; });
    const items = opts.map((o, i) => {
      const kids = [letterChip(o.L), h('span', { class: 'feed-opt-t' }, o.t)];
      const attrs = { class: 'feed-opt enter', 'data-letter': o.L, 'data-p': o.p != null ? String(o.p) : null, 'data-k': o.k || null, style: { animationDelay: 40 + i * 60 + 'ms' } };
      if (!G.solo) return h('div', attrs, kids);
      const b = h('button', { type: 'button', ...attrs }, kids);
      b.addEventListener('click', () => {
        CREW.sound.play('tap');
        items.forEach((x) => { x.disabled = true; });
        b.classList.add('picked');
        setTimeout(() => pickFn(o.L), 200);
      });
      return b;
    });
    return { el: h('div', { class: 'feed-opts' }, items), picked };
  }
  async function chooseOption(G, holder, list, stage) {
    if (G.solo) {
      clear(holder);
      holder.appendChild(h('p', { class: 'muted feed-hint' }, 'Tippe an, was du machen würdest.'));
      mark(G, stage + '-ask');
      const r = await G.ctx.waitFor(list.picked);
      return r === G.ctx.SKIP ? r : { solo: r };
    }
    return callTeams(G, holder, { stage, paddle: 'abcd', hint: 'Jedes Team einigt sich leise', choices: LETTERS.map((L) => ({ v: L, label: L, cls: 'l' + L })) });
  }
  // Gleiche Wahl beider Teams zusammenfassen
  function groupSel(G, sel) {
    const map = new Map();
    sides(G).forEach((s) => {
      const v = sel[s];
      if (v == null) return;
      if (!map.has(v)) map.set(v, []);
      map.get(v).push(s);
    });
    return [...map.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([L, ss]) => ({ L, sides: ss }));
  }
  // „Alle Wege“: Was hätten die anderen Antworten bewirkt?
  function allWays(G, title, opts, render) {
    G.ctx.ui.modal({
      title,
      body: h('div', { class: 'feed-ways' }, opts.map((o) => h('div', { class: 'feed-way' }, letterChip(o.L), h('div', { class: 'feed-way-b' }, render(o))))),

  }

  }

  /* ---------- Gesicht: So geht es der Person ---------- */
  function faceSVG(feel) {
    const f = clamp(feel, 0, 100) / 100;
    const c = Math.round((f - 0.42) * 32);
    const S = `stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none"`;
    const eyes = f >= 0.7
      ? `<path d="M31 46 Q38 37 45 46 M55 46 Q62 37 69 46" ${S}/>`
      : `<circle cx="38" cy="44" r="5.5" fill="${INK}"/><circle cx="62" cy="44" r="5.5" fill="${INK}"/>`;
    const brows = f < 0.38 ? `<path d="M27 36 L42 30 M73 36 L58 30" ${S}/>` : '';
    const tear = f < 0.2 ? `<path d="M68 51 Q73 60 68 64 Q63 60 68 51 Z" style="fill:var(--teamA)" stroke="${INK}" stroke-width="2.5"/>` : '';
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" style="fill:var(--yellow)" stroke="${INK}" stroke-width="5"/>${eyes}${brows}<path d="M31 69 Q50 ${69 + c} 69 69" ${S}/>${tear}</svg>`;
  }

  /* ---------- Runde: Fakt oder Meinung? ---------- */
  async function roundFakt(G, card) {
    const { ctx } = G;
    const ui = ctx.ui;
    // Zwei Kommentare pro Runde: der Fake und einer der anderen (Zeit!)
    const fake = card.items.filter((x) => x.fake);
    const rest = shuffle(card.items.filter((x) => !x.fake));
    card = { ...card, items: shuffle(fake.slice(0, 1).concat(rest.slice(0, fake.length ? 1 : 2))) };
    const n = card.items.length;
    const done = [];
    let playedAny = false;
    for (let i = 0; i < n; i++) {
      const it = card.items[i];
      const ph = phoneShell(appHead(), [postEl(card.post),
        h('div', { class: 'feed-cmts' }, card.items.map((c, j) => cmtEl(c, j === i ? 'cur' : done[j] ? 'done' : j > i ? 'later' : 'skipped', done[j])))], { cls: 'fakt' });
      const holder = h('div', { class: 'feed-holder' });
      G.wrap = ctx.screen(layout(G, 'fakt', ph.el, [
        question(G, null, 'Echt, Meinung oder Fake?', () => it.text + '. Echt, Meinung oder Fake?'),
        h('div', { class: 'card feed-quote enter' }, ava(it.von, 46),
          h('div', { class: 'feed-quote-b' }, h('span', { class: 'feed-handle' }, '@' + it.von), h('div', { class: 'feed-quote-t' }, '„' + it.text + '“'))),
        h('div', { class: 'feed-rule' },
          h('div', null, stampEl('F'), h('span', null, 'nachprüfbar und stimmt')),
          h('div', null, stampEl('M'), h('span', null, 'jemand findet etwas')),
          h('div', null, stampEl('X'), h('span', null, 'klingt nach Fakt, ist erfunden'))),
        holder,
      ], 'Kommentar ' + (i + 1) + ' von ' + n));
      // Aktuellen Kommentar im Handy sichtbar halten
      requestAnimationFrame(() => {
        const cur = ph.body.querySelector('.feed-cmt.cur');
        if (cur && cur.offsetTop + cur.offsetHeight > ph.body.clientHeight) ph.body.scrollTop = cur.offsetTop + cur.offsetHeight - ph.body.clientHeight + 10;
      });
      let ans;
      if (G.solo) {
        const r = await soloChoice(G, holder, 'fakt-ask', [{ v: 'F', label: 'Echt', variant: 'good' }, { v: 'M', label: 'Meinung', variant: 'yellow' }, { v: 'X', label: 'Fake', variant: 'teamB' }]);
        if (r === ctx.SKIP) continue;
        ans = { solo: r };
      } else {
        const r = await callTeams(G, holder, { stage: 'fakt', paddle: 'abcd', hint: 'A = Echt · B = Meinung · C = Fake', choices: [{ v: 'F', label: 'Echt', sub: 'A', cls: 'ja' }, { v: 'M', label: 'Meinung', sub: 'B', cls: 'lD' }, { v: 'X', label: 'Fake', sub: 'C', cls: 'nein' }] });
        if (r === ctx.SKIP) continue;
        ans = r;
      }
      playedAny = true;
      const truth = it.fake ? 'X' : it.fakt ? 'F' : 'M';
      const worth = it.fake ? 2 : 1; // Fake erwischt = 2 Punkte
      done[i] = truth;
      // Stempel im Handy
      const cur = ph.body.querySelector('.feed-cmt.cur');
      if (cur) { cur.classList.remove('cur'); cur.classList.add('done'); cur.appendChild(stampEl(truth)); }
      let anyRight = false;
      const rows = sides(G).filter((s) => ans[s] != null).map((s) => {
        const ok = ans[s] === truth;
        anyRight = anyRight || ok;
        score(G, s, ok ? worth : 0, worth);
        const txt = G.solo ? (ok ? (it.fake ? 'Fake erwischt!' : 'Richtig erkannt!') : 'Diesmal anders. Lies kurz die Begründung.') : (ok ? (it.fake ? 'Fake erwischt!' : 'richtig erkannt') : 'anders getippt');
        return h('div', { class: 'feed-res-row' }, G.solo ? null : teamPill(G, s), h('span', null, txt), h('span', { class: 'feed-grow' }), ptsChip(ok ? worth : 0));
      });
      clear(holder);
      holder.appendChild(h('div', { class: 'card feed-verdict pop v' + truth },
        h('div', { class: 'feed-verdict-top' }, stampEl(truth, true), h('p', { class: 'lead' }, it.why)),
        h('div', { class: 'feed-res' }, rows)));
      CREW.sound.play(anyRight ? 'good' : 'soft');
      await ask(G, holder, [{ label: i < n - 1 ? 'Nächster Kommentar' : nextLabel(G), value: 'go', iconRight: 'right', id: 'feed-next' }], 'fakt-done');

  /* ---------- Runde: Gerücht-Kette ---------- */
  // Schritte 1–4 und „?“ (so weit wäre es ohne Stopp gekommen)
  function chainTrack(G, n) {
    const node = (label) => {
      const c = h('span', { class: 'c' }, label);

      return { el: h('div', { class: 'feed-node' }, c, v, flags), c, v, flags };
    };
    const nodes = Array.from({ length: n }, (_, i) => node(String(i + 1)));
    const end = node('?');
    end.el.classList.add('end');
    return {
      el: h('div', { class: 'feed-track', role: 'img', 'aria-label': 'Kette in ' + n + ' Schritten' }, nodes.map((x) => x.el), end.el),
      set(i, views, stopped) {
        nodes.forEach((x, j) => { x.el.classList.toggle('on', j <= i); x.el.classList.toggle('now', j === i); });
        if (views != null) nodes[i].v.textContent = fmt(views);
        nodes.forEach((x, j) => {
          clear(x.flags);
          sides(G).forEach((s) => {
            if (stopped[s] === j + 1) x.flags.appendChild(h('span', { class: 'feed-flag ' + (s === 'solo' ? 'solo' : G.ctx.teams[s].cls) }, s === 'solo' ? 'Du' : s));
          });
        });
      },
    };
  }
  // Punkte-Wolke: so viele Leute haben es gesehen
  function swarm() {
    const N = 140, W = 220, H = 120;
    const golden = Math.PI * (3 - Math.sqrt(5));
    let dots = '';
    for (let i = 0; i < N; i++) {
      const r = 5.1 * Math.sqrt(i + 0.5);
      const a = i * golden;
      dots += `<circle cx="${(W / 2 + r * Math.cos(a) * 1.55).toFixed(1)}" cy="${(H / 2 + r * Math.sin(a) * 0.93).toFixed(1)}" r="${i ? 3.4 : 6}"/>`;
    }
    const el = h('div', { class: 'feed-swarm', html: `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${dots}</svg>` });
    const cs = el.querySelectorAll('circle');
    let shown = 1;
    cs[0].classList.add('src');
    return {
      el,
      set(frac) {
        const k = Math.max(1, Math.round(N * Math.sqrt(clamp(frac, 0, 1))));
        cs.forEach((c, i) => { c.classList.toggle('on', i < k); c.classList.toggle('new', i >= shown && i < k); });
        shown = k;
      },
    };
  }

  async function roundKette(G, card) {
    const { ctx } = G;

    const wahr = h('div', { class: 'card feed-out feed-truth' },
      h('span', { class: 'eyebrow' }, 'Was wirklich war'),
      h('div', { class: 'feed-truth-row' }, h('span', { class: 'feed-truth-ic' }, CREW.icon('check', 30)), h('p', { class: 'lead' }, card.wahr)));
    const allBtn = ui.btn('Alle Wege', () => allWays(G, 'Alle Wege zum Stoppen', wie, (o) => [

  const ratioOf = (G) => {
    const max = sides(G).reduce((a, s) => a + G.max[s], 0);
    const got = sides(G).reduce((a, s) => a + G.pts[s], 0);
    return max ? got / max : 0;
  };
  function praise(r, solo) {
    if (r >= 0.8) return solo ? 'Stark! Du hast den Feed voll im Griff.' : 'Stark! Ihr habt den Feed voll im Griff.';
    if (r >= 0.55) return solo ? 'Gut gemacht! Dich legt man nicht so leicht rein.' : 'Gut gemacht! Euch legt man nicht so leicht rein.';
    return solo ? 'Du hast ausprobiert, was online passiert. Das zählt.' : 'Ihr habt ausprobiert, was online passiert. Das zählt.';
  }
  async function soloEnd(G, best) {
    const { ctx } = G;
    const ui = ctx.ui;
    const num = h('span', { class: 'display feed-endnum' }, '0');
    const wrap = ctx.screen([
      h('div', { class: 'stack feed-end' },
        h('span', { class: 'eyebrow' }, 'Solo · Feed-Check'),
        h('h2', null, praise(ratioOf(G), true)),
        h('div', { class: 'feed-endrow' }, CREW.icon('star', 48), num, h('span', { class: 'display feed-endlbl' }, 'von ' + G.max.solo)),
        best.isNew && G.pts.solo > 0 ? h('span', { class: 'pill good' }, 'Neuer Bestwert!') : h('span', { class: 'pill' }, 'Dein Bestwert: ' + best.best)),
      tipCard(),
    ], { center: true, narrow: true });
    G.wrap = wrap;
    CREW.sound.play('good');
    await ui.countUp(num, 0, G.pts.solo, 800);
    return ask(G, wrap, [{ label: 'Nochmal', value: 'again', variant: 'ghost', icon: 'shuffle' }, { label: 'Fertig', value: 'done', iconRight: 'right', id: 'feed-done' }], 'solo-end', 'center');
  }

  /* ---------- Ablauf ---------- */
  // Gruppe: drei Runden (Echt/Meinung/Fake, Gerücht-Kette, dann Was machst du? oder Gruppendruck).
  // Solo: alle vier Rundentypen + eine Extra-Runde.
  function planRounds(ctx) {
    const extra = Math.random() < 0.5 ? 'tun' : 'druck';
    const order = ctx.solo ? ['fakt', 'tun', 'kette', 'druck', extra] : ['fakt', 'kette', extra];
    const ids = new Set();
    const cards = [];
    for (const t of order) {
      let c = ctx.pick('feed', 1, (x) => x.type === t && !ids.has(x.id))[0];
      if (!c) c = ctx.pick('feed', 1, (x) => !ids.has(x.id))[0];
      if (c) { ids.add(c.id); cards.push(c); }
    }
    return cards;
  }
  const ROUND = { fakt: roundFakt, tun: roundTun, kette: roundKette, druck: roundDruck };
  async function play(ctx) {
    const G = { ctx, solo: !!ctx.solo, round: 0, total: 0, pts: { A: 0, B: 0, solo: 0 }, max: { A: 0, B: 0, solo: 0 }, played: 0, seq: 0, scEl: {}, wrap: null };
    const cards = planRounds(ctx);
    G.total = cards.length;
    await intro(G);
    for (const card of cards) {
      if (!G.solo && !ctx.roundGate(G.round, cards.length)) break;
      G.round++;
      await splash(G, card.type);
      if (await ROUND[card.type](G, card)) G.played++;
    }
    return G;
  }

  CREW.registerMission({
    id: 'feed',
    day: 4,
    title: 'Feed-Check',
    tagline: 'Gerüchte, Chats, Gruppendruck. Was macht ihr?',
    hook: 'Team gegen Team · 3 Runden',
    color: '#2f7cf6',
    minutes: 5,
    themes: ['Medien', 'Zivilcourage', 'Gruppendruck'],
    etep: 'IV–V',
    eldib: [
      { code: 'KOG-58', text: 'unterscheidet in Posts und Texten Fakten von Meinungen' },
      { code: 'K-31', text: 'findet in angespannten Gruppenmomenten ruhige, entschärfende Worte' },
      { code: 'SOZ-31', text: 'sagt, dass er/sie anders handelt als die Gruppe' },
      { code: 'SOZ-37', text: 'versteht, wie es anderen geht, und nimmt Rücksicht' },
      { code: 'SOZ-39', text: 'entscheidet nach eigenen Werten, auch unter Druck' },
    ],
    teacherNote: 'Zwei Teams, drei schnelle Runden auf einem erfundenen Handy („Glimmr“). Rundentypen: Echt, Meinung oder Fake? (Antwort-Karte A = Echt, B = Meinung, C = Fake; Fake erwischt = 2 Punkte), Was machst du? (A–D), Gerücht-Kette (bei jedem Schritt: Ja = wir stoppen hier), Gruppendruck (A–D). Jedes Team einigt sich leise. Auf „Zeigt her!“ hält pro Team eine Person die Karte hoch (oder alle, dann zählt die Mehrheit). Du tippst an, was jedes Team zeigt. Punkte: stark 3, gut 2, okay 1, riskant 0; Echt/Meinung 1 pro Kommentar, Fake 2; Kette: früh gestoppt 2, später 1, plus 1 für einen starken Weg. Beide Teamkonten zählen am Ende zusammen für die Crew. Es gibt kein „Falsch“: Die Folgen werden nur sichtbar. „Alle Wege“ zeigt, was die anderen Antworten bewirkt hätten – gut zum Nachfragen. Vapes, Familie und Geld sind als heikel markiert. Die X-Karte überspringt einen Kommentar oder eine Runde. Am Ende steht die BEE SECURE Helpline (8002 1234).',
    debrief: [
      'Warum leiten Leute Gerüchte weiter, obwohl sie nicht wissen, ob es stimmt?',
      'Hast du schon mal erlebt, dass online etwas ganz anders war als in echt?',
      'Wie sagt man Nein, ohne uncool zu wirken? Welcher Satz passt zu dir?',
      'Was macht es schwer, im Gruppenchat etwas gegen die anderen zu schreiben?',
      'An wen kannst du dich wenden, wenn online etwas schiefläuft?',
      'Woran erkennst du, ob ein Post eine Meinung oder ein Fakt ist?',
      'Was hilft einer Person, über die gerade alle lästern?',
    ],
    async run(ctx) {
      const G = await play(ctx);
      // Kein eigener End-Bildschirm mehr: Punkte und Helpline zeigt der gemeinsame Abschluss
      const r = ratioOf(G);
      const energy = G.played ? clamp(5 + Math.round(5 * r), 4, 10) : 4;
      let summary = 'Ihr habt ausprobiert, was online passiert. Das zählt.';
      if (r >= 0.8) summary = 'Stark! Ihr habt den Feed voll im Griff.';
      else if (r >= 0.55) summary = 'Gut gemacht! Ihr lasst euch online nicht so leicht reinlegen.';
      return { energy, summary, points: G.pts.A + G.pts.B, note: tipCard() };
    },
  });

  /* ---------- Solo: eine Person tippt direkt an ---------- */
  CREW.registerSolo({
    id: 'feed',
    title: 'Feed-Check',
    desc: 'Posts, Chats, Gerüchte. Was ist echt und was machst du?',
    icon: 'phone',
    async run(ctx) {
      for (;;) {
        const G = await play(ctx);
        const best = ctx.best('punkte', G.pts.solo, true);
        const r = await soloEnd(G, best);
        if (r !== 'again') return;
      }
    },
  });
})();

  const EMO = Object.fromEntries(EMOS.map((e) => [e.id, e]));

  /* Gefühls-Abzeichen: farbiges Kästchen mit Zeichen */
  function emoBadge(id, size) {

  /* Zahl mit deutschem Komma, ganze Zahlen ohne Nachkomma */
  function fmt(n) {
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ',');
  }
  function tweenNumber(el, to, ms) {
    const t0 = performance.now();
    return new Promise((res) => {
      (function frame(t) {
        if (!document.body.contains(el)) return res();
        const k = Math.min(1, (t - t0) / ms);
        const e = 1 - Math.pow(1 - k, 3);
        el.textContent = k < 1 ? (to * e).toFixed(1).replace('.', ',') : fmt(to);
        if (k < 1) requestAnimationFrame(frame); else res();
      })(t0);

  /* ---------- Das Radar (Halbkreis-Skala 0–10, SVG) ---------- */
  let uid = 0;
  const DW = 460, DH = 268, CX = 230, CY = 230, RO = 206, RI = 176;
  const ang = (v) => Math.PI * (1 - v / 10);
  const P = (v, r) => [+(CX + r * Math.cos(ang(v))).toFixed(1), +(CY - r * Math.sin(ang(v))).toFixed(1)];
  const pt = (p) => p[0] + ' ' + p[1];
  // Ring-Stück zwischen zwei Werten und zwei Radien
  function sector(v1, v2, r1, r2) {
    const a = P(v1, r2), b = P(v2, r2), c = P(v2, r1), d = P(v1, r1);
    return `M${pt(a)} A${r2} ${r2} 0 0 1 ${pt(b)} L${pt(c)}` + (r1 > 0 ? ` A${r1} ${r1} 0 0 0 ${pt(d)}` : '') + ' Z';
  }

  function dial(o) {
    const opt = o || {};
    const id = 'radar-d' + (++uid);
    let s = `<svg class="radar-dial" viewBox="0 0 ${DW} ${DH}" role="img" aria-label="Radar: Stärke von 0 bis 10">`;
    s += `<defs><linearGradient id="${id}-band" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--good)"/><stop offset=".5" style="stop-color:var(--yellow)"/><stop offset="1" style="stop-color:var(--radar-hot)"/></linearGradient></defs>`;
    // Raster
    s += '<g class="grid">';
    [66, 112, 150].forEach((r) => { s += `<path d="M${pt(P(0, r))} A${r} ${r} 0 0 1 ${pt(P(10, r))}"/>`; });
    [2.5, 5, 7.5].forEach((v) => { s += `<path d="M${pt(P(v, 28))} L${pt(P(v, 140))}"/>`; });
    s += '</g>';
    s += `<path class="base" d="M${CX - RO} ${CY} H${CX + RO}"/>`;
    // Radar-Strahl (wischt hin und her)
    if (opt.sweep !== false) {
      s += '<g class="radar-sweep">';
      [[0, 0.6, 0.05], [0.6, 1.1, 0.1], [1.1, 1.45, 0.18], [1.45, 1.7, 0.3]].forEach(([a, b, op]) => { s += `<path d="${sector(a, b, 0, RI - 4)}" style="opacity:${op}"/>`; });
      s += `<path class="edge" d="M${CX} ${CY} L${pt(P(1.7, RI - 4))}"/></g>`;
    }
    // Treffer-Zone rund um den Tipp
    s += '<g class="radar-zone"><path d="M0 0"/></g>';
    // Farbband mit Stufen
    s += `<path class="band" d="${sector(0, 10, RI, RO)}" fill="url(#${id}-band)"/>`;
    for (let v = 1; v < 10; v++) s += `<path class="sep" d="M${pt(P(v, RI))} L${pt(P(v, RO))}"/>`;
    for (let v = 0; v <= 10; v++) { const q = P(v, RI - 21); s += `<text class="num${v % 5 === 0 ? ' key' : ''}" x="${q[0]}" y="${q[1]}">${v}</text>`; }
    s += `<text class="anchor" x="${CX - (RO + RI) / 2}" y="${CY + 25}">gar nicht</text><text class="anchor" x="${CX + (RO + RI) / 2}" y="${CY + 25}">extrem</text>`;
    // Deko-Punkte (nur im Intro)
    if (opt.decor) {
      s += '<g class="radar-decor">';
      [[1.6, 118, 'Wut', 0], [3.7, 72, 'Freude', 0.7], [5.4, 128, 'Angst', 1.3], [7.3, 96, 'Stolz', 0.35], [8.8, 124, 'Überraschung', 1.8], [6.4, 52, 'Trauer', 1.05]].forEach(([v, r, e, dl]) => {
        const q = P(v, r);
        s += `<circle class="ping" cx="${q[0]}" cy="${q[1]}" r="9" style="stroke:${EMO[e].color};animation-delay:${dl}s"/><circle class="dot" cx="${q[0]}" cy="${q[1]}" r="9" style="fill:${EMO[e].color}"/>`;
      });
      s += '</g>';
    }
    s += '<polygon class="radar-marker" points="0,0" style="display:none"/>';
    if (opt.needle !== false) {
      s += `<g class="radar-needle${opt.idle ? ' idle' : ''}"><path class="shadow" d="M${CX} ${CY} H${CX - 134}"/><path class="main" d="M${CX} ${CY} H${CX - 134}"/></g>`;

      el: svg,
      // Tipp anzeigen: gelbes Dreieck + Zone ±1
      setPred(v) {
        zone.querySelector('path').setAttribute('d', sector(Math.max(0, v - 1), Math.min(10, v + 1), 34, RI - 42));
        zone.classList.add('on');
        const a = ang(v);
        const tip = P(v, RO - 3), bc = P(v, RO + 20);

      hit(on) { zone.classList.toggle('hit', !!on); },
