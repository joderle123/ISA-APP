/* =========================================================
   CREW – Design-System
   Drei Looks (die Crew stimmt ab): arena (Standard), pixel, neon.
   Alle Farben laufen über Tokens auf .app[data-look].
   ========================================================= */

:root {
  color-scheme: dark;
  --ink: #0e0a26;
  --bg: #1b1446;
  --bg2: #2a1e6e;
  --panel: #2d2378;
  --panel2: #3a2e92;
  --line: #0e0a26;
  --text: #fff8ee;
  --muted: #c3bdf0;
  --accent: #ff6b3d;
  --accent-2: #ff8a5c;
  --accent-ink: #1a0b05;
  --yellow: #ffc93c;
  --yellow-ink: #2a1c00;
  --good: #2ee6c5;
  --good-ink: #03211c;
  --warn: #ffb020;
  --hot: #ff4d3d;
  --teamA: #3da5ff;
  --teamA-ink: #03182b;
  --teamB: #ff4fa3;
  --teamB-ink: #2b0418;
  --radius: 18px;
  --radius-sm: 12px;
  --bw: 3px;
  --lift: 5px;
  --glow: none;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Rubik", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display-case: none;
  --display-track: 0.01em;
  --bg-image: radial-gradient(1200px 700px at 15% -10%, #3b2a9a 0%, transparent 60%),
              radial-gradient(900px 600px at 110% 110%, #5a1f6e 0%, transparent 55%);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ---------- Looks ---------- */
.app[data-look="arena"] { /* nutzt :root */ }

.app[data-look="pixel"] {
  --ink: #05070d;
  --bg: #10141f;
  --bg2: #182033;
  --panel: #1e2a3a;
  --panel2: #29384d;
  --line: #05070d;
  --text: #f0f4f8;
  --muted: #9fb3c8;
  --accent: #f7b32b;
  --accent-2: #ffd166;
  --accent-ink: #1c1300;
  --yellow: #ffe066;
  --good: #5ad17a;
  --good-ink: #04200c;
  --teamA: #4cc9f0;
  --teamB: #f15bb5;
  --radius: 0px;
  --radius-sm: 0px;
  --bw: 4px;
  --lift: 4px;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Pixelify Sans", "Courier New", monospace;
  --display-case: uppercase;
  --display-track: 0.04em;
  --warn: #ffb020;
  --hot: #ff5a4f;
  --bg-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
}
.app[data-look="pixel"] { background-size: 16px 16px, 16px 16px; font-variant-ligatures: none; }

.app[data-look="neon"] {
  --ink: #000008;
  --bg: #0a0a1a;
  --bg2: #120f2e;
  --panel: #141433;
  --panel2: #1d1d48;
  --line: #3b3bff55;
  --text: #eef6ff;
  --muted: #9aa6d6;
  --accent: #00e5ff;
  --accent-2: #6ff3ff;
  --accent-ink: #001a1f;
  --yellow: #ffe45e;
  --good: #b8ff3c;
  --good-ink: #142000;
  --teamA: #00e5ff;
  --teamA-ink: #001a1f;
  --teamB: #ff2e88;
  --teamB-ink: #2a0013;
  --radius: 14px;
  --radius-sm: 10px;
  --bw: 2px;
  --lift: 0px;
  --glow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --display-case: uppercase;
  --display-track: 0.06em;
  --warn: #ffb020;
  --hot: #ff2e63;
  --bg-image: radial-gradient(800px 500px at 80% -10%, #2a0f5a 0%, transparent 60%),
              radial-gradient(700px 500px at -10% 110%, #003a4a 0%, transparent 60%);
}

/* ---------- App-Gerüst ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  background-color: var(--bg);
  background-image: var(--bg-image);
  color: var(--text);
  font-family: var(--font-body);
  font-size: clamp(17px, 0.9vw + 10px, 23px);
  line-height: 1.4;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  min-height: 64px;
}
.topbar .spacer { flex: 1; }
.crew-badge {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  font-size: 1.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40vw;
}
.crew-badge .logo {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  background: var(--accent);
  color: var(--accent-ink);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line), var(--glow);
}
.energy-mini {
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.energy-mini .bar {
  width: clamp(80px, 12vw, 180px); height: 14px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.app[data-look="pixel"] .energy-mini .bar { border-radius: 0; }
.energy-mini .bar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--yellow), var(--accent));
  width: 0;
  transition: width 900ms cubic-bezier(.2,.8,.2,1);
}

.stage {
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  outline: none;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 100%;
}
.wrap.center { justify-content: center; align-items: center; text-align: center; }
.wrap.narrow { max-width: 760px; }

/* ---------- Typo ---------- */
.display, h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  text-wrap: balance;
  margin: 0;
  line-height: 1.08;
}
.app[data-look="neon"] .display, .app[data-look="neon"] h1, .app[data-look="neon"] h2 { font-weight: 600; }
h1 { font-size: clamp(2.1em, 4vw + 1em, 3.6em); }
h2 { font-size: clamp(1.5em, 2vw + 0.9em, 2.3em); }
h3 { font-size: 1.25em; }
.outline-text {
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink);
}
.app[data-look="neon"] .outline-text { -webkit-text-stroke: 0; text-shadow: 0 0 14px var(--accent); }
.app[data-look="pixel"] .outline-text { -webkit-text-stroke: 0; text-shadow: 4px 4px 0 var(--ink); }
.lead { font-size: 1.15em; color: var(--text); margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }
.eyebrow {
  font-size: 0.8em; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--yellow);
}
p { margin: 0; }

/* Große Karte für Beamer-Text */
.bigcard {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: clamp(20px, 3vw, 40px);
  display: flex; flex-direction: column; gap: 14px;
  position: relative;
}
.bigcard .say {
  font-family: var(--font-display);
  text-transform: none;
  font-size: clamp(1.6em, 2.6vw + 0.8em, 2.8em);
  line-height: 1.15;
  text-wrap: balance;
}
.app[data-look="pixel"] .bigcard .say { font-size: clamp(1.4em, 2.2vw + 0.7em, 2.4em); }

/* ---------- Layout-Helfer ---------- */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid.four { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

/* ---------- Karten & Kacheln ---------- */
.card {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: 0 var(--lift) 0 var(--line);
}
.card.soft { box-shadow: none; background: color-mix(in srgb, var(--panel) 70%, transparent); }

.tile {
  appearance: none;
  font: inherit; color: inherit; text-align: left;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 20px;
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 120ms ease, box-shadow 120ms ease, background 160ms;
  min-height: 120px;
}
.tile:hover { background: var(--panel2); }
.tile:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.tile .t-title { font-family: var(--font-display); font-size: 1.45em; text-transform: var(--display-case); letter-spacing: var(--display-track); line-height: 1.1; }
.tile .t-sub { color: var(--muted); font-size: 0.92em; }
.tile .t-icon {
  width: 56px; height: 56px; display: grid; place-items: center;
  border-radius: var(--radius-sm);
  border: var(--bw) solid var(--line);
  background: var(--accent); color: var(--accent-ink);
}
.tile.hero { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--accent-ink); }
.tile.hero .t-sub { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
.tile.hero .t-icon { background: var(--yellow); color: var(--yellow-ink); }
.app[data-look="neon"] .tile.hero { background: transparent; color: var(--accent); border-color: var(--accent); }
.app[data-look="neon"] .tile.hero .t-sub { color: var(--muted); }

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  font: inherit;
  font-family: var(--font-display);
  text-transform: var(--display-case);
  letter-spacing: var(--display-track);
  font-size: 1.1em;
  line-height: 1;
  color: var(--accent-ink);
  background: var(--accent);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) - 4px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 16px 24px;
  min-height: 60px;
  min-width: 60px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 90ms ease, box-shadow 90ms ease, filter 120ms;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.btn:focus-visible, .tile:focus-visible, .icon-btn:focus-visible, .chip:focus-visible {
  outline: 3px solid var(--yellow); outline-offset: 3px;
}
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn.big { font-size: 1.45em; padding: 20px 34px; min-height: 76px; }
.btn.small { font-size: 0.9em; padding: 10px 16px; min-height: 48px; }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--panel); color: var(--text); }
.btn.good { background: var(--good); color: var(--good-ink); }
.btn.yellow { background: var(--yellow); color: var(--yellow-ink); }
.btn.teamA { background: var(--teamA); color: var(--teamA-ink); }
.btn.teamB { background: var(--teamB); color: var(--teamB-ink); }
.app[data-look="neon"] .btn { background: transparent; color: var(--accent); border-color: currentColor; }
.app[data-look="neon"] .btn.good { color: var(--good); }
.app[data-look="neon"] .btn.yellow { color: var(--yellow); }
.app[data-look="neon"] .btn.teamA { color: var(--teamA); }
.app[data-look="neon"] .btn.teamB { color: var(--teamB); }
.app[data-look="neon"] .btn.ghost { color: var(--text); border-color: var(--line); box-shadow: none; }

.icon-btn {
  appearance: none; font: inherit; color: var(--text);
  width: 52px; height: 52px; flex: none;
  display: grid; place-items: center;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line);
  cursor: pointer; touch-action: manipulation;
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.icon-btn.on { background: var(--yellow); color: var(--yellow-ink); }
.icon-btn.xcard { background: var(--teamB); color: var(--teamB-ink); font-family: var(--font-display); font-size: 1.2em; }
.app[data-look="neon"] .icon-btn.on { background: transparent; color: var(--yellow); border-color: var(--yellow); }
.app[data-look="neon"] .icon-btn.xcard { background: transparent; color: var(--teamB); border-color: var(--teamB); }

.chip {
  appearance: none; font: inherit; color: var(--text);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; min-height: 48px;
  border-radius: 99px;
  border: var(--bw) solid var(--line);
  background: var(--panel);
  cursor: pointer; touch-action: manipulation;
}
.app[data-look="pixel"] .chip { border-radius: 0; }
.chip.sel { background: var(--yellow); color: var(--yellow-ink); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78em; font-weight: 700;
  padding: 5px 12px; border-radius: 99px;
  background: var(--panel2); color: var(--text);
  border: 2px solid var(--line);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.pill.good { background: var(--good); color: var(--good-ink); }
.pill.teamA { background: var(--teamA); color: var(--teamA-ink); }
.pill.teamB { background: var(--teamB); color: var(--teamB-ink); }
.app[data-look="pixel"] .pill { border-radius: 0; }

/* Hinweis: welche Antwort-Karte */
.paddle-hint {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--good) 20%, transparent);
  border: 2px dashed var(--good);
  color: var(--text);
  font-weight: 600;
  font-size: 0.9em;
}

/* ---------- Stepper / Tally / Zahlenfeld ---------- */
.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper .val {
  font-family: var(--font-display);
  font-size: 3em; min-width: 1.6em; text-align: center;
  font-variant-numeric: tabular-nums;
}
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tally .t-item {
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.tally .t-count { font-family: var(--font-display); font-size: 2.2em; font-variant-numeric: tabular-nums; }
.tally .t-label { font-weight: 600; text-align: center; }
.tally .t-ctrl { display: flex; gap: 8px; }
.tally .t-item.tap { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; transition: transform 90ms ease; }
.tally .t-item.tap:active { transform: scale(.97); }
.tally .t-item.bump .t-count { animation: tally-bump 260ms cubic-bezier(.2,1.6,.4,1); }
.tally.full .t-item { border-color: var(--good); }
@keyframes tally-bump { 0% { transform: scale(1); } 45% { transform: scale(1.45); color: var(--yellow); } 100% { transform: scale(1); } }
.scanbar { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--panel); font-weight: 700; font-size: 0.9em; width: fit-content; }
.scanbar i { position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--good) 45%, transparent) 50%, transparent 100%); transform: translateX(-100%); animation: scan-sweep 1.6s linear infinite; }
.scanbar-t { position: relative; }
@keyframes scan-sweep { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .scanbar i { animation: none; opacity: .4; transform: none; } }

.valuepad { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 10px; }
.valuepad .btn { font-size: 1.4em; min-height: 64px; padding: 10px; }
.valuechips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; align-items: center; }
.valuechips .v {
  font-family: var(--font-display); font-size: 1.3em;
  min-width: 48px; height: 48px; padding: 0 10px;
  display: grid; place-items: center;
  background: var(--yellow); color: var(--yellow-ink);
  border: 2px solid var(--line); border-radius: 12px;
}

/* Fortschritt */
.progress {
  height: 26px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}
.app[data-look="pixel"] .progress { border-radius: 0; }
.progress > i {
  display: block; height: 100%; width: 0;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, var(--accent) 14px 28px);
  transition: width 1200ms cubic-bezier(.2,.8,.2,1);
}

/* Timer-Ring */
.timer { position: relative; width: 120px; height: 120px; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 2.2em; font-variant-numeric: tabular-nums;
}

/* ---------- Overlays ---------- */
.overlay-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.overlay {
  position: absolute; inset: 0;
  background: color-mix(in srgb, var(--ink) 78%, transparent);
  display: grid; place-items: center;
  padding: 16px;
  pointer-events: auto;
  animation: fade-in 160ms ease both;
}
.modal {
  width: min(640px, 100%);
  max-height: calc(100% - 32px);
  overflow: auto;
  background: var(--bg2);
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 24px;
  display: flex; flex-direction: column; gap: 16px;
  animation: pop-in 220ms cubic-bezier(.2,1.4,.4,1) both;
}
.toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateX(-50%);
  background: var(--yellow); color: var(--yellow-ink);
  border: var(--bw) solid var(--line);
  border-radius: 99px;
  padding: 12px 22px;
  font-weight: 700;
  box-shadow: 0 4px 0 var(--line);
  animation: toast-in 240ms cubic-bezier(.2,1.4,.4,1) both;
  max-width: calc(100% - 32px);
  text-align: center;
}
.countdown-big {
  font-family: var(--font-display);
  font-size: clamp(6em, 18vw, 14em);
  color: var(--yellow);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 10px 0 var(--ink);
  animation: count-pop 700ms cubic-bezier(.2,1.4,.4,1) both;
  line-height: 1;
  text-align: center;
}
.app[data-look="neon"] .countdown-big { -webkit-text-stroke: 0; text-shadow: 0 0 30px var(--yellow); }
.confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ---------- Antwort-Karte (Schüler-iPad) ---------- */
.paddle { display: flex; flex-direction: column; gap: 16px; height: 100%; }
.paddle-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.paddle-tabs .chip { flex: none; }
.paddle-body { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.paddle-grid { display: grid; gap: 12px; flex: 1; }
.paddle-grid .btn { font-size: 1.6em; min-height: 88px; white-space: normal; }
.paddle-grid .btn.sel { outline: 5px solid var(--yellow); outline-offset: 3px; }
.paddle-show {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  padding: 24px;
  pointer-events: auto;
  text-align: center;
  animation: fade-in 120ms ease both;
}
.paddle-show .answer {
  font-family: var(--font-display);
  font-size: clamp(5em, 30vmin, 18em);
  line-height: 1;
  -webkit-text-stroke: 5px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 10px 0 var(--ink);
}
.paddle-show .answer.wordy { font-size: clamp(3em, 14vmin, 8em); }
.app[data-look="neon"] .paddle-show .answer { -webkit-text-stroke: 0; text-shadow: 0 0 40px currentColor; }

/* Wetter-Icons */
.wx { display: inline-grid; place-items: center; }
.wx svg { width: 100%; height: 100%; }

/* Liste im Lehrermodus */
.list { display: flex; flex-direction: column; gap: 10px; }
.list .li {
  display: flex; gap: 14px; align-items: flex-start; justify-content: space-between;
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius-sm);
  padding: 14px 16px;
}
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
textarea, input[type="text"], input[type="password"] {
  font: inherit; color: var(--text);
  background: var(--panel);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  width: 100%;
  user-select: text; -webkit-user-select: text;
}
textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 0.8em; }
.selectable { user-select: text; -webkit-user-select: text; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.kbd { font-family: ui-monospace, Menlo, monospace; background: var(--panel2); padding: 2px 8px; border-radius: 6px; }

/* ---------- Animationen ---------- */
.enter { animation: slide-up 360ms cubic-bezier(.2,1,.3,1) both; }
.enter-2 { animation: slide-up 360ms 80ms cubic-bezier(.2,1,.3,1) both; }
.enter-3 { animation: slide-up 360ms 160ms cubic-bezier(.2,1,.3,1) both; }
.pop { animation: pop-in 300ms cubic-bezier(.2,1.5,.4,1) both; }
.shake { animation: shake 420ms ease both; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
.float { animation: floaty 3s ease-in-out infinite; }
.attn { animation: attn-glow 1.6s ease-in-out infinite; }
@keyframes attn-glow { 0%,100% { box-shadow: 0 var(--lift) 0 var(--line), 0 0 0 0 color-mix(in srgb, var(--yellow) 0%, transparent); } 50% { box-shadow: 0 var(--lift) 0 var(--line), 0 0 0 8px color-mix(in srgb, var(--yellow) 45%, transparent); } }
@keyframes slide-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes count-pop { 0% { opacity: 0; transform: scale(2.2); } 40% { opacity: 1; transform: scale(.92); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes breathe { 0%,100% { transform: scale(.6); } 50% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

@media (max-width: 640px) {
  .topbar { gap: 6px; padding-left: 12px; padding-right: 12px; }
  .crew-badge .name { display: none; }
  .energy-mini .lvl { display: none; }
  .energy-mini .bar { width: 56px; }
  .topbar .icon-btn { width: 44px; height: 44px; }
  .btn { white-space: normal; }
  .btn.big { font-size: 1.2em; padding: 16px 22px; }
}
@media (max-width: 420px) {
  .energy-mini { display: none; }
  .topbar .icon-btn { width: 42px; height: 42px; }
}

/* ---------- Startbildschirm: Held, Haupt-Knopf, Crew-Woche ---------- */
.home-hero { position: relative; aspect-ratio: 21 / 9; max-height: 38dvh; width: 100%; border-radius: var(--radius); overflow: hidden; border: var(--bw) solid var(--line); box-shadow: 0 var(--lift) 0 var(--line); }
.home-hero .hq-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.home-hero-txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; background: linear-gradient(0deg, color-mix(in srgb, var(--bg) 88%, transparent) 0%, transparent 100%); }
.home-cta {
  --mc: var(--accent);
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  padding: 18px 22px; border-radius: var(--radius); border: var(--bw) solid var(--line);
  background: var(--mc); color: #fff; cursor: pointer; font: inherit;
  box-shadow: 0 var(--lift) 0 var(--line);
}
.home-cta:active { transform: translateY(var(--lift)); box-shadow: none; }
.home-cta-ic { display: grid; place-items: center; width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--yellow); color: var(--yellow-ink); border: var(--bw) solid var(--line); }
.home-cta-t { font-family: var(--font-display); font-size: clamp(1.4em, 2.6vw, 2.1em); line-height: 1.05; text-transform: var(--display-case); letter-spacing: var(--display-track); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.home-cta-s { font-weight: 600; opacity: .92; }
.app[data-look="neon"] .home-cta { background: transparent; color: var(--mc); border-color: var(--mc); box-shadow: 0 0 18px color-mix(in srgb, var(--mc) 45%, transparent); }
.home-next { display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.home-ghost { position: relative; width: 132px; flex: none; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); }
.home-ghost.big { width: 100%; max-width: 520px; margin: 0 auto; }
.home-ghost .hq-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.home-q { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 2em; color: var(--yellow); text-shadow: 0 3px 0 var(--ink); pointer-events: none; }
.home-ghost.big .home-q { font-size: 4em; }
.home-week { display: flex; align-items: center; }
.week { display: flex; flex-direction: column; gap: 8px; }
.week-pips { display: flex; gap: 8px; flex-wrap: wrap; }
.week-pips .pip { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel2, var(--panel)); font-weight: 800; font-size: .9em; color: var(--muted); }
.week-pips .pip.on { background: var(--good); color: var(--good-ink, #062); }
.week-pips .pip.today { outline: 3px solid var(--yellow); outline-offset: 2px; }
.hq-ghost { filter: brightness(0); opacity: .82; }
.wx-map { gap: 18px; padding: 14px; border-radius: var(--radius); background: linear-gradient(180deg, color-mix(in srgb, var(--teamA) 22%, transparent), transparent); }
.paddle-private { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 1.1em; }
.unlock-cand .display { color: var(--yellow); }

/* ---------- Wer steht? ---------- */
.sa-gold { border-color: #e0a100 !important; background: linear-gradient(135deg, color-mix(in srgb, #ffd54a 30%, var(--panel)), var(--panel)) !important; }
.sa-crowd { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.sa-person { appearance: none; font: inherit; width: 84px; height: 110px; border-radius: 18px; border: var(--bw) solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; display: grid; place-items: end center; padding-bottom: 8px; transform-origin: 50% 100%; transform: scaleY(.72); opacity: .6; transition: transform 220ms cubic-bezier(.2,1.6,.4,1), opacity 160ms; touch-action: manipulation; }
.sa-person.up { transform: none; opacity: 1; background: var(--yellow); color: var(--yellow-ink); }
.sa-line { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 4px; width: 100%; max-width: 900px; margin: 0 auto; padding-top: 70px; border-bottom: 4px solid var(--line); }
.sa-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; padding-bottom: 6px; }
.sa-col.real .sa-num { background: var(--good); color: var(--good-ink, #062); }
.sa-chips { display: flex; flex-direction: column-reverse; gap: 4px; min-height: 20px; }
.sa-chip { width: 26px; height: 16px; border-radius: 6px; background: var(--teamA); border: 2px solid var(--line); animation: pop-in 300ms both; }
.sa-num { font-family: var(--font-display); font-size: 1.5em; min-width: 40px; text-align: center; border-radius: 10px; padding: 2px 6px; }
.sa-ball { position: absolute; top: -40px; width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); border: var(--bw) solid var(--line); opacity: 0; }
.sa-ball.drop { animation: sa-drop 520ms cubic-bezier(.3,1.4,.5,1) forwards; }
@keyframes sa-drop { 0% { opacity: 1; transform: translateY(-40px); } 70% { transform: translateY(46px); } 100% { opacity: 1; transform: translateY(34px); } }
.sa-fuse { height: 12px; border-radius: 99px; background: var(--accent); width: 100%; animation: sa-fuse 5s linear forwards; transform-origin: left; }
@keyframes sa-fuse { to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .sa-ball.drop { animation: none; opacity: 1; transform: translateY(34px); } .sa-fuse { animation: none; } }

/* ---- missions/clash.css ---- */
/* =========================================================
   Mission „Clash“ – Friedenstreppe
   Alle Klassen mit Präfix clash-. Farben nur über Tokens
   (die SVG-Figuren haben eine eigene Palette).
   ========================================================= */

/* Eigene Hitze-Farben: warm = Orange, heiß = Pink/Rot (in allen Looks warm) */
.app { --clash-warm: var(--warn, #ffb020); --clash-hot: var(--teamB); }
.clash-hud, .clash-hud *, .clash-comic, .clash-comic *, .clash-q, .clash-opts, .clash-opt, .clash-feedback,
.clash-finale, .clash-finale *, .clash-teams, .clash-teams *, .clash-stairs-card, .clash-stairs-card * { box-sizing: border-box; }

/* ---------- Kopfzeile: Treppe + Hitze-Meter ---------- */
.clash-hud { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 22px; }
.clash-stairs-wrap { flex: 1 1 300px; max-width: 520px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.clash-hud .clash-heat { flex: 1 1 250px; max-width: 420px; }
.clash-title { gap: 4px; flex: 1 1 260px; }

/* ---------- Hitze-Meter ---------- */
.clash-heat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.clash-heat-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.clash-heat-head .lbl {
  font-family: var(--font-display); text-transform: var(--display-case); letter-spacing: var(--display-track);
  font-size: 1.1em;
}
.clash-heat-head .word {
  font-size: 0.72em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
  padding: 3px 10px; border-radius: 99px; border: 2px solid var(--line);
  background: var(--good); color: var(--good-ink);
  transition: background 300ms, color 300ms;
}
.clash-heat[data-level="1"] .word { background: var(--yellow); color: var(--yellow-ink); }
.clash-heat[data-level="2"] .word { background: var(--clash-warm); color: var(--yellow-ink); }
.clash-heat[data-level="3"] .word { background: var(--clash-hot); color: var(--teamB-ink); }
.clash-heat-head .num {
  margin-left: auto; font-family: var(--font-display); font-size: 1.7em; line-height: 1;
  font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right;
}
.clash-flame { color: var(--clash-warm); display: inline-grid; transform-origin: 50% 90%; }
.clash-heat[data-level="0"] .clash-flame { color: var(--good); }
.clash-heat[data-level="3"] .clash-flame { color: var(--clash-hot); animation: clash-flicker 0.7s ease-in-out infinite; }
.clash-heat-track {
  position: relative; height: 24px; overflow: hidden;
  border: var(--bw) solid var(--line); border-radius: 99px;
  background: linear-gradient(90deg, var(--good) 0%, var(--yellow) 40%, var(--clash-warm) 68%, var(--clash-hot) 100%);
  box-shadow: 0 3px 0 var(--line);
}
.clash-heat-track::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), color-mix(in srgb, var(--ink) 35%, transparent) calc(25% - 2px) 25%);
}
.clash-heat-cover {
  position: absolute; top: 0; right: 0; bottom: 0; display: block;
  background: var(--panel);
  transition: width 1000ms cubic-bezier(.2, .8, .2, 1);
}
.clash-heat.up .clash-heat-track { animation: clash-jolt 420ms ease both; }
.clash-heat.down .clash-heat-track { animation: clash-cool 900ms ease both; }
.app[data-look="pixel"] .clash-heat-track,
.app[data-look="pixel"] .clash-heat-head .word { border-radius: 0; }
.app[data-look="neon"] .clash-heat-track { box-shadow: 0 0 16px color-mix(in srgb, var(--clash-hot) 40%, transparent); }
.app[data-look="neon"] .clash-heat-head .word { background: transparent; color: var(--good); border-color: currentColor; }
.app[data-look="neon"] .clash-heat[data-level="1"] .word { color: var(--yellow); }
.app[data-look="neon"] .clash-heat[data-level="2"] .word { color: var(--clash-warm); }
.app[data-look="neon"] .clash-heat[data-level="3"] .word { color: var(--clash-hot); }

/* ---------- Friedenstreppe ---------- */
.clash-stairs { display: flex; align-items: flex-end; gap: 6px; }
.clash-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.clash-lanes { display: flex; flex-direction: column; gap: 4px; }
.clash-col.s1 .clash-lanes { height: 48px; }
.clash-col.s2 .clash-lanes { height: 56px; }
.clash-col.s3 .clash-lanes { height: 64px; }
.clash-col.s4 .clash-lanes { height: 72px; }
.clash-col.s5 .clash-lanes { height: 80px; }
.clash-cell {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--panel2); color: var(--muted);
  border: 2px solid var(--line); border-radius: var(--radius-sm);
  transition: background 300ms, color 300ms;
}
.clash-cell.a { background: color-mix(in srgb, var(--teamA) 16%, var(--panel2)); }
.clash-cell.b { background: color-mix(in srgb, var(--teamB) 16%, var(--panel2)); }
.clash-cell.j { background: color-mix(in srgb, var(--good) 12%, var(--panel2)); }
.clash-cell.done.a { background: var(--teamA); color: var(--teamA-ink); }
.clash-cell.done.b { background: var(--teamB); color: var(--teamB-ink); }
.clash-cell.done.j { background: var(--good); color: var(--good-ink); }
.clash-cell.skip { background: transparent; border-style: dashed; color: var(--muted); }
.clash-cell.now {
  background: var(--yellow); color: var(--yellow-ink);
  animation: clash-now 1.4s ease-in-out infinite;
}
.clash-cell .n { font-family: var(--font-display); font-size: 1.1em; line-height: 1; }
.clash-cap {
  text-align: center; font-size: 0.8em; font-weight: 700; color: var(--muted);
  line-height: 1.1; overflow-wrap: anywhere; hyphens: auto;
}
.clash-stairs.big { gap: 8px; }
.clash-stairs.big .s1 .clash-lanes { height: 100px; }
.clash-stairs.big .s2 .clash-lanes { height: 122px; }
.clash-stairs.big .s3 .clash-lanes { height: 144px; }
.clash-stairs.big .s4 .clash-lanes { height: 166px; }
.clash-stairs.big .s5 .clash-lanes { height: 188px; }
.clash-stairs.big .clash-cell { border-width: var(--bw); box-shadow: 0 3px 0 var(--line); }
.clash-stairs.big .clash-cell.j { flex-direction: column; }
.clash-stairs-big { display: flex; flex-direction: column; gap: 10px; }
.clash-legend { display: none; flex-wrap: wrap; gap: 4px 12px; font-size: 0.85em; color: var(--muted); }
.clash-legend b { color: var(--yellow); font-family: var(--font-display); font-weight: 400; }
.clash-stairs-card { display: flex; flex-direction: column; gap: 16px; }
.app[data-look="neon"] .clash-cell.done.a { background: transparent; color: var(--teamA); border-color: var(--teamA); }
.app[data-look="neon"] .clash-cell.done.b { background: transparent; color: var(--teamB); border-color: var(--teamB); }
.app[data-look="neon"] .clash-cell.done.j { background: transparent; color: var(--good); border-color: var(--good); }
.app[data-look="neon"] .clash-cell.now { background: transparent; color: var(--yellow); border-color: var(--yellow); }

/* ---------- Teams ---------- */
.clash-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.clash-teamcard { display: flex; align-items: center; gap: 16px; padding: 12px 18px 12px 12px; }
.clash-teamcard.a { border-left: 10px solid var(--teamA); }
.clash-teamcard.b { border-left: 10px solid var(--teamB); }
.clash-teamcard .clash-ava { width: 92px; flex: none; }
.clash-teamcard-name { font-size: 1.25em; }
.clash-teamcard-name b { font-family: var(--font-display); font-weight: 400; font-size: 1.2em; }

/* ---------- Comic ---------- */
.clash-comic {
  --clash-h: 0;
  position: relative; overflow: hidden;
  background-color: var(--bg2);
  background-image: radial-gradient(color-mix(in srgb, var(--text) 9%, transparent) 1.4px, transparent 1.7px);
  background-size: 16px 16px;
  border: var(--bw) solid var(--line);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 50px 18px 0;
}
.clash-comic::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 95% at 50% 115%, color-mix(in srgb, var(--clash-hot) 60%, transparent), transparent 62%);
  opacity: var(--clash-h);
  transition: opacity 900ms ease;
}
.clash-caption {
  position: absolute; top: 12px; left: 14px; z-index: 2;
  background: var(--yellow); color: var(--yellow-ink);
  border: 2px solid var(--line); border-radius: 6px;
  box-shadow: 0 3px 0 var(--line);
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em;
  font-size: 0.8em; padding: 4px 12px;
  transform: rotate(-1.5deg);
}
.app[data-look="pixel"] .clash-caption { border-radius: 0; transform: none; }
.app[data-look="neon"] .clash-caption { background: transparent; color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 12px color-mix(in srgb, var(--yellow) 45%, transparent); }
.clash-cast {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: minmax(100px, 200px) minmax(0, 1fr) minmax(100px, 200px);
  gap: 14px; align-items: end;
}
.clash-side { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 14px; transition: transform 250ms ease; }
.clash-side.talking { transform: translateY(-6px); }
.clash-side .clash-ava { width: 100%; max-width: 190px; }
.clash-ava { aspect-ratio: 160 / 170; }
.clash-ava svg { display: block; width: 100%; height: 100%; overflow: visible; }
.clash-ava.bump { animation: clash-bump 420ms cubic-bezier(.2, 1.4, .4, 1) both; }
.clash-name { display: flex; flex-direction: column; align-items: center; line-height: 1.15; text-align: center; }
.clash-name b {
  font-family: var(--font-display); font-weight: 400; font-size: 1.15em;
  text-transform: var(--display-case); letter-spacing: var(--display-track);
  padding: 3px 12px; border-radius: 99px; border: 2px solid var(--line);
}
.clash-name.a b { background: var(--teamA); color: var(--teamA-ink); }
.clash-name.b b { background: var(--teamB); color: var(--teamB-ink); }
.clash-name span { font-size: 0.74em; color: var(--muted); font-weight: 600; margin-top: 3px; }
.app[data-look="pixel"] .clash-name b { border-radius: 0; }
.app[data-look="neon"] .clash-name.a b { background: transparent; color: var(--teamA); border-color: var(--teamA); }
.app[data-look="neon"] .clash-name.b b { background: transparent; color: var(--teamB); border-color: var(--teamB); }

.clash-talk { display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 4px 0 20px; min-height: 230px; min-width: 0; }
.clash-bubble {
  position: relative; max-width: 92%;
  background: var(--text); color: var(--ink);
  border: var(--bw) solid var(--line); border-radius: 20px;
  box-shadow: 0 4px 0 var(--line);
  padding: 12px 18px;
  font-weight: 600; line-height: 1.25;
  font-size: clamp(1em, 0.6vw + 0.82em, 1.3em);
  overflow-wrap: break-word;
  animation: clash-bubble-in 340ms cubic-bezier(.2, 1.4, .4, 1) both;
}
.clash-bubble.a { align-self: flex-start; border-left: 10px solid var(--teamA); border-bottom-left-radius: 6px; transform-origin: 0 100%; }
.clash-bubble.b { align-self: flex-end; border-right: 10px solid var(--teamB); border-bottom-right-radius: 6px; transform-origin: 100% 100%; }
.clash-bubble::after {
  content: ''; position: absolute; bottom: 8px; width: 0; height: 0;
  border: 9px solid transparent;
}
.clash-bubble.a::after { left: -28px; border-right-color: var(--teamA); }
.clash-bubble.b::after { right: -28px; border-left-color: var(--teamB); }
.clash-bubble.typing { padding: 14px 20px; }
.clash-dots { display: inline-flex; gap: 6px; }
.clash-dots i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; animation: clash-dots 1s ease-in-out infinite; }
.clash-dots i:nth-child(2) { animation-delay: 0.15s; }
.clash-dots i:nth-child(3) { animation-delay: 0.3s; }
.app[data-look="pixel"] .clash-bubble { border-radius: 0; }
.app[data-look="pixel"] .clash-dots i { border-radius: 0; }
.app[data-look="neon"] .clash-bubble { color: var(--text); box-shadow: none; }
.app[data-look="neon"] .clash-bubble.a { background: color-mix(in srgb, var(--teamA) 16%, var(--panel)); border-color: var(--teamA); }
.app[data-look="neon"] .clash-bubble.b { background: color-mix(in srgb, var(--teamB) 16%, var(--panel)); border-color: var(--teamB); }

/* „Stopp!“-Stempel am Ende des Intros */
.clash-comic.stopped .clash-cast { filter: saturate(0.7) brightness(0.8); transition: filter 400ms; }
.clash-stamp {
  position: absolute; left: 50%; top: 46%; z-index: 3; pointer-events: none;
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em;
  font-size: clamp(3em, 7vw, 6em); line-height: 1;
  color: var(--yellow);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
  transform: translate(-50%, -50%) rotate(-8deg);
  animation: clash-stamp 460ms cubic-bezier(.2, 1.5, .4, 1) both;
}
.clash-stamp.small {
  left: auto; top: 12px; right: 16px;
  font-size: clamp(1.4em, 2.4vw, 2.2em);
  -webkit-text-stroke-width: 2px; text-shadow: 0 3px 0 var(--ink);
  transform: rotate(-6deg);
  animation: clash-stamp-small 360ms cubic-bezier(.2, 1.5, .4, 1) both;
}
.app[data-look="neon"] .clash-stamp { -webkit-text-stroke: 0; text-shadow: 0 0 28px var(--yellow); }
.app[data-look="pixel"] .clash-stamp { -webkit-text-stroke: 0; text-shadow: 5px 5px 0 var(--ink); }
.app[data-look="neon"] .clash-stamp.small { text-shadow: 0 0 16px var(--yellow); }
.app[data-look="pixel"] .clash-stamp.small { text-shadow: 3px 3px 0 var(--ink); }

/* ---------- Frage + Antworten ---------- */
.clash-q { position: relative; display: flex; align-items: center; gap: 18px; padding: 14px 20px 14px 14px; }
.clash-q .clash-speak { position: absolute; top: 12px; right: 12px; }
.clash-q-top { padding-right: 60px; }
.clash-q.a { border-left: 10px solid var(--teamA); }
.clash-q.b { border-left: 10px solid var(--teamB); }
.clash-q.j { border-left: 10px solid var(--good); }
.clash-q > .clash-ava { width: clamp(84px, 11vw, 130px); flex: none; }
.clash-q-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.clash-q-top { gap: 8px 10px; }
.clash-q h2 { font-size: clamp(1.3em, 1.3vw + 0.8em, 1.9em); text-transform: none; }
.clash-starters { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.clash-starters span {
  font-size: 0.78em; color: var(--muted); font-style: italic;
  border: 2px dashed color-mix(in srgb, var(--muted) 45%, transparent);
  border-radius: 99px; padding: 2px 10px;
}
.app[data-look="pixel"] .clash-starters span { border-radius: 0; }
.clash-duo { display: flex; flex: none; }
.clash-duo .clash-ava { width: clamp(64px, 8vw, 96px); }
.clash-duo .clash-ava + .clash-ava { margin-left: -14px; }

.clash-opts { display: flex; flex-direction: column; gap: 12px; }
.clash-opt {
  appearance: none; font: inherit; color: var(--text); text-align: left;
  display: flex; align-items: center; gap: 16px; width: 100%;
  background: var(--panel);
  border: var(--bw) solid var(--line); border-radius: var(--radius);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  padding: 8px 18px 8px 8px; min-height: 66px;
  font-size: clamp(1.02em, 0.5vw + 0.84em, 1.28em); font-weight: 600; line-height: 1.25;
  cursor: pointer; touch-action: manipulation;
  transition: transform 90ms ease, box-shadow 90ms ease, background 150ms, opacity 200ms;
}
.clash-opt:hover { background: var(--panel2); }
.clash-opt:active { transform: translateY(var(--lift)); box-shadow: 0 0 0 var(--line); }
.clash-opt:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.clash-opt[disabled] { cursor: default; }
.clash-opt[disabled]:not(.picked) { opacity: 0.5; }
.clash-opt.picked { outline: 5px solid var(--yellow); outline-offset: 2px; background: var(--panel2); }
.clash-opt.tried { opacity: 0.7; }
.clash-opt-text { flex: 1; min-width: 0; }
.clash-letter {
  flex: none; width: 50px; height: 50px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.6em; line-height: 1;
  border: var(--bw) solid var(--line); border-radius: var(--radius-sm);
}
.clash-letter.lA { background: var(--teamA); color: var(--teamA-ink); }
.clash-letter.lB { background: var(--teamB); color: var(--teamB-ink); }
.clash-letter.lC { background: var(--good); color: var(--good-ink); }
.clash-letter.lD { background: var(--yellow); color: var(--yellow-ink); }
.app[data-look="neon"] .clash-letter { background: transparent; }
.app[data-look="neon"] .clash-letter.lA { color: var(--teamA); border-color: var(--teamA); }
.app[data-look="neon"] .clash-letter.lB { color: var(--teamB); border-color: var(--teamB); }
.app[data-look="neon"] .clash-letter.lC { color: var(--good); border-color: var(--good); }
.app[data-look="neon"] .clash-letter.lD { color: var(--yellow); border-color: var(--yellow); }
.clash-by {
  display: inline-block; vertical-align: 0.1em; margin-right: 8px;
  font-size: 0.7em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 2px 9px; border-radius: 99px; border: 2px solid var(--line);
}
.clash-by.a { background: var(--teamA); color: var(--teamA-ink); }
.clash-by.b { background: var(--teamB); color: var(--teamB-ink); }
.app[data-look="pixel"] .clash-by { border-radius: 0; }
.clash-tried {
  flex: none; display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.7em; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
}
.clash-foot { gap: 10px; }

/* ---------- Rückmeldung ---------- */
.clash-feedback { display: flex; flex-direction: column; gap: 8px; }
.clash-feedback.good { border-left: 10px solid var(--good); }
.clash-feedback.hot { border-left: 10px solid var(--accent); }
.clash-delta {
  font-family: var(--font-display); font-size: 1.05em; line-height: 1;
  padding: 6px 12px; border-radius: 99px; border: 2px solid var(--line);
}
.clash-delta.down { background: var(--good); color: var(--good-ink); }
.clash-delta.up { background: var(--accent); color: var(--accent-ink); }
.app[data-look="pixel"] .clash-delta { border-radius: 0; }
.app[data-look="neon"] .clash-delta.down { background: transparent; color: var(--good); border-color: var(--good); }
.app[data-look="neon"] .clash-delta.up { background: transparent; color: var(--accent); border-color: var(--accent); }

/* ---------- Zurückspulen ---------- */
.clash-rewind { background: color-mix(in srgb, var(--ink) 72%, transparent); overflow: hidden; }
.clash-rewind::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--text) 8%, transparent) 0 2px, transparent 2px 6px);
  animation: clash-scan 300ms linear infinite;
}
.clash-rw {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  color: var(--yellow);
  animation: clash-rw 850ms ease-in-out both;
}
.clash-rw b {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em;
  font-size: clamp(2.2em, 6vw, 4.4em); line-height: 1;
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink);
}
.app[data-look="neon"] .clash-rw b { -webkit-text-stroke: 0; text-shadow: 0 0 24px var(--yellow); }

/* ---------- Finale ---------- */
.clash-finale { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.clash-peace { font-size: clamp(2.6em, 3.6vw + 1em, 4.4em); color: var(--yellow); animation: pop-in 500ms cubic-bezier(.2, 1.5, .4, 1) both; }
.clash-top { display: flex; flex-direction: column; align-items: center; width: min(560px, 100%); }
.clash-summit { display: flex; align-items: flex-end; justify-content: center; gap: 4px; width: 100%; }
.clash-summit .clash-ava { width: clamp(104px, 13vw, 156px); animation: floaty 3s ease-in-out infinite; }
.clash-summit .clash-ava + .clash-hands + .clash-ava { animation-delay: -1.5s; }
.clash-hands { align-self: center; color: var(--yellow); margin: 0 6px 26px; animation: pulse 1.6s ease-in-out infinite; }
.clash-plate {
  width: 100%; margin-top: -4px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 10px 16px;
  background: var(--good); color: var(--good-ink);
  border: var(--bw) solid var(--line); border-radius: var(--radius-sm);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow);
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 1.05em;
}
.app[data-look="neon"] .clash-plate { background: transparent; color: var(--good); border-color: var(--good); }
.clash-pact { width: min(640px, 100%); display: flex; flex-direction: column; gap: 6px; text-align: left; border-left: 10px solid var(--good); }
.clash-pact-text { font-family: var(--font-display); font-size: clamp(1.25em, 1vw + 0.9em, 1.7em); line-height: 1.2; text-wrap: balance; }
.clash-big { font-size: 5em; color: var(--yellow); line-height: 1; }

/* ---------- Animationen ---------- */
@keyframes clash-bubble-in { from { opacity: 0; transform: scale(0.7) translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes clash-stamp {
  0% { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(2.4); }
  60% { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(0.92); }
  100% { opacity: 1; transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
}
@keyframes clash-stamp-small { from { opacity: 0; transform: rotate(-6deg) scale(1.8); } to { opacity: 1; transform: rotate(-6deg) scale(1); } }
@keyframes clash-now {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--yellow) 70%, transparent); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--yellow) 0%, transparent); }
}
@keyframes clash-flicker { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.18) rotate(4deg); } }
@keyframes clash-jolt { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes clash-cool { 0% { filter: none; } 30% { filter: brightness(1.25) saturate(1.2); } 100% { filter: none; } }
@keyframes clash-dots { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
@keyframes clash-bump { 0% { transform: none; } 40% { transform: scale(1.05) translateY(-4px); } 100% { transform: none; } }
@keyframes clash-scan { from { background-position: 0 0; } to { background-position: 0 12px; } }
@keyframes clash-rw { 0% { transform: translateX(40%); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(-40%); opacity: 0; } }

/* ---------- Hochformat-iPad: mehr Platz für den Comic ---------- */
@media (orientation: portrait) and (min-width: 701px) {
  .clash-talk { min-height: 30vh; }
  .clash-side .clash-ava { max-width: 210px; }
  .clash-cast { grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) minmax(120px, 220px); }
}

/* ---------- Kleine Bildschirme ---------- */
@media (max-width: 700px) {
  .clash-cast { grid-template-columns: 1fr 1fr; grid-template-areas: "a b" "t t"; gap: 8px 12px; }
  .clash-side.a { grid-area: a; }
  .clash-side.b { grid-area: b; }
  .clash-talk { grid-area: t; min-height: 0; padding-top: 0; }
  .clash-side { padding-bottom: 0; }
  .clash-side .clash-ava { max-width: 120px; }
  .clash-bubble::after { display: none; }
  .clash-comic { padding: 48px 12px 0; }
}
@media (max-width: 560px) {
  .clash-hud { gap: 10px; }
  .clash-col.s1 .clash-lanes { height: 38px; }
  .clash-col.s2 .clash-lanes { height: 44px; }
  .clash-col.s3 .clash-lanes { height: 50px; }
  .clash-col.s4 .clash-lanes { height: 56px; }
  .clash-col.s5 .clash-lanes { height: 62px; }
  .clash-heat-head .num { font-size: 1.4em; }
  .clash-heat-track { height: 20px; }
  .clash-side .clash-ava { max-width: 104px; }
  .clash-q { align-items: flex-start; gap: 10px; padding: 12px 12px 12px 10px; }
  .clash-q > .clash-ava { width: 60px; }
  .clash-duo { flex-direction: column; }
  .clash-duo .clash-ava { width: 52px; }
  .clash-duo .clash-ava + .clash-ava { margin-left: 0; margin-top: -10px; }
  .clash-q-top { padding-right: 56px; }
  .clash-starters { display: none; }
  .clash-cap { display: none; }
  .clash-legend { display: flex; }
  .clash-opt { gap: 12px; padding: 8px 12px 8px 8px; min-height: 64px; }
  .clash-letter { width: 44px; height: 44px; font-size: 1.35em; }
  .clash-stairs.big .s1 .clash-lanes { height: 70px; }
  .clash-stairs.big .s2 .clash-lanes { height: 84px; }
  .clash-stairs.big .s3 .clash-lanes { height: 98px; }
  .clash-stairs.big .s4 .clash-lanes { height: 112px; }
  .clash-stairs.big .s5 .clash-lanes { height: 126px; }
  .clash-teamcard .clash-ava { width: 70px; }
  .clash-hands { margin-bottom: 20px; }
}

/* ---- missions/feed.css ---- */
/* =========================================================
   Mission „Feed-Check“ – Online-Leben, Gerüchte, Gruppendruck
   Alle Klassen mit Präfix feed-. Farben nur über Tokens
   (die flachen SVG-Bilder lesen ebenfalls var(--…)).
   ========================================================= */

.feed-grow { flex: 1 1 auto; }
.feed-phone, .feed-screen, .feed-tip, .feed-out, .feed-call { box-sizing: border-box; }

/* ---------- Kopfzeile: Runde + Punkte ---------- */
.feed-hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.feed-hud-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.feed-hud h3 { font-size: 1.3em; }
.feed-tico {
  --c: var(--accent);
  width: 50px; height: 50px; flex: none;
  display: grid; place-items: center;
  background: var(--c); color: var(--ink);
  border: var(--bw) solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line);
}
.feed-tico.big { width: 116px; height: 116px; border-radius: calc(var(--radius) + 6px); box-shadow: 0 var(--lift) 0 var(--line), var(--glow); }
.app[data-look="neon"] .feed-tico { background: transparent; color: var(--c); border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 45%, transparent); }

.feed-score { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.feed-sc {
  --c: var(--yellow);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px 5px 8px; min-height: 44px;
  border-radius: 99px; border: 2px solid var(--line);
  background: var(--panel); color: var(--text);
  font-weight: 700; font-size: 0.88em;
  box-shadow: 0 3px 0 var(--line);
}
.feed-sc.teamA { --c: var(--teamA); }
.feed-sc.teamB { --c: var(--teamB); }
.feed-sc .dot { width: 14px; height: 14px; flex: none; border-radius: 50%; background: var(--c); border: 2px solid var(--line); }
.feed-sc .nm { white-space: nowrap; }
.feed-sc b {
  font-family: var(--font-display); font-weight: 400; font-size: 1.45em; line-height: 1;
  min-width: 1.3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--c);
}
.feed-sc.crew { background: var(--yellow); color: var(--yellow-ink); }
.feed-sc.crew b { color: var(--yellow-ink); }
.feed-sc.bump { animation: feed-bump 520ms cubic-bezier(.2, 1.6, .4, 1); }
.app[data-look="pixel"] .feed-sc, .app[data-look="pixel"] .feed-sc .dot { border-radius: 0; }
.app[data-look="neon"] .feed-sc { box-shadow: none; border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.app[data-look="neon"] .feed-sc.crew { background: transparent; color: var(--yellow); border-color: var(--yellow); }
.app[data-look="neon"] .feed-sc.crew b { color: var(--yellow); }

/* ---------- Grundaufbau: Handy links, Frage rechts ---------- */
.feed-main {
  display: grid;
  grid-template-columns: minmax(290px, 370px) minmax(0, 1fr);
  gap: 16px 28px;
  align-items: start;
}
.feed-left { min-width: 0; }
.feed-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.feed-side h2 { font-size: clamp(1.4em, 1.1vw + 0.95em, 1.85em); }
.feed-q { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.feed-lage { color: var(--muted); font-size: 1em; margin: 0; }
.feed-post-q { margin: 2px 0 0; color: var(--yellow); font-family: var(--font-display); font-size: 1.2em; text-transform: var(--display-case); letter-spacing: var(--display-track); }
.feed-holder { display: flex; flex-direction: column; gap: 12px; }
.feed-hint { margin: 2px 0 0; }
.feed-foot { margin-top: 2px; }

/* ---------- Das Handy ---------- */
.feed-phone {
  --ph-r: 40px;
  --feed-h: clamp(430px, calc(100vh - 250px), 590px);
  position: relative;
  width: 100%; max-width: 370px; margin: 0 auto;
  padding: 8px;
  background: var(--ink);
  border: var(--bw) solid var(--line);
  border-radius: var(--ph-r);
  box-shadow: 0 var(--lift) 0 var(--line), var(--glow), inset 0 0 0 2px color-mix(in srgb, var(--text) 14%, transparent);
}
.feed-phone::before, .feed-phone::after {
  content: ''; position: absolute; width: 4px; border-radius: 3px;
  background: color-mix(in srgb, var(--text) 25%, var(--ink));
}
.feed-phone::before { left: -7px; top: 22%; height: 11%; }
.feed-phone::after { right: -7px; top: 28%; height: 16%; }
.app[data-look="pixel"] .feed-phone { --ph-r: 6px; }
.app[data-look="neon"] .feed-phone { border-color: color-mix(in srgb, var(--accent) 65%, transparent); box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 30%, transparent); }

.feed-screen {
  position: relative;
  height: var(--feed-h);
  border-radius: calc(var(--ph-r) - 8px);
  overflow: hidden;
  background: var(--bg);
  display: flex; flex-direction: column;
  font-size: 0.84em; line-height: 1.3;
  text-align: left;
}
.feed-status {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 20px 3px; font-size: 0.85em; font-variant-numeric: tabular-nums;
  flex: none;
}
.feed-island { width: 78px; height: 22px; border-radius: 99px; background: var(--ink); }
.app[data-look="pixel"] .feed-island { border-radius: 0; }
.feed-sys { display: inline-flex; }
.feed-apphead {
  flex: none;
  display: flex; align-items: center; gap: 12px;
  padding: 6px 14px 9px;
  border-bottom: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
}
.feed-apphead.chat { gap: 10px; }
.feed-logo {
  font-family: var(--font-display); font-size: 1.55em; line-height: 1;
  letter-spacing: 0.01em; text-transform: none;
  background: linear-gradient(90deg, var(--teamB), var(--accent) 55%, var(--yellow));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.feed-chatname { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.feed-chatname b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-chatname span { color: var(--muted); font-size: 0.82em; }
.feed-body {
  position: relative;
  flex: 1; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px;
}
.feed-body.chat {
  justify-content: flex-end;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px);
  mask-image: linear-gradient(to bottom, transparent 0, #000 36px);
}
.feed-input {
  flex: none;
  display: flex; align-items: center; gap: 10px;
  margin: 0 10px 4px; padding: 6px 10px;
  border-radius: 99px; background: var(--panel);
  color: var(--muted);
}
.feed-input-f { flex: 1; }
.feed-homebar { flex: none; width: 34%; height: 5px; margin: 6px auto 7px; border-radius: 99px; background: color-mix(in srgb, var(--text) 55%, transparent); }
.app[data-look="pixel"] .feed-input, .app[data-look="pixel"] .feed-homebar { border-radius: 0; }

.feed-ava {
  flex: none; display: inline-grid; place-items: center;
  border-radius: 50%; border: 2px solid var(--line);
  color: var(--ink); font-weight: 800; font-family: var(--font-body);
  line-height: 1;
}
.app[data-look="pixel"] .feed-ava { border-radius: 4px; }

/* Post */
.feed-post { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-radius: 16px; padding: 10px 12px; }
.feed-post-head { display: flex; align-items: center; gap: 10px; }
.feed-who { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.feed-who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-who span { color: var(--muted); font-size: 0.82em; }
.feed-more { color: var(--muted); letter-spacing: 0.1em; }
.feed-post-text { font-size: 1.08em; font-weight: 600; }
.feed-actions { display: flex; align-items: center; gap: 14px; color: var(--muted); font-weight: 700; font-size: 0.86em; }
.feed-actions > span { display: inline-flex; align-items: center; gap: 5px; }
.app[data-look="pixel"] .feed-post { border-radius: 0; }

/* Kommentare */
.feed-cmts { display: flex; flex-direction: column; gap: 6px; }
.feed-cmt {
  position: relative;
  display: flex; align-items: flex-start; gap: 8px;
  padding: 5px; border-radius: 14px; border: 2px solid transparent;
  transition: opacity 300ms;
}
.feed-cmt-b { display: flex; flex-direction: column; gap: 1px; background: var(--panel); border-radius: 14px; padding: 6px 10px; min-width: 0; }
.feed-cmt-b b { font-size: 0.85em; color: var(--muted); }
.feed-cmt.cur { border-color: var(--yellow); background: color-mix(in srgb, var(--yellow) 16%, transparent); animation: feed-glow 1.6s ease-in-out infinite; }
.feed-cmt.later { opacity: 0.45; }
.feed-cmt.skipped { opacity: 0.6; }
.feed-cmt .feed-stamp { position: absolute; right: 2px; top: -4px; transform: rotate(-7deg); }
.app[data-look="pixel"] .feed-cmt, .app[data-look="pixel"] .feed-cmt-b { border-radius: 0; }

/* Chat */
.feed-msg-row { display: flex; align-items: flex-end; gap: 8px; animation: feed-in 320ms cubic-bezier(.2, 1.2, .4, 1) both; }
.feed-msg-row.me { justify-content: flex-end; }
.feed-msg {
  max-width: 82%;
  display: flex; flex-direction: column; gap: 3px;
  padding: 7px 12px 8px;
  background: var(--panel2); color: var(--text);
  border-radius: 18px 18px 18px 6px;
}
.feed-msg-row.me .feed-msg { background: var(--accent); color: var(--accent-ink); border-radius: 18px 18px 6px 18px; }
.feed-msg-name { font-size: 0.8em; }
.feed-msg-t { font-size: 1.04em; }
.feed-fwd { display: inline-flex; align-items: center; gap: 4px; font-size: 0.76em; font-style: italic; color: var(--muted); }
.feed-typing { flex-direction: row; gap: 5px; padding: 12px 14px; }
.feed-typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: feed-dot 1s ease-in-out infinite; }
.feed-typing i:nth-child(2) { animation-delay: 0.15s; }
.feed-typing i:nth-child(3) { animation-delay: 0.3s; }
.app[data-look="pixel"] .feed-msg, .app[data-look="pixel"] .feed-msg-row.me .feed-msg { border-radius: 0; }
.app[data-look="neon"] .feed-msg-row.me .feed-msg { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); color: var(--text); border: 1px solid var(--accent); }

/* Bilder im Feed */
.feed-media { position: relative; overflow: hidden; border-radius: 12px; border: 2px solid var(--line); }
.feed-media svg { display: block; width: 100%; height: auto; max-height: 150px; }
.feed-cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 3px 8px; font-size: 0.8em; font-weight: 700;
  background: rgba(0, 0, 0, 0.55); color: #fff;
}
.feed-cap.top {
  top: 0; bottom: auto; text-align: center;
  background: #fff; color: #111;
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.95em;
}
.feed-media.screen { background: var(--bg2); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.feed-shot-l { font-size: 0.72em; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.feed-shot-b { display: flex; flex-direction: column; gap: 2px; background: var(--panel2); border-radius: 12px 12px 12px 4px; padding: 6px 10px; }
.feed-shot-b b { font-size: 0.75em; color: var(--muted); }
.feed-media.poll { background: var(--bg2); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.feed-poll-row { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--panel); overflow: hidden; font-weight: 700; }
.feed-poll-row i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--teamB) 45%, transparent); }
.feed-poll-row span, .feed-poll-row b { position: relative; }
.app[data-look="pixel"] .feed-media, .app[data-look="pixel"] .feed-poll-row, .app[data-look="pixel"] .feed-shot-b { border-radius: 0; }

/* Sperrbildschirm (Intro) */
.feed-lock { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--accent) 35%, var(--bg)) 0%, var(--bg) 70%); }
.feed-lock-date { text-align: center; margin-top: 14px; font-weight: 700; color: var(--muted); }
.feed-lock-time { text-align: center; font-family: var(--font-display); font-size: 4.4em; line-height: 1; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.feed-notis { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 0 10px; }
.feed-noti {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 11px; border-radius: 16px;
  background: color-mix(in srgb, var(--panel2) 85%, transparent);
  border: 1px solid color-mix(in srgb, var(--text) 12%, transparent);
  animation: feed-drop 420ms cubic-bezier(.2, 1.3, .4, 1) both;
}
.feed-noti-ic {
  width: 30px; height: 30px; flex: none; display: grid; place-items: center;
  border-radius: 9px; color: #fff; font-family: var(--font-display); font-size: 1.2em;
  background: linear-gradient(135deg, var(--teamB), var(--accent));
}
.feed-noti-b { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.feed-noti-top { display: flex; justify-content: space-between; gap: 8px; }
.feed-noti-top span { color: var(--muted); font-size: 0.85em; }
.app[data-look="pixel"] .feed-noti, .app[data-look="pixel"] .feed-noti-ic { border-radius: 0; }

/* ---------- Antworten A–D ---------- */
.feed-opts { display: flex; flex-direction: column; gap: 10px; }
.feed-opt {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 14px 7px 8px; min-height: 58px;
  background: var(--panel); color: var(--text);
  border: var(--bw) solid var(--line); border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--line);
  font: inherit; text-align: left;
}
button.feed-opt { appearance: none; cursor: pointer; touch-action: manipulation; transition: transform 90ms ease, box-shadow 90ms ease, background 160ms; }
button.feed-opt:hover { background: var(--panel2); }
button.feed-opt:active, button.feed-opt.picked { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
button.feed-opt.picked { outline: 4px solid var(--yellow); outline-offset: 2px; }
button.feed-opt[disabled]:not(.picked) { opacity: 0.55; }
.feed-opt-t { font-weight: 600; line-height: 1.25; }
.feed-l {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.35em; line-height: 1;
  color: var(--ink);
  border: 2px solid var(--line); border-radius: var(--radius-sm);
}
.feed-l.lA { background: var(--teamA); }
.feed-l.lB { background: var(--teamB); }
.feed-l.lC { background: var(--good); }
.feed-l.lD { background: var(--yellow); }
.app[data-look="neon"] .feed-opt { box-shadow: none; }
/* Während die Lehrkraft eintippt: Antworten schmal, damit alles auf den Bildschirm passt */
.feed-opts.compact { gap: 6px; }
.feed-opts.compact .feed-opt { min-height: 46px; padding: 4px 12px 4px 6px; box-shadow: none; }
.feed-opts.compact .feed-l { width: 34px; height: 34px; font-size: 1.1em; }
.feed-opts.compact .feed-opt-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 0.94em; }

/* ---------- Eingabe der Lehrkraft ---------- */
.feed-callbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.feed-call { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; }
.feed-call-h { display: flex; align-items: center; gap: 8px; }
.feed-call-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.feed-call-row .pill { min-width: 9.6em; justify-content: center; font-size: 0.8em; }
.feed-segs { display: flex; gap: 8px; flex: 1 1 220px; }
.feed-seg {
  --seg: var(--yellow);
  appearance: none; font: inherit; cursor: pointer; touch-action: manipulation;
  flex: 1 1 0; min-width: 54px; min-height: 54px; padding: 6px 10px;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-family: var(--font-display); font-size: 1.2em; line-height: 1;
  text-transform: var(--display-case); letter-spacing: var(--display-track);
  background: var(--panel2); color: var(--text);
  border: var(--bw) solid var(--line); border-radius: var(--radius-sm);
  box-shadow: 0 3px 0 var(--line);
  transition: transform 90ms ease, box-shadow 90ms ease, background 140ms;
}
.feed-seg small { font-family: var(--font-body); font-size: 0.55em; font-weight: 700; opacity: 0.8; text-transform: none; letter-spacing: 0; }
.feed-seg.lA { --seg: var(--teamA); }
.feed-seg.lB { --seg: var(--teamB); }
.feed-seg.lC { --seg: var(--good); }
.feed-seg.lD { --seg: var(--yellow); }
.feed-seg.ja { --seg: var(--good); }
.feed-seg.nein { --seg: var(--teamB); }
.feed-seg.sel { background: var(--seg); color: var(--ink); transform: translateY(3px); box-shadow: 0 0 0 var(--line); outline: 3px solid var(--yellow); outline-offset: 2px; }

.feed-toggles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.feed-toggle {
  --c: var(--teamA);
  appearance: none; font: inherit; color: var(--text); cursor: pointer; touch-action: manipulation;
  display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 64px; padding: 8px 14px 8px 10px;
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--line);
}
.feed-toggle.teamB { --c: var(--teamB); }
.feed-tg-box {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border: var(--bw) solid var(--c); border-radius: var(--radius-sm); color: transparent;
}
.feed-tg-t { display: flex; flex-direction: column; line-height: 1.15; }
.feed-tg-t small { color: var(--muted); font-weight: 700; }
.feed-toggle.on { background: color-mix(in srgb, var(--c) 22%, var(--panel)); transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.feed-toggle.on .feed-tg-box { background: var(--c); color: var(--ink); }
.feed-toggle.on .feed-tg-t small { color: var(--text); }

/* ---------- Fakt oder Meinung ---------- */
.feed-quote { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; }
.feed-quote-b { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feed-handle { color: var(--muted); font-weight: 700; font-size: 0.9em; }
.feed-quote-t { font-family: var(--font-display); font-size: clamp(1.3em, 1vw + 0.95em, 1.75em); line-height: 1.18; text-wrap: balance; }
.feed-rule { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); }
.feed-rule > div { display: inline-flex; align-items: center; gap: 8px; }
.feed-stamp {
  display: inline-block;
  font-family: var(--font-display); font-size: 0.82em; line-height: 1;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 4px 8px; border: 2px solid var(--line); border-radius: 8px;
  box-shadow: 0 2px 0 var(--line);
}
.feed-stamp.F { background: var(--good); color: var(--good-ink); }
.feed-stamp.M { background: var(--yellow); color: var(--yellow-ink); }
.feed-stamp.X { background: var(--teamB); color: #fff; }
.feed-stamp.big { font-size: 1.5em; padding: 8px 14px; transform: rotate(-4deg); border-width: var(--bw); animation: feed-stamp 420ms cubic-bezier(.2, 1.5, .4, 1) both; }
.app[data-look="pixel"] .feed-stamp { border-radius: 0; }
.feed-verdict { display: flex; flex-direction: column; gap: 12px; }
.feed-verdict.vF { border-color: var(--good); }
.feed-verdict.vM { border-color: var(--yellow); }
.feed-verdict.vX { border-color: var(--teamB); }
.app[data-look="arena"] .feed-verdict.vF, .app[data-look="arena"] .feed-verdict.vM, .app[data-look="pixel"] .feed-verdict.vF, .app[data-look="pixel"] .feed-verdict.vM { border-color: var(--line); }
.feed-verdict-top { display: flex; align-items: center; gap: 16px; }
.feed-verdict-top .lead { flex: 1; }
.feed-res { display: flex; flex-direction: column; gap: 6px; }
.feed-res-row { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.feed-res-row .feed-pts { position: static; font-size: 1.05em; padding: 2px 10px; animation: none; }

/* ---------- Folgen (Karten) ---------- */
.feed-outs { display: grid; gap: 20px 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; padding-top: 8px; }
.feed-outs.one { grid-template-columns: minmax(0, 640px); justify-content: center; }
.feed-out { position: relative; display: flex; flex-direction: column; gap: 12px; }
.feed-out.k-stark { border-top: 8px solid var(--good); }
.feed-out.k-gut { border-top: 8px solid color-mix(in srgb, var(--good) 55%, var(--yellow)); }
.feed-out.k-okay { border-top: 8px solid var(--yellow); }
.feed-out.k-riskant { border-top: 8px solid var(--accent); }
.feed-out-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 56px; }
.feed-out-t { font-weight: 700; font-size: 1.08em; line-height: 1.25; }
.feed-kind {
  font-size: 0.74em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 4px 10px; border-radius: 99px; border: 2px solid var(--line); white-space: nowrap;
}
.feed-kind.stark { background: var(--good); color: var(--good-ink); }
.feed-kind.gut { background: color-mix(in srgb, var(--good) 55%, var(--yellow)); color: var(--good-ink); }
.feed-kind.okay { background: var(--yellow); color: var(--yellow-ink); }
.feed-kind.riskant { background: var(--accent); color: var(--accent-ink); }
.app[data-look="pixel"] .feed-kind { border-radius: 0; }
.feed-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feed-metric { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--panel2); min-width: 0; }
.feed-mi { color: var(--muted); display: inline-grid; flex: none; }
.feed-mv { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.feed-mv > span { color: var(--muted); font-size: 0.84em; font-weight: 600; }
.feed-big { font-family: var(--font-display); font-weight: 400; font-size: 2.1em; line-height: 1; font-variant-numeric: tabular-nums; }
.feed-feel { font-family: var(--font-display); font-weight: 400; font-size: 1.35em; line-height: 1.05; }
.feed-face { width: 58px; height: 58px; flex: none; display: inline-grid; }
.feed-face svg { width: 100%; height: 100%; }
.feed-line { margin: 0; font-size: 1.02em; }
.feed-pts {
  position: absolute; top: -16px; right: 12px;
  font-family: var(--font-display); font-size: 1.55em; line-height: 1;
  padding: 6px 14px;
  background: var(--yellow); color: var(--yellow-ink);
  border: var(--bw) solid var(--line); border-radius: 99px;
  box-shadow: 0 3px 0 var(--line);
  animation: feed-stamp 480ms 200ms cubic-bezier(.2, 1.5, .4, 1) both;
}
.feed-pts.zero { background: var(--panel2); color: var(--muted); }
.app[data-look="pixel"] .feed-pts { border-radius: 0; }
.app[data-look="neon"] .feed-pts { background: var(--bg); color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 14px color-mix(in srgb, var(--yellow) 40%, transparent); }

.feed-minichat { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--radius-sm); background: var(--bg); min-height: 104px; justify-content: flex-end; }
.feed-checks { display: flex; flex-wrap: wrap; gap: 8px; }
.feed-check {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 8px; border-radius: 99px; border: 2px solid var(--line);
  font-weight: 700; font-size: 0.86em;
  background: var(--panel2); color: var(--muted);
}
.feed-check-s { width: 18px; text-align: center; }
.feed-check.ja { background: var(--good); color: var(--good-ink); }
.feed-check.halb { background: var(--yellow); color: var(--yellow-ink); }
.feed-check.nein { background: var(--panel2); color: var(--text); }
.app[data-look="pixel"] .feed-check { border-radius: 0; }

.feed-nein { display: flex; flex-direction: column; gap: 10px; border-top: 8px solid var(--teamA); }
.feed-nein-h { display: flex; align-items: center; gap: 10px; color: var(--teamA); }
.feed-nein-h b { color: var(--text); font-size: 1.05em; }
.feed-nein-list { display: flex; flex-direction: column; gap: 8px; }
.feed-nein-l {
  padding: 8px 12px; border-left: 5px solid var(--teamA);
  background: var(--panel2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-weight: 600;
}

.feed-ways { display: flex; flex-direction: column; gap: 10px; }
.feed-way { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius-sm); }
.feed-way-b { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feed-way-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.88em; font-weight: 600; }
.feed-way-meta > span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- Gerücht-Kette ---------- */
.feed-spread { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.feed-track { display: flex; align-items: flex-start; }
.feed-node { position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.feed-node::before {
  content: ''; position: absolute; z-index: 0;
  top: 18px; right: 50%; width: 100%; height: 5px;
  background: var(--panel2);
  transition: background 400ms;
}
.feed-node:first-child::before { display: none; }
.feed-node .c {
  position: relative; z-index: 1;
  width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: 50%; border: 3px solid var(--line);
  background: var(--panel2); color: var(--muted);
  font-family: var(--font-display); font-size: 1.15em;
  transition: background 300ms, color 300ms;
}
.feed-node .v { font-weight: 800; font-size: 0.85em; color: var(--muted); font-variant-numeric: tabular-nums; }
.feed-node .flags { display: flex; gap: 3px; min-height: 22px; }
.feed-node.on::before { background: var(--accent); }
.feed-node.on .c { background: var(--accent); color: var(--accent-ink); }
.feed-node.on .v { color: var(--text); }
.feed-node.now .c { background: var(--yellow); color: var(--yellow-ink); animation: feed-now 1.4s ease-in-out infinite; }
.feed-node.end .c { border-style: dashed; }
.app[data-look="pixel"] .feed-node .c { border-radius: 0; }
